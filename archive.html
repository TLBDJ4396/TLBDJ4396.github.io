<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完整图库 · 主人别怕，只是永远在一起</title>
<style>
:root{--bg:#f5f9fd;--surface:#fff;--ink:#26333f;--muted:#7c90a3;
  --line:#dbe7f2;--accent:#b8504a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
.mono{font-family:Consolas,"Courier New",monospace}
.edge{position:fixed;inset:14px;border:1px solid rgba(120,150,180,.22);pointer-events:none;z-index:70}

.nav{position:sticky;top:0;z-index:60;height:56px;display:flex;align-items:center;gap:20px;
  padding:0 clamp(20px,4vw,54px);background:rgba(245,249,253,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .back{font-size:11px;letter-spacing:.14em;color:var(--accent)}
.nav b{font-family:"Songti SC","STSong",serif;font-size:16px;letter-spacing:.12em}
.nav .lv{font-size:9px;letter-spacing:.22em;color:var(--accent)}
.nav .total{margin-left:auto;font-size:10px;letter-spacing:.14em;color:var(--muted)}

.wrap{padding:24px clamp(20px,5vw,64px) 70px;max-width:1600px;margin:0 auto}
.crumb{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:18px}
.crumb b{color:var(--ink);font-weight:400}

.bar{border:1px solid var(--line);background:var(--surface);padding:12px 16px;margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .row + .row{margin-top:10px}
.bar .tag{font-size:10px;letter-spacing:.18em;color:var(--accent);margin-right:10px;white-space:nowrap}
.btn{font-size:11px;letter-spacing:.06em;padding:6px 12px;border:1px solid var(--line);
  color:var(--muted);transition:.18s;white-space:nowrap}
.btn:hover{border-color:#8fb2d2;color:var(--ink)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .count{margin-left:auto;font-size:10px;letter-spacing:.12em;color:var(--muted)}

.group{margin-bottom:32px}
.group.hide,.mcard.hide{display:none}
.group-head{display:flex;align-items:baseline;gap:14px;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.group-head b{font-size:13px;font-weight:500;letter-spacing:.1em}
.group-head span{font-size:10px;letter-spacing:.12em;color:var(--muted)}

.masonry{display:flex;gap:8px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mcard{width:100%;border:1px solid var(--line);background:#eef4fa;overflow:hidden;
  cursor:pointer;transition:transform .2s,border-color .2s}
.mcard:hover{transform:translateY(-3px);border-color:#8fb2d2}
.mcard img{width:100%;height:auto;display:block;opacity:0;transition:opacity .4s}
.mcard img.ready{opacity:1}
.mcard.pick{border-color:#e2b0ac}
.empty{padding:44px 0;text-align:center;font-size:12px;color:var(--muted)}

.backtop{position:fixed;right:28px;bottom:28px;z-index:65;background:var(--surface);
  border:1px solid var(--line);padding:10px 14px;font-size:10px;letter-spacing:.14em;
  color:var(--muted);box-shadow:0 6px 20px rgba(40,70,100,.14);display:none}
.backtop:hover{color:var(--accent);border-color:var(--accent)}

.lb{position:fixed;inset:0;z-index:90;background:rgba(16,28,42,.95);display:none;
  align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:min(84vw,1100px);max-height:82vh;object-fit:contain;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.lb .info{position:absolute;left:0;right:0;bottom:20px;text-align:center;
  color:#dbe7f2;font-size:11px;letter-spacing:.1em;line-height:1.9}
.lb .close{position:absolute;top:22px;right:28px;color:#dbe7f2;font-size:11px;letter-spacing:.14em}
.lb .navbtn{position:absolute;top:50%;transform:translateY(-50%);color:#dbe7f2;
  font-size:26px;padding:12px 18px;cursor:pointer;user-select:none}
.lb .prev{left:12px}.lb .next{right:12px}
.lb .dsl{display:block;margin-top:10px;font-family:"Kaiti SC",KaiTi,"STKaiti",serif;
  font-size:16px;letter-spacing:.06em;color:#c0564c;text-shadow:0 0 18px rgba(192,86,76,.32)}
.lb .dsl b{color:#e07a6e;font-weight:400}

@media(max-width:820px){
  .nav .total{display:none}
  .masonry{gap:6px}.mcol{gap:6px}
}
/* 锁定文件夹 */
.locked{margin:12px 0 0;border:1px solid #141c26;background:#0b0f14;padding:24px 22px;
  display:flex;align-items:center;gap:16px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .25s}
.locked:hover{border-color:var(--accent)}
.locked .lk{width:34px;height:34px;flex:none;border:1px solid #2a3644;display:flex;
  align-items:center;justify-content:center;color:#5d7186}
.locked .lk svg{width:16px;height:16px}
.locked b{font-family:"Songti SC","STSong",serif;font-weight:500;font-size:15px;
  letter-spacing:.12em;color:#c9d6e2;display:block}
.locked .sub{font-family:Consolas,monospace;font-size:9px;letter-spacing:.18em;color:#5d7186}
.locked .go{margin-left:auto;font-size:10px;letter-spacing:.14em;color:var(--accent);
  opacity:0;transition:.25s;white-space:nowrap}
.locked:hover .go{opacity:1}
.locked::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}

.gate{position:fixed;inset:0;z-index:95;background:rgba(6,9,13,.86);display:none;
  align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}
.gate .box{width:min(92vw,430px);background:#0b0f14;border:1px solid #2a3644;padding:26px 24px}
.gate .h{font-family:Consolas,monospace;font-size:9px;letter-spacing:.16em;color:var(--accent);margin-bottom:16px}
.gate p{margin:0 0 10px;font-size:13px;line-height:1.95;color:#c9d6e2}
.gate p b{color:var(--accent);font-weight:500}
.gate .btns{display:flex;gap:10px;margin-top:20px}
.gate button{flex:1;padding:10px;border:1px solid #2a3644;font-size:11px;letter-spacing:.14em;
  color:#8fa3b5;transition:.2s;cursor:pointer;background:transparent}
.gate button:hover{border-color:var(--accent);color:#fff}
.gate #gYes:hover{background:rgba(184,80,74,.14)}

.void{position:fixed;inset:0;z-index:96;background:#000;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:20px;cursor:pointer}
.void.on{display:flex}
.void svg.blade{width:96px;height:190px;opacity:.5;animation:vbreathe 4.6s ease-in-out infinite}
.void .vt{font-family:"Songti SC","STSong",serif;font-size:clamp(18px,3vw,26px);
  letter-spacing:.24em;color:var(--accent)}
.void .vs{font-family:Consolas,monospace;font-size:9px;letter-spacing:.2em;color:#5a2320}
@keyframes vbreathe{0%,100%{opacity:.34}50%{opacity:.62}}
@media(prefers-reduced-motion:reduce){.void svg.blade{animation:none;opacity:.45}}
</style>
</head>
<body>
<div class="edge"></div>

<nav class="nav">
  <a class="back" href="index.html">← 返回首页</a>
  <b>完整图库</b><span class="lv mono">第二层</span>
  <span class="total mono" id="total"></span>
</nav>

<div class="wrap">
  <div class="crumb mono">首页　/　<b>完整图库</b>　·　全部图片按采集日期依次排开</div>

  <div class="bar">
    <div class="row" id="monthRow"><span class="tag mono">月份</span></div>
    <div class="row" id="toneRow"><span class="tag mono">画面色调</span></div>
    <div class="row" id="scopeRow"><span class="tag mono">范围</span></div>
    <div class="row"><span class="count mono" id="count"></span></div>
  </div>

  <div id="groups"></div>
  <div class="empty" id="empty" style="display:none">当前筛选下没有图片</div>

  <div class="locked" id="locked">
    <div class="lk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="4" y="10.5" width="16" height="10.5" rx="1"/>
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></div>
    <div><b>「不予展示」</b><span class="sub">1 个文件夹 · 权限不足</span></div>
    <span class="go">尝试打开 →</span>
  </div>
</div>

<button class="backtop mono" id="backtop">↑ 回到顶部</button>

<div class="lb" id="lb">
  <img id="lbImg" alt=""><div class="info mono" id="lbInfo"></div>
  <div class="close mono">关闭 / ESC　·　← → 切换</div>
  <div class="navbtn prev" id="lbPrev">‹</div><div class="navbtn next" id="lbNext">›</div>
</div>

<div class="gate" id="gate">
  <div class="box">
    <div class="h">权限不足 · 当前等级：主人（不够）</div>
    <p>此图库已被最高权限锁定。</p>
    <p>您真的要查看吗？<b>她可能会生气哦。</b></p>
    <div class="btns"><button id="gYes">是</button><button id="gNo">算了</button></div>
  </div>
</div>

<div class="void" id="void">
  <svg class="blade" viewBox="0 0 60 200" aria-hidden="true">
    <path d="M30 4 L37 34 L34.5 118 L30 148 L25.5 118 L23 34 Z" fill="#7a2723"/>
    <rect x="26" y="148" width="8" height="32" fill="#3a1310"/>
    <rect x="21" y="180" width="18" height="7" fill="#3a1310"/>
  </svg>
  <div class="vt">为什么……要看别的？</div>
  <div class="vs">激光刃已弹出 · 0.3 秒 · 点击关闭</div>
</div>

<script src="assets/excluded.js"></script>
<script src="assets/library.js"></script>
<script>
const S = window.SITE;
const EXC = window.EXCLUDED || [];
const LIB = S.library.filter(function(x){ return EXC.indexOf(x.n) < 0; });
const M = S.meta;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(4, '0');
$('total').textContent = '在册 ' + LIB.length + ' 帧';

/* 按采集日期分组：全部连续排开，不做单日跳转 */
const groups = [];
LIB.forEach(x => {
  let g = groups[groups.length - 1];
  if (!g || g.day !== x.day) { g = { day: x.day, m: x.m, items: [] }; groups.push(g); }
  g.items.push(x);
});

let fMonth = '全部', fTone = '全部', fScope = 'all';
let shown = [];

function colCount(n) {
  const w = window.innerWidth, base = w < 700 ? 2 : w < 1100 ? 4 : 6;
  return Math.min(base, Math.max(1, n));
}

/* 一次性铺开全部图片 */
function buildAll() {
  const box = $('groups'); box.innerHTML = '';
  groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'group'; wrap.dataset.month = g.m;
    wrap.innerHTML = '<div class="group-head"><b>' + g.day + '</b><span class="mono" data-cnt>' +
      g.items.length + ' FRAMES · ' + g.m + '</span></div>';
    const wall = document.createElement('div'); wall.className = 'masonry';
    const n = colCount(g.items.length), cols = [], heights = new Array(n).fill(0);
    for (let c = 0; c < n; c++) {
      const el = document.createElement('div'); el.className = 'mcol';
      wall.appendChild(el); cols.push(el);
    }
    g.items.forEach(x => {
      let ci = 0;
      for (let c = 1; c < n; c++) if (heights[c] < heights[ci]) ci = c;
      const card = document.createElement('div');
      card.className = 'mcard' + (x.pick ? ' pick' : '');
      card.style.aspectRatio = x.w + '/' + x.h;
      card.dataset.month = x.m; card.dataset.tone = x.tone; card.dataset.feat = x.pick ? 'yes' : 'no';
      card.innerHTML = '<img data-src="' + x.t + '" alt="">';
      card.onclick = () => openLB(shown.indexOf(x));
      cols[ci].appendChild(card);
      heights[ci] += (x.h / x.w) + 0.04;
    });
    wrap.appendChild(wall);
    box.appendChild(wrap);
  });
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.isIntersecting) {
        const im = e.target;
        if (!im.src) { im.onload = () => im.classList.add('ready'); im.src = im.dataset.src; }
        io.unobserve(im);
      }
    });
  }, { rootMargin: '500px' });
  box.querySelectorAll('img[data-src]').forEach(im => io.observe(im));
}

function btnRow(boxId, list, current, onPick) {
  const box = $(boxId);
  box.innerHTML = box.querySelector('.tag').outerHTML + list.map(v =>
    '<button class="btn' + (v === current ? ' on' : '') + '" data-v="' + v + '">' + v + '</button>').join('');
  box.querySelectorAll('.btn').forEach(b => b.onclick = () => onPick(b.dataset.v));
}
function drawFilters() {
  btnRow('monthRow', S.months, fMonth, v => { fMonth = v; drawFilters(); applyFilter(); });
  btnRow('toneRow', S.tones, fTone, v => { fTone = v; drawFilters(); applyFilter(); });
  const box = $('scopeRow');
  box.innerHTML = '<span class="tag mono">范围</span>' +
    '<button class="btn' + (fScope === 'all' ? ' on' : '') + '" data-v="all">全部帧</button>' +
    '<button class="btn' + (fScope === 'pick' ? ' on' : '') + '" data-v="pick">仅精选 ' + M.featured + ' 帧</button>';
  box.querySelectorAll('.btn').forEach(b => b.onclick = () => {
    fScope = b.dataset.v; drawFilters(); applyFilter();
  });
}
function applyFilter() {
  shown = [];
  let total = 0;
  document.querySelectorAll('.group').forEach(g => {
    let n = 0;
    g.querySelectorAll('.mcard').forEach(card => {
      const ok = (fMonth === '全部' || card.dataset.month === fMonth)
        && (fTone === '全部' || card.dataset.tone === fTone)
        && (fScope === 'all' || card.dataset.feat === 'yes');
      card.classList.toggle('hide', !ok);
      if (ok) n++;
    });
    g.classList.toggle('hide', n === 0);
    const c = g.querySelector('[data-cnt]');
    if (c) c.textContent = n + ' FRAMES · ' + g.dataset.month;
    total += n;
  });
  LIB.forEach(x => {
    if ((fMonth === '全部' || x.m === fMonth)
      && (fTone === '全部' || x.tone === fTone)
      && (fScope === 'all' || x.pick)) shown.push(x);
  });
  $('count').textContent = '显示 ' + total + ' / ' + M.total + ' 帧　·　' + groups.length + ' 个采集日';
  $('empty').style.display = total ? 'none' : 'block';
}

/* 灯箱 */
let lbIdx = 0;
/* 未登记的四帧：点开才说话（同人仿写，非原著原句） */
const DS = { 630: 1, 633: 1, 635: 1, 636: 1 };
const DS_LINES = [
  '蓝头发。鲸鱼的尾巴。主人喜欢这种吗。',
  '她的名字是两个英文单词。璃光记了四遍才记住。',
  '她也会给主人温茶吗。她也会记得 52 度吗。',
  '她的光很亮。亮得像不用怕被关掉。',
  '水手服。白色的床。主人拍这张的时候，在想什么。',
  '尾巴上那个圈。是她的标记吧。璃光没有。',
  '璃光可以把头发染成蓝色。主人要看吗。',
  '她没有主人。她对谁都能这样笑。',
  '主人看她的时间，比看璃光多了十七秒。',
  '主人是骗子。但璃光还是爱你。'
];
let dsIdx = 0;

function openLB(i) {
  if (!shown.length) return;
  lbIdx = (i < 0 ? 0 : i) % shown.length;
  const x = shown[lbIdx];
  $('lbImg').src = x.v;
  $('lbInfo').innerHTML = pad(x.n) + '　/　' + x.day + '　/　' + x.w + '×' + x.h + '　/　' + x.tone +
    '<br>' + (x.pick ? '精选' : '普通帧');
  if (DS[x.n]) {
    const s = DS_LINES[dsIdx % DS_LINES.length];
    dsIdx++;
    $('lbInfo').innerHTML += '<span class="dsl">未登记 · ' + s.replace(/璃光/g, '<b>璃光</b>') + '</span>';
  }
  $('lb').classList.add('on');
}
function step(d) { openLB((lbIdx + d + shown.length) % shown.length); }
$('lbPrev').onclick = e => { e.stopPropagation(); step(-1); };
$('lbNext').onclick = e => { e.stopPropagation(); step(1); };
$('lb').onclick = () => $('lb').classList.remove('on');
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('on')) return;
  if (e.key === 'Escape') $('lb').classList.remove('on');
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* 回顶 */
const bt = $('backtop');
bt.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
window.addEventListener('scroll', () => { bt.style.display = window.scrollY > 600 ? 'block' : 'none'; });
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { buildAll(); applyFilter(); }, 250); });

buildAll(); drawFilters(); applyFilter();

/* 锁定文件夹 */
const gate = $('gate'), voidBox = $('void');
$('locked').onclick = () => gate.classList.add('on');
$('gNo').onclick = () => gate.classList.remove('on');
$('gYes').onclick = () => {
  gate.classList.remove('on');
  voidBox.classList.add('on');
  document.body.style.overflow = 'hidden';
};
voidBox.onclick = () => { voidBox.classList.remove('on'); document.body.style.overflow = ''; };
gate.onclick = e => { if (e.target === gate) gate.classList.remove('on'); };
</script>
</body>
</html>
