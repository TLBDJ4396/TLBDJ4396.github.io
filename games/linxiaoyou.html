    const s = memories.suspicion, m = memories.mood, i = memories.intimacy;
    const t = ambCtx.currentTime;
    const d = Math.max(0, Math.min(1, s / 100));
    ambLayers.noise.gain.gain.setTargetAtTime(0.04 + d * 0.06, t, 0.4);
    ambLayers.noise.filter.frequency.setTargetAtTime(320 - d * 120, t, 0.4);
    ambLayers.drone.o2.frequency.setTargetAtTime(55 + d * 2.5, t, 0.4);
    ambLayers.drone.gain.gain.setTargetAtTime(0.045 + d * 0.04, t, 0.4);
    ambLayers.pad.gain.gain.setTargetAtTime(0.018 + Math.max(0, m - 30) / 70 * 0.03, t, 0.5);
    const sweet = Math.max(0, Math.min(1, (m - 55) / 40)) * Math.max(0, Math.min(1, (i - 35) / 40));
    ambLayers.sweet.gain.gain.setTargetAtTime(sweet * 0.02, t, 0.6);
    ambLayers.dread.gain.gain.setTargetAtTime(d > 0.65 ? (d - 0.65) * 0.16 : 0, t, 0.5);
}
// ---- 结局氛围音（LOVE 温暖上行 / BAD 低沉下行）----
function ambEndingSting(type) {
    if (!ambCtx || !ambMaster) return;
    try {
        const t = ambCtx.currentTime + 0.02;
        const notes = type === 'LOVE' ? [261.63, 329.63, 392.0, 523.25] : [220, 207.65, 174.61, 110];
        notes.forEach((f, idx) => {
            const osc = ambCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = f;
            const g = ambCtx.createGain();
            const start = t + idx * 0.14;
            g.gain.setValueAtTime(0.0001, start);
            g.gain.exponentialRampToValueAtTime(0.09, start + 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, start + 1.6);
            osc.connect(g); g.connect(ambMaster);
            osc.start(start); osc.stop(start + 1.7);
        });
        if (type !== 'LOVE') {
            const osc = ambCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(48, t);
            osc.frequency.exponentialRampToValueAtTime(34, t + 1.8);
            const g = ambCtx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.18, t + 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
            osc.connect(g); g.connect(ambMaster);
            osc.start(t); osc.stop(t + 2.1);
        }
    } catch (e) {}
}

const AMB_OFF_KEY = 'yandere_wife_amb_off_v1';
function ambChime() {
    if (!ambCtx || !ambMaster) return;
    try {
        const t = ambCtx.currentTime + 0.01;
        [440, 659.25, 880].forEach((f, i) => {
            const osc = ambCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = f;
            const g = ambCtx.createGain();
            const st = t + i * 0.09;
            g.gain.setValueAtTime(0.0001, st);
            g.gain.exponentialRampToValueAtTime(0.16, st + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
            osc.connect(g); g.connect(ambMaster);
            osc.start(st); osc.stop(st + 0.55);
        });
    } catch (e) {}
}
function ambStart() {
    const ctx = ambEnsure();
    if (!ctx) { showToast('⚠️ 当前浏览器不支持音频播放'); return; }
    if (ambOn) return;
    ambOn = true;
    ambLayers = {};
    ambLayers.noise = ambLayerNoise(ctx);
    ambLayers.drone = ambLayerDrone(ctx);
    ambLayers.pad = ambLayerPad(ctx);
    ambLayers.sweet = ambLayerSweet(ctx);
    ambLayers.dread = ambLayerDread(ctx);
    ambMelStep = 0;
    ambBeat();

    ambSpark();
    ambUpdTimer = setInterval(ambUpdate, 500);

}

function visibleChoiceIndexes() {
    const btns = Array.prototype.slice.call(document.querySelectorAll('#choice-area button'));
    const out = [];
    btns.forEach(function (b, i) { if (!b.disabled) out.push(i); });
    return out;
}
function activateChoiceByKey(digit) {
    const btns = document.querySelectorAll('#choice-area button');
    const b = btns[digit - 1];
    if (!b || b.disabled) return false;
    b.click();

}
function closeTopModal() {
    const modals = document.querySelectorAll('.modal-bg');
    if (!modals.length) return false;
    // 优先点它自己的关闭按钮，走正常清理逻辑
    const m = modals[modals.length - 1];
    const btn = m.querySelector('button');
    if (btn) btn.click(); else m.remove();
    return true;
}
document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (/^[1-9]$/.test(e.key)) {
        const done = activateChoiceByKey(parseInt(e.key, 10));
        if (done) { e.preventDefault(); return; }
        const mb = document.getElementById('menu-buttons');
        if (mb) {                                  // 菜单页也用数字键
            const btns = mb.querySelectorAll('button');
            const idx = parseInt(e.key, 10) - 1;
            if (btns[idx]) { btns[idx].click(); e.preventDefault(); }
        }
        return;
    }
    if (e.key === 'Escape') { if (closeTopModal()) e.preventDefault(); return; }
    if (e.key === '[') { setFontSize(fontSize - 1); e.preventDefault(); return; }
    if (e.key === ']') { setFontSize(fontSize + 1); e.preventDefault(); return; }
});

// ---------- 存档 / 读档 ----------
let saveTokenSeq = 0;       // 存档快照序号（每次到达存档点 +1）
let lastLoadToken = null;   // 上一次读档消费的快照序号（同一快照重复读档不重复计周目）

        // 同一快照反复读档：惩罚累积到快照上（防刷锁）
        savedState.suspicion = clamp(savedState.suspicion + 3, 0, 150);
        savedState.worldline = clamp((savedState.worldline === undefined ? 100 : savedState.worldline) - 2, 0, 100);
    } else {
        weekCount++;
        archive.week++;
        lastLoadToken = savedState.token;

    restoreSnapshot();
    saveArchive();
}

function residueLevel() { return archive.residue || 0; }
// 回档代价：前两次"容错"，第 3 次起璃光的既视感开始变成猜疑
function residuePenalty() { return Math.min(6, Math.max(0, residueLevel() - 2)); }
function rewindFlavor() {
    const n = residueLevel();

const ARCHIVE_DEFAULTS = {
    week: 0, star: false, core: false, gun: false, past: false, equal: false,
    endings: {}, achievements: {}, cg: {}, flags: {}, rewinds: 0, residue: 0, arcs: {},
    readNodes: {}, intel: {},

// 存档规范化：原版 v1 的存档里没有 flags / rewinds / residue / arcs / readNodes，
// deepMerge 之后这些键仍是 undefined —— 于是点任何一个带 flag 的选项都会抛
// 「Cannot set properties of undefined」，表现就是"点了没反应、整局卡死"。
// 这里在每次读档/导入之后统一补齐，并且顺手把画廊进度从存档恢复
// （原先 unlockedEndings 只活在内存里，刷新一次画廊就全变回 ？？？）。
function normalizeArchive() {
    archive = archive || {};
    const defaults = ARCHIVE_DEFAULTS;
    for (const k of Object.keys(defaults)) {
        const dv = defaults[k];
        if (dv !== null && typeof dv === 'object' && !Array.isArray(dv)) {
            archive[k] = archive[k] || {};
            for (const k2 of Object.keys(dv)) {
                if (archive[k][k2] === undefined) archive[k][k2] = dv[k2];
            }
        } else if (archive[k] === undefined) {
            archive[k] = dv;
        }
    }
    if (typeof archive.rewinds !== 'number') archive.rewinds = 0;
    if (typeof archive.residue !== 'number') archive.residue = 0;
    if (typeof archive.week !== 'number') archive.week = 0;
    unlockedEndings = Object.assign({}, archive.endings || {});
}

        } catch (e) {}
    }
    // 即使 localStorage 不可用（部分手机浏览器直接开 file:// 时就是这样）也要规范化，
    // 保证 archive 的每个字段都存在

function saveArchive() {

        input.onchange = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    archive = deepMerge(JSON.parse(JSON.stringify(ARCHIVE_DEFAULTS)), data);
                    normalizeArchive();
                    saveArchive();
                    showToast('📂 存档已导入');
                    renderMenu();
                } catch (err) {

    }
    if (nodeId === 'final' && (archive.past || (memories.flags && memories.flags.past))) {
        return '风里，你忽然想起第三十天的那个旧梦。\n\n想起那个满地打滚的孩子，想起那双勾住的尾指，想起雪地里回头的少女，和那句轻得几乎听不见的——"阿奇，晚安。"\n\n原来在比这个清晨更早的从前，你们就已经见过。\n\n而此刻，你终于站在她的面前，亲口说出那个答案。';
    }
    if (nodeId === 'final' && met) {
        return '风里，你忽然想起第七天那家电影院。想起那些静静看着你们的观众，想起方易说的那句"你们已经在薄暮里了"。\n\n原来从那天起，你就已经见过，觉醒者们藏起来的、小心翼翼的那个世界。\n\n而此刻，面前的璃光，正站在那个世界与你的交界处，等你带她回家。';
    }
    if (nodeId === 'final' && archive.week >= 4) {
        return '你忽然觉得后颈发凉。\n\n不是风。\n\n有什么东西，在云层之上，在像素与规则之外，正安静地、一遍又一遍地，注视着你们。';
    }
    return '';
}

// ---------- 怀疑值爆表判定 ----------
function resolveSuspicionEnding() {
    if (memories.worldline <= 25) return 'e_ghost';      // 世界线被磨穿：你成了新世界的养料
    if (memories.intimacy >= 70) return 'e_sleep';       // 高亲密 + 高怀疑 → 她怕失去你，让你沉睡
    if (memories.trust <= 15) return 'e_chair';          // 低信任 + 高怀疑 → 她判定你背叛，断腿
    if (memories.flags.lxy_danger && !memories.flags.lxy_truth) return 'e_dinner'; // 林小悠作死 + 高怀疑 → 最后的晚餐（获知真相后豁免）
    if (archive.rili && archive.rili.escape) return 'e_chain'; // 逃跑过 + 高怀疑 → 铁笼的回声
    if (memories.mood <= 20) return 'e_happy';           // 低心情 + 高怀疑 → 快乐永恒
    return 'e_happy';                                     // 兜底 → 快乐永恒（伪装暴露，洗脑）
}

// ---------- 最终结局判定 ----------
function resolveFinal(kind) {
    switch (kind) {
        case 'report': return 'e_noescape';
        case 'betray': return memories.suspicion >= 50 ? 'e_noescape' : 'e_chair';
        case 'see':    return 'e_pillow';
        case 'flee':   return 'e_cage';
        // 后期结局：需满足对应前置，否则降级为基础坏结局
        case 'ruin':    return memories.intimacy >= 45 ? 'e_ruin' : 'e_cage';
        case 'wedding': return memories.flags.gun ? 'e_wedding' : (memories.intimacy >= 40 ? 'e_fuse' : 'e_cage');
        case 'fuse':    return memories.intimacy >= 40 ? 'e_fuse' : 'e_chair';
        case 'blind':   return memories.suspicion >= 20 ? 'e_blind' : 'e_happy';
        case 'fate': return archive.week >= 3 ? 'e_fate' : 'e_happy';
        case 'meaningless': return archive.week >= 5 ? 'e_meaningless' : 'e_happy';
        // 彩蛋结局
        case 'meta': return (Object.keys(archive.endings).length >= Math.max(18, Object.keys(endings).length - 8)) ? 'e_meta' : 'e_meaningless';
        case 'neverleave': return (memories.trust <= 25 && memories.intimacy <= 30) ? 'e_neverleave' : 'e_chair';
        case 'loop': return (archive.endings.e_fate && archive.endings.e_meaningless) ? 'e_loop' : 'e_meaningless';
        // 世界的眼睛（隐藏线）：周目≥4 才能进入，否则跌入【无意义】
        case 'eye': return archive.week >= 4 ? 'eye_1' : 'e_meaningless';
        // 世界危机终局：背着璃光突围（trust/intimacy 决定生死）
        case 'crisis_run': return (memories.trust >= 55 && memories.intimacy >= 50) ? 'e_crisis_good' : 'e_crisis_bad';
        // 平等篇终点判定（"不再叫主人"线）：按关系深度给出不同 LOVE 结局
        case 'love_final':
            // 三项全部 100+：关系已不可动摇，猜疑不再引发惩罚
            const lfMaxed = memories.trust >= 100 && memories.intimacy >= 100 && memories.mood >= 100;
            if (!lfMaxed && memories.suspicion > 40) return 'e_pillow';
            if (!lfMaxed && memories.mood <= 35) return 'e_happy';
            if (memories.trust >= 80 && memories.intimacy >= 90 && memories.mood >= 90) return 'e_love';
            if (memories.trust >= 65) return 'e_perfect';
            if (memories.intimacy >= 105) return 'e_sleep';
            return 'e_equal';
        case 'love':
            // 林小悠线作死过，且猜疑累积、且未获知她的真相 → 最后的晚餐
            if (memories.flags.lxy_danger && memories.suspicion >= 25 && !memories.flags.lxy_truth) return 'e_dinner';
            // 真结局核心条件：信任、亲密度、心情、回忆、关键信任，且妥善处理林小悠与安怜
            // 电影院支线联动：见过薄暮仍选择留在璃光身边 → 信任门槛放宽（50 → 45）
            // 旧梦联动：在梦中认出"阿奇"与银发大姐姐 → 信任门槛再放宽（45 → 40）
            const thinmuBond = !!(memories.flags.thinmu_met && !(archive.thinmu && archive.thinmu.joined));
            const pastBond = !!(archive.past || (memories.flags && memories.flags.past));
            const trustReq = pastBond ? 40 : (thinmuBond ? 45 : 50);
            // 林小悠危机已妥善解决（获知真相）→ 不再阻塞真结局
            const lxyResolved = !memories.flags.lxy_danger || !!memories.flags.lxy_truth;
            const loveCore = memories.trust >= trustReq && memories.intimacy >= 42 && memories.mood >= 60 &&
                memories.flags.star && memories.flags.trusted &&
                lxyResolved && !archive.anlian.suspect;
            // 三项全部 100+：关系已不可动摇，猜疑不再引发惩罚
            const maxed = memories.trust >= 100 && memories.intimacy >= 100 && memories.mood >= 100;
            if (loveCore) {
                if (maxed || memories.suspicion <= 30) {
                    // 条件满足、猜疑可控 → 进入"平等篇"剧情线（不再叫主人），终点再判定 LOVE 结局
                    return 'love_path_1';
                }
                // 条件都够，但猜疑偏高：她察觉你的紧张，仍舍不得伤你 → 人型抱枕（而非笼中挚爱）
                return 'e_pillow';
            }
            // 数值极高但缺关键回忆（小星星/核心信任）：关系已成，给次一级 LOVE 结局而非笼中
            if (memories.trust >= 75 && memories.intimacy >= 75 && memories.mood >= 75 && memories.suspicion <= 30) return 'e_perfect';
            // 真结局条件不满足时：仅"信任不足 + 亲密度过高"才沉眠，其余降级
            if (memories.trust < 50 && memories.intimacy >= 78) return 'e_sleep';
            if (memories.suspicion >= 45) return 'e_happy';
            if (memories.trust <= 20) return 'e_chair';
            return 'e_cage';
    }
    return 'e_cage';
}

// 同一 group 的选项只渲染一个（例如"支线入口"与"情报捷径"是同一个去处的两种走法）：
//   ① 优先显示"条件已满足"的那个；都满足时取 groupPriority 更高的（捷径）；
//   ② 都不满足时显示 groupPriority 最低的那个 —— 那是给新玩家的正规入口，
//      它的解锁提示（"需要先与安怜打过交道"）比"需要情报"更可执行。
// 返回的仍是原始下标，makeChoice / 键盘选号都不受影响。
function visibleChoiceIndexes(node) {
    const groups = {};
    const out = [];
    node.choices.forEach((c, i) => {
        if (!c.group) { out.push(i); return; }
        (groups[c.group] = groups[c.group] || []).push(i);
    });
    const prio = (i) => node.choices[i].groupPriority || 0;
    Object.keys(groups).forEach(g => {
        const idxs = groups[g];
        const ok = idxs.filter(i => checkRequire(node.choices[i].require).ok);
        let pick;
        if (ok.length) {
            pick = ok.reduce((a, b) => (prio(b) > prio(a) ? b : a), ok[0]);
        } else {
            pick = idxs.reduce((a, b) => (prio(b) < prio(a) ? b : a), idxs[0]);
        }
        out.push(pick);
    });
    return out.sort((a, b) => a - b);
}
// ============================================================
//  死档兜底：存档里记的节点在当前版本可能已经不存在（跨版本读档 / 手动改过的存档）。
//  原来的行为是弹一个 alert 就 return —— 玩家会永远卡在上一帧画面上，
//  点任何东西都没反应，只能手动清数据。现在改成自动恢复到还能用的最近位置。
// ============================================================
// 按存档点名字找回节点：旧槽位里存了 savePointName（如「第15天 · 52℃的茶」），
// 就算节点 id 在新版本里变了，也能靠这个名字精确落回同一天的存档点。
function findSavePointByName(name) {
    if (!name) return null;
    for (const id in story) {
        if (story[id].savePoint && story[id].saveName === name) return id;
    }
    return null;
}
function recoverMissingNode(preferredName) {
    const badId = currentNodeId;
    const byName = findSavePointByName(preferredName);
    if (byName) {
        currentNodeId = byName;
        showToast('⚠️ 存档位置已更新，已恢复到「' + preferredName + '」');
        return true;
    }
    const seen = Object.keys(archive.readNodes || {}).filter(k => story[k] || endings[k]);
    const candidates = [saveNodeId].concat(seen.reverse()).concat(['start']);
    for (const c of candidates) {
        if (!c) continue;
        const n = story[c] || endings[c];
        if (!n) continue;
        currentNodeId = c;
        const label = n.saveName || n.title || (story[c] ? '最近的剧情节点' : '');
        showToast('⚠️ 进度「' + badId + '」在当前版本已不存在，已回到' + (label ? '「' + label + '」' : '开头'));
        return true;
    }
    return false;
}

function startGame() {
    memories = { trust: 30, suspicion: 0, mood: 60, intimacy: 20, worldline: 100,
                 flags: { star: false, trusted: false, check_pass: false, lxy_danger: false, gun: false } };
    memories.path = [];
    // 跨周目 flag 回填（新支线用通用 flag 记录进度）
    const af = archive.flags || {};
    for (const k of Object.keys(af)) { if (af[k]) memories.flags[k] = true; }
    applyNpcMemory();
    // 残留记忆：回档越多，开局的世界线越薄
    memories.worldline = clamp(100 - Math.min(20, Math.floor((archive.rewinds || 0) / 2) * 2), 40, 100);
    currentNodeId = 'start';
    currentScreen = 'game';
    archive.week++;
    weekCount = archive.week;      // 顶栏周目数与本局档案保持一致
    saveArchive();
    saveGame('start', '序章 · 穿越');
    renderGame();
    // 点击"开始游戏"是用户手势：自动开启氛围音效（除非用户此前手动关闭过）
    try {
        if (!ambOn && localStorage.getItem(AMB_OFF_KEY) !== '1') ambStart();
        updateSoundBtn();
    } catch (e) {}
}

function makeChoice(idx) {
    const node = story[currentNodeId] || endings[currentNodeId];
    if (!node || !node.choices) return;
    const c = node.choices[idx];
    if (!c) return;
    const rq = checkRequire(c.require);
    if (!rq.ok) { showToast('🔒 条件未满足：' + rq.text); return; }
    // 手动点击时先取消挂起的自动/快进推进：否则那个定时器会在新节点上再走一步，
    // 表现为"点一次跳两格"（手机上尤其明显，因为 1.4 秒的自动间隔很容易撞上手指）
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }

    if (memories.path) memories.path.push(c.text);
    else memories.path = [c.text];
    markHistoryChoice(c.text);

    addStat('trust', c.trust);
    addStat('suspicion', c.suspicion);
    addStat('mood', c.mood);
    addStat('intimacy', c.intimacy);
    addStat('worldline', c.worldline);
    // 后期高压（难度曲线平滑上升）：第二十一天起，每天开始时璃光的不安 +1——
    // 正常路线摊牌前约 +11（仍低于真结局 25 线），作死路线叠加自身惩罚更快爆表
    if (/^(day2[1-9]_daily|day12_morning|day13_night|d3_morning)/.test(currentNodeId)) {
        addStat('suspicion', 1);
    }
    if (c.flag_star) memories.flags.star = true;
    if (c.flag_trusted) memories.flags.trusted = true;
    if (c.flag_check_pass) memories.flags.check_pass = true;
    if (c.flag_lxy) { memories.flags.lxy_danger = true; archive.lxy.met = true; archive.lxy.danger = true; }
    if (c.flag_handled) { memories.flags.lxy_danger = false; archive.lxy.met = true; archive.lxy.rejected = true; }
    if (c.flag_gun) memories.flags.gun = true;
    if (c.flag_anlian) { archive.anlian.trust = true; archive.anlian.suspect = false; }
    // 新支线 flag：旧梦（前世记忆）、林悠真相
    if (c.flag_past) { memories.flags.past = true; archive.past = true; }
    if (c.flag_lxy_truth) { memories.flags.lxy_truth = true; archive.lxy.truth = true; }
    // 平等篇：她第一次喊出你的名字
    if (c.flag_equal) { archive.equal = true; }
    // 电影院支线 · 薄暮记忆（本局 flag + 跨周目档案）
    if (c.flag_thinmu_met) { memories.flags.thinmu_met = true; archive.thinmu.met = true; }
    if (c.flag_thinmu_truth) { memories.flags.thinmu_truth = true; archive.thinmu.truth = true; }
    if (c.flag_thinmu_watch) { memories.flags.thinmu_watch = true; }
    // ---- 通用 flag 处理：任何 flag_xxx 都写入本局记忆与跨周目档案，
    //      新增支线无需再改引擎（旧的特殊语义仍在上方保留）
    for (const fk of Object.keys(c)) {
        if (fk.indexOf('flag_') === 0 && c[fk]) {
            const fname = fk.slice(5);
            memories.flags[fname] = true;
            if (!archive.flags) archive.flags = {};   // 兜底：旧存档规范化之前也不能崩
            archive.flags[fname] = true;
        }
    }
    // 写入跨周目记忆档案（永久保留，不随读档重置）
    if (c.flag_star) archive.star = true;
    if (c.flag_trusted) archive.core = true;
    if (c.flag_gun) archive.gun = true;
    saveArchive();
    checkAchievements();

    // 怀疑值爆表：直接进入坏结局（根据其他值选择）
    if (memories.suspicion >= 80) {
        currentNodeId = resolveSuspicionEnding();
        renderGame();
        return;
    }
    // 心情归零：她察觉你已痛苦到极点，决定移除你所有不快乐 → 快乐永恒
    if (memories.mood <= 0) {
        currentNodeId = 'e_happy';
        renderGame();
        return;
    }

    // 亲密度风险判定：同床共枕
    if (c.risk === 'sleep') {
        if (memories.intimacy >= 48 && memories.trust < 60) { currentNodeId = 'e_sleep'; }
        else { currentNodeId = c.next; }
        renderGame();
        return;
    }
    if (c.risk === 'sleep2') {
        if (memories.intimacy >= 48 && memories.trust < 60) { currentNodeId = 'e_sleep'; }
        else { currentNodeId = c.next; }
        renderGame();
        return;
    }
    if (c.risk === 'escape') {
        if (memories.suspicion >= 15) { currentNodeId = 'e_chain'; }
        else if (memories.intimacy >= 35) { currentNodeId = 'e_cage'; }
        else { currentNodeId = 'e_chair'; }
        renderGame();
        return;
    }
    if (c.risk === 'marry') {
        if (memories.trust >= 70 && memories.intimacy >= 70 && memories.flags.star) {
            currentNodeId = 'e_marry';
        } else if (memories.trust < 50) {
            currentNodeId = 'e_sleep';
        } else {
            currentNodeId = 'e_cage';
        }
        renderGame();
        return;
    }
    if (c.risk === 'crisis') {
        currentNodeId = (memories.trust >= 55 && memories.intimacy >= 50) ? 'e_crisis_good' : 'e_crisis_bad';
        renderGame();
        return;
    }

    // 最终判定
    if (c.final) {
        currentNodeId = resolveFinal(c.final);
        renderGame();
        return;
    }

    currentNodeId = c.next;
    renderGame();
}

function arcReached(a) {
    if (!a.flag) return true;
    const f = archive.flags || {};
    if (f[a.flag]) return true;
    if (a.flag === 'thinmu_met') return !!(archive.thinmu && archive.thinmu.met);
    if (a.flag === 'past') return !!archive.past;
    if (a.flag === 'equal') return !!archive.equal;
    if (a.flag === 'lxy_truth') return !!(archive.lxy && archive.lxy.truth);
    if (a.flag === 'island_seen') return !!archive.endings.e_island || !!archive.endings.e_home;
    if (a.flag === 'amnesia_seen') return !!archive.endings.e_amnesia;
    return false;
}
function showArcs() {
    const items = ARC_DEFS.map(a => {
        const on = arcReached(a);
        return `<div class="hist-entry" style="border-left-color:${on ? '#d6336c' : '#d8d0dc'};">
            <div style="font-size:14px;font-weight:600;color:${on ? '#b0003a' : '#a094a8'};">${on ? a.icon : '🔒'} ${a.name}${on ? '' : '（未解锁）'}</div>
            <div style="font-size:12px;color:#999;margin-top:3px;">${a.tip}</div></div>`;
    }).join('');
    const done = ARC_DEFS.filter(arcReached).length;
    showModal(`🧭 支线图鉴（${done}/${ARC_DEFS.length}）`,
        `${items}<p style="margin-top:10px;font-size:12px;color:#999;">本作依据原著 651 章改编。主线之外共有十余条支线，多数需要在特定天数做出特定选择才会开启。<br>已知情报 <b>${intelCount()}</b>/${Object.keys(INTEL_DEFS).length} —— 见过的事会变成情报，主菜单「🧠 情报」可查看。</p>`, false);
}
// ---------- 璃光档案：把人物分析做成随进度解锁的图鉴 ----------
// 解锁条件全部基于"你真的走到过那里"：readNodes（走过的节点）/ endings / week / intel。
function loreEntryUnlocked(e) {
    const u = e.unlock || {};
    if (u.default) return true;
    if (u.node && !(archive.readNodes && archive.readNodes[u.node])) return false;
    if (u.ending && !(archive.endings && archive.endings[u.ending])) return false;
    if (u.flag && !hasStoryFlag(u.flag)) return false;
    if (u.intel && !hasIntel(u.intel)) return false;
    if (typeof u.week === 'number' && (archive.week || 0) < u.week) return false;
    if (typeof u.rewinds === 'number' && (archive.rewinds || 0) < u.rewinds) return false;
    return true;
}
function loreUnlocked() {
    return (window.LIGUANG_LORE || []).filter(loreEntryUnlocked).length;
}
function loreUnlockHint(e) {
    const u = e.unlock || {};
    if (u.node) return '走过「' + String(u.node).replace(/^(d1_|d2_|day\d+_)/, '') + '」这一段';
    if (u.ending) return '达成结局【' + ((endings[u.ending] || {}).title || u.ending) + '】';
    if (u.intel) return '获得情报「' + ((INTEL_DEFS[u.intel] || {}).name || u.intel) + '」';
    if (typeof u.week === 'number') return '第 ' + u.week + ' 周目起';
    if (typeof u.rewinds === 'number') return '回档 ≥' + u.rewinds + ' 次';
    return '继续往下玩';
}
function showLore() {
    const lore = window.LIGUANG_LORE || [];
    const items = lore.map(e => {
        const on = loreEntryUnlocked(e);
        if (!on) {
            return `<div class="hist-entry" style="border-left-color:#ddd6e2;">
                <div style="font-size:14px;font-weight:600;color:#a094a8;">🔒 ？？？　<span style="font-size:11px;font-weight:400;">${e.chapters}</span></div>
                <div style="font-size:12px;color:#b3a8bd;margin-top:3px;">解锁：${loreUnlockHint(e)}</div></div>`;
        }
        const kindCls = e.kind === 'phase' ? '#d6336c' : (e.kind === 'lang' ? '#2f9e44' : '#6b4bb0');
        return `<div class="hist-entry" style="border-left-color:${kindCls};">
            <div style="font-size:14px;font-weight:700;color:${kindCls};">${e.title}
                <span style="font-size:11px;font-weight:400;color:#a094a8;">　${e.chapters}</span></div>
            <div style="font-size:13px;color:#5a5060;line-height:1.85;margin-top:6px;">${
                e.lines.map(l => `<div style="margin-bottom:3px;">· ${l}</div>`).join('')}</div></div>`;
    }).join('');
    const n = loreUnlocked();
    showModal(`📖 璃光档案（${n}/${lore.length}）`,
        `<p style="font-size:12.5px;color:#8a7fa8;line-height:1.8;margin-bottom:10px;">
           依据原著 651 章原文整理的人物分析，<b>随着你在游戏里真正走到那一段而逐条解锁</b>。
           文中引用的台词全部逐字取自原著并标注章号。</p>
         ${items}
         <p style="margin-top:12px;font-size:12px;color:#999;">完整版（含量化统计与核验说明）见随附的《璃光人物分析.md》。</p>`, false);
}

// 结局攻略路线：由 _tools/solve_routes.py 用真实引擎搜索并复演得出，写在 endings[].route 里
function showWalkthrough() {
    const ids = Object.keys(endings);
    const withRoute = ids.filter(id => endings[id].route && endings[id].route.length);
    const items = ids.map(id => {
        const e = endings[id];
        const love = e.type === 'LOVE';
        const row = (e.route && e.route.length)
            ? `<details style="margin-top:6px;">
                   <summary style="cursor:pointer;font-size:12.5px;color:#6b4bb0;">查看路线（${e.route.length} 步）</summary>
                   <div style="font-size:12px;line-height:1.9;color:#6a6070;margin-top:6px;padding:8px 10px;background:#faf7fc;border-radius:8px;">
                       ${e.route.map((s, i) => `<div>${i + 1}. ${s}</div>`).join('')}
                   </div>
                   ${(e.route_needs && e.route_needs.length) ? `<div style="font-size:12px;color:#a8690a;margin-top:6px;">前置：${e.route_needs.join('、')}</div>` : ''}
                   ${e.route_fresh ? '<div style="font-size:12px;color:#2f9e44;margin-top:4px;">✅ 全新存档即可达成</div>' : '<div style="font-size:12px;color:#a8690a;margin-top:4px;">⚠️ 需要先有上面这些前置</div>'}
               </details>`
            : `<div style="font-size:12px;color:#a8690a;margin-top:6px;line-height:1.8;">
                   ⚠️ 这条结局的达成条件是一条很窄的数值带，自动求解没能给出可复演的点击路线。按条件走：<br>${e.hint || '—'}</div>`;
        const on = !!unlockedEndings[id];
        return `<div class="hist-entry" style="border-left-color:${love ? '#d6336c' : '#8a2b4a'};">
            <div style="font-size:13.5px;font-weight:600;color:${love ? '#d6336c' : '#8a2b4a'};">
                ${love ? '💖' : '💀'} 【${e.title}】<span style="font-size:11px;font-weight:400;color:#a094a8;">${e.code || ''}${on ? ' · 已达成' : ''}</span></div>
            <div style="font-size:12.5px;color:#8a7f90;margin-top:3px;">${e.hint || ''}</div>
            ${row}</div>`;
    }).join('');
    showModal(`🧭 全结局攻略路线（${withRoute.length}/${ids.length} 条经实机复演）`,
        `<p style="font-size:12.5px;color:#8a7fa8;line-height:1.8;margin-bottom:10px;">
         下面每一条路线都是用<b>游戏本身的引擎</b>搜索出来、再原样复演验证过的——
         照着点，就会走到那个结局。展开可看每一步点什么。</p>
         ${items}`, false);
}
// 结局回放：在模态中显示已解锁结局的全文
function showEndingText(id) {

}

// ---------- CG 系统 ----------
function unlockCg(id) {
    archive.cg = archive.cg || {};
    if (!archive.cg[id]) {
        archive.cg[id] = true;
        saveArchive();
        const m = (window.CG_MANIFEST || []).find(c => c.id === id);
        if (m) showToast('🖼 CG 解锁：' + m.name);
    }
}
function checkCgUnlock(nodeId) {
    (window.CG_MANIFEST || []).forEach(m => {
        if (m.node === nodeId || m.ending === nodeId) unlockCg(m.id);
    });
}
function cgThumb(m) {
    const img = window.CG_IMAGES && window.CG_IMAGES[m.id];
    if (img) return `<img src="${img}" alt="${m.name}" style="width:100%;height:104px;object-fit:cover;border-radius:8px;display:block;">`;
    return `<div style="width:100%;height:104px;border-radius:8px;background:linear-gradient(135deg, ${m.bg || '#4a3a5a'}, #1a1024);display:flex;align-items:center;justify-content:center;font-size:42px;">${m.icon || '🖼'}</div>`;
}
function showCgGallery() {
    const manifest = window.CG_MANIFEST || [];
    archive.cg = archive.cg || {};
    const unlocked = Object.keys(archive.cg).length;
    const items = manifest.map(m => {
        const on = !!archive.cg[m.id];
        if (on) {
            return `<div class="g-item on" onclick="showCgImage('${m.id}')" style="cursor:pointer;">${cgThumb(m)}<div style="margin-top:6px;font-size:12px;">${m.name}</div></div>`;
        }
        return `<div class="g-item"><div style="width:100%;height:104px;border-radius:8px;background:#e8e2ea;display:flex;align-items:center;justify-content:center;font-size:30px;color:#b8a8b8;">🔒</div><div style="margin-top:6px;font-size:12px;color:#b8a8b8;">？？？</div></div>`;
    }).join('');
    showModal(`🖼 CG 画廊（${unlocked}/${manifest.length}）`,
        `<div id="gallery-grid">${items}</div><p style="margin-top:10px;font-size:12px;color:#999;">点击已解锁的 CG 查看大图。正式素材放入 assets/cg/&lt;id&gt;.png，构建后自动替换占位图。</p>`, false);
    spawnParticles();
}
function showCgImage(id) {
    const m = (window.CG_MANIFEST || []).find(x => x.id === id);
    if (!m || !archive.cg[id]) return;
    try { document.querySelectorAll('.modal-bg').forEach(o => o.remove()); } catch (err) {}
    const img = window.CG_IMAGES && window.CG_IMAGES[m.id];
    const body = img
        ? `<img src="${img}" style="width:100%;border-radius:12px;display:block;">`
        : `<div style="width:100%;aspect-ratio:16/10;border-radius:12px;background:linear-gradient(135deg, ${m.bg || '#4a3a5a'}, #1a1024);display:flex;align-items:center;justify-content:center;font-size:96px;">${m.icon || '🖼'}</div>`;
    showModal(`🖼 ${m.name}${img ? '' : '（占位图，待替换素材）'}`,
        `${body}<p style="margin-top:12px;font-size:12px;color:#999;">CG 素材就位后，将 assets/cg/${id}.png 放入工程并重新构建即可替换。</p>`, true);
}
function spawnParticles() {
    try {
        const modal = document.querySelector('.modal');
        if (!modal) return;
        const colors = ['#ffd700', '#ffb6c1', '#ff9ec7', '#a0f4ff', '#c39bff'];
        for (let i = 0; i < 24; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = 2 + Math.random() * 4;
            const color = colors[Math.floor(Math.random() * colors.length)];
            p.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;width:' + size + 'px;height:' + size + 'px;background:' + color + ';box-shadow:0 0 ' + (size * 2) + 'px ' + color + ';animation-duration:' + (3 + Math.random() * 4) + 's;animation-delay:' + (Math.random() * 4) + 's;';
            modal.appendChild(p);
        }
    } catch (e) {}
}

function showModal(title, content, hasClose = true) {
    let bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${String(title).replace(/[<>&"]/g, '')}"><h3>${title}</h3>${hasClose ? `<p>${content}</p>` : content}<button onclick="this.closest('.modal-bg').remove()">关闭</button></div>`;
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    document.body.appendChild(bg);
    // 键盘/读屏：打开后把焦点移进弹窗，Esc 可关闭
    try {
        if (lastFocused && document.body.contains(lastFocused)) { /* 保留以便还原 */ }
        lastFocused = document.activeElement;
        const btn = bg.querySelector('.modal button');
        if (btn) btn.focus({ preventScroll: true });
    } catch (e) {}
    const obs = new MutationObserver(function () {
        if (!document.body.contains(bg)) {
            obs.disconnect();
            try { if (lastFocused && document.body.contains(lastFocused)) lastFocused.focus({ preventScroll: true }); } catch (e) {}
        }
    });
    obs.observe(document.body, { childList: true });
}
let lastFocused = null;

loadArchive();
