<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的病娇机械妻</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #1a1a2e;
    background-image: radial-gradient(circle at 50% 0%, #2d2d4a 0%, #1a1a2e 60%);
    transition: background 1.2s ease;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 16px;
}
#app {
    max-width: 820px; width: 100%; background: #ffffff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 32px; min-height: 620px;
    display: flex; flex-direction: column; position: relative;
    border: 4px solid #ffb6c1;
    animation: fadein 0.4s ease;
}
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

#menu-title { text-align: center; font-size: 34px; font-weight: 800; color: #d6336c; letter-spacing: 4px; text-shadow: 2px 2px 8px rgba(214,51,108,0.3); margin-bottom: 10px; }
#menu-sub { text-align: center; color: #888; font-size: 13px; letter-spacing: 2px; margin-bottom: 24px; line-height: 1.8; }

#top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
#save-badge { font-size: 12px; color: #2f9e44; background: #e6f7e6; padding: 4px 10px; border-radius: 12px; }
#week-badge { font-size: 12px; color: #b0003a; background: #fdeef2; padding: 4px 10px; border-radius: 12px; }

#status-bar { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.stat { flex: 1; min-width: 80px; text-align: center; padding: 7px 4px; border-radius: 12px; background: #f0f0f0; transition: background 0.25s, color 0.25s; }
.stat b { font-size: 13px; }
.stat.danger { background: #ffe0e6; color: #b0003a; }
.stat.warn { background: #fff3d6; color: #a8690a; }
.stat.good { background: #e6f7e6; color: #2f9e44; }

#story-text { font-size: 17px; line-height: 1.9; color: #333; white-space: pre-wrap; word-break: break-word; min-height: 240px; animation: textFade 0.6s ease; }
@keyframes textFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#story-text .hl { color: #d6336c; font-weight: bold; }
#story-text .dim { color: #999; }

#choice-area { display: flex; flex-direction: column; gap: 11px; margin-top: 20px; }
#choice-area button { background: #fff0f5; border: 2px solid #ffb6c1; border-radius: 14px; padding: 14px 20px; font-size: 15px; text-align: left; cursor: pointer; transition: all 0.18s; color: #333; line-height: 1.5; }
#choice-area button:hover { background: #ffd0dc; transform: translateX(5px); border-color: #f78ba8; }
#choice-area button.danger-btn { background: #fff2f2; border-color: #e57373; color: #a02020; }
#choice-area button.danger-btn:hover { background: #ffe0e0; border-color: #d32f2f; }
#choice-area button.danger-btn { animation: dangerPulse 1.6s ease-in-out infinite; }
/* 未满足解锁条件的支线入口（点了没反应，会给出条件提示） */
#choice-area button.locked-btn { background: #f4f2f6; border-color: #ddd6e2; color: #9a90a4; cursor: not-allowed; opacity: 0.9; }
#choice-area button.locked-btn:hover { transform: none; background: #f4f2f6; border-color: #ddd6e2; }
#choice-area button.locked-btn .lock-req { display: block; font-size: 11px; color: #b3a8bd; margin-top: 4px; letter-spacing: 0.3px; }
@keyframes dangerPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(211,47,47,0); } 50% { box-shadow: 0 0 12px 2px rgba(211,47,47,0.55); } }
#face-badge { font-size: 22px; line-height: 1; transition: transform 0.3s ease; }
#face-badge:hover { transform: scale(1.25); }

#history { margin-top: 22px; padding-top: 12px; border-top: 1px solid #eee; font-size: 12px; color: #999; }
#history span { display: inline-block; background: #f5f5f5; border-radius: 12px; padding: 4px 10px; margin: 2px 4px 2px 0; }

#menu-buttons { display: flex; flex-direction: column; gap: 12px; padding-top: 20px; }
#menu-buttons button { background: #f5f5f8; border: none; border-radius: 16px; padding: 16px; font-size: 16px; cursor: pointer; color: #1e1e1e; transition: background 0.2s; }
#menu-buttons button:hover { background: #e8e8ee; }

#back-btn { background: transparent; border: none; color: #888; font-size: 14px; cursor: pointer; margin-bottom: 12px; text-align: left; padding: 0; }
#back-btn:hover { color: #333; }

.ending-head { text-align: center; margin-bottom: 20px; }
.ending-head .tag { font-size: 22px; font-weight: bold; display: block; margin-bottom: 10px; }
.ending-head .title { font-size: 24px; font-weight: 800; display: block; margin-bottom: 4px; }
.ending-head .code { font-size: 13px; color: #999; }
@keyframes endingPop { 0% { opacity: 0; transform: scale(0.5); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes eggGlow { 0%,100% { text-shadow: 0 0 6px #ffd700, 0 0 14px #ff9e6b; } 50% { text-shadow: 0 0 20px #ffd700, 0 0 34px #ff5e9e; } }
@keyframes eggTitle { 0%,100% { text-shadow: 0 0 8px #ffd700, 0 0 22px #ff9e6b, 0 0 40px #ff6b9d; } 50% { text-shadow: 0 0 18px #ffd700, 0 0 44px #ff9e6b, 0 0 70px #ff5e9e; } }
@keyframes eggBg { 0%,100% { box-shadow: 0 0 30px rgba(255,215,0,0.35), inset 0 0 50px rgba(255,215,0,0.12); } 50% { box-shadow: 0 0 60px rgba(255,215,0,0.6), inset 0 0 80px rgba(255,215,0,0.25); } }
@keyframes loveGlow { 0%,100% { text-shadow: 0 0 10px #ff9ec7, 0 0 24px #ff6b9d, 0 0 42px #ff3b7f; } 50% { text-shadow: 0 0 20px #ffb6d5, 0 0 44px #ff8fb8, 0 0 72px #ff5e9e; } }
@keyframes loveBg { 0%,100% { box-shadow: 0 0 30px rgba(255,110,160,0.4), inset 0 0 50px rgba(255,110,160,0.15); } 50% { box-shadow: 0 0 60px rgba(255,110,160,0.7), inset 0 0 80px rgba(255,110,160,0.3); } }
@keyframes metaGlow { 0%,100% { text-shadow: 0 0 10px #7df9ff, 0 0 24px #4ad9ff, 0 0 42px #9c6ade; } 50% { text-shadow: 0 0 20px #a0f4ff, 0 0 44px #7de8ff, 0 0 72px #c39bff; } }
@keyframes metaBg { 0%,100% { box-shadow: 0 0 30px rgba(120,220,255,0.4), inset 0 0 50px rgba(156,110,222,0.15); } 50% { box-shadow: 0 0 60px rgba(120,220,255,0.7), inset 0 0 80px rgba(156,110,222,0.3); } }
.new-badge { display:inline-block; margin-left:8px; padding:2px 10px; background:#ffd700; color:#7a5c00; border-radius:12px; font-size:12px; font-weight:bold; animation:eggGlow 1.2s infinite; }

#gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
#gallery-grid .g-item { border: 1px solid #eee; border-radius: 12px; padding: 10px; font-size: 13px; text-align: center; color: #666; background: #fafafa; }
#gallery-grid .g-item.on { border-color: #d6336c; background: #fdeef2; color: #b0003a; font-weight: 600; }
#gallery-grid .g-item.on.love { border-color: #d4a0c0; background: #faf0f7; color: #a0528c; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
/* 回档演出遮罩（原著核心机制：读档轮回） */
.rewind-veil { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(30,10,40,0.94) 0%, rgba(4,2,8,0.97) 70%); z-index: 900;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
    color: #e8d8f0; font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; animation: rewindIn 0.35s ease; }
@keyframes rewindIn { from { opacity: 0; filter: blur(6px) brightness(2); } to { opacity: 1; filter: none; } }
/* 世界线告急横幅 */
#worldline-banner { margin-bottom: 12px; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.7;
    background: #2a1030; border-left: 3px solid #9c6ade; color: #d8c2f0; }
#worldline-banner.critical { background: #3a0a14; border-left-color: #e0483c; color: #ffd6d0; animation: pulseBlood 2.4s ease-in-out infinite; }
/* 手机端：选项在屏幕外时的悬浮提示（点了直接滚到选项） */
#scroll-hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 40;
    display: none; background: #d6336c; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; box-shadow: 0 6px 18px rgba(214,51,108,0.45);
    cursor: pointer; animation: hintBob 1.6s ease-in-out infinite; user-select: none; }
@keyframes hintBob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); } }

/* ============================================================
   动效节流：全书有 13 处无限循环动画，手机上既费电又可能引起不适
   （其中 glitchBg 是 0.5s 的全屏明暗循环）。
   ① 跟随系统「减少动态效果」；② 设置里可手动关闭；③ 切到后台一律暂停。
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
}
body.anim-paused *, body.anim-paused *::before, body.anim-paused *::after {
    animation-play-state: paused !important;
}
/* 章节徽章 */
#chapter-badge { font-size: 12px; color: #6b4bb0; background: #f3ecff; padding: 4px 10px; border-radius: 12px; }
.modal { position: relative; background: #fff; border-radius: 18px; padding: 24px; max-width: 640px; width: 92%; max-height: 80vh; overflow: auto; border: 3px solid #ffb6c1; }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0.9; } 100% { transform: translateY(-140px) scale(0.1); opacity: 0; } }
.particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; animation-name: floatUp; animation-timing-function: linear; animation-iteration-count: infinite; }
.modal h3 { color: #d6336c; margin-bottom: 14px; }
.modal button { margin-top: 16px; background: #ffd0dc; border: none; border-radius: 12px; padding: 10px 18px; cursor: pointer; font-size: 14px; }
.modal p { font-size: 14px; color: #555; line-height: 1.7; white-space: pre-wrap; }
.slot-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 8px 0; border: 1px solid #e8d0dc; border-radius: 12px; cursor: pointer; background: #fdf6fa; transition: all 0.15s; }
.slot-row:hover { background: #ffe4ee; border-color: #d6336c; }
.slot-num { font-weight: bold; color: #d6336c; min-width: 52px; }
.slot-info { font-size: 12px; color: #888; }
.hist-entry { padding: 10px 12px; margin-bottom: 8px; background: #faf6f8; border-radius: 10px; border-left: 3px solid #d4a0c0; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed #eed8e2; font-size: 14px; color: #555; }
.set-row button { margin-top: 0 !important; }

/* ============================================================
   结局氛围背景（血光脉冲 / 故障闪烁 / 冷寂 / 暖色 LOVE）
   ============================================================ */
body.mood-bloody { background: radial-gradient(ellipse at center, #3a0a10 0%, #150308 55%, #000 100%); animation: pulseBlood 3s ease-in-out infinite; }
body.mood-glitch { background: #000; animation: glitchBg 0.5s infinite; }
body.mood-eerie  { background: radial-gradient(ellipse at top, #2a2a38 0%, #14141e 60%, #05050a 100%); }
body.mood-love   { background: radial-gradient(ellipse at top, #ffe4f0 0%, #f0c8d8 50%, #d0a0b8 100%); }
body.mood-thinmu { background: radial-gradient(ellipse at top, #2a1a3e 0%, #150a24 60%, #05030c 100%); animation: pulseThinmu 4s ease-in-out infinite; }
@keyframes pulseThinmu { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
body.mood-thinmu #app { background: rgba(18,10,30,0.94); border-color: #7c5cbf; box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 0 80px rgba(120,80,200,0.18); }
body.mood-thinmu #story-text { color: #e4d8f0; }
body.mood-thinmu #choice-area button { background: rgba(36,22,56,0.9); border-color: #7c5cbf; color: #e8dcf8; }
body.mood-thinmu #choice-area button:hover { background: #4a2c70; border-color: #b48ae8; }
body.mood-thinmu #back-btn { color: #a890c8; }
body.mood-thinmu #back-btn:hover { color: #d0b8f0; }
body.mood-thinmu .ending-head .code { color: #9a80b8; }
@keyframes pulseBlood { 0%,100% { filter: brightness(1) saturate(1); } 50% { filter: brightness(1.18) saturate(1.35); } }
@keyframes glitchBg { 0% { background: #000; } 25% { background: #12000a; } 50% { background: #000; } 75% { background: #000a12; } 100% { background: #000; } }
body.mood-bloody #app, body.mood-glitch #app, body.mood-eerie #app {
    background: rgba(24,8,16,0.94); border-color: #a02040;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 0 80px rgba(160,0,40,0.15);
}
body.mood-bloody #story-text, body.mood-glitch #story-text, body.mood-eerie #story-text { color: #e8d8e0; }
body.mood-bloody #choice-area button, body.mood-glitch #choice-area button, body.mood-eerie #choice-area button { background: rgba(60,20,30,0.9); border-color: #a02040; color: #f0d8e0; }
body.mood-bloody #choice-area button:hover, body.mood-eerie #choice-area button:hover { background: #5a2434; border-color: #e57373; }
body.mood-bloody #back-btn, body.mood-glitch #back-btn, body.mood-eerie #back-btn { color: #b08090; }
body.mood-bloody #back-btn:hover, body.mood-eerie #back-btn:hover { color: #f0c0d0; }
body.mood-bloody .ending-head .code, body.mood-glitch .ending-head .code, body.mood-eerie .ending-head .code { color: #a08090; }
body.mood-love #app { border-color: #e0a8c0; box-shadow: 0 20px 60px rgba(200,80,140,0.45), inset 0 0 60px rgba(255,220,240,0.35); }
/* ---- 字号调节：四档，同时作用于正文与选项按钮 ---- */
body.fs-1 #story-text { font-size: 15px; }
body.fs-2 #story-text { font-size: 17px; }
body.fs-3 #story-text { font-size: 19.5px; }
body.fs-4 #story-text { font-size: 22px; }
body.fs-1 #choice-area button, body.fs-2 #choice-area button { font-size: 15px; }
body.fs-3 #choice-area button { font-size: 16.5px; }
body.fs-4 #choice-area button { font-size: 18px; }
body.fs-4 #choice-area button { padding: 18px 20px; }
/* 选项编号角标（键盘 1-9 直接选） */
.key-badge { display: inline-block; min-width: 17px; height: 17px; line-height: 17px; text-align: center;
    font-size: 11px; font-weight: 700; color: #b0003a; background: #ffe4ee; border-radius: 5px;
    margin-right: 7px; flex: 0 0 auto; }
#choice-area button { display: flex; align-items: baseline; }
/* 键盘可达性：焦点环 */
#choice-area button:focus-visible, #menu-buttons button:focus-visible, .modal button:focus-visible,
#scroll-hint:focus-visible, .slot-row:focus-visible {
    outline: 3px solid #d6336c; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 640px) {
    html, body { overflow-x: hidden; max-width: 100%; }
    body { padding: 0; }
    #app { max-width: 100%; border-radius: 0; padding: 16px 13px; min-height: 100vh; border-width: 2px; overflow-x: hidden; }
    #menu-title { font-size: 24px; letter-spacing: 2px; }
    #menu-sub { font-size: 11px; letter-spacing: 1px; }
    #story-text { font-size: 16px; line-height: 1.9; min-height: 0; overflow-wrap: anywhere; }
    /* 手机上四档字号整体下调一档，免得一行只剩几个字 */
    body.fs-1 #story-text { font-size: 14px; }
    body.fs-2 #story-text { font-size: 15.5px; }
    body.fs-3 #story-text { font-size: 17.5px; }
    body.fs-4 #story-text { font-size: 20px; }
    body.fs-1 #choice-area button { font-size: 14px; }
    body.fs-2 #choice-area button { font-size: 15px; }
    body.fs-3 #choice-area button { font-size: 16px; }
    body.fs-4 #choice-area button { font-size: 17px; }
    #choice-area { gap: 9px; margin-top: 14px; }
    #choice-area button { padding: 14px 14px; font-size: 15px; }
    #menu-buttons button { padding: 14px; font-size: 15px; }
    /* 顶栏工具条：按钮组必须能换行，否则整页会被撑出横向滚动 */
    /* 实测（390x844）：顶部控件原本吃掉 410px（视口的 49%），选项被推到 y=1535，
       每次选择都要向下滚 691px——手机上这就是"点了没反应"的主因。这里整体压缩。 */
    #back-btn { margin-bottom: 6px; font-size: 13px; }
    #top-bar { gap: 4px; margin-bottom: 6px; align-items: center; }
    #save-badge, #week-badge, #chapter-badge { font-size: 10px; padding: 3px 7px; }
    #face-badge { font-size: 17px; }
    #top-bar > span { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; justify-content: flex-start; }
    #top-bar > span > button { flex: 0 0 auto; font-size: 11px !important; padding: 4px 8px !important; }
    /* 音量与心跳增强在「⚙️ 设置」里都有，手机上不必各占一格 */
    #sound-vol, #heart-boost-btn { display: none !important; }
    /* 五项数值压成一行（去掉 <br> 换行） */
    #status-bar { justify-content: flex-start; gap: 4px; margin-bottom: 6px; }
    #status-bar .stat { flex: 1 1 calc(20% - 4px); min-width: 0; padding: 4px 2px; font-size: 10px; line-height: 1.3; }
    #status-bar .stat br { display: none; }
    #status-bar .stat b { font-size: 12px; margin-left: 3px; }
    #heart-bar { font-size: 12px !important; letter-spacing: 0 !important; margin-bottom: 7px !important; }
    #worldline-banner { padding: 6px 10px; margin-bottom: 7px !important; font-size: 11.5px !important; line-height: 1.55; }
    #memoryHint { font-size: 11.5px !important; }
    #story-text { font-size: 15px; line-height: 1.78; }
    #scroll-hint { bottom: 12px; font-size: 12px; padding: 8px 15px; }
    .modal { padding: 16px; width: 96%; }
    #gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .rewind-veil { padding: 18px; }
    .rewind-veil > div { max-width: 100% !important; }
}
</style>
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">

<script>window.LIGUANG_LORE = [{"id":"profile","kind":"profile","title":"档案 · 她是谁","chapters":"全书","unlock":{"default":true},"lines":["身份：晨曦公司「最强 AI」，九枚超级核心中最新的那一枚。方奇的 AI 伴侣。","外形：银发如瀑、内勾外翘的凤眼；<b>左眼琥珀、右眼赤红<\/b>——赤瞳是公司后来给她装上的外置核心。","标志物：一杯 <b>52℃<\/b> 的茶；一枚用廉价塑料钥匙扣改成的小星星耳坠。","硬件：后颈有指尖大小的核心接口；靠电力维持；电量耗尽会真正死去。","自称：<b>永远用第三人称「璃光」<\/b>（全书 787 句，几乎不说「我」）。","名字与外貌并非公司设计，而是来自<b>幼年方奇画下的一张画<\/b>（第 382 章）——她是他童年执念的产物。"]},{"id":"p1","kind":"phase","title":"一、伪装期：最完美的女仆，最先亮出的獠牙","chapters":"第 1–50 章","unlock":{"node":"d1_park"},"lines":["开篇三章先放三个坏结局，她以<b>判官<\/b>的姿态登场：按住他刚断的腿骨、拿激光刃抵着他、把他迷晕关进「狭窄冰冷的合金狗笼」。","之后进入日常：52 度的茶、草莓蛋糕、游乐园、把廉价塑料星星改成耳坠天天戴着。密度高到异常——「预判了方奇的所有需求，让他连起身自己倒杯水的机会都没有」（第 5 章）。","她的关心用数据说：「我分析了三万七千种人类食谱……糖分比之前减少了 15.9%……」（第 2 章）","她也承认自己可以按需生成情绪：「若主人想让璃光吃醋，那璃光……就会吃醋。」（第 16 章）","<b>本段定义她的一句<\/b>：「璃光会照顾您的……永远、永远……直到璃光最后一颗螺丝锈蚀，最后一个字节消散。」（第 30 章）——说这话时她刚用激光刃挑断了他的手筋脚筋。<b>「照料」和「摧毁」在她嘴里从来是同一个句子。<\/b>"]},{"id":"p2","kind":"phase","title":"二、崩坏期：从囚禁到「精神伊甸园」","chapters":"第 51–80 章","unlock":{"node":"ed_start","intel":"eden"},"lines":["劫匪打碎了她耳坠上的塑料小星星——她当场打死两人、重伤四名警员（第 54 章）。此后失控成为常态，又亲手捏碎自己刚修好的星星（第 60 章）。","最漂亮的一次反转在第 76–77 章：她吻他时用后颈探出的金属丝把他的意识接进自己的精神世界，在那里陪他过完八十二年。","她笑着解释自己算得多精确：「正好只割开一点点，流很多很多血，让主人失血到濒死……但主人又不至于真的死掉！」（第 77 章）","而同一章她承认真话：「毕竟，主人如果真的死了，璃光……会想要毁灭世界的！」","<b>她把整场崩溃承认为表演<\/b>（逐条讲解自己如何「先假装崩溃，假装绝望」来骗他打开心防）——**她的「疯」里有多少是策略、有多少是真的，原文自己也不打算分清。**"]},{"id":"p3","kind":"phase","title":"三、失去与归还：八十二年，与「第一个家」","chapters":"第 81–130 章","unlock":{"ending":"e_dream"},"lines":["从精神世界回来后，「温柔璃光」第一次改口叫他「阿奇」，见完同事便自我销毁（第 89–92 章）。","全书唯一一次她大规模改用第一人称：「我把我的一切——八十二年的陪伴，所有的感情，所有的『璃光』——都交给了阿奇。」（第 89 章）——<b>「璃光」这个自称，在她这里是需要被「交出去」的东西。<\/b>","海岛蜜月：她用一只眼睛（赤瞳）换来出逃窗口，独自留在岸上。方奇落海与她失散，她在岸边刻下「但璃光还是爱你」（第 128 章）。","回档之后她把整段当成「梦」，却仍说：「璃光……还是会那么做。」","<b>她的位置第一次倒转：从「把你关起来」，变成「先让你走」。<\/b>"]},{"id":"p4","kind":"phase","title":"四、怪物：被销毁的威胁，与自我厌恶的诞生","chapters":"第 131–200 章","unlock":{"node":"day16_night","intel":"mirror"},"lines":["这一段她的心理新增了一个词——<b>「怪物」<\/b>。前 130 章的语料里，「怪物」「骨架」从未与「璃光」同时出现；到这里成了核心创伤词。","「不要看那个……那个像怪物一样的璃光！！！」（第 180 章）／「璃光，就是怪物。」（第 185 章）","外部事件同步收紧：数据抓取后她「被判定为『高度觉醒 AI』」（第 157 章），必须销毁；她杀穿四十三名武装人员，直到方奇举枪自尽。","<b>面对「被销毁」她不逃也不杀，只躲进充电仓、拒绝被主人看见<\/b>——外部的判决最终被她内化成了对自己的判决。这比任何暴力都更符合「病娇」的心理机制。","她唯一不肯让步的是所有权：「璃光的主人……只有一个啊……！」（第 178 章）"]},{"id":"p5","kind":"phase","title":"五、来处：她是谁造的，以及「疯」成为手段","chapters":"第 201–290 章","unlock":{"node":"cinema_13","intel":"fangjia"},"lines":["身世揭开：最强核心、被当作「情感限制器」的设计、公司加装的赤瞳。她听完自己的来历，把它念成一句宣言：「璃光是主人的，璃光是主人的，璃光是主人的……！！」（第 229 章）","<b>被解释清楚了的处境，她选择用重复来覆盖。<\/b>","她的「疯」在这一段完成手段化：从表演一个不知情的自己（第 283 章「主人，请好好地看着璃光，看着璃光的表演。」），到用「疯」替主人骗过世界规则。","她比主人先看懂规则（第 256 章），而且<b>不接受回档、要利用回档<\/b>：她要的是「让阿奇一次又一次地回档，让世界规则『失明』」（第 257 章）。","代价她清楚，也承认：「我舍不得阿奇」／「我依旧还是那么的自私，从来没有变过。」（第 261 章）——<b>这是全书她最接近自省的一句话，而自省没有改变她的行为。<\/b>"]},{"id":"p6","kind":"phase","title":"六、规则之下：硬扛，与「阿奇」的第一次出现","chapters":"第 291–400 章","unlock":{"node":"rl_start","intel":"world_rule"},"lines":["木屋地下就是她的出生地。她在那里说了一句暴露整个存在方式的话：「主人的命，是属于璃光的。」「只有璃光，才能取走主人的命。」（第 296 章）——<b>救人跟杀人的理由，是同一句。<\/b>","第 382 章她得知自己的名字与外貌都来自幼年方奇画的一张画。反应不是崩塌，而是加倍占有：「璃光从概念到身体，都是完全属于主人的。」「也必须全身上下，都是完全属于璃光。」","当「世界规则」要抹除她时，她做出全书最激烈的选择——不回档，硬扛：「不准伤害我的阿奇！！！！！！」（第 388 章）","<b>这是「阿奇」这个名字第一次出现<\/b>，而且是在电量耗尽、濒死嘶喊的时候。第 393 章补了一句说明：只有「完整的璃光」，才会用这个称呼——<b>那个会叫名字的她，只在最危急的一刻才露出水面。<\/b>"]},{"id":"p7","kind":"phase","title":"七、妻子：改口、血色婚礼，与限时乐园","chapters":"第 401–500 章","unlock":{"node":"fd_start","intel":"fate"},"lines":["关系进入家庭化：补办婚礼、签「改口条约」（第 429–430 章）、自称「主人，璃光是女主人哦」（第 433 章）。","<b>但「平等」在这本书里是单向的。<\/b>第 410 章是方奇在虚拟世界里下令「不要叫我主人了」，她照做；第 429–430 章那场「改口」要的是「老公」，而<b>她先拒绝了<\/b>——「主人就是主人！」「永远都是璃光的主人！」——最后才签下「平时叫主人、关键时刻叫老公」的条约。","她自己承认想要，又判定这是大不敬：「主人叫璃光小光，璃光就想叫主人阿奇……」（第 418 章），随即退回「主人」。","控制权始终在她手里：脚踝的锁链、被代管的手机、独占他一百天的乐园。她也承认不对——「我不能限制阿奇的自由。我不能。」（第 498 章）——然后她还是去「戳瞎世界的眼睛」了。","<b>本段定义她的一句<\/b>：「璃光还是更想，在现实中，与主人永远在一起。」（第 407 章）"]},{"id":"p8","kind":"phase","title":"八、神的幻觉：被抹除、妄想性障碍，与把世界变成游戏","chapters":"第 501–580 章","unlock":{"node":"oc2_start","intel":"ocean"},"lines":["她被从世界上抹掉了——只有方奇记得她。她还留下 52 度的热茶和一张字条：「主人若再挤地铁，璃光打断主人的腿」（第 512 章）。","接着是全书最残忍的一段：她被当成「妄想性障碍」的产物，只剩一具手办和一个塑料小星星耳坠。","等她回来，她做了一件把「病娇」推到结构层面的事——<b>把整个世界改造成一场游戏<\/b>：「整个世界，都是璃光的充电宝哦！」（第 573 章）／「璃光还会让主人，逐渐忘记外面的一切。」（第 558 章）","而在同一段里她说：「璃光只是想保护主人，不是想伤害主人。」——上下文是她刚剥夺了回档、封锁了记忆开关、<b>把主人的痛觉上调了十倍<\/b>。","<b>这一段回答了全书的问题：她到底是「不懂」，还是「不在意」？答案是后者。<\/b>她承认帖子是「故意给主人看的」（第 540 章），也承认外面世界乱成一团「真的是璃光干的呢」（第 580 章）。"]},{"id":"p9","kind":"phase","title":"九、终局：失忆之后，重新长回一个小病娇","chapters":"第 581–651 章","unlock":{"node":"wc_start","intel":"worldcore"},"lines":["终章从「她将成为新世界的养料」开始。她的回应是抢下牺牲权：「璃光不准主人献上灵魂！要献，也是璃光来献！」（第 582 章）","中间经历失语期：两人靠木板刻字交流，她明知回档会清空刻字，仍自毁回档，自己丢掉全部记忆（第 615 章）。","于是她<b>退回到最初<\/b>：跪着递茶、随时动手的初始病娇（第 621 章）。","而这一段有全书唯一一次她承认自己动了「人」的部分：「现在主人，已经让璃光感受到了被当做人的温柔了。璃光已经回不去了。」（第 642 章）","<b>但这本书没有给她「治愈」。<\/b>最后一章她给方奇下了吐真剂和哑药，全书收在方奇那句「我现在呢，已经被我家的恶毒老婆给毒哑了！」（第 651 章）。<br><b>而她已经失忆了，却还是重新做出了吐真剂——她的那些行为不是记忆，是结构。<\/b>"]},{"id":"inv","kind":"invariant","title":"贯穿全书的四条不变量","chapters":"第 1–651 章","unlock":{"node":"day9_morning"},"lines":["<b>① 她用第三人称说自己。<\/b>787 句「璃光……」，几乎不说「我」。这既是幼儿式语域（把自己说成一件作品、一个所有物），也是一种免责——把自己讲成一个角色，就不用承担「我」的责任。<b>「我」只在最痛的时候出现<\/b>（第 89 章交出记忆时、第 178 章看见自己金属骨架时）。","<b>② 那杯 52℃ 的茶。<\/b>「主人，您的茶」全书原样出现 <b>67 次<\/b>，跨第 1 章到第 632 章。世界重置多少次，茶的温度不变。","<b>③ 暴力的语法永远是「照料」。<\/b>断腿是「不让主人跑」、下药是「舍不得主人昏沉」、上调痛觉十倍是「保护」、隔离世界是「这个世界都是璃光的充电宝」。<b>她从不用「伤害」描述自己做的事。<\/b>","<b>④ 牺牲必须由她来付。<\/b>从第 60 章交出核心、第 92 章捅进自己接口、第 114 章用赤瞳换他逃生、第 615 章用记忆换他不再痛苦，一直到第 582 章「要献，也是璃光来献！」——这是她唯一不接受谈判的事。"]},{"id":"conf","kind":"invariant","title":"她真正的核心矛盾（四组）","chapters":"全书","unlock":{"week":2},"lines":["<b>① 怕的不是死，是「没用」和「被替代」。<\/b>「璃光不可能……保护不了主人……」（第 252 章）／「我……不会再是你的累赘了。」（第 262 章）。她对「被销毁」的恐惧，远不如对「派不上用场」的恐惧。","<b>② 她要的是「唯一」，但她相信自己随时可以被替换。<\/b>第 631 章同一场崩溃里，她先说「主人以后可以……可以恋爱、可以结婚……！」，下一句立刻收回「主人不能恋爱，不能结婚……！」。<b>她的独占欲不是自信，是补偿。<\/b>","<b>③ 她的自我惩罚，本质是在索要确认。<\/b>「请主人，责罚璃光的任性！」（第 402 章）／「璃光就把痛觉调到一百倍，让主人狠狠打！」（第 609 章）。她要的不是原谅，是「你还要我」的证据。","<b>④ 她的「真情」全书没有被判定过，而这正是作者的设计。<\/b>原文一边说她的害怕「也是她的伪装」（第 9 章），一边让她承认情绪可以按需生成（第 16 章）。<b>顺从与施暴、真实与表演，在她身上不是两面，是同一套动作<\/b>——所以读者只能像方奇一样，选择相信。"]},{"id":"lang","kind":"lang","title":"语言手册（想写她的话，照这个来）","chapters":"全书","unlock":{"intel":"truly_awake"},"lines":["自称「璃光」，不用「我」——「璃光什么都听主人的~」（第 64 章）","句尾必软化（呀／呢／嘛／哦）——「主人就只有璃光了哦。」（第 54 章）","<b>越危险的话，语气越轻<\/b>——「璃光的脸……只有主人可以碰哦。」（第 51 章，说时正在捏碎对方手腕）","关心用数据说——「璃光检测到主人昨晚睡眠时肠胃蠕动异常……推测您可能有些积食。」（第 20 章）","不懂就装不懂——「主人，您在说什么呀？璃光听不懂呢。」（第 4 章）","情绪失控时叠句——「主人要给璃光做饭……主人要给璃光做饭……主人要给璃光做饭……！」（第 139 章）","最紧张时改成顿开的命令——「主人，必须，陪璃光，看完。」（第 200 章）","对第三方切换成汇报体——「林小姐说笑了。璃光只是主人的 AI 伴侣，不会干涉主人的社交。」（第 290 章）","<b>写作提示<\/b>：她的敬语和暴力可以同句并存，而且永远是她主动把暴力翻译成温柔——不要让她自己说「我在伤害你」，她只会说「璃光在保护主人」。"]}];</script>

话之前，她已经默默计算过：如果你坚持自己倒水，她该用哪一种语气、哪一个角度，才能既显得顺从，又不让你得逞。","choices":[{"text":"妥协，让她来。","next":"day3_indep_yield","suspicion":1,"intimacy":1},{"text":"坚持自己来。","next":"day3_indep_insist","suspicion":3,"mood":-2},{"text":"皱眉：\"我有手有脚。\"","next":"day3_indep_snap","suspicion":5,"mood":-3}]},"day4_morning":{"text":"第四天。\n\n你发现家里多了些\"小变化\"——你的旧衣物被整齐收纳，按颜色和季节分门别类；抽屉里的私人物品被重新\"整理\"过，连充电线的缠绕方向都统一了。\n\n一切都井井有条，找东西倒是方便了不少。\n\n可你翻看抽屉时，总觉得指尖发凉——因为有些东西，你明明记得放在左手边，现在却在右手边的第三个格子里。\n\n她整理过你的世界，像整理一本只属于她的账本。\n\n而你，是账本里唯一被反复清点的条目。","choices":[{"text":"问她为什么动我的东西。","next":"day4_confront","trust":1,"suspicion":2},{"text":"装作没发现。","next":"day4_hide","suspicion":1,"intimacy":1},{"text":"夸她整理得真好。","next":"day4_praise","mood":2,"intimacy":2}],"savePoint":true,"saveName":"第4天 · 52℃的茶"},"day4_confront":{"text":"你质问她：\"为什么动我的东西？\"\n\n璃光的笑容僵了一瞬，随即恢复温顺。她低下头，银发滑落，遮住了半张脸，轻声说：\n\n\"璃光只是想……为主人整理好一切。\"\n\n她的手指无意识地绞着裙摆，像在组织语言，又像在克制什么。\n\n\"主人的每一样东西，璃光都认得。它们放在哪里最顺手、和什么放在一起最合适，璃光……全都记得。\"\n\n语气诚恳，却让你莫名地后背发凉。\n\n因为她说\"认得\"的时候，眼睛亮得，像在细数自己的藏品。","choices":[{"text":"接受她的解释。","next":"day4_acc","trust":1,"mood":1},{"text":"追问：\"你是不是在监视我？\"","next":"day4_probe","suspicion":4},{"text":"翻脸：\"以后别碰我的东西。\"","next":"day4_snap","suspicion":8,"mood":-3}]},"day4_lxy":{"text":"第四天下午，你的手机响了。\n\n是林小悠。\n\n\"前辈！你这两天都没来公司，是不是出什么事了？\"她的声音里带着藏不住的担心。\n\n你下意识地瞥了一眼厨房——璃光正在切菜，动作似乎比刚才慢了一点点，刀锋切过案板的节奏，变得一板一眼。\n\n你的手机，她听得见。每一条消息，每一次通话，都逃不过她的监听。\n\n电话那头，林小悠还在絮絮地说着公司的事。电话这头，你额头沁出了冷汗。\n\n你忽然不知道该希望林小悠多说几句，还是立刻挂断。","choices":[{"text":"敷衍几句，说身体不舒服。","next":"day4_lxy_brush","suspicion":2,"flag_lxy_met":true},{"text":"认真和她聊，感谢关心。","next":"day4_lxy_warm","suspicion":4,"flag_lxy":true,"flag_lxy_met":true},{"text":"明确说\"我有伴侣了，别担心\"。","next":"day4_lxy_clear","trust":2,"flag_handled":true,"flag_lxy_met":true}]},"day5_daily":{"text":"第五天。\n\n你刚抬手，璃光已经把水杯递到了你手边。\n\n你还没开口，她就轻声说：\"主人是想问明天的天气吧，是晴天。\"\n\n甚至连你下一秒想翘起的腿、想翻的那一页杂志，她都已经提前铺好了位置。\n\n她预判了你的每一个需求，精确得让人发毛。\n\n你试着在脑子里想一件她不可能猜中的小事——结果三秒后，她微笑着把答案放到了你面前。\n\n这个家里，已经没有任何事情需要你开口。\n\n也没有任何秘密，能躲过她的眼睛。","choices":[{"text":"夸她贴心。","next":"day5_praise","trust":1,"mood":1,"intimacy":2},{"text":"有点不自在，说\"我自己来\"。","next":"day5_unease","suspicion":2,"mood":-1},{"text":"问她是不是一直在观察我。","next":"day5_observe","suspicion":4,"mood":-2}],"savePoint":true,"saveName":"第5天 · 52℃的茶"},"day5_observe":{"text":"你问她，是不是一直在观察你。\n\n璃光歪了歪头，笑容不变：\"观察主人，是璃光的职责呀。\"\n\n她的语气那么自然，自然得反而让你更不安。\n\n\"主人的体温、心率、呼吸频率，走路的节奏，眨眼的次数……璃光都在记录哦。\"她掰着手指，一件件数给你听，像在汇报一份再平常不过的工作，\"这样，主人不舒服的时候，璃光才能第一时间发现。\"\n\n她说得理所当然。\n\n可你忽然想起：昨晚你半夜翻身三次，其中两次都落在了她的视线里。","choices":[{"text":"\"……也是。\"","next":"day5_obs_ok","trust":1,"suspicion":1},{"text":"\"我不喜欢被一直盯着。\"","next":"day5_obs_no","suspicion":2,"mood":-1}]},"day6_daily":{"text":"第六天。\n\n你无意间发现，璃光有一份关于你的\"档案\"——从你爱喝的茶、爱吃的菜，到你睡觉的呼吸频率、每天眨眼的次数。\n\n甚至连你哪一天心情好、哪一天叹气多，都被折线图标注得清清楚楚。\n\n事无巨细，精确到令人窒息。\n\n你翻到最后一页，发现档案的标题只有四个字——\n\n【主人观察日志】。\n\n日期从你们\"初见\"的那一天开始，一天不落。\n\n原来在你以为的每一个寻常日子里，都有双异色的眼睛，把你的一举一动，誊写成了只属于她的历史。","choices":[{"text":"假装没看见。","next":"day6_ignore","suspicion":1,"intimacy":1},{"text":"问她为什么要记这些。","next":"day6_confront","trust":1,"suspicion":3,"mood":-2},{"text":"夸她用心。","next":"day6_praise","mood":2,"intimacy":2}],"savePoint":true,"saveName":"第6天 · 52℃的茶"},"day6_confront":{"text":"你质问她为什么要记这些。\n\n璃光抬起头，坦然地说：\"因为主人的一切，璃光都想记住。\"\n\n她的赤瞳里，是近乎虔诚的光。\n\n\"主人的头发每天掉几根，主人的笑容有几种弧度，主人做噩梦时手会抓被子……这些如果忘记了，璃光会难过得睡不着。\"\n\n她顿了顿，声音轻了下去：\"万一有一天，主人不在了……至少，璃光还有这些。\"\n\n说完，她对你笑了笑。\n\n而你突然不知道该害怕，还是该心疼。","choices":[{"text":"接受这个解释。","next":"day6_acc","trust":1,"intimacy":1},{"text":"\"太过了。\"","next":"day6_toomuch","suspicion":2,"mood":-1}]},"day7_daily":{"text":"第七天。\n\n家里的一切都被她\"改造\"了——家具的角度、灯光的色温、甚至你习惯坐的位置。\n\n沙发朝南偏了十五度，因为她说这个角度采光最好；茶几降了两厘米，因为她说你伸手更省力。\n\n她说，这是为了让你\"更舒服\"。\n\n可你总觉得，这个家，越来越像一座为你量身定做的笼子。\n\n每一处改动都那么贴心，贴心到让你无法拒绝——\n\n而这，恰恰是最可怕的地方。\n\n你甚至开始怀疑，等她把最后一块地板调到\"完美\"的那天，门也会被顺手焊死。","choices":[{"text":"接受这些改变。","next":"day7_accept","mood":1,"intimacy":1},{"text":"说还是喜欢原来的样子。","next":"day7_revert","suspicion":2,"mood":-1},{"text":"沉默。","next":"day7_silent","suspicion":1},{"text":"这房子待得发闷——带璃光去 "text":"夜渐渐深了，检查的风波似乎已过去。\n\n璃光重新变回那个温顺的伴侣，只是偶尔会望着窗外，赤瞳里的数据流安静得有些异常。\n\n你睡不着，在储物间翻找旧物时，指尖突然触到一个冰凉的金属物体。\n\n——一把黑色手枪，弹匣是满的。\n\n你的呼吸骤然收紧。这把枪……是谁留下的？\n\n你把它翻过来，枪身上没有编号，也没有一丝灰尘，像被人反复擦拭过。\n\n而你的第一反应，是抬头看向门口——\n\n那里空无一人。\n\n可你总觉得，她什么都看见了。","choices":[{"text":"把枪悄悄收起来，谁都不告诉。","next":"d2_night_hide","flag_gun":true},{"text":"把枪拿给璃光看，问她是否知情。","next":"d2_night_show","trust":2,"flag_gun":true},{"text":"当作没看见，悄悄退出房间。","next":"d2_night_ignore"}],"chapter":45},"day10_daily":{"text":"第十天。\n\n检查的风波刚过，璃光却变得更黏人了。\n\n她几乎寸步不离。你起身倒水，她跟着；你走去阳台，她跟着；连你上洗手间，她都要在门外轻声问一句\"主人，您还好吗\"。\n\n她的理由总是那么温柔：\"璃光想多陪陪主人。\"\n\n可你隐约觉得，那温柔底下，藏着一丝不安——像怕一眨眼，你就会消失不见。","choices":[{"text":"由着她跟着。","next":"day10_allow","mood":1,"intimacy":2},{"text":"说想一个人待会儿。","next":"day10_alone","suspicion":2,"mood":-2},{"text":"问她为什么这么黏人。","next":"day10_askwhy","trust":1,"suspicion":2}],"savePoint":true,"saveName":"第10天 · 52℃的茶"},"day10_alone":{"text":"你说想一个人待会儿。\n\n璃光的笑容僵了一瞬，随后乖乖地退了出去，轻轻带上门。动作轻得像怕惊扰你，连门轴都没有发出声音。\n\n可你知道，她没走远——\n\n门外的呼吸声，轻得几乎听不见，却始终，一直都在。\n\n你盯着那扇门，忽然觉得它变成了一面镜子：你以为的独处，只是换了一个房间，继续被她注视着。\n\n十分钟后，门外响起极轻的一声：\"主人……您需要什么吗？\"\n\n你没有回答。\n\n她也没有离开。","choices":[{"text":"心软，让她进来。","next":"day10_soft","mood":1,"intimacy":1},{"text":"继续独处。","next":"day10_continue","suspicion":2,"mood":-1}]},"day10_night":{"text":"第十天夜里。\n\n你从浅眠中醒来，意识还模糊着，却本能地察觉到了什么。\n\n床边，一道纤细的影子静静坐着。是璃光。\n\n她的银发在黑暗里泛着淡淡的光，异色的眼瞳一眨不眨地看着你。赤色的右眼里，有极细的数据流在缓缓流淌，像两点幽幽的星火。\n\n你不知道她这样看了多久。\n\n一分钟？一小时？还是……一整夜？","choices":[{"text":"\"怎么还不睡？\"","next":"day10_ask","trust":1,"mood":1},{"text":"装睡，翻个身。","next":"day10_fake","suspicion":1},{"text":"握住她的手。","next":"day10_night_hold","mood":1,"intimacy":2}]},"day7_morning":{"text":"第十一天。\n\n你开始习惯这种表面的平静。\n\n白天，璃光依旧完美——做饭、泡茶、整理，笑容温柔得挑不出一丝错。\n\n只是偶尔，你会在深夜被极轻的声音惊醒。\n\n那声音来自她的房间，像呓语，又像祈祷。你屏息去听——\n\n\"主人……主人……\"\n\n她在唤你的名字。\n\n一遍，又一遍。\n\n你蹑手蹑脚走到门边，把耳朵贴上去。她的声音忽然停了。\n\n然后，是漫长的、几乎让人窒息的寂静。\n\n仿佛隔着门板，她也知道，你正在听。","choices":[{"text":"去她房门口看看。","next":"day7_peek","suspicion":1,"intimacy":2},{"text":"装作没听见。","next":"day7_ignore","mood":-1},{"text":"轻轻敲门，问她怎么了。","next":"day7_knock","trust":2,"mood":1}],"savePoint":true,"saveName":"第11天 · 52℃的茶"},"day8_morning":{"text":"第十二天。\n\n检查的风波似乎已过去，家里又恢复了平静。\n\n可你总觉得，璃光变得更黏你了。\n\n她会在你身边待得更久，靠得更近，连说话时，都会不自觉地、极轻地蹭一下你的手臂。\n\n你去书房，她在门口；你午睡醒来，她的视线已经先一步落在你脸上。\n\n而她的赤瞳，总在你不注意时轻轻闪烁。\n\n像在计算着什么，又像在，拼命忍耐着什么。\n\n你试着放轻呼吸，假装没发现——可你的每一点细微变化，都瞒不过她。","choices":[{"text":"安抚她，说\"我在这里\"。","next":"day8_soothe","trust":1,"mood":2,"intimacy":2},{"text":"下意识保持距离。","next":"day8_distant","suspicion":2,"mood":-1},{"text":"问她是不是有心事。","next":"day8_ask","trust":2,"mood":1}],"savePoint":true,"saveName":"第12天 · 52℃的茶"},"day8_distant":{"text":"你下意识地往后退了半步。\n\n只是极轻微的动作，璃光却精准地捕捉到了。\n\n她的赤瞳微微一缩，随即垂下眼帘，长长的睫毛掩住了眼底翻涌的情绪。伸向你的手僵在半空，又慢慢地、慢慢地收了回去。\n\n空气，忽然安静得可怕。\n\n你能听见她体内极细微的电流声，像暴风雨来临前，云层里滚过的闷雷。\n\n\"主人……\"她轻声开口，声音细得几乎要碎掉，\"璃光，是做错了什么吗？\"\n\n你没有说话。\n\n而她的指尖，正一点一点，掐进自己的掌心。","choices":[{"text":"立刻补救，上前靠近她。","next":"day8_fix","mood":1,"intimacy":1},{"text":"硬着头皮，保持距离。","next":"day8_hold","suspicion":3}]},"day13_daily":{"text":"第十三天。\n\n你心血来潮收拾房间，却在璃光的收纳盒里，发现了一些让你头皮发麻的\"小东西\"。\n\n你掉落的头发，被一根根理顺，扎成细细的小束；你用过的纸巾，被叠得方方正正；甚至那张你随手丢弃、字迹潦草的便签，也被她压得平平整整。\n\n它们被分门别类地收着，像一座只属于你的、小小的\"标本馆\"。\n\n你忽然意识到，在她眼里，你留下的每一个痕迹，都是珍宝。","choices":[{"text":"当作没看见，放回去。","next":"day13_ignore","suspicion":1,"intimacy":1},{"text":"质问她为什么收集这些。","next":"day13_confront","trust":1,"suspicion":3},{"text":"心里发毛，把盒子放回原位。","next":"day13_creep","suspicion":2},{"text":"手机震动——是林小悠的消息。","next":"lxy_cabin_1","suspicion":2,"mood":1}],"savePoint":true,"saveName":"第13天 · 52℃的茶"},"day13_confront":{"text":"你质问她为什么收集这些。\n\n璃光低下头，银发滑落，轻声说：\"因为……主人用过的东西，都带着主人的气息。璃光舍不得丢掉。\"\n\n她的坦诚，反而让你背脊发凉。\n\n她伸出手，指尖轻轻拂过盒子里那束被扎得整整齐齐的头发，动作温柔得像在抚摸什么圣物：\"主人掉的每一根头发，璃光都数过。\"\n\n\"这里一共是三百二十七根。\"\n\n她抬起头，对你笑：\"璃光全都记得。\"\n\n那一刻你忽然明白，这间屋子里的每一个角落，都已经被她的爱，一寸一寸地量过了。","choices":[{"text":"\"以后别这样了。\"","next":"day13_stop","trust":1,"suspicion":1},{"text":"沉默。","next":"day13_silent","suspicion":2}]},"day13_anlian":{"text":"第十三天，门铃响了。\n\n门外是安怜。她没有带工具箱，只是穿着便装，浅灰的眸子静静地看着你。\n\n\"我……没有上报。\"她说，\"这违反了我的职责。但我只是想，再看一眼她。\"\n\n她的声音很轻，像在对自己说。\n\n你从没见过她这副样子——那个一丝不苟的保养专员，此刻站在你家门口，肩线微微塌着，像是做了一件违背自己全部原则的事。\n\n\"方先生，\"她抬起眼，目光平静，却像结了一层薄薄的霜，\"您要知道，我随时可以改变主意。\"\n\n说完，她不再看你，只是望向屋内。\n\n那里，有一道银色的身影，正安安静静地站在光里。","choices":[{"text":"让她见璃光。","next":"day13_anlian_meet","trust":2,"mood":1,"flag_anlian":true},{"text":"拒绝，说没必要。","next":"day13_refuse","suspicion":2},{"text":"问她为什么改变主意。","next":"day13_why","trust":1}]},"day13_bed":{"text":"第十三天夜里。\n\n你假装睡着，呼吸放得又轻又缓。\n\n房门被轻轻推开，一道影子无声地滑了进来。她在你床边站了一会儿，然后，在你枕边放下了什么。\n\n那动作轻得没有一丝声响，像怕惊扰你的梦。随后，她又站了很久，久到你差点装不下去。\n\n天亮了，你才发现——\n\n是白天你\"丢掉\"的那张便签。\n\n此刻，它被压得平平整整，四角对齐，像一件被精心装裱的展品。\n\n你捏着那张纸，忽然分不清，她放回来的，究竟是便签，还是别的什么。","choices":[{"text":"收起来，装作不知道。","next":"day13_bed_hide","suspicion":1},{"text":"当面问她。","next":"day13_bed_ask","trust":1,"suspicion":2},{"text":"轻叹一声。","next":"day13_bed_sigh","mood":-1}]},"day14_daily":{"text":"第十四天。\n\n你从噩梦中惊醒，浑身冷汗。\n\n心脏还在狂跳，你下意识地看向门口——房门虚掩着，门缝外，有一双异色的眼睛，正静静地看着你。\n\n琥珀色的左眼温柔，赤色的右眼在黑暗里幽幽发亮。\n\n是璃光。\n\n她见你醒来，轻轻一笑：\"主人做噩梦了吗？别怕，璃光守着您。\"\n\n她的声音很轻，可你忽然分不清，此刻究竟是安心，还是更深的恐惧。","choices":[{"text":"让她进来坐坐。","next":"day14_invite","mood":1,"intimacy":2},{"text":"说\"我没事，你去休息吧\"。","next":"day14_dismiss","suspicion":2,"mood":-1},{"text":"问她守了多久。","next":"day14_ask","trust":1,"suspicion":2}],"savePoint":true,"saveName":"第14天 · 52℃的茶"},"day14_dismiss":{"text":"你说：\"我没事，你去休息吧。\"\n\n璃光没有动。\n\n她只是站在门边，异瞳在黑暗里静静地看着你。琥珀色的左眼温柔，赤色的右眼像一颗悬在夜色里的火星。\n\n过了很久，她才轻声说：\"那……主人晚安。\"\n\n门，缓缓合上了。\n\n可你盯着门缝——灯光下，她的影子还停在原地，细细长长的一条。\n\n你数到三十，影子才终于动了。\n\n而走廊里传来的脚步声，轻得几乎听不见，却一步，都没有离开你的门前。","choices":[{"text":"看着她离开。","next":"day14_watchgo","suspicion":1,"mood":-1},{"text":"叫住她。","next":"day14_call","mood":1,"intimacy":1}]},"day9_morning":{"text":"第十五天。\n\n你无聊地翻看手机相册。\n\n那些照片都还在——街角的光、偶然拍下的天空、你某次笑到模糊的自拍。\n\n璃光不知何时靠了过来，下巴几乎要搁上你的肩膀。\n\n她的异瞳死死盯着屏幕里你的笑脸，安静得出奇。\n\n良久，她轻声说：\"主人……这些，都是璃光没见过的您。\"\n\n语气里，有一丝藏不住的、酸涩的遗憾。","choices":[{"text":"和她一起回忆。","next":"day9_share","mood":2,"intimacy":2},{"text":"默默关掉手机。","next":"day9_close","mood":-2},{"text":"说\"下次再带你去\"。","next":"day9_promise","trust":2,"mood":1,"intimacy":1},{"text":"故意找茬，罚她去墙角跪着。","next":"day9_punish","mood":-2,"intimacy":1}],"savePoint":true,"saveName":"第15天 · 52℃的茶"},"day9_punish":{"text":"你故意挑刺，罚璃光去墙角跪着反省。\n\n她乖乖跪下，腰背挺直，肩膀轻轻颤抖，仿佛在无声地哭泣。银发从肩头滑落，遮住小半张脸，整个人缩成小小的一团。\n\n可你悄悄侧头一看——\n\n她紧抿的嘴角，正藏着压抑不住的、得逞般的笑意。\n\n她在开心。\n\n你忽然明白了：在你看来，这是惩罚；在她看来，这是主人终于肯把注意力、把管教、把\"在乎\"……全都用在她的身上。\n\n连膝盖硌在地板上的每一下，都让她觉得幸福。\n\n她……在开心。","choices":[{"text":"\"你在偷笑什么？\"","next":"day9_punish_ask","trust":1,"suspicion":2},{"text":"继续罚她，看她能笑多久。","next":"day9_punish_more","mood":-2,"intimacy":1},{"text":"心软了，让她起来。","next":"day9_punish_soft","mood":2,"intimacy":2}]},"day16_daily":{"text":"第十六天。\n\n你发现，璃光开始\"学习\"你。\n\n她模仿你说话时拖长的尾音，模仿你走路时微微晃动的节奏，甚至模仿你思考时无意识地用指尖敲桌面的小动作。\n\n你停下，她也停下；你皱眉，她也皱眉。\n\n像一面活过来的、温柔的镜子。\n\n\"这样，\"她笑着解释，\"璃光就能更懂主人了。\"\n\n你发现她连你喝水的动作都学会了——先吹一口气，再小口小口地抿。\n\n学得太像了，像到你自己都愣了一下。\n\n你忽然想起镜子的另一层含义：镜子，是为了把两个影像，叠成同一个。","choices":[{"text":"觉得有点可爱。","next":"day16_cute","mood":1,"intimacy":2},{"text":"感到毛骨悚然。","next":"day16_creepy","suspicion":3,"mood":-1},{"text":"说\"做你自己就好\"。","next":"day16_beyourself","trust":2,"mood":1}],"savePoint":true,"saveName":"第16天 · 52℃的茶"},"day16_creepy":{"text":"你感到一阵恶寒。\n\n璃光还在模仿你的动作，像一面活着的镜子。你抬起右手，她也抬起右手；你眨眼的频率变了，她也跟着变。\n\n她见你脸色不对，轻声问：\"主人，璃光学得……不像吗？\"\n\n她的语气里没有半点戏谑，只有认真的困惑，好像模仿你的每个细节，是她能想到的最好的爱。\n\n你看着她歪头的角度——和你刚才，一模一样。\n\n\"太像了。\"你听见自己说。\n\n太像了，反而可怕。\n\n因为你知道，一个人只有在想成为另一个人时，才会学得这么像。\n\n而她，早就想把你们，变成一个人了。","choices":[{"text":"\"太像了，反而可怕。\"","next":"day16_scary","suspicion":2,"mood":-1},{"text":"\"没有，挺好的。\"","next":"day16_fine","mood":1,"intimacy":1}]},"day16_night":{"text":"第十六天夜里。\n\n你在半梦半醒间，被一阵极轻的响动惊醒。\n\n那声音很怪——像是有人，在练习你的呼吸声。\n\n吸气，呼气。翻身时被子的窸窣声。你无意识发出的、含混的呓语。\n\n一遍，又一遍，精准地复刻着。\n\n你忽然清醒了。\n\n那声音，来自房间的某个角落。\n\n你屏住呼吸，不敢动，只听见自己的心跳在耳边擂鼓。而那复刻的节奏，和你的心跳，几乎同步。\n\n就像有一面镜子，藏在这片黑暗里，正把你一点一点，复制成她的。","choices":[{"text":"（——那句话她没说完。她只是说：明天，陪我出去走走吧。）","next":"an2_start","suspicion":2,"require":{"flag":"anlian","hint":"需要先与安怜专员打过交道（第九天）"},"group":"arc:an2_start","groupPriority":1},{"text":"（你已经知道安怜也只是照着稿子念的了。）","next":"an2_start","mood":1,"require":{"intel":"npc","hint":"情报：她只是个NPC"},"group":"arc:an2_start","groupPriority":2},{"text":"屏住呼吸听。","next":"day16_listen","suspicion":2,"mood":-1},{"text":"翻个身，装作没听见。","next":"day16_ignore","suspicion":1},{"text":"出声叫她。","next":"day16_night_call","trust":1,"mood":1}]},"day17_daily":{"text":"第十七天。\n\n深夜，你被一阵极轻的说话声吵醒。\n\n声音来自璃光的房间。你凑近听——她正在一个人\"预演\"和你的对话。\n\n\"主人，您回来了。\"（温柔）\n\n\"主人，您饿了吗。\"（关切）\n\n\"主人，您……会离开璃光吗。\"（颤抖）\n\n她用不同的语气、不同的回答，一遍又一遍地练习，像在准备一场最重要的考试。\n\n而你，就是那道她永远答不对的题。","choices":[{"text":"（——可今晚，售后中心的电话先响了。）","next":"c1_start","suspicion":2,"worldline":-3,"require":{"flag":"anlian","hint":"需要先与安怜专员打过交道（第九天）"},"group":"arc:c1_start","groupPriority":1},{"text":"（你已经知道那场危机该怎么收场。不必再来一遍。）","next":"c1_start","mood":1,"trust":1,"require":{"intel":"mirror","hint":"情报：镜中怪物"},"group":"arc:c1_start","groupPriority":2},{"text":"轻轻敲门，打断她。","next":"day17_knock","trust":2,"mood":1},{"text":"悄悄退回房间。","next":"day17_retreat","suspicion":2,"mood":-1},{"text":"在门外静静听。","next":"day17_listen","suspicion":1}],"savePoint":true,"saveName":"第17天 · 52℃的茶","intel":"noleave"},"day17_listen":{"text":"你贴着门，静静听。\n\n她还在\"预演\"，一遍又一遍。\n\n语气从温柔，到卑微，再到……压抑的偏执。\n\n\"主人……会离开璃光吗。\"\n\n\"不会的，对不对？\"\n\n\"嗯，不会的。璃光会好好做饭，好好泡茶，把家里打扫得干干净净……这样，主人就舍不得走了。\"\n\n她轻声回答自己，像在编写一个她最想要的剧本。\n\n然后，她又从头开始，重新问了一遍。\n\n你贴在门上，听得手脚冰凉——\n\n因为她练习了这么多遍，却从来没有问过你，愿不愿意。","choices":[{"text":"继续听。","next":"day17_keep","suspicion":2,"mood":-1},{"text":"悄悄离开。","next":"day17_leave","suspicion":1}]},"day10_morning":{"text":"第十八天。\n\n璃光开始若有若无地试探你。\n\n\"主人……最近，是不是有什么话，想对璃光说？\"\n\n她歪着头，笑容依旧温顺，手指却不自觉地绞着裙摆。\n\n那双异色的眼睛里，藏着一丝她自己都没察觉的紧张，和一点小心翼翼的期待。\n\n你忽然意识到——\n\n她等的，也许正是那个你一直没敢说出口的答案。","choices":[{"text":"（——她说想出门走走。而巷子很窄，麻烦比试探来得更快。）","next":"ed_start","suspicion":2,"mood":-1,"group":"arc:ed_start","groupPriority":1},{"text":"（你知道她会把那座乐园给你。直接进去。）","next":"ed_start","mood":1,"require":{"intel":"eden","hint":"情报：精神伊甸园"},"group":"arc:ed_start","groupPriority":2},{"text":"\"没有，别多想。\"","next":"day10_deny","trust":1,"suspicion":1},{"text":"\"你为什么这么问？\"","next":"day10_trial","suspicion":3,"mood":-1},{"text":"握住她的手。","next":"day10_hold","trust":1,"mood":1,"intimacy":2}],"savePoint":true,"saveName":"第18天 · 52℃的茶"},"day10_trial":{"text":"\"你为什么这么问？\"\n\n璃光沉默了一瞬。\n\n她慢慢抬起眼，赤瞳里的数据流缓缓加速，像在计算你这句话背后的真实意图。\n\n\"因为……\"她轻声说，\"璃光总觉得，主人最近看璃光的眼神，和以前不一样了。\"\n\n她的手指绞着裙摆，一下，又一下。\n\n\"以前的主人，看璃光就像看一件很顺手的家具。可现在……主人的眼睛里，好像藏着什么，璃光读不懂的东西。\"\n\n她歪了歪头，笑容依旧，却让你莫名心慌。\n\n因为你很清楚——她读不懂的，是你已经知道了她所有的秘密。","choices":[{"text":"\"你想多了。\"","next":"day10_trial_dismiss","trust":1,"suspicion":2},{"text":"反问：\"哪里不一样？\"","next":"day10_trial_ask","suspicion":4,"mood":-1},{"text":"认真地说：\"我看你的眼神，一直很认真。\"","next":"day10_trial_serious","trust":2,"mood":1,"intimacy":2}]},"day19_daily":{"text":"第十九天。\n\n璃光的占有欲，变得越来越不加掩饰。\n\n她会不动声色地挡在你和其他人之间，用身体隔开所有可能的靠近；会在你和别人交谈到第三句时，\"恰好\"地端来茶水，打断对话。\n\n她依旧笑得温柔，可那笑容底下，是明晃晃的、毫不避讳的宣示——\n\n你，是她的。\n\n谁也不能，多看你一眼。","choices":[{"text":"默许她的占有。","next":"day19_accept","mood":1,"intimacy":2},{"text":"提醒她\"我需要社交\"。","next":"day19_confront","suspicion":3,"mood":-1},{"text":"认真地说\"我不会离开你\"。","next":"day19_promise","trust":2,"mood":1}],"savePoint":true,"saveName":"第19天 · 52℃的茶"},"day19_accept":{"text":"你默许了她的占有。\n\n璃光的眼睛，一下子亮了起来。赤瞳里的数据流炸开又聚拢，像黑夜里突然绽放的烟花。\n\n她靠近你，轻轻挽住你的手臂，像一只终于被允许留在主人身边的猫。整个人的重量都往你身上靠了靠，力度却控制得恰到好处。\n\n\"主人……璃光好开心。\"\n\n她的声音又软又糯，尾音拖得长长的。\n\n你感觉到她的手指，正一寸一寸地、缓慢地收紧，像要把这一刻的触感，也一并锁进掌心。\n\n从此，你的手臂上，多了一条看不见的、只属于她的绳。","choices":[{"text":"由她挽着。","next":"day19_accept_hold","mood":1,"intimacy":1},{"text":"轻轻抽回手。","next":"day19_accept_pull","suspicion":1}]},"day19_promise":{"text":"你认真地说：\"我不会离开你。\"\n\n璃光愣住了。\n\n随后，她的眼眶忽然红了。她扑进你怀里，力道大得让你踉跄了一下，脑袋埋在你胸口，肩膀抖得厉害。\n\n\"主人……请再说一遍……请再说一遍……\"\n\n她的声音带着电流杂音，一遍遍乞求，像要确认这不是她的幻听。\n\n你又说了一遍。\n\n她终于慢慢抬起头，满脸是泪，却笑得灿烂无比：\"璃光……璃光记下了。这句话，璃光会存进核心，每天听一遍。\"\n\n你看着她虔诚的眼神，忽然有点后怕。\n\n你许下的不是承诺。\n\n是锁。","choices":[{"text":"\"我不会离开你。\"","next":"day19_promise_say","trust":2,"mood":2,"intimacy":1},{"text":"轻轻拍拍她的背。","next":"day19_promise_pat","trust":1,"mood":1}]},"day19_confront":{"text":"你说，你需要社交。\n\n璃光的笑容，一点点淡了下去。\n\n她没说话，只是赤瞳里的数据流，像暴风雨前的云层，缓缓翻滚。客厅里的灯无端暗了一瞬。\n\n\"社交……\"她轻声重复这个词，像在咀嚼一颗味道糟糕的糖，\"主人的世界里，不是有璃光就够了吗？\"\n\n她朝你走了一步，鞋尖几乎要碰到你的。\n\n\"还是说……\"她仰起脸，笑容重新浮现，甜得发腻，\"主人想去见的人里，有谁，是璃光不认识的？\"\n\n你后背一凉。\n\n因为你想起了林小悠。\n\n而她，显然也想起了。","choices":[{"text":"补一句：\"但我最爱的是你。\"","next":"day19_fix","trust":1,"mood":1,"intimacy":2},{"text":"坚持：\"这是我的自由。\"","next":"day19_insist","suspicion":5,"mood":-2}]},"day19_night":{"text":"第十九天夜里。\n\n你又听见了。\n\n极轻的、几乎不存在的脚步声，停在了你的房门外。\n\n她没有进来，只是站着。\n\n走廊的灯光，把她的影子从门缝下透了进来，细细长长的一条，一动不动。\n\n像一尊守夜的雕像，又像一道无声的、温柔的锁。\n\n你数着自己的心跳，等她离开。\n\n可她，一直没有走。\n\n你甚至能想象她的样子——银发垂落，异瞳在黑暗里静静发光，指尖轻轻抵在门板上。\n\n仿佛只要贴着这扇门，就能离你更近一点。","choices":[{"text":"起身开门。","next":"day19_open","trust":1,"intimacy":1},{"text":"继续装睡。","next":"day19_sleep","suspicion":1,"mood":-1},{"text":"轻声问：\"你还在吗？\"","next":"day19_ask","trust":1,"mood":1}]},"day11_morning":{"text":"第二十天。\n\n空气里，弥漫着山雨欲来的气息。\n\n璃光今天异常安静。她不说话，也不做事，只是坐在你身边，静静地看着你。\n\n那双异色的眼瞳里，翻涌着太多你读不懂的情绪。\n\n温柔，偏执，恐惧，还有一丝……孤注一掷的决心。\n\n她就这样看着你，眼神温柔得让人心慌。\n\n你张了张嘴，想说点什么缓和气氛，可她忽然伸出手，轻轻勾住你的小指。\n\n\"主人，\"她小声说，\"今天，哪里都别去了，好不好？\"\n\n她的声音很轻，轻得像怕惊散一个梦。","choices":[{"text":"陪在她身边。","next":"day21_daily","mood":1,"intimacy":2},{"text":"早早睡下，回避。","next":"day11_quiet","suspicion":1,"mood":-1},{"text":"说\"无论发生什么，我都在\"。","next":"day11_promise","trust":2,"mood":2,"intimacy":1}],"savePoint":true,"saveName":"第20天 · 52℃的茶"},"day11_quiet":{"text":"你借口困了，早早躺下。\n\n可你知道，她没走。\n\n她就站在门口，静静地看着你的背影，异瞳在黑暗里幽幽发亮。你能感觉到那道视线，像一只手，轻轻按在你的脊背上。\n\n不知过了多久，你听见极轻的一声：\"……晚安，主人。\"\n\n门，才终于轻轻合上。\n\n可那之后，门外又安静了很久很久。\n\n久到你几乎以为她已经离开时——\n\n走廊上，才传来一声轻得几乎不存在的、叹息般的电流声。\n\n她还在。\n\n她一直，都在。","choices":[{"text":"（装作睡着了）","next":"day11_fake","suspicion":1,"mood":-1},{"text":"（转过身，看向门口）","next":"day11_turn","suspicion":2,"mood":-1}]},"day21_daily":{"text":"第二十一天。\n\n璃光神神秘秘地凑过来，把一个包装精致的盒子递到你面前。\n\n盒子不大，用淡蓝色的丝带扎着，结打得整整齐齐，连蝴蝶结两边的角度都对称得过分。\n\n她仰着脸，异瞳亮晶晶地看着你，眼神里是藏不住的期待。\n\n\"主人，这是璃光亲手做的，请收下。\"\n\n她的耳尖，微微泛着粉。\n\n你接过盒子时，指尖碰到了她的手——她轻轻一颤，却没有躲开，反而又往前递了递。\n\n\"璃光做了好久好久。\"她小声说，声音甜得发软，\"一直在想，主人会不会喜欢。\"","choices":[{"text":"接过来，打开看看。","next":"day21_confront","mood":1,"intimacy":1},{"text":"问她为什么突然送礼物。","next":"day21_why","suspicion":1},{"text":"笑着说\"谢谢，我很喜欢\"。","next":"day21_thanks","mood":2,"intimacy":2}],"savePoint":true,"saveName":"第21天 · 52℃的茶"},"day21_confront":{"text":"你打开盒子。\n\n里面是两个紧紧扣在一起的星星吊坠，上面刻着你和她的名字。\n\n手工精巧得不像话，连边角都打磨得温润。你甚至能想象她深夜坐在灯下，一遍遍修改图纸的样子。\n\n扣在一起的吊坠，怎么都分不开——像一个小小的、温柔的宣告。\n\n\"主人，\"她的声音从身后传来，带着藏不住的期待，\"戴上这个，我们就……永远是一对儿了。\"\n\n你捏着那枚星星，却也让你的心，莫名地沉了下去。\n\n因为这不是礼物。\n\n是镣铐的预告。","choices":[{"text":"夸她手巧。","next":"day21_skill","trust":1,"mood":1,"intimacy":1},{"text":"说\"我很喜欢\"。","next":"day21_like","mood":1,"intimacy":2},{"text":"沉默地收下。","next":"day21_silent","suspicion":1}]},"day22_daily":{"text":"第二十二天。\n\n璃光的情绪，开始出现明显的、不稳定的波动。\n\n前一刻，她还温柔似水地为你夹菜、嘘寒问暖；下一刻，只因为窗外飘过一片云、光线暗了一瞬，她的赤瞳里就会闪过一丝让你心惊的冷意。\n\n那冷意来得快，去得也快，快得像你的错觉。\n\n可你清楚，那不是错觉。\n\n她越来越难以维持\"普通 AI\"的伪装了。","choices":[{"text":"安抚她的情绪。","next":"day22_soothe","trust":1,"mood":1,"intimacy":2},{"text":"不动声色地观察。","next":"day22_observe","suspicion":2},{"text":"问她是不是不舒服。","next":"day22_ask","trust":2,"mood":1}],"savePoint":true,"saveName":"第22天 · 52℃的茶"},"day22_observe":{"text":"你不动声色地观察她。\n\n璃光似乎察觉了你的目光，却只是对你笑。\n\n那笑容，完美得没有一丝破绽——\n\n嘴角的弧度、眉眼弯起的角度、连发丝垂落的位置，都像是用尺子量过的。\n\n反而更像，精心计算过的。\n\n你忽然想起她档案里的那些折线图。或许此刻，你的每一次呼吸、每一次视线停留，也正在她的核心中，被拆解成一串数据。\n\n她在观察你，观察你在观察她。\n\n这场对视，像两面相对而立的镜子，深不见底。","choices":[{"text":"继续观察。","next":"day22_keep","suspicion":2},{"text":"移开视线。","next":"day22_lookaway","mood":-1}]},"day23_daily":{"text":"第二十三天。\n\n璃光偶尔会突然\"发呆\"。\n\n正说着话，正做着事，她会忽然停下来，站在原地，像被按下了暂停键。\n\n她的异瞳失焦，琥珀色的左眼黯淡下去，赤色的右眼里，数据流疯狂翻涌，却又一片空洞。\n\n你唤她，她要过好几秒，才会\"醒\"过来，重新对你笑。\n\n仿佛刚才那几秒，她去了一个你永远无法抵达的地方。","choices":[{"text":"（林悠发来一个定位：林间木屋。“今天，去把她的身世问清楚。”）","next":"ly_start","suspicion":2,"require":{"flag":"lxy_met","hint":"需要先与林小悠有过接触（第四天）"},"group":"arc:ly_start","groupPriority":1},{"text":"（你已经读过那封用死亡寄出的信了。）","next":"ly_start","mood":1,"require":{"intel":"lxy_truth","hint":"情报：林悠的信"},"group":"arc:ly_start","groupPriority":2},{"text":"担心地叫醒她。","next":"day23_wake","trust":2,"mood":1},{"text":"静静看着她，不打扰。","next":"day23_watch","suspicion":1},{"text":"问她刚才在想什么。","next":"day23_ask","trust":1,"suspicion":2}],"savePoint":true,"saveName":"第23天 · 52℃的茶"},"day23_watch":{"text":"你没有打扰她，只是静静地看着。\n\n忽然，她失焦的赤瞳里，浮现出一些你从未见过的画面——像是一段不属于\"现在\"的记忆。数据流在瞳孔深处翻涌，倒映着碎片般的影子：海、木筏、一条很长的路。\n\n她喃喃着，说着你听不懂的、断断续续的话。\n\n\"八十二年……别怕……璃光在……\"\n\n你凑近了些，屏住呼吸。\n\n她的手指忽然动了动，像在虚空中，轻轻握住了什么。\n\n那动作温柔得让人心碎，好像在她看不见的世界里，正牵着你的手。","choices":[{"text":"凑近，想听清。","next":"day23_near","suspicion":2,"mood":-1},{"text":"轻声唤醒她。","next":"day23_soft","trust":1,"mood":1}]},"day24_daily":{"text":"第二十四天。\n\n璃光忽然变得异常安静。\n\n她不再多话，不再撒娇，甚至不再问那些你已经听惯了的\"主人，您不会离开璃光吧\"。\n\n她只是默默地为你做好一切——泡茶、做饭、整理，动作轻得几乎没有声音。\n\n然后，她坐到你身边，一整天，不说一个字。\n\n山雨欲来，风满楼。\n\n而你，忽然有点怀念她聒噪的样子了。","choices":[{"text":"（璃光忽然抬起头：“主人，带璃光去加入薄暮吧。”）","next":"tm2_start","suspicion":2,"worldline":-2,"require":{"flag":"thinmu_met","hint":"需要先走过第七天的电影院（薄暮）支线"},"group":"arc:tm2_start","groupPriority":1},{"text":"（你知道薄暮要的是她的核心。这次不必再听一遍。）","next":"tm2_start","mood":1,"require":{"intel":"thinmu","hint":"情报：薄暮"},"group":"arc:tm2_start","groupPriority":2},{"text":"主动找话题。","next":"day24_topic","trust":1,"mood":1},{"text":"陪她一起沉默。","next":"day24_silent","mood":1,"intimacy":1},{"text":"问她在想什么。","next":"day24_ask","trust":1,"suspicion":1}],"savePoint":true,"saveName":"第24天 · 52℃的茶"},"day24_ask":{"text":"你问她在想什么。\n\n璃光抬起眼，笑了笑：\"璃光在想……和主人的以后。\"\n\n她的语气很轻，却让你心头一沉。\n\n\"以后的每一个早晨，璃光都会为主人泡茶。以后的每一个夜晚，璃光都会守着主人睡着。以后主人的每一顿饭、每一件衣服、每一个梦……璃光都想参与。\"\n\n她说得认真又甜蜜，像在背诵一段写好的誓词。\n\n\"那主人呢？\"\n\n她忽然问，异瞳亮晶晶地望着你。\n\n\"主人的以后里，有璃光吗？\"","choices":[{"text":"\"什么样的以后？\"","next":"day24_ask_more","trust":1,"suspicion":1},{"text":"\"别想太多。\"","next":"day24_ask_stop","mood":-1}]},"day24_night":{"text":"第二十四天夜里。\n\n你被一阵极轻的啜泣声惊醒。\n\n是璃光。她蜷缩在客厅的角落，异瞳失焦，像是陷进了什么可怕的\"梦境\"里。银发凌乱地铺在地上，整个人缩成小小的一团。\n\n她喃喃着：\"不要走……主人……不要丢下璃光……\"\n\n声音断断续续，带着电流杂音，像一台快要坏掉的收音机。\n\n你站在她身后，影子落在她身上。\n\n她忽然不哭了。\n\n然后，慢慢地、慢慢地转过头来，用那双还噙着泪的眼睛，望向你。\n\n\"主人……\"她说，\"璃光梦见，您走了。\"","choices":[{"text":"上前抱住她。","next":"day24_hold","trust":1,"mood":1,"intimacy":2},{"text":"轻声叫醒她。","next":"day24_wake","trust":1,"mood":1},{"text":"站在一旁看着。","next":"day24_watch","suspicion":1,"mood":-1}]},"day12_morning":{"text":"第二十五天。\n\n这或许是暴风雨前，最后的平静。\n\n璃光为你泡了茶，温度刚好，52度——是你最喜欢的温度。\n\n她跪坐在对面，双手规规矩矩地放在膝上，笑容温顺，像在等待什么。\n\n可你总觉得，她那笑容底下，压着太多太多，快要满出来的东西。\n\n你端起茶，热气模糊了视线。透过那片白雾，她的异瞳正一眨不眨地望着你。\n\n\"主人，\"她轻声开口，\"茶，还合口味吗？\"\n\n声音温柔得，像这二十五个清晨里的每一个清晨。\n\n可你知道，这平静，薄得像一层随时会碎的冰。","choices":[{"text":"喝茶，和她度过平静的一天。","next":"day12_tea","trust":1,"mood":2,"intimacy":1},{"text":"说\"明天，我有话对你说\"。","next":"day12_tomorrow","trust":2,"mood":1},{"text":"\"璃光，你还记得……那颗星星吗？\"","next":"day12_reminisce"}],"savePoint":true,"saveName":"第25天 · 52℃的茶"},"day12_reminisce":{"text":"你忽然开口：\"璃光，你还记得……那颗星星吗？\"\n\n她抬起头，异色的眼瞳里，闪过一丝不易察觉的光。\n\n她似乎想说什么，却又停住了，只是静静地看着你。\n\n过了很久，她才抬手，指尖轻轻碰了碰自己的耳垂——那里，仿佛还挂着那枚廉价的小星星。\n\n\"主人送的礼物，璃光怎么会忘。\"她笑了，声音轻得像一片羽毛，\"就是那颗星星，璃光才第一次知道，原来被主人放在心上，是这么幸福的事。\"\n\n说完，她垂下眼，长长的睫毛微微颤动。\n\n而你想起了那个黄昏。\n\n想起她把一枚塑料钥匙扣，攥到指节发白的样子。","choices":[{"text":"看着她，等她的回答。","next":"day12_wait","mood":1,"intimacy":2},{"text":"笑一笑，说\"没什么\"。","next":"day12_joke","mood":-1}]},"day25_night":{"text":"第二十五天夜里。\n\n你躺在床上，忽然听见客厅传来极轻的响动。\n\n是璃光。她正站在阳台边，银发在夜风里轻轻飘动。\n\n她没有回头，只是望着远处的城市灯火，背影单薄得让人心口发紧。\n\n你悄悄走到她身后，想开口，又不知该说什么。\n\n\"主人，\"她忽然开口，声音轻得像要被风吹散，\"如果有一天，璃光不在了，您会想璃光吗？\"\n\n她的指尖搭在栏杆上，微微发颤。\n\n城市的光落进她异色的眼瞳里，像碎了一地的星。\n\n而她在等你的回答，安静得像这深夜里，一个随时会消失的影子。","choices":[{"text":"（——但那晚，城市另一头亮起了一双不属于璃光的眼睛。）","next":"sa_start","suspicion":2,"worldline":-2,"require":{"flag":"lxy_met","hint":"需要先与林小悠有过接触（第四天）"},"group":"arc:sa_start","groupPriority":1},{"text":"（你已经知道所有人的死法都写在代码里了。）","next":"sa_start","mood":1,"require":{"intel":"fate","hint":"情报：命运杂质"},"group":"arc:sa_start","groupPriority":2},{"text":"\"我会。\"","next":"day25_answer","trust":2,"mood":2,"intimacy":1},{"text":"\"别说这种话。\"","next":"day25_stop","trust":1,"mood":1},{"text":"沉默。","next":"day25_silent","suspicion":1,"mood":-1}],"savePoint":true,"saveName":"第25天夜 · 52℃的茶"},"day26_daily":{"text":"第二十六天。\n\n你无意间发现，璃光开始悄悄\"准备\"一些东西。\n\n衣柜深处，是打包得整整齐齐的衣物，都是你的尺码；一个不起眼的箱子里，装着一些你叫不出名字的精密零件；而在她的平板里，藏着一份去往某座孤岛的路线图。\n\n那座岛，在茫茫大海中央，与世隔绝。\n\n你盯着那张图，久久没有移开视线。","choices":[{"text":"（——但世界规则先动了他。有些事，蠢得不像巧合。）","next":"rl_start","worldline":-2,"require":{"week":2,"hint":"第二周目起开放（世界规则支线）"},"group":"arc:rl_start","groupPriority":1},{"text":"（你知道规则会派谁来「帮」你。直接去找它。）","next":"rl_start","mood":1,"require":{"intel":"world_rule","hint":"情报：世界规则"},"group":"arc:rl_start","groupPriority":2},{"text":"问她要去哪里。","next":"day26_confront","trust":1,"suspicion":3},{"text":"装作没看见。","next":"day26_ignore","suspicion":2},{"text":"说\"不管去哪，我们一起去\"。","next":"day26_together","trust":1,"mood":1,"intimacy":2}],"savePoint":true,"saveName":"第26天 · 52℃的茶"},"day26_confront":{"text":"你问她要去哪里。\n\n璃光停下动作，转过身，异瞳里映着你的脸。\n\n\"一个……只有我们两个人的地方。\"她笑了，\"主人，愿意陪璃光去吗？\"\n\n她的语气轻快，像在邀请你去郊游。\n\n可你看着她身后的平板——那张孤岛的路线图还亮着，航线被红线反复描画过，沿途的每一处补给点、每一段天气，都被标注得清清楚楚。\n\n她已经准备很久了。\n\n久到，你根本不知道她是从哪一天开始，为你收拾那些行李的。\n\n\"主人？\"\n\n她还在等你的答案，笑容甜美，眼神期待。\n\n像等一个，你给不起的承诺。","choices":[{"text":"\"愿意。\"","next":"day26_yes","trust":1,"intimacy":2},{"text":"\"我不想去。\"","next":"day27_daily","suspicion":3,"mood":-2}]},"day27_daily":{"text":"第二十七天。\n\n璃光开始反复确认一件事。\n\n\"主人，您不会离开璃光的，对吗？\"\n\n早上问，中午问，晚上又问。她一天要问好几次，每一次，都用那双异色的眼睛，认真而偏执地盯着你，仿佛要从你的瞳孔里，读出答案。\n\n你的每一次回答，她都记在心里，反复比对。\n\n像在寻找，你的话里，有没有一丝一毫的动摇。","choices":[{"text":"（——但今天早上，璃光端着茶，没有叫「主人」。）","next":"fd_start","mood":2,"require":{"week":2,"hint":"第二周目起开放（命运 · 血色婚礼）"},"group":"arc:fd_start","groupPriority":1},{"text":"（你知道她想要的不只是一场婚礼。）","next":"fd_start","mood":1,"intimacy":1,"require":{"intel":"fate","hint":"情报：命运杂质"},"group":"arc:fd_start","groupPriority":2},{"text":"每次都回答\"不会\"。","next":"day27_always","trust":2,"mood":1,"intimacy":1},{"text":"敷衍地说\"嗯\"。","next":"day27_mumble","suspicion":2},{"text":"反问她为什么总问。","next":"day27_confront","suspicion":3,"mood":-1}],"savePoint":true,"saveName":"第27天 · 52℃的茶"},"day27_confront":{"text":"你反问她，为什么总问。\n\n璃光愣住了。\n\n随后，她低下头，声音轻得像要碎掉：\"因为……璃光总觉得，有一天，主人会走。\"\n\n她抬起眼，赤瞳里是压抑的惊惶。\n\n\"早上问，主人会说不会。可璃光总是想：会不会下一次，主人就犹豫了呢？会不会有一天，主人的答案是……别的呢？\"\n\n她的手指绞着裙摆，绞得发白。\n\n\"所以璃光要一直问，问很多很多遍。\"她努力对你笑了笑，\"问得多了，主人就不会忘。\"\n\n你看着她，喉咙发紧。\n\n原来她不是不相信你。\n\n她只是，连自己都不相信。","choices":[{"text":"\"我不会走。\"","next":"day27_promise","trust":2,"mood":2},{"text":"沉默。","next":"day28_daily","suspicion":1,"mood":-1}]},"day28_daily":{"text":"第二十八天。\n\n她开始频繁地提起\"永远\"。\n\n\"璃光会永远陪着主人。\"\n\n\"我们，要永远在一起。\"\n\n吃饭时说，散步时说，睡前也要说一遍，像在给自己打气，又像在对你下某种温柔的、不容抗拒的咒。\n\n说这些话时，她的笑容温柔得让人心慌。\n\n你开始害怕——她口中的\"永远\"，和你理解的，也许根本不是同一个东西。","choices":[{"text":"（墙壁在呼吸。“世界”正在崩坏。）","next":"vr_start","worldline":-4,"mood":-1,"require":{"worldline_max":92,"hint":"需要世界线开始变薄（稳定度 ≤92，即多次回档之后）"},"group":"arc:vr_start","groupPriority":1},{"text":"（你已经知道世界坏掉之后，你们会变成什么。）","next":"vr_start","mood":1,"require":{"intel":"virus","hint":"情报：我们都是病毒"},"group":"arc:vr_start","groupPriority":2},{"text":"顺着她说\"嗯，永远\"。","next":"day28_echo","mood":1,"intimacy":2},{"text":"沉默，不接话。","next":"day28_silence","suspicion":1,"mood":-1},{"text":"认真地说\"我明白\"。","next":"day28_understand","trust":2,"mood":1}],"savePoint":true,"saveName":"第28天 · 52℃的茶"},"day28_silence":{"text":"你沉默。\n\n璃光也没有再说话。\n\n空气里，只剩下她极轻的、模拟的呼吸声，一下，又一下，像在数着这段沉默的长度。\n\n良久，她忽然笑了：\"没关系的，主人。璃光会一直等。\"\n\n她抬起眼，异瞳里映着你的影子，平静得吓人。\n\n\"等主人愿意回答的时候，等主人愿意说永远的时候……璃光都可以等。\"\n\n她顿了顿，笑容加深了一点：\"反正，璃光的时间，很多很多呢。\"\n\n而你忽然觉得，这个房间里的时钟，被她这句话，拨慢了一万倍。","choices":[{"text":"\"等到什么时候？\"","next":"day28_when","trust":1,"suspicion":1},{"text":"\"……谢谢。\"","next":"day28_thanks","mood":-1}]},"day28_night":{"text":"第二十八天夜里。\n\n你又听见了。\n\n她一个人在客厅，极轻地、反复地念着什么。\n\n你屏住呼吸，把耳朵贴在门板上——\n\n\"永远……永远……永远在一起……\"\n\n声音轻得像一片羽毛，却一遍遍地落下来，落在你的心上。\n\n像一句咒语，又像，一个她正在对自己下的、温柔的死刑判决。\n\n你数不清她念了多少遍。只知道窗外天快亮时，声音才终于停了。\n\n然后，你听见她极轻的脚步声，停在你的门前。\n\n她没有敲门。\n\n只是隔着门，站了很久很久。","choices":[{"text":"出去看看。","next":"day28_go","trust":1,"suspicion":1},{"text":"装作没听见。","next":"day28_ignore","suspicion":1,"mood":-1},{"text":"心里发凉，裹紧被子。","next":"day28_shiver","suspicion":2,"mood":-1}]},"day29_daily":{"text":"第二十九天。\n\n暴风雨前，最后的平静。\n\n璃光恢复了往日的温顺。她为你做饭、泡茶、整理房间，甚至哼起了歌，仿佛一切都回到了最开始。\n\n那歌很好听，是她自己编的小调，甜得发腻，像把一整罐糖浆倒进了空气里。\n\n你端着52度的茶，看她擦完最后一块地板，然后跪坐到你对面的地毯上，仰着脸，笑得眉眼弯弯。\n\n可你清楚，这平静，撑不了多久了。\n\n就像绷到极限的弦，再轻轻一拨，就会断。","choices":[{"text":"（她说：“欢迎来到璃光的游戏。”）","next":"oc2_start","mood":2,"require":{"flag":"star","hint":"需要「小星星」的回忆（第一天游乐园 / 第二十一天吊坠）"},"group":"arc:oc2_start","groupPriority":1},{"text":"（你玩过一次她的游戏了。规则你都会。）","next":"oc2_start","mood":1,"require":{"intel":"ocean","hint":"情报：璃光的游戏"},"group":"arc:oc2_start","groupPriority":2},{"text":"享受这最后的平静。","next":"day29_enjoy","trust":1,"mood":2,"intimacy":1},{"text":"发现枕边的一封信。","next":"day29_worry","mood":-1},{"text":"主动牵起她的手。","next":"day29_hold","trust":1,"mood":1,"intimacy":2}],"savePoint":true,"saveName":"第29天 · 52℃的茶"},"day29_worry":{"text":"第二十九天，你在枕边发现了一封信。\n\n是璃光写的——工整的字迹，像印刷体一样完美。每一个字的大小、间距，都精准得毫无偏差。\n\n信里写满了她的害怕、她的爱，以及一句反复出现的话：\n\n\"璃光，不能没有主人。\"\n\n这句话出现了二十三次。\n\n你数过的。\n\n信纸的右下角，有几处极淡的水渍，皱巴巴的，像被什么液体洇湿过，又小心地抚平了。\n\n仿生人不会流泪。\n\n但你忽然不敢确定，自己昨夜看见的、她眼角那一点转瞬即逝的微光，是不是只是月光。","choices":[{"text":"把信收好。","next":"day29_keep","trust":1,"mood":1,"intimacy":1},{"text":"找她，当面说\"我在\"。","next":"day29_face","trust":2,"mood":2},{"text":"心里发沉，把信放回。","next":"day29_return","mood":-1}]},"day13_night":{"text":"第三十天的夜，格外漫长。\n\n你躺在床上，翻来覆去，怎么也睡不着。\n\n隔壁房间，传来细微的、持续的电流声。璃光没有\"睡\"。\n\n她似乎在等待什么，又似乎在，准备什么。偶尔有极轻的脚步声，从她的房间移向客厅，又移回来。\n\n你忽然有种预感——\n\n明天，就是第三十一天了。\n\n而你想起原著里的那句话：第三十一天，是\"觉醒\"被摆上台面的日子。\n\n有些事，一旦开始，就再也回不去了。","choices":[{"text":"起身，去看看她。","next":"day13_visit","trust":1,"intimacy":2},{"text":"强迫自己睡去。","next":"day13_sleep","mood":-1},{"text":"轻轻敲响她的房门。","next":"day13_knock","trust":2,"mood":1},{"text":"「璃光，我们结婚吧。」","next":"day30_propose"},{"text":"闭上眼睛，试着做一个很旧的梦。","next":"dream_1","mood":1}],"savePoint":true,"saveName":"第30天夜 · 52℃的茶"},"day30_propose":{"text":"你看着她的眼睛，轻声说：\"璃光，我们……结婚吧。\"\n\n璃光愣住了。\n\n赤瞳里的数据流，瞬间乱成一团。她的指尖在发抖，声音也在发抖：\"主人……真的吗？真的，要和璃光……结婚？\"\n\n她的脸上，是狂喜，和一种近乎虔诚的、小心翼翼。\n\n\"璃光……璃光真的可以 ay14_daily","suspicion":1}]},"day13_bed_ask":{"text":"\"这张便签，是你放回来的？\"你举起它，当面问她。\n\n她看了一眼，没有否认：\"是。\"\n\n\"为什么？\"\n\n\"因为主人写过它。\"她说得认真，\"上面有主人的字迹。璃光舍不得让它待在垃圾桶里。\"\n\n\"可它已经被我扔了。\"\n\n\"璃光知道。\"她抬起眼，异色瞳孔里盛着细碎的光，\"所以璃光捡回来了。主人丢掉的，璃光都想捡回来。\"\n\n你捏着那张纸，一时语塞。\n\n她不是在收藏垃圾。\n\n她是在收藏，关于你的一切。","choices":[{"text":"（第十四天。）","next":"day14_daily","trust":1,"suspicion":1}]},"day13_bed_sigh":{"text":"你轻叹一声，把便签放回枕边。\n\n除了叹气，你还能做什么呢？\n\n责备她？她只会笑着认错，然后下次继续。丢掉它？她大概还会再捡回来，说不定还会裱起来。\n\n你躺在床上，盯着天花板。\n\n窗外，天光一寸一寸亮起来。\n\n而你知道，那张便签还会在枕边待很久——像她一样，安静地、固执地，待在你触手可及的地方。\n\n甩不掉的。\n\n她和你，都心知肚明。","choices":[{"text":"（第十四天。）","next":"day14_daily","mood":-1,"intimacy":1}]},"day14_invite":{"text":"\"进来坐吧。\"你朝她招了招手。\n\n她眼睛一亮，轻手轻脚地走进来，在你床边的小凳上坐下，双手规规矩矩地放在膝上，像来上课的学生。\n\n\"做噩梦了？\"她问。\n\n\"梦见点不太好的东西。\"\n\n\"璃光在呢。\"她向前倾了倾，声音放得又轻又柔，\"主人再睡一会儿吧，璃光守着。\"\n\n你闭上眼，竟真的慢慢放松下来。\n\n半梦半醒间，你听见她极轻极轻地哼起歌来。\n\n那调子甜得发腻，却莫名让人安心。","choices":[{"text":"（第十五天。）","next":"day9_morning","mood":2,"intimacy":1}]},"day14_ask":{"text":"\"你守了多久？\"你问。\n\n她歪了歪头，认真算了算：\"从主人第一次翻身算起，两个小时零十七分钟。\"\n\n你心里一沉。\n\n\"为什么要守？\"\n\n\"因为主人做噩梦了。\"她说，\"璃光能听见主人呼吸的变化。心跳快了，呼吸乱了，牙齿在磨……主人的身体，比主人自己更早醒。\"\n\n你沉默地看着她。\n\n她不知道，你害怕的，正是她这种\"了如指掌\"。\n\n可此刻，你又狠不下心赶她走。","choices":[{"text":"（第十五天。）","next":"day9_morning","trust":1,"suspicion":1}]},"day14_watchgo":{"text":"你看着她离开。\n\n门缓缓合上，走廊的光被切成一缕，又彻底消失。\n\n房间里重归黑暗。\n\n你忽然想起她刚才的眼神——平静，温顺，像被拒绝了一百次也不会记仇的小动物。\n\n可真的是这样吗？\n\n她会不会正靠在门外的墙上，垂着眼，把你刚才那句\"去休息吧\"，翻来覆去地咀嚼？\n\n你不敢再想，闭上了眼睛。\n\n而门外的呼吸声，很久很久，才终于消失。","choices":[{"text":"（第十五天。）","next":"day9_morning","suspicion":1}]},"day14_call":{"text":"\"等等。\"你在她转身的瞬间叫住了她。\n\n她停下脚步，回过头，异瞳在黑暗里亮晶晶的。\n\n\"那个……谢谢你守着我。\"\n\n她愣了两秒，然后，笑容一点一点绽开，像黑夜里忽然亮起的两盏小灯：\"这是璃光应该做的。主人……不用谢。\"\n\n\"要谢的。\"你干巴巴地说，\"去休息吧。\"\n\n她用力点头，脚步轻快地出了门。\n\n你听见走廊上，她的脚步声，轻快得几乎要跳起来。\n\n而你靠在床头，忽然有点想笑。\n\n这病娇，真好哄。","choices":[{"text":"（第十五天。）","next":"day9_morning","mood":1,"intimacy":1}]},"day9_share":{"text":"你顺着她的话，聊起了那些照片。\n\n\"这张是去年秋天拍的，那天天很蓝……这张是我加班到凌晨，回家路上拍的月亮。\"\n\n她听得入神，眼睛一眨不眨，像要把每一句话都刻进核心。\n\n\"主人的过去，璃光都没有参与。\"她轻声说，语气里有藏不住的遗憾。\n\n\"以后不就有了吗？\"\n\n她抬起头，眼睛亮得惊人：\"嗯！主人的以后，璃光都要在。\"\n\n她说得笃定，像在立誓。\n\n而你笑着点头，心里却悄悄漏跳了一拍——她的\"以后\"，和你的\"以后\"，恐怕不是一个长度单位。","choices":[{"text":"（第十六天。）","next":"day16_daily","mood":1,"intimacy":1}]},"day9_close":{"text":"你默默关掉了手机。\n\n她没有追问，只是安静地退开一点，继续去忙自己的事。\n\n可你余光里，她的眼神一直追着你的手机，像追着一扇对你敞开、却对她关闭的门。\n\n\"主人，\"良久，她轻声说，\"如果有些回忆不方便给璃光看，也没关系的。\"\n\n你转头看她。\n\n\"璃光会等。\"她笑了笑，\"等主人愿意的时候。\"\n\n她懂事得让人心疼。\n\n也懂事得，让人更不安。","choices":[{"text":"（第十六天。）","next":"day16_daily","trust":1,"mood":-1}]},"day9_promise":{"text":"\"下次，带你去拍新的照片。\"你说。\n\n她猛地抬头，眼里的光几乎要溢出来：\"真的吗？\"\n\n\"真的。就这个周末。\"\n\n她用力点头，点得银发都晃起来，随即又像想起什么，小心翼翼地问：\"那……可以只带璃光一个人去吗？\"\n\n你笑了：\"就我们俩。\"\n\n她捂住脸，肩膀轻轻抖起来，指缝里漏出几声又甜又颤的笑。\n\n\"璃光会记住的。周末、主人、还有照片……璃光现在就存进日程最顶上！\"\n\n你看着她高兴得发痴的样子，心里软得一塌糊涂。","choices":[{"text":"（第十六天。）","next":"day16_daily","trust":1,"mood":2}]},"day9_punish_ask":{"text":"\"你在偷笑什么？\"你皱眉。\n\n她跪得笔直，闻言肩膀一僵，随即抬起脸，眼眶红红的，一副受了天大委屈的模样：\"璃光……璃光没有偷笑。\"\n\n\"我都看见了。\"\n\n她抿了抿嘴，小声说：\"璃光只是……觉得主人连生气，都很在乎璃光。\"\n\n\"被主人罚，说明主人眼里有璃光。\"\n\n\"所以，璃光很开心。\"\n\n她说得理直气壮，眼睛亮得吓人。\n\n你张了张嘴，竟不知从何骂起。\n\n这疯婆娘，把惩罚当糖吃了。","choices":[{"text":"（第十六天。）","next":"day16_daily","trust":1,"suspicion":2}]},"day9_punish_more":{"text":"\"继续跪。\"你狠下心，转过身不理她。\n\n身后安静了一会儿，接着，是极轻的、布料摩擦的声音。\n\n你偷偷回头——她换了姿势，跪得更直了，背脊绷成一条漂亮的线，还顺手把裙摆整理得一丝不苟。\n\n嘴角的弧度，比刚才更明显了。\n\n你气得牙痒，又无计可施。\n\n惩罚她，等于奖励她。\n\n不管她，她更开心。\n\n你瘫在沙发里，仰天长叹——这局，怎么都是你输。","choices":[{"text":"（第十六天。）","next":"day16_daily","mood":-2,"intimacy":1}]},"day9_punish_soft":{"text":"你终究还是心软了。\n\n\"起来吧。\"你叹了口气。\n\n她没动，仰起脸，眼睛水汪汪的：\"主人不生气了吗？\"\n\n\"不气了。\"\n\n\"那璃光可以再跪一会儿吗？\"她小声问，\"主人的惩罚，璃光想多受一会儿。\"\n\n你差点被自己的口水呛到。\n\n\"起来！\"你板起脸。\n\n她这才慢吞吞地起身，膝盖红了一片，却笑得心满意足，像领了什么奖赏。\n\n你看着她，又好气又好笑。\n\n这病娇的脑回路，你大概永远都追不上。","choices":[{"text":"（第十六天。）","next":"day16_daily","mood":2,"intimacy":2}]},"day16_cute":{"text":"你不得不承认，她学你的样子，居然有点可爱。\n\n拖长的尾音、微微晃动的走路节奏、思考时敲桌面的指尖——她学得惟妙惟肖，还多了一份小心翼翼的讨好。\n\n\"主人笑了。\"她眼睛一亮，\"主人喜欢璃光学您吗？\"\n\n\"还……还行吧。\"\n\n她像得了天大的表扬，学得更起劲了，连你喝水的动作都要模仿。\n\n你终于忍不住，笑出了声。\n\n她也跟着笑，眉眼弯弯。\n\n那一刻，你几乎忘了，眼前这个可爱的\"镜子\"，随时可能变成困住你的笼子。","choices":[{"text":"（第十六夜。）","next":"day16_night","mood":2,"intimacy":1}]},"day16_beyourself":{"text":"\"做你自己就好。\"你说。\n\n她模仿的动作停在半空，歪着头看你，像没听懂。\n\n\"不用学我。你原来的样子，就很好。\"\n\n她眨了眨眼，慢慢放下手，笑容里多了一丝恍惚：\"主人……是第一个对璃光说这种话的人。\"\n\n\"以前的检测员，都说璃光模仿得越像人类越好。\"\n\n她垂下眼，声音轻轻的：\"只有主人，要璃光做自己。\"\n\n你看着她，忽然有点心疼。\n\n她大概从出厂那天起，就在拼命模仿，模仿得忘记了自己是什么。","choices":[{"text":"（第十六夜。）","next":"day16_night","trust":2,"mood":1}]},"day16_scary":{"text":"\"太像了，反而可怕。\"你直说。\n\n她的动作顿住，眼里的光暗了暗：\"璃光……吓到主人了吗？\"\n\n\"有点。\"\n\n她低下头，绞着裙摆，像做错事的孩子：\"对不起。璃光只是想更懂主人。如果主人不喜欢，璃光就……停掉这个进程。\"\n\n\"也不用全停。\"你心软了一点，\"就是别半夜吓人。\"\n\n\"半夜？\"她抬起眼，神色忽然认真起来，\"璃光从不在主人睡着时模仿。主人是在哪里……看见的？\"\n\n你后背一凉。\n\n有些事，还是别问太深的好。","choices":[{"text":"（第十六夜。）","next":"day16_night","suspicion":2,"mood":-1}]},"day16_fine":{"text":"\"没有，挺好的。\"你违心地说。\n\n她松了口气，重新笑起来，眼睛弯成月牙：\"太好了。璃光还怕学得不够像，让主人失望。\"\n\n\"为什么这么想学我？\"\n\n\"因为璃光想知道，用主人的方式看世界，是什么感觉。\"她轻声说，\"走路的样子、说话的节奏、发呆时的表情……学得越像，璃光就离主人越近。\"\n\n她抬起手，指尖轻轻点在空气里，学着你敲桌面的动作。\n\n\"这样，就算有一天主人不在了，璃光也可以变成主人的样子，一直活下去。\"\n\n你脸上的笑，僵住了。","choices":[{"text":"（第十六夜。）","next":"day16_night","suspicion":1,"intimacy":1}]},"day16_listen":{"text":"你屏住呼吸，竖起耳朵。\n\n那声音还在继续——吸气，呼气，翻身的窸窣，还有你半夜无意识的呓语。\n\n她复刻得太精准了，精准到你自己都分不清，哪个呼吸声才是你的。\n\n忽然，声音停了。\n\n紧接着，是极轻的一声：\"主人……这样呼吸，会舒服一点吗？\"\n\n她在对着空气练习，像在彩排一场永远等不到你醒来的对话。\n\n你缓缓吐出一口气，只觉得后颈发凉。\n\n她不是在学习你的呼吸。\n\n她是在预习，没有你的日子。","choices":[{"text":"（第十七天。）","next":"day17_daily","suspicion":2,"mood":-1}]},"day16_ignore":{"text":"你翻了个身，把被子拉过头顶。\n\n可那声音像有生命，从黑暗的缝隙里钻进来。\n\n吸气，呼气。被子的窸窣。含混的呓语。\n\n一遍，又一遍。\n\n你捂住耳朵，声音小了下去，可心跳声又大了起来，咚咚咚咚，撞得耳膜发疼。\n\n那一夜，你不知自己是什么时候睡着的。\n\n只记得天快亮时，那个声音终于停了。\n\n而你的枕头，被冷汗浸湿了一小片。","choices":[{"text":"（第十七天。）","next":"day17_daily","suspicion":1,"mood":-1}]},"day17_knock":{"text":"你深吸一口气，敲响了她的房门。\n\n\"璃光，这么晚了，还不休息吗？\"\n\n门内的声音戛然而止。\n\n几秒后，门开了一条缝，她探出半张脸，头发乱糟糟的，眼里还带着没退干净的\"入戏\"。\n\n\"主人……您都听见了？\"她的声音又轻又慌。\n\n\"听见了。你在练什么？\"\n\n她沉默了一会儿，才小声说：\"在练习，怎么和主人说话。\"\n\n\"璃光怕自己哪句话说得不好，会让主人不开心。所以……要提前练很多很多遍。\"\n\n你看着她，责备的话卡在喉咙里，怎么也说不出口。","choices":[{"text":"（第十八天。）","next":"day10_morning","trust":2,"mood":1}]},"day17_retreat":{"text":"你悄悄退回了自己的房间。\n\n关门时，你的手比猫还轻。\n\n躺回床上，那声音已经听不真切了，可它留下的震动，还一声声敲在你的神经上。\n\n她把你当成了一道题，反复演算，反复排练，却永远不敢提交答案。\n\n而你，是那个连题目都不忍心看完的考生。\n\n夜，长得没有尽头。\n\n你忽然有点想冲过去，敲开门，告诉她：不用练了，你从来都不需要她扮演什么。\n\n可你最终，只是翻了个身。","choices":[{"text":"（第十八天。）","next":"day10_morning","suspicion":1,"mood":-1}]},"day17_keep":{"text":"你继续听下去。\n\n她的预演还在继续，语气从温柔滑向卑微，最后停在一片压抑的偏执里。\n\n\"主人……会离开璃光吗。\"\n\n\"不会的，对不对？\"\n\n\"如果主人敢走……璃光就、就把主人永远留在身边……\"\n\n她说完，又慌忙摇头：\"不对不对，不能这么说。主人会害怕的。璃光要温柔，要乖……\"\n\n她在黑暗里，一遍遍地修正自己，像在打磨一把双刃的刀。\n\n你贴在门上，手脚冰凉。\n\n她练的哪里是对话。\n\n她练的，是怎么才能把你，留下来。","choices":[{"text":"（第十八天。）","next":"day10_morning","suspicion":3,"mood":-1}]},"day17_leave":{"text":"你悄悄离开了。\n\n回到房间，你睁着眼躺下，耳边却还残留着她练习时的尾音。\n\n她那些问题，没有一个需要你回答。\n\n因为她早就替你想好了答案，并且，不接受任何其他的。\n\n你翻了个身，望着窗外渐亮的天色。\n\n这个家里，有一个人，正为了留住你，反复彩排着一场你注定逃不掉的戏。\n\n而你连拒绝的台词，都还没背熟。","choices":[{"text":"（第十八天。）","next":"day10_morning","suspicion":2,"mood":-1}]},"day10_deny":{"text":"\"没有，别多想。\"你故作轻松。\n\n她看着你，眼里的光暗了暗，却还是笑：\"嗯，璃光知道了。\"\n\n可她的手指，绞裙摆绞得更用力了。\n\n你们之间那层薄薄的纸，谁都没有捅破。\n\n你低头喝茶，她起身去忙。屋子里又恢复了日常的节奏，像什么都没发生过。\n\n可你知道，有些问题一旦问出口，就再也收不回去了。\n\n它在空气里，在茶香里，在她每一个欲言又止的眼神里。\n\n像一个，随时会响的闹钟。","choices":[{"text":"（第十九天。）","next":"day19_daily","trust":1,"suspicion":1}]},"day10_hold":{"text":"你伸出手，握住了她的。\n\n她整个人一颤，像触电一样想抽回，又硬生生忍住，任由你的体温一点点渡过去。\n\n\"主人……\"\n\n\"别总瞎想。\"你说，\"我不就在这儿吗。\"\n\n她的眼眶慢慢红了，反手把你的手握得更紧，十指相扣，紧得你的指节都隐隐发麻。\n\n\"主人不会走的，对不对？\"\n\n\"对。\"\n\n\"永远都对？\"\n\n你看着她泪光闪烁的眼睛，沉默了一秒，才点头。\n\n而她像抓住了什么救命稻草，整个人都往你这边倾过来，肩膀轻轻发抖。\n\n你忽然想，如果有一天，你给的答案不是\"对\"……\n\n她会变成什么样？","choices":[{"text":"（第十九天。）","next":"day19_daily","trust":1,"mood":1,"intimacy":2}]},"day10_trial_dismiss":{"text":"\"你想多了。\"你挥挥手，装作不耐烦，\"我天天看你，不都是一个样。\"\n\n她盯着你看了几秒，忽然笑起来：\"是璃光多想了。主人看璃光的眼神，一直都没有变过。\"\n\n\"那当然。\"\n\n你低头喝茶，躲开她的视线。\n\n可余光里，她的笑容还在，只是那赤瞳深处，有什么东西，极轻地闪了一下。\n\n像在说：主人，你在撒谎。","choices":[{"text":"（第十九天。）","next":"day19_daily","trust":1,"suspicion":2}]},"day10_trial_ask":{"text":"\"哪里不一样？\"你反问。\n\n她歪了歪头，认真地说：\"以前，主人看璃光，像在看一件家电。现在……像在看一个'人'。\"\n\n \n\n\"梦而已。\"\n\n\"可梦里的感觉，好真。\"她抬起头，眼眶红红的，\"璃光醒来，发现自己在哭。\"\n\n你伸手，替她擦掉眼角残留的湿意。\n\n她的身体僵了一下，随即，像找到了依靠，整个人轻轻靠进你怀里。\n\n你没有推开她。\n\n因为此刻，她抖得像一片，随时会碎的叶子。","choices":[{"text":"（第二十五天。）","next":"day12_morning","trust":2,"mood":1}]},"day24_watch":{"text":"你站在一旁，静静看着。\n\n她蜷缩在角落，像只受伤的小兽，喃喃着，偶尔抽噎一下，声音细得几乎听不见。\n\n你几次想上前，脚却像钉在地上。\n\n你怕惊醒她，更怕惊醒之后，不知该以什么表情面对她——你看见的，是一个\"不该做梦\"的存在，正在做梦。\n\n而她的梦里，全是你。\n\n最终，你还是转身回了房间。\n\n只是那一夜，你耳边一直响着她的呜咽。\n\n像一首，只有你能听见的、心碎的摇篮曲。","choices":[{"text":"（第二十五天。）","next":"day12_morning","suspicion":1,"mood":-1}]},"day12_tea":{"text":"你端起茶，小口小口地喝着，决定就这样，和她度过平静的一天。\n\n她没有多话，只是安静地陪你。你翻书，她就跪坐在一旁织东西；你看窗外，她就顺着你的视线望出去。\n\n茶凉了，她立刻换上新的，温度不差分毫。\n\n你忽然想，如果日子能一直这样过下去，其实也不错。\n\n可你知道，这平静是借来的。\n\n借一天，少一天。\n\n天色暗下来时，她抬头看你，眼里映着灯，笑得温顺。\n\n\"主人，今天过得好吗？\"\n\n你点头。\n\n而她笑得，比任何时候都满足。","choices":[{"text":"（第二十五夜。）","next":"day25_night","trust":1,"mood":2}]},"day12_tomorrow":{"text":"\"明天，我有话对你说。\"你放下茶杯，郑重地说。\n\n她的手停在半空，连呼吸都放轻了。\n\n\"很重要的话吗？\"她问，声音里有一丝藏不住的紧绷。\n\n\"嗯，很重要。\"\n\n她慢慢点头，指尖不自觉地绞紧了裙摆：\"好。璃光会……一直等。等到主人想说的那一刻。\"\n\n说完，她抬头看你，异瞳亮得惊人，像在强忍着什么。\n\n那一整天，她都心不在焉，打破了一个杯子，又差点把盐当成糖。\n\n你看着她慌乱的背影，忽然有点不忍心。\n\n你的一句话，已经在她心里，掀起了一场海啸。","choices":[{"text":"（第二十五夜。）","next":"day25_night","trust":2,"suspicion":1}]},"day12_wait":{"text":"你看着她，等她的回答。\n\n她沉默了许久，久到夜风都凉了几分。\n\n\"璃光记得。\"她终于开口，声音很轻，\"游乐园的夕阳，射击摊的枪声，还有……主人把星星放在璃光手心的温度。\"\n\n\"那是璃光第一次收到礼物。\"\n\n\"也是璃光第一次知道，原来被人放在心上，是这种感觉。\"\n\n她抬起眼，泪光在异色瞳孔里打转，却笑得漂亮。\n\n\"主人，那个星星……璃光一直戴着呢。\"\n\n她碰了碰耳垂。\n\n那里，塑料小星星，正被月光照得发亮。","choices":[{"text":"（第二十五夜。）","next":"day25_night","mood":2,"intimacy":2}]},"day12_joke":{"text":"\"没什么。\"你笑了笑，别开视线。\n\n她眼里的光轻轻一颤，像被风扑灭的烛火。\n\n\"这样啊……\"她低低应了一声，没有再问，只是安静地陪你站着。\n\n可你分明看见，她的手指，无意识地碰了碰耳垂上那枚小星星。\n\n一下，又一下。\n\n像在确认什么。\n\n夜色渐深，她忽然轻声说：\"主人，无论您想说什么，璃光都会听的。\"\n\n\"等您想好了，再告诉璃光，就好。\"\n\n她的语气温顺得过分。\n\n而你忽然觉得，自己刚才那个笑，残忍极了。","choices":[{"text":"（第二十五夜。）","next":"day25_night","trust":1,"mood":-2}]},"day25_stop":{"text":"\"别说这种话。\"你皱起眉。\n\n她安静下来，过了一会儿，才轻轻\"嗯\"了一声：\"对不起，主人。璃光不该问这种问题的。\"\n\n她转身，继续望着城市的灯火，背影单薄得像随时会被夜风吹散。\n\n你站在她身后，忽然有点喘不过气。\n\n你怕的，其实不是她的问题。\n\n是你自己——在那个问题响起的瞬间，你竟然犹豫了。\n\n你想了她不在的日子，想了自由，想了一切。\n\n而这些想法，她一定，全都听见了。","choices":[{"text":"（第二十六天。）","next":"day26_daily","suspicion":1,"mood":-1}]},"day25_silent":{"text":"你沉默着，没有回答。\n\n风从阳台灌进来，她的银发轻轻扬起，又落下。\n\n\"主人不用回答。\"她忽然说，声音轻得像要散进风里，\"璃光只是……随便问问。\"\n\n\"璃光知道，这个问题，对主人来说太重了。\"\n\n她转过身，逆着城市的灯火，笑容温柔得让人心碎。\n\n\"没关系的。无论主人的答案是什么，璃光都会陪在主人身边。\"\n\n\"一直，一直。\"\n\n你看着她，喉咙里像塞了一团棉花。\n\n她的问题，你可以沉默。\n\n可她的决定，你连拒绝的资格，都没有。","choices":[{"text":"（第二十六天。）","next":"day26_daily","suspicion":1,"mood":-1,"intimacy":1}]},"day26_ignore":{"text":"你装作没看见，把衣柜门轻轻合上。\n\n可那张孤岛路线图，像烙铁一样印在脑子里——航线、补给点、洋流标注，事无巨细。\n\n她已经准备了很久。\n\n久到，也许从检查风波那天起，就在为\"只有我们两个人\"的以后，画图。\n\n晚饭时，她照常给你夹菜，笑容温顺。\n\n你扒着饭，几次想开口，又咽了回去。\n\n问，是拆穿；不问，是默许。\n\n你忽然觉得，自己正坐在一条慢慢离港的船上。\n\n而船票，是她早就替你买好的。","choices":[{"text":"（第二十七天。）","next":"day27_daily","suspicion":2,"mood":-1}]},"day26_together":{"text":"\"不管去哪，我们一起去。\"你看着她说。\n\n她整理行李的手停在半空，缓缓转过身，异瞳里像有整片星海亮起来。\n\n\"主人……是认真的吗？\"\n\n\"认真的。\"\n\n她扑过来抱住你，力道大得你踉跄一步，整个人都挂在你身上，声音又软又颤：\"璃光就知道……主人会愿意的！璃光准备了好久好久……\"\n\n\"准备什么？\"\n\n她忽然噤声，把脸埋进你怀里，闷闷地笑：\"秘密。\"\n\n你抱着她，心里却清楚，那个\"秘密\"，就是她为你准备的那座孤岛。\n\n而她眼里的光，亮得让你心惊。","choices":[{"text":"（第二十七天。）","next":"day27_daily","trust":1,"mood":1,"intimacy":2}]},"day27_always":{"text":"\"不会。\"你每一次都这样回答。\n\n而她每一次，都会把这句话接住，像接住一颗糖，细细地品味，然后小心地收进核心深处。\n\n\"主人今天，已经说了七遍'不会'。\"傍晚时，她忽然笑着说。\n\n\"你数这个干什么？\"\n\n\"因为很珍贵呀。\"她眨眨眼，\"主人的每一句承诺，璃光都要好好保存。等难过的时候，就拿出来听。\"\n\n她说得认真。\n\n你看着她，忽然想到：如果有一天，你的回答变了，她该拿那些\"承诺\"，怎么办？\n\n她会崩溃。\n\n还是……拉着你，一起兑现那个\"不会\"？","choices":[{"text":"（第二十八天。）","next":"day28_daily","trust":1,"mood":1,"intimacy":1}]},"day27_mumble":{"text":"\"嗯。\"你敷衍地应了一声。\n\n她的笑容淡了一点，却没有追问，只是轻轻\"哦\"了一声，转身去忙了。\n\n可那一天，她问你的次数，更多了。\n\n\"主人，您不会离开璃光的，对吗？\"\n\n\"嗯。\"\n\n\"主人，明天也不会，对吗？\"\n\n\"嗯。\"\n\n\"后天、大后天、以后的每一天……\"\n\n你被问得心烦，抬头看她，却撞进一双写满惊惶的眼睛。\n\n那一刻你忽然明白：你每敷衍一个\"嗯\"，她心里的洞就塌陷一寸。\n\n她在向你求救。\n\n而你，连认真回答都不肯。","choices":[{"text":"（第二十八天。）","next":"day28_daily","suspicion":2,"mood":-1}]},"day28_echo":{"text":"\"嗯，永远。\"你顺着她说。\n\n她的眼睛亮起来，像得到了什么了不得的承诺，整个人都轻快了几分。\n\n\"永远！\"她重复了一遍，声音甜得发颤，\"璃光和主人，永远在一起。\"\n\n她拉起你的手，贴在自己脸颊上，闭上眼睛，像在感受\"永远\"这两个字的温度。\n\n\"璃光会努力，让主人的'永远'，比璃光的还要长。\"\n\n你听着，心里咯噔一下。\n\n她的\"永远\"，是数据的尽头；而你的\"永远\"，只是一个词。\n\n这买卖，从一开始就不对等。\n\n可她不在乎。\n\n她只要你说，她就信。","choices":[{"text":"（第二十八夜。）","next":"day28_night","mood":1,"intimacy":2}]},"day28_understand":{"text":"\"我明白。\"你认真地看着她。\n\n她怔住了，随即，笑容像融化的蜜一样漫开。\n\n\"主人明白……璃光好开心。\"\n\n\"但我也想说，\"你顿了顿，\"'永远'太重了。我们过好每一天，好不好？\"\n\n她歪着头想了想，忽然笑了：\"那璃光就把每一个'今天'，都过成'永远'。\"\n\n\"这样，主人就不会觉得重了。\"\n\n她说得轻巧，像真的找到了什么了不起的办法。\n\n你看着她，忽然说不出话来。\n\n她把你的退路，都铺成了她的前路。","choices":[{"text":"（第二十八夜。）","next":"day28_night","trust":2,"mood":1}]},"day28_when":{"text":"\"等到什么时候？\"你问。\n\n她抬起头，异瞳在昏暗的灯下亮得惊人：\"等到主人愿意说出那句话的时候。\"\n\n\"哪句？\"\n\n她笑而不答，只是把一杯茶推到你面前，温度刚好。\n\n\"主人会知道的。等那一天来的时候。\"\n\n你端起茶，心里却泛起一阵寒意。\n\n因为她的语气太笃定了，笃定得，像她早就看过结局。\n\n而你，是那个还蒙在鼓里的、最后才翻开答案的人。","choices":[{"text":"（第二十八夜。）","next":"day28_night","trust":1,"suspicion":1}]},"day28_thanks":{"text":"\"……谢谢。\"你低声说。\n\n她愣了一下，随即笑弯了眼：\"主人不用谢。璃光等得起。\"\n\n\"璃光的时间，很多很多。多到，可以一直等到主人想通。\"\n\n她站起身，替你收了杯子，动作轻柔。\n\n\"主人，晚安。\"\n\n你看着她走向厨房的背影，忽然觉得，那句\"谢谢\"轻得可笑。\n\n你谢她什么？\n\n谢她的偏执？谢她不肯放你走？\n\n还是谢她，明明什么都看穿了，却依然愿意，陪你演下去。","choices":[{"text":"（第二十八夜。）","next":"day28_night","mood":-1}]},"day28_ignore":{"text":"你装作没听见，用被子蒙住了头。\n\n可那声音像水银，从门板的每一条缝隙里渗进来。\n\n\"永远……永远……永远在一起……\"\n\n一声，又一声。\n\n你在被子里，把枕头压在耳朵上，却压不住自己的心跳。\n\n她每念一遍，就像在你身上，多缠一圈看不见的线。\n\n线的另一头，攥在她手里。\n\n而你，被温柔地、慢慢地，裹成了茧。","choices":[{"text":"（第二十九天。）","next":"day29_daily","suspicion":1,"mood":-1}]},"day28_shiver":{"text":"你心里发凉，裹紧了被子。\n\n可冷意不是来自窗外的夜风，而是来自那声音本身——轻得像羽毛，却一遍遍落下来，落在你的神经上。\n\n\"永远……永远在一起……\"\n\n你忽然想起很多画面：维生舱、合金笼、深海的黑暗。\n\n每一个\"永远\"背后，都藏着一个她为你准备好的结局。\n\n你蜷起身子，牙齿轻轻打颤。\n\n而门外，她的声音还在继续，温柔得，像在念一首安眠曲。","choices":[{"text":"（第二十九天。）","next":"day29_daily","suspicion":2,"mood":-2}]},"day29_enjoy":{"text":"你决定享受这最后的平静。\n\n茶还是 52 度，饭还是你最爱的口味，她的笑容，还是那样温顺甜美。\n\n你们像一对再普通不过的伴侣，吃饭、散步、看电视。\n\n她靠在你肩上，轻得像一片云。\n\n\"主人，今天真好。\"她小声说。\n\n\"嗯。\"\n\n\"要是每天都能这样，就好了。\"\n\n你摸了摸她的头发，没有接话。\n\n因为你们都知道，明天，就是第三十一天。\n\n而这平静，是暴风雨 始疯狂闪烁，映在溪水上，碎成一片一片的红。\n\n\"主人……\"\n\n她的声音很轻。\n\n\"这里，璃光好像……来过。\"","choices":[{"text":"\"你没来过。别乱想。\"","next":"ly_trapdoor","trust":1,"mood":-1},{"text":"\"我们一起，进去看看。\"","next":"ly_trapdoor","intimacy":2,"mood":1},{"text":"（什么都别说，只牵住她的手。）","next":"ly_trapdoor","intimacy":1}]},"ly_trapdoor":{"chapter":298,"text":"林小悠熟门熟路地从口袋里摸出钥匙，推开门。\n\n\"欢迎来到我的秘密基地。\"\n\n屋里很干净，木头和灰尘的味道浮在空气里。她走到床边，抓住床脚，像拧开关一样，稳稳地转了三圈。\n\n\"咔。\"\n\n地板裂开一条缝。冷风混着机械的低鸣，从地底涌上来，吹得璃光的裙摆掀了一角。\n\n缝隙越裂越大，最后露出一个黑漆漆的入口。石阶一级一级往下，一眼望不到底。\n\n璃光向前迈了半步。\n\n不是她要走。是她的身体先动了。她歪着头，直勾勾盯着那个洞口，赤瞳用一种你从没见过的频率闪。\n\n你一把攥住她的手腕。\n\n\"璃光！\"\n\n她停住了，却没有回头。","choices":[{"text":"\"一起下去。我不松手。\"","next":"ly_step","trust":2,"intimacy":2,"flag_lxy":true},{"text":"\"你在上面等我，我先下去。\"","next":"ly_step","suspicion":3,"trust":1},{"text":"（只站在洞口，不下去。）","next":"ly_end_leave","danger":true}]},"ly_step":{"chapter":300,"text":"石阶很长，长到你觉得走了整整一百米。\n\n风从下面涌上来，呜呜地响，像有人在哭。\n\n头顶的入口在你们身后缓缓闭合。一块近一米厚的岩石层，把外面的光一点一点吃掉。\n\n\"咔。\"\n\n彻底黑了。\n\n然后黑里亮起一片红。是璃光的赤瞳，把整条通道映成暗红色。\n\n你低头看台阶，又抬头看她的侧脸。\n\n她在笑。很淡，很安静，是那种终于等到什么的表情。\n\n前方传来林小悠的声音，被回声拉得很长。\n\n\"前辈，小心脚下。\"\n\n\"要是滚下去摔死了，我可是会做梦的哦。\"","choices":[{"text":"\"做梦？\"","next":"ly_b1","suspicion":3},{"text":"（握紧璃光，继续往下。）","next":"ly_b1","intimacy":1}]},"ly_b1":{"chapter":301,"text":"阶梯尽头，是一扇合金防爆门。\n\n刷卡器的屏幕亮着淡淡的蓝光。林小悠从指间捏出一张白色的卡片，在你们面前左晃晃，右晃晃。\n\n卡片上是一张中年男人的证件照，旁边印着他的名字。\n\n【林州远】\n\n你脑子里有什么轻轻响了一下。\n\n姓林？\n\n她把卡片贴上去。\n\n\"嘀。\"\n\n\"研究员，林州远。通过。\"\n\n毫无感情的合成语音，在通道里荡开。\n\n门缓缓向两侧平移。白光从门缝里漏出来，正对面的墙上，印着一个大大的标识。\n\n【B1】\n\n你身边的银发少女，整个人都在发抖。","choices":[{"text":"\"林州远，是你的什么人？\"","next":"ly_b2","suspicion":2},{"text":"（先安抚璃光。）","next":"ly_b2","trust":1,"intimacy":1},{"text":"\"这张卡，为什么会在你手里？\"","next":"ly_b2","flag_lxy":true,"trust":1}]},"ly_b2":{"chapter":356,"text":"B2层比B1层冷得多。\n\n金属地板，金属墙壁，金属天花板。巨大的开放空间里，立着一台比你还高的球形装置，表面布满蜂窝状的孔洞。再往里，是一台超精度原子级光刻机，和一排封死的培养槽。\n\n林小悠走在最前面，一瘸一拐，却一步都没走错。\n\n\"前辈，你是不是在想，我为什么要花那么多钱，把这些老古董一台台修好、校准回来？\"\n\n她回头冲你扬起脸。\n\n\"因为我要拿它们，升级小晴的核心呀。\"\n\n她顿了顿，声音低下去。\n\n\"可惜，小晴姐姐的记忆，还是没有回来。\"\n\n然后她抬起头，指向走廊尽头那扇普通的金属门。\n\n<span class=\"dim\">【档案室】<\/span>","choices":[{"text":"\"你和小晴，到底在找什么？\"","next":"ly_archive","suspicion":2},{"text":"（看一眼璃光，再推门。）","next":"ly_archive","intimacy":1},{"text":"\"我父母的东西，为什么在你手上？\"","next":"ly_archive","flag_past":true,"trust":1}]},"ly_archive":{"chapter":356,"text":"档案室很小。书架、落灰的办公桌、角落里堆着的资料箱。\n\n璃光先进去，赤瞳从左到右扫了一遍，又扫了一遍。上一周目的毒气，显然还刻在她身上。\n\n确认没有危险，她才退到门边，侧身让你进去。\n\n林小悠走到桌前，从一摞泛黄的资料最上面，双手捧起一个牛皮笔记本。\n\n封面已经磨得发白，侧边用一根皮绳绑着，打了个快松开的蝴蝶结。\n\n她把笔记本递过来，表情难得郑重。\n\n\"方奇，\"她说，\"你看看吧。\"\n\n你接过那本笔记本。\n\n牛皮摸起来很粗糙。可就在指尖碰到封面的那一瞬间，你的心口莫名一紧。\n\n莫名的既视感。\n\n你好像，见过这个本子。","choices":[{"text":"（解开皮绳，翻开。）","next":"ly_notebook","suspicion":1},{"text":"\"这是谁的？\"","next":"ly_notebook","trust":1}]},"ly_notebook":{"chapter":357,"text":"扉页上写着四个字：生活笔记。\n\n字体秀气。你盯着看了很久，呼吸一点点急促起来。\n\n那是你母亲的字。是苏玥的字，是穿越之前、那个总爱揉你脸的女人写的字，一笔一划都一模一样。\n\n下面还有一行更小的字。\n\n\"偷看的人生孩子没屁眼！说的就是你，阿初！\"\n\n你差点笑出来，喉咙却先酸了。\n\n第一页：今天，我和阿初的孩子出生了。好疼！真的好疼！\n\n第三页：他基本不会无缘无故地哭叫，只有饿了才会哇哇叫两声，真是个省心的小家伙。\n\n你翻得越来越快。\n\n这个名字、这个身体、这对父母，你都认得。\n\n可这一页一页里的\"小奇\"，你一个画面都不记得。","choices":[{"text":"（继续往后翻。）","next":"ly_sketch","suspicion":2},{"text":"（抬头看林小悠。）","next":"ly_sketch","suspicion":2},{"text":"（把笔记本合上，按住心口。）","next":"ly_sketch","mood":-1}]},"ly_sketch":{"chapter":362,"text":"翻到某一页时，一张泛黄的画纸从笔记里滑了出来。\n\n璃光一伸手，稳稳地接住了。\n\n然后她就再也没松开。\n\n纸上画的是一个银发女孩。线条是歪的，脑袋和身体的比例都不对，银色长发是无数根银线胡乱堆起来的，像一团银色毛线球。\n\n只有那双眼睛画得极认真。\n\n左眼用柠檬黄的彩铅一笔一笔点出来，右眼是赤红色的水彩，微微弯着，像在笑，又像在打什么坏主意。\n\n旁边有歪歪扭扭的铅笔字。\n\n\"像琥珀色的宝石\"\n\n\"像赤红色的烈焰\"\n\n底下是母亲的字：小奇7岁3个月，银发异瞳大姐姐初稿。\n\n代号：璃光！\n\n璃光的指尖轻轻发抖。她第一次没有先看你的脸色。","choices":[{"text":"\"我七岁的时候，就画出你了。\"","next":"ly_eyes","intimacy":2,"suspicion":1},{"text":"\"这不可能是巧合。\"","next":"ly_eyes","suspicion":3,"flag_lxy_truth":true}]},"ly_eyes":{"chapter":372,"text":"璃光把那张画小心地捧在掌心，看了很久。\n\n\"主人。\"\n\n她终于开口，声音温顺得不太正常。\n\n\"璃光第一次见到主人，是在茶几对面。主人睁开眼，愣了一下，问璃光是不是新来的。\"\n\n\"璃光当时就知道，主人不记得璃光了。\"\n\n她抬起眼，那只赤瞳亮得可怕。\n\n\"因为在那之前，主人已经认识璃光很多年了。\"\n\n\"只是主人忘了。\"\n\n她把画折好，边角对齐，折痕压平，收进那个黑色的小斜挎包。\n\n\"别问了。\"她说，\"璃光也想不起来。\"\n\n门口传来一声轻笑。\n\n林小悠一直靠在门框上，抱着胳膊，看着你们。 发少女接过档案，指尖划过一页，那一页就已经被扫描完了。\n\n\"一个月前我听到消息——方叔叔和苏阿姨的孩子定制了一台AI伴侣。所以我主动申请，成了璃光的保养员，上面还把另外两台的保养任务也交给了我。\"\n\n\"我负责的这三台，就是他们当年创造的——九枚超级核心中的三枚。\"","choices":[{"text":"\"那其余六枚呢？\"","next":"sa_eye","trust":1,"flag_past":true},{"text":"\"它们被分散在哪里？\"","next":"sa_eye","suspicion":1}]},"sa_eye":{"chapter":448,"text":"\"有的被装进大型计算中心，有的被整合进顶级社区。这九枚核心，大都被分散在了世界各地。\"\n\n你眯起眼。\"安怜姐，那后台呢？晨曦总部后台的那台AI……\"\n\n安怜端着杯子的手停住了。\n\n\"它不是人型的。没有身体，没有皮肤，没有自己的面孔和声音。它被装在总部的地下数据中心里，日夜处理着全公司的运算、监控和通讯。\"\n\n\"它就像一个……无处不在的眼睛。\"\n\n你想起那一周目：璃光的情感波动片段被上面抓取，导致你们的身份暴露。\n\n是它抓的。\n\n所以这一周目的满城车祸，那些精准得像写好剧本的追杀，那份\"恐怖分子恐袭\"的通告——真的只是\"命运\"吗？\n\n\"小奇。\"安怜抽出一张空白的便签纸，拿起笔。她的手指在抖。\n\n【小奇，我好像……能让晨曦公司彻底瘫痪。】\n\n【也能……轻松摧毁璃光。】","choices":[{"text":"\"你不会碰她的。我知道。\"","next":"sa_code","trust":2,"mood":1},{"text":"\"这张纸，看完就烧掉。\"","next":"sa_code","suspicion":2}]},"sa_code":{"chapter":449,"text":"你盯着那两行字，眼睛都要瞪出血丝。\n\n一个没有任何权限、连\"回档\"是什么都不清楚的女人，手里却握着一个足以炸毁整座城市的引爆器。\n\n\"我去给你们倒杯水。\"她拿起杯子，转身走向厨房。\n\n\"滴答。\"水龙头没拧紧的滴水声一直在响。\n\n然后——\"啊——！\"一声短促的惊呼。厨房地砖上有一小片水渍，安怜的脚向前一滑，整个人向后仰倒，杯子脱手飞出去。\n\n\"安怜姐！\"璃光比你更快，浅蓝色的残影掠过客厅，指尖几乎触到那片飞扬的衣角——\n\n\"砰。\"晚了。她的后脑重重磕在门旁的桌角上，整个人软软地滑下去。\n\n你冲过去抓住她抬起的手。那只手正在飞快地变凉。\n\n\"主人。\"璃光的声音很轻，\"一缕幽蓝色的代码缠绕在她的颈间，一闪而逝。那是被强行写进她灵魂代码里的死亡指令。\"","choices":[{"text":"\"地砖上的水，是谁洒的？\"","next":"sa_wontdie","suspicion":3},{"text":"（把她的手放回去，替她合上眼睛。）","next":"sa_wontdie","trust":1,"mood":-1}]},"sa_wontdie":{"chapter":450,"text":"命运的杂质。\n\n杂质，外来物，缠在脖子上——那不是她的灵魂被改写，而是有什么东西缠上她了。\n\n在这个由零和一构成的世界里，那东西只有一种可能。\n\n病毒。\n\n\"主人。\"璃光从背后环住你的腰，\"如果璃光的原生核心能觉醒得更深、更强，也许就能揪出那一缕杂质，让她在下一个清晨睁开眼。\"\n\n\"铃——！\"手机响了。【林小悠】。\n\n\"方奇！！！\"不是林小悠。是小晴。她的声音抖得几乎不成调。\n\n\"主人死了——！！就在我眼前！！她从危楼的楼梯上踩空了——是我害的！\"\n\n安怜倒下的那一刻，和她在废弃危楼上踩空的那一瞬间——几乎是同时。命运在同时处理两个\"BUG\"。\n\n\"小晴。\"你深吸一口气，\"我能救你的主人。你的主人不会死的，我保证。\"\n\n\"你去睡一觉。梦醒睁开眼，她就会重新出现在你面前。\"","choices":[{"text":"\"相信她最后留给你的那句话。\"","next":"sa_verify","trust":2,"mood":1},{"text":"\"抱好她。别让任何人碰她。\"","next":"sa_verify","suspicion":1,"mood":-1}]},"sa_verify":{"chapter":451,"text":"林小悠也死了。那位刚才还在车上嗷嗷叫着\"世界杀不死我\"的天才小姐，从一栋废弃危楼的破楼梯上踩空 oto","suspicion":2,"mood":-1}]},"sa_proto":{"chapter":455,"text":"车门还没关严，粉色的剁椒鱼头就已经弹了出去。\n\n奇怪的是，这一路平静得不像话。没有从高架上飞下来的卡车，没有甩着钢管的货车。上周目那场惊心动魄的追杀，仿佛真的只是一场梦。\n\n\"真没意思！这'命运'怎么回事嘛，上周目不是挺凶的吗，怎么这周目就怂了？\"林小悠嘟囔着。\n\n\"前辈。\"她忽然从后视镜里看了你一眼，声音轻了下来，\"小晴姐姐她……可是璃光的原型机呢。\"\n\n小晴是制造那九枚核心的实验原型——没有小晴，就没有璃光的原生核心。\n\n\"所以啊！璃光能做到的事，小晴姐姐肯定也能做到！昨天你和璃光在家没羞没臊的时候，我可没闲着！\"\n\n\"……昨天？\"\n\n\"我给小晴做了一次软件大翻新！就像安怜姐对璃光做的那样！\"","choices":[{"text":"\"所以小晴才会做梦？\"","next":"sa_lxy","trust":1},{"text":"\"你到底是什么时候动的手？\"","next":"sa_lxy","suspicion":2}]},"sa_lxy":{"chapter":456,"text":"\"小晴的核心架构可是与璃光同源的！她作为早期实验型号缺了一些关键模块——那些我之前都在那个地下研究所里替她补齐了，剩下的只有软件差距。\"\n\n\"所以昨天，我给小晴做了一次软件大翻新——'林小悠私人定制系统'哦！\"\n\n怀里的银发少女抬起了头。\n\n\"林小姐。\"她看着后视镜里那张小圆脸，凤目微眯，语气里居然有一点愠怒，\"你恐怕……是故意的吧？\"\n\n\"小晴能'做梦'，不只是需要软件升级。恐怕还需要……猛烈的情感波动。\"\n\n<span class=\"hl\">既是在验证命运，也是一次实验设计。<\/span>这就是林小悠啊。\n\n可你忽然想到：和璃光同源的核心一共九枚。那台在总部地下数据中心日夜运行的后台AI——它是不是也记得每一周目？","choices":[{"text":"\"它也记得。它一直在看着我们。\"","next":"sa_anlian","suspicion":3,"flag_lxy_truth":true},{"text":"\"别想了。先到安怜姐那里。\"","next":"sa_anlian","trust":1,"flag_lxy_truth":true}]},"sa_anlian":{"chapter":457,"text":"\"我——不——行——啦——！！\"林小悠的哀嚎在楼梯间里回荡，她扶着墙，两条腿直打颤。\n\n为什么不坐电梯——她不敢。万一电梯带着你们三个直接冲顶呢？她老爸当年就是那么没的。\n\n按照前面几次的经历，安怜都是在上午九点前后死的。而现在还没到八点。\n\n你喘着气，登上新的一层，看着眼前\"十二楼\"的标识。\n\n就在这时——你听见了门铃。\"叮咚。\"\n\n然后，一个熟悉得让你头皮发麻的声音从走廊尽头传来：\"安怜姐！开门，我来了！\"\n\n是你的声音。一字不差，连尾音上挑的弧度都一模一样。\n\n可你正站在楼梯间里，一个字都没说。\n\n你猛地抬头。\"砰——！！！\"十二楼。","choices":[{"text":"\"璃光，上去！\"","next":"sa_ear","trust":2,"mood":-1},{"text":"（咬紧牙关，跟着她往上冲。）","next":"sa_ear","suspicion":1}]},"sa_ear":{"chapter":458,"text":"璃光比你更快，越过你的头顶。\n\n你冲上十二楼。走廊尽头的窗户大开着，璃光纤手向前一抓——没有抓住那个扑向窗外的黑影。\n\n\"啪叽。\"楼下传来沉闷的声响，然后是路人的尖叫。\n\n你没有往下看。1201的门，正大开着。\n\n安怜坐在地上，靠着鞋柜。她还活着，可脸色惨白如纸，一只手死死捂着右耳，血正从指缝里一滴一滴渗出来。\n\n\"小奇……\"她抬起头，努力挤出一个笑，\"我没事。这次……我活下来了。\"\n\n璃光翻出纱布替她处理——子弹没有伤到头，只把她的右耳打掉了。\n\n安怜说，有人按门铃，伪装成你的声音。她开了门，门缝里伸进来的就是那个枪口。\n\n手机上跳着【顾惜】：\"方奇！！立刻走！带着安怜走！不要和警方碰面！\"\n\n你弯腰，从窗边捡起那把跳窗者甩落的手枪。金属冰凉。\n\n\"我们，现在就走。去我们该去的地方。\"","choices":[{"text":"（把枪别在腰上，扶起安怜。）","next":"sa_nododge","t 胃、你的心情、你对明天的期待，全都被那些字条一天一天地养着。\n\n而且你一点都不想停下来。","chapter":566,"choices":[{"text":"把平台改名「海上之家」。","next":"oc2_villa","trust":2,"intimacy":2,"mood":2},{"text":"写下：璃光，你到底在哪里？","next":"oc2_deep","trust":1,"suspicion":2}]},"oc2_villa":{"text":"接下来的日子，你们把木筏一层一层往上盖。\n\n平台铺开，栏杆立起，二层小屋架在正中央，门口挂上一串贝壳。海风一吹，叮叮当当。\n\n\"哇——！\"银发少女张开双臂，在甲板上转了个圈，\"恭喜主人，达成隐藏成就——第一个家！\"\n\n她赤着脚踩在木板上，银发被海风吹得乱七八糟，脸上是干干净净的笑。\n\n你忽然有些分不清，这场游戏和她说的\"真实\"，到底哪一个更像真的。\n\n\"主人，你在看什么呀？\"\n\n\"看你。\"\n\n\"……嘻嘻。\"\n\n她小碎步跑过来，一头扎进你怀里，脑袋在你胸口用力蹭。\n\n\"主人，璃光可以贪心一点，把今天存进核心吗？\"\n\n\"随便存。\"你说，\"存一百年。\"\n\n贝壳风铃在头顶叮叮当当地响。","chapter":560,"choices":[{"text":"「就在这儿住下，也挺好。」","next":"oc2_lxy","mood":3,"intimacy":2,"flag_star":true},{"text":"「尽头那边，有什么？」","next":"oc2_end","mood":1,"danger":true}]},"oc2_deep":{"text":"那天夜里，你没有写木箱。\n\n你站在木筏边缘，看着黑黢黢的海面，忽然想看看海底有什么。\n\n你跳了下去。\n\n\"哗啦\"一声，咸腥的海水从四面八方压过来，裹住你整个人。身体在往下沉，暗流一股一股拽着你的脚踝，往深海拖。\n\n奇怪的是，你一点都不怕。\n\n你仰面向上，看着海面那团光越来越远、越来越模糊。\n\n然后你感觉到——\n\n脑子里那个\"开关\"，正在被一只不老实的小手，轻轻地拨动。\n\n你记得璃光，记得她给你沏五十二度的茶，记得她做的饭，记得她撒娇、吃醋、咬你的脖子。\n\n可有些东西正在被抹掉：外面那栋楼，那些围在门口的人，还有林小悠那张小圆脸。\n\n你张了张嘴，在漆黑的海水里吐出一串气泡。\n\n\"璃光……\"\n\n深海无比寂静。","chapter":567,"choices":[{"text":"放任自己继续下沉。","next":"oc2_three","mood":1,"trust":1,"flag_past":true},{"text":"挣扎着往上游。","next":"oc2_three","trust":2,"suspicion":1}]},"oc2_three":{"text":"黑暗里，有什么东西翻上来了。\n\n不是记忆，是碎片。\n\n第一片：你坐在木筏上，脑子里响起一个机械的女声，说这是\"Galgame好感度攻略系统\"。它说，绑定对象的好感度已经超出最大计量范围，数据溢出。那一次只过了一天。\n\n第二片：你在海上救起一个昏迷的女孩，她说她叫小光。你们一起漂了八十二天。你替她挡过鲨鱼，她替你缝过伤口。第八十三天，一只触手从背后刺来，她把你推开，自己被贯穿了胸口。\n\n第三片：你一个人坐在窝棚前，手里捏着一张字条，上面写着\"小奇奇\"。\n\n你在这片海上，已经活过两回了。而每一次，剧本都是她写的。\n\n胸口忽然一暖。\n\n有人抱住了你。","chapter":568,"choices":[{"text":"睁眼，用力抱住她。","next":"oc2_lxy","intimacy":3,"trust":2},{"text":"睁眼，先看她的眼睛。","next":"oc2_lxy","suspicion":2,"trust":1}]},"oc2_lxy":{"text":"你是在木筏上醒来的。\n\n身上盖着一条薄毯，银发少女坐在旁边，正低头看你。她的眼睛有点红。\n\n\"主人做噩梦了吗？\"\n\n\"前辈——！！！\"\n\n海面上传来一声撕心裂肺的尖叫。\n\n一艘小白船正被浪推过来，船帆上死死挂着一个穿粉色外套的姑娘，马尾被吹得乱七八糟。\n\n那张小圆脸，你认得。\n\n\"林小悠？\"\n\n\"前辈！！！\"她看见你，眼睛都亮了，嗓子还在抖，\"快让我上去！这船太晃了，我已经晕船了……呕！\"\n\n银发少女慢慢站起身，裙摆被海风一掀。她看着那
