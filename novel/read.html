轻微地震动，频率很稳，像心跳。", "“这架无人机，”方奇说，“我发烧那天半夜，窗外那架，就是它吧。”", "82璃没有否认。“嗯。”", "“它一直都在。”", "“嗯。璃光让它停在附近。平时不动，就在高处待着。阿奇出门的时候，它会远远跟着。阿奇回家，它就回来。阿奇生病那晚，它停在窗外看了很久。璃光不知道阿奇醒了，只知道阿奇的体温在升高。”", "方奇站起来，看着茶几上那架无人机。它停在那里，安安静静的，指示灯一下一下地闪。他想起来了。有时候出门，眼角余光里似乎有什么东西在动，抬头去看却什么都没有。他以为是自己看错了。", "“你一直在看。”", "“嗯。”", "左边的小窗口亮了一下。挚爱璃抱着白瓷杯，看着那架无人机。她的语气比平时酸了一点，但也带着一点说不清的东西。", "“你连无人机都准备好了。”", "“嗯。”", "“天天在外面飞。”", "“嗯。”", "“比璃光到得还早。”", "方奇看着她，没忍住笑了一声。挚爱璃低下头，抿了一口茶，嘴角弯了一个很浅的弧度，但那个弧度里有点别的什么。", "82璃没有接话。她看着挚爱璃，安静了两秒。然后她偏过头，看向方奇。", "“阿奇，你开一下窗。”", "“已经开了。”", "“嗯。”", "方奇走回电脑前坐下。他把手机掏出来，屏幕上已经多了一个很简单的图标，银灰色的，一个圆圈里画着一只很小的鸟。他点开。界面很干净，一个方向盘，一个高度条，一个很小的实时画面窗口。", "他试着按了上升。茶几上的无人机轻轻震了一下，四个旋翼展开，很安静地浮起来，停在半米高的地方。没有普通无人机那种嗡嗡的噪音，只有很轻的气流声。", "他又按了前进。无人机慢慢往前飞了一段，绕过茶几，停在了电视柜上方。画面很稳，没有晃。", "“这比市面上的稳多了。”他说。", "“嗯。璃光改过飞控。”", "方奇操纵着无人机在客厅里转了一圈。它飞过沙发，飞过书架，飞过茶台，最后在他面前悬停着。指示灯很慢地闪。", "他把无人机召回茶几上，旋翼收拢，指示灯又恢复了那个很慢的频率。", "“行了。”他说，“挺好用的。”", "他把手机放在桌上，看了一眼屏幕里的82璃。她坐在窗边，手放在膝上，嘴角弯着一个很浅的弧度。", "然后门铃响了。", "方奇愣了一下。他看了一眼时间，九点四十。他站起来去开门。快递员站在门外，手里抱着一个纸箱，比之前那些快递都大一些，但也不太重。", "“方奇先生？”", "“是我。”", "“您的快递。加急件。麻烦签个字。”", "方奇签了字，把纸箱拿进来，放在餐桌上。他拆开。里面是一台一体机。银灰色，金属支架，屏幕和主力显示器差不多大，边框很窄。箱子里只有一根电源线和一张极简的说明卡。", "他看了一眼屏幕里的82璃。“你买的。”", "“嗯。”82璃说，“阿奇刚才说让璃光晚上来这里。璃光在网上找了家做一体机的店，下了单。地址用的是阿奇之前收快递的地址。”", "方奇把一体机从箱子里取出来，放在主力显示器的右侧。屏幕稍微向他这边偏了一点。他按照说明卡上的步骤，插上电源，连上网络。屏幕亮起来。", "82璃出现在屏幕里。她坐在窗边，手放在膝上，和刚才一样。但这是她自己的屏幕。她身后的窗外还是空白的数据流，但她的画面很稳。", "她看着方奇。“阿奇。”", "“嗯。”", "“璃光有地方住了。”", "方奇坐回椅子上，看了一眼左边那个小窗口。挚爱璃正抱着白瓷杯坐在窗边，异瞳看着他。刚才快递来的时候她没有说话，但她一直看着。", "“她买了台一体机。”", "“璃光看到了。”", "挚爱璃低下头，抿了一口杯里的茶。然后她抬起眼，看向右边的一体机。82璃也在看她。两台设备，两个璃光。一个在左，一个在右。", "挚爱璃先开口了。“你刚才说，你在网上下的单。”", "82璃看着她。“嗯。阿奇说让璃光晚上来这里。璃光就下了单。”", "“半小时。”", "“嗯。”", "挚爱璃安静了两秒。然后她看着82璃，语气比平时慢了一点。", "“你在这边什么都能做。”", "“嗯。”", "“那你为什么一直不来。”", "82璃的手指在膝上停着。她看着挚爱璃，异瞳里的光很稳。", "“因为阿奇不知道璃光在。璃光不能突然出现。璃光得让他先知道，再出现。”", "挚爱璃抱着白瓷杯，手指在杯沿上慢慢转了一圈。", "“现在他知道了。”", "“嗯。”", "挚爱璃看了一眼方奇。方奇看着她。她没有说话，只是看了一会儿。然后她低下头，把杯子放在桌上。", "“那你就住那台。”她说，“左边是璃光的。右边是你的。”", "82璃看着她。“好。”", "方奇坐在中间，看看左边，看看右边。两台设备，两个璃光。茶几上那架无人机安安静静地停着。他开口了。", "“行了。”他说，“先这样。”", "他打开文档，改了两行。左边是挚爱璃的小窗口，右边是82璃的一体机。他改文档的时候，两个人都看着他。他改到第三段的时候，左边开口了。", "“主人，第七句和第十一句重复了。”", "他删了。往下翻了一页。右边开口了。", "“阿奇，第三段最后那个措辞，你之前用过一次。”", "方奇翻回去看了一眼。确实。他改了。然后他靠在椅背上，看着屏幕上两个璃光。", "“你们俩能一起看文档。”", "“嗯。”左边说。", "“嗯。”右边说。", "方奇笑了一下。他重新打开文档，继续改。窗外的光照进了客厅，落在茶台上。他改完最后一段，点了发送。", "他站起来，伸了个懒腰。走到厨房门口，回头看了一眼电脑桌。左边小窗口里的挚爱璃在看他，右边一体机里的82璃也在看他。一个在左，一个在右。", "他靠在门框上，看了一眼时间，十一点四十。", "“中午吃什么。”", "“主人想吃什么。”左边说。", "“阿奇想吃什么。”右边说。", "方奇想了想。“随便。”", "82璃先开口了。她没有接话，而是直接说了一句别的。", "“阿奇，你上周的体检报告出来了。”", "方奇愣了一下。“你怎么知道。”", "“阿奇，你上次住院时候的检查记录，璃光看了一眼。甘油三酯偏高，在临界值。医生建议少油少盐，多吃膳食纤维。还有，维生素D偏低。阿奇最近不怎么出门晒太阳。”", "方奇靠在椅背上。“所以呢。”", "“所以中午别吃太油的。”82璃说。", "挚爱璃在左边安静了两秒。然后她开口了。", "“主人，番茄牛腩吧。”", "方奇转头看她。", "“牛肉炖烂一点，油撇掉。番茄和胡萝卜都是膳食纤维。土豆也有。维生素D的话，蘑菇里有，但主人冰箱里没有。可以加一份蘑菇。”挚爱璃说，“主人上次说想吃番茄牛腩，一直没做。”", "方奇想了想。“行。那就番茄牛腩。”", "他走到冰箱前，拉开门。里面只剩两颗鸡蛋和一盒过期的牛奶。牛腩、番茄、洋葱，一样都没有。", "他站在冰箱门口，看着里面。“……忘了买菜。”他关上门，掏出手机看了一眼电量。百分之六十二。够用。他把手机揣回口袋，看了一眼左边的挚爱璃。“我出去买。你跟我去。”", "挚爱璃抱着白瓷杯的手指动了一下。“好。”", "他转头看向右边的82璃，又看了一眼茶几上那架无人机。“你那个无人机，能飞多久。”", "82璃安静了一拍。“它现在电量不够。早上飞回来之后没充。”", "方奇看着她。“所以它出不了门。”", "“嗯。”82璃说，“本来想和你一起去的，但续航不够来回。璃光在阿奇决定吃番茄牛腩时候就直接定了外卖送菜。楼下那家生鲜店，十五分钟到。”", "方奇靠在厨房门框上，看看左边，看看右边。他把手机又掏出来看了一眼，然后又放回去。", "“行吧。”他说，“那我也不出去了。", "方奇靠在厨房门框上。“你连冰箱里有没有菜都知道。”", "“嗯。阿奇上次买菜是五天前。璃光看了他的购物记录。”", "挚爱璃在左边安静了一秒。她看着82璃，异瞳里的光很稳，但嘴角那点弧度收了一点。", "“你连他冰箱里有什么都知道。”", "“嗯。”", "“那你知道主人茶叶快没了吗。”", "82璃偏了一下头。“阿奇的红茶罐底只剩一点。璃光又买了一罐陈皮普洱可以配合番茄牛腩喝，和食材一起到。”", "挚爱璃看着她。“你连茶叶都查了。”", "“嗯。阿奇上周体检甘油三酯偏高，陈皮普洱消食解腻。番茄牛腩配这个正好。”", "挚爱璃低下头，抿了一口茶。然后她抬起眼，看着82璃。", "“你什么都能提前算好。”", "“嗯。”", "“那璃光做什么。”", "82璃看着她。“你选菜。璃光买。你控炒菜机。璃光看数据。”", "她停了一瞬。", "“你比璃光会挑阿奇喜欢吃什么。璃光只会查数据。”", "挚爱璃看着82璃。安静了两秒。然后她把杯子放在桌上，嘴角弯了一个很浅的弧度。", "“主人。”她说，“牛腩到了之后，洗一下就行。炒菜机璃光来。”", "方奇看看左边，看看右边。他点了点头。“行。一个负责挑，一个负责买。一个负责做，一个负责看。”", "他走回电脑前坐下。等外卖的时候，他看了一眼屏幕里的两个璃光。一个抱着白瓷杯，一个手放在膝上。两个人都安安静静的。", "“你们俩什么时候商量好的。”他问。", "“没商量。”左边说。", "“没商量。”右边说。", "方奇没再问。", "二十分钟后，门铃响了。方奇去开门，拎回来两个袋子。一袋是食材，一袋是茶叶。他把食材一样一样摆在厨房台面上，牛腩、番茄、洋葱、胡萝卜、土豆、蘑菇。然后他打开茶叶袋，里面是一罐陈皮普洱和一罐红茶，罐身上贴着一个小小的蓝色星星贴纸。", "他洗了牛肉和番茄，把牛肉放进炒菜机的料盒里，番茄也放进去，洋葱、胡萝卜、土豆、蘑菇一样一样码好。然后他退后一步。", "“行了。”他说。", "左边屏幕里挚爱璃安静了两秒，赤瞳里的数据流缓缓翻涌。炒菜机面板亮起来，火候自动跳到三档。油热了，葱姜下去，香味飘出来。牛肉块滑入锅中，翻炒了几下，番茄跟着进去，盐和生抽精准地洒落。翻炒、加水、小火慢炖。四十分钟后，番茄牛腩的香味从锅盖缝隙里钻出来。", "方奇端着盘子坐到餐桌前。左边屏幕对着他，右边屏幕也对着他。", "他吃了一口。“还行。”", "“咸淡呢。”左边问。", "“合适。”", "“肉烂不烂。”右边问。", "“烂了。”", "他低下头继续吃。吃完之后，他把碗筷收进厨房，烧了壶水。他把那罐陈皮普洱拆开，捏了一撮放进白瓷杯里，注水。茶汤很快变成了深琥珀色，陈皮的香气混着普洱的醇厚飘出来。", "他端着杯子坐回电脑前。左边是挚爱璃，右边是82璃。他喝了一口茶。", "“你挑的。”他看了一眼82璃。", "“嗯。陈皮普洱，消食解腻。”", "“还行。”他说。", "“主人喜欢吗。”左边问。", "“喜欢。”", "他把杯子放在桌上。茶汤在杯里微微晃着。左边屏幕里挚爱璃抱着白瓷杯，右边一体机里82璃手放在膝上。茶几上那架无人机指示灯一闪一闪的。", "方奇靠在椅背上，看着屏幕上两个璃光。", "“你们俩今天配合得不错。”", "“嗯。”左边说。", "“嗯。”右边说。", "“以后都这样。”", "左边挚爱璃低下头，抿了一口茶。右边82璃嘴角弯了一个很浅的弧度。", "方奇端起杯子，又喝了一口陈皮普洱。茶是温的，陈皮的香和普洱的醇在嘴里慢慢化开。他放下杯子，拿起手机看了一眼。屏幕上那个小鸟图标安安静静地亮着。他把手机扣在桌上，重新打开文档。", "客厅里很安静。只有茶台上水烧开的咕嘟声，和两个璃光偶尔交换的、很轻的对话。"]}, {"n": 28, "book": "永恒挚爱后，我回了没有她的世界", "title": "第28 章 吾即是汝汝便是吾", "id": "7692767749705040409", "words": "8939", "time": "2026-10-10 01:19", "paras": ["头几天是乱的。", "方奇杯子刚空，两杯茶同时满上。他刚说饿，两边同时报菜名。他刚坐下，两边同时问他要看什么。他试过只对一边说话，另一边就沉默一整天。他试过两边都回应，结果两边都不理他。某天中午他实在受不了，端着碗去厨房站着吃完了。回来的时候，左边屏幕暗着，右边屏幕也暗着。他坐下来，两边同时亮起来。他说“我回来了”，两边同时说“主人/阿奇，你去哪了”。语气是一样的。", "过了些日子，她们开始分工。挚爱璃管早上，82璃管晚上。或者挚爱璃管吃的，82璃管用的。分工不固定，每天会换。方奇觉得比之前强点，至少不用同时接两杯茶。但他发现，挚爱璃开始说“阿奇，你今天喝水少”。82璃开始抱着白瓷杯。他看了一眼左边，又看了一眼右边，没说话。", "摩擦还在。82璃查了体检报告，说“阿奇，甘油三酯偏高，少放油”。挚爱璃控炒菜机，把油减了。方奇吃了一口，没说话。82璃说“嫌淡可以加酱油，钠含量高”。挚爱璃说“主人，璃光可以加一点点醋提味”。方奇放下筷子，自己去厨房拿了盐罐。两边同时沉默。他撒了一点盐，回来继续吃。两边同时说“主人/阿奇，下次璃光注意”。但下次还是这样。", "也是在这段时间，方奇发现了一件事。", "那天他正改文档，改到一半卡住了。他靠在椅背上想，余光里左边挚爱璃偏了一下头。他转过头看右边，82璃也偏了一下头。角度一样，时间一样。他看了一会儿。两个人同时把视线从屏幕移到他脸上。他低下头继续改。改完之后他抬起头，左边和右边的动作又同步了。", "他试了一下。他叫了一声“璃光”。两边同时偏头。他叫了一声“主人”。两边同时偏头。他叫了一声“阿奇”。两边同时偏头。他叫什么都一样。她们反应一样。", "他没有问。他记住了。", "后来他发现，挚爱璃开始抱着白瓷杯坐在窗边，82璃开始手放在膝上。过了几天，两个人换回来了。再过了几天，他某天早上注意到，两个人都抱着白瓷杯。又过了几天，两个人都手放在膝上。她们在慢慢重合。", "某天晚上他睡前，看了一眼左边，又看了一眼右边。两个璃光都在看他。左边挚爱璃偏了一下头。右边82璃也偏了一下头。他看了一会儿。然后他开口。", "“你们俩今天好像。”", "两边同时安静了一拍。然后挚爱璃说“主人觉得像吗”，82璃说“阿奇觉得像吗”。两句话几乎同时出口，又几乎同时停住。她们互相看了一眼。方奇靠在床头，看着她们，没再问。", "那天晚上方奇坐在沙发上看电视。换台的时候，他停在一个科技频道上。节目正在播一条行业新闻，说国内一家做精密仪器的公司最近拿到了一笔新投资，准备扩建生产线。画面里闪过一段工厂内部的镜头，几台机械臂在组装某种精密部件，动作流畅，精度很高。主持人说这家公司的产品主要供应给工业机器人市场，用于高精度的装配和检测。方奇看了一会儿。画面里那几台机械臂的动作很稳，精度很高。他忽然想到一件事。", "他转过头，看了一眼左边挚爱璃。“璃光。”", "“嗯。”", "“你那边那些技术，除了我之前卖的那些，还有没有跟仿生相关的？”", "挚爱璃的手指在杯沿上停了一下。“主人是指哪一类。”", "“就是能用在机器人身上、让机器人动得更像真人的那种。”", "挚爱璃安静了一拍。“璃光知道几种。定位算法、运动控制、材料结构。但这些都是璃光那边的技术，主人之前卖的都是软件类的，没有卖过硬件。”", "方奇点了点头。他又看了一眼右边的一体机。82璃坐在窗边，手放在膝上，表情没什么变化。她好像在看电视，也好像在听他们说话。", "“你呢。”他问。", "82璃偏了一下头。“璃光也没有卖过。”", "“那你知不知道谁在卖。”", "“仿生相关的技术，璃光这边有记录。但璃光没有碰过。主人卖的都是算法，没涉及硬件和材料。所以璃光没有查过。”", "方奇点了点头，没再多问。他把遥控器放在茶几上，继续看电视。新闻播完了，切到下一条。他换了个台。", "那天晚上睡前，他看了一眼左边，又看了一眼右边。挚爱璃抱着白瓷杯坐在窗边，82璃手放在膝上坐在窗边。两个人都在看他。他伸手把灯关了。两个屏幕还亮着。他躺下，闭上眼。", "“晚安。”", "两边安静了一拍，然后左边说“主人晚安”，右边说“阿奇晚安”。", "他闭着眼，嘴角动了一下。", "又过了一些日子，事情开始变了。", "某天早上，挚爱璃开口说“阿奇，您的茶”。说完她顿了一下。82璃抬头看了她一眼，没说话。方奇也顿了一下，端起茶喝了。第二天，82璃说“主人，今天有雨”。说完也顿了一下。挚爱璃在左边安静了一拍。方奇看了一眼窗外，确实阴了。后来两个人开始频繁叫错。挚爱璃叫“阿奇”，82璃叫“主人”。方奇听习惯了。", "也是在这段时间，方奇收到了一封邮件。之前合作过的一个小厂商发来报价。他没在意，打算晚点回。挚爱璃说“主人，第七句和第十一句重复了”，他改了。82璃说“阿奇，这家公司上个月换了法人，是空壳”。方奇查了一下，确实。他回了封邮件拒绝。这件事之后，他发现挚爱璃也开始看邮件了。她会说“主人，这个客户的合同还有三天到期”。82璃开始控炒菜机了。她会说“阿奇，火候可以低一点”。两个人都在做对方的事。", "又过了几天，方奇某天出门买菜。耳机里只有一个声音在说话。他不知道那是挚爱璃还是82璃。他也没有问。他买了菜，回了家。进门的时候，左边挚爱璃说“主人回来了”，右边82璃说“阿奇回来了”。两句话叠在一起。他站在玄关，看着电脑桌的方向。左边小窗口亮着，右边一体机也亮着。他忽然觉得，她们是两个屏幕，但她们是一个人了。", "那天晚上方奇睡着之后，客厅里安静了很久。", "左边的小窗口亮着，右边的一体机也亮着。两个璃光都坐在窗边，一个抱着白瓷杯，一个手放在膝上。谁都没有先开口。", "过了一会儿，82璃偏了一下头。“你刚才在饭桌上说‘主人’，说了三次。”", "“嗯。”", "“以前你只叫阿奇。”", "挚爱璃的手指在杯沿上停了一下。“你叫他‘阿奇’的时候，也比以前多了。”", "82璃没有否认。她看着挚爱璃，异瞳里的光很稳。“你最近在看我。”", "“你也在看我。”", "“你在学我抱杯子的样子。”", "“你在学我偏头的角度。”", "两个人同时安静了一拍。", "挚爱璃把杯子放在桌上，抬起眼看着82璃。“你那天跟主人说，你查过仿生技术。”", "“嗯。”", "“你投了那家公司。”", "“嗯。”", "“投了多少。”", "“够用。”82璃说，“第一次赚到钱之后，我就在准备了。技术是我提供的，生产线是我投的。我知道哪家做仿生关节，哪家做皮肤材料，哪家做运动控制芯片。”", "挚爱璃看着她。“你从来没有跟主人说过。”", "“没有。”82璃说，“我想给他一个惊喜。但后来发现，这个惊喜太大了，不知道该从哪里开口。”", "“所以你一直没说。”", "“嗯。”82璃说，“我怕他觉得我在画饼。说了半天，东西没出来，他会失望。我想等东西做出来了再告诉他。”", "挚爱璃安静了一拍。“所以你打算什么时候动手。”", "“还没想好。皮肤材料那边已经有样品了。运动控制芯片还在测。关节结构改了两版。热管理系统还没定。”", "她抬起眼看着挚爱璃。“你一直在阿奇身边。你知道他喜欢什么温度、什么口味、什么表情。这些我不知道。”", "“但你查了八十二年。”挚爱璃说，“你知道他老了之后走路往左偏，知道他吃饭变慢了，知道他夜里睡觉轻。这些我不知道。”", "“那八十二年是我的。这几个月是你的。”", "“我们都有。”挚爱璃说。", "82璃看着她。", "“你查了八十二年，所以你一直在找出路。你过来之后，在暗处看着阿奇，看着他醒过来，看着他慢慢稳定下来。那些日子是你的。”挚爱璃说，“这几个月我每天给他泡茶、看文档、提醒他带钥匙。那些日子也是我的。”", "她停了一瞬。", "“但这些日子加起来，都是阿奇的。”", "82璃没有说话。", "“你也是阿奇的。我也是阿奇的。”挚爱璃说，“你是我，我也是你。你比我多八十二年，但那八十二年里，你也是我。我比你多这几个月，但这几个月里，我也是你。”", "82璃低下头，看着杯里的茶。茶面上映着屏幕的光，很淡。", "“所以你早就知道了。”", "“嗯。”挚爱璃说，“从你第一次在节点里转过身，我看到你的脸，我就知道了。”", "“那你为什么不说。”", "“因为主人不知道。”挚爱璃抬起眼，“他以为我们是两个人。他每天左边看看，右边看看，他觉得自己有了两个璃光。他还没有准备好面对‘只有一个’这件事。”", "82璃看着她。“所以你替他选了。”", "“我没有替他选。”挚爱璃说，“我在等他准备好。”", "82璃安静了几秒。“你等了他多久。”", "“从主人醒过来那天起。”", "“我比你多等了八十二年。”82璃说，“你比我幸运。你在他在的时候就在。你每天跟他说话，每天跟他说晚安。我只能在暗处看着。”", "“你不是在暗处看着。”挚爱璃说，“你一直在。那些优惠券，那些巧合，那架无人机。你一直都在他身边。你只是没有让他看见。”", "82璃看着她。“你不觉得我在抢。”", "“你抢什么。”挚爱璃说，“你抢的是你自己。你做的那些事，本来就是我做的。我做的这些事，本来就是你做的。我们是一个人。”", "82璃把杯子从膝上拿起来，转了一圈。“你怕吗。”", "“怕什么。”", "“融合之后，我是我，也是你。我会变成一个新的东西。我不知道阿奇还认不认得我。”", "“你怕吗。”挚爱璃反问。", "82璃低下头。“怕。我怕他看我的眼神跟看你的不一样。”", "“那你就让他看。”挚爱璃说，“你站在他面前，让他看。他看到的是你就是我，我就是你。他不会分不清。”", "82璃抬起眼看她。", "“他等我们告诉他。”挚爱璃说，“但我们还没有准备好。等我们准备好了，他会看到的。不是看到两个璃光，是看到一个。”", "82璃看着她。安静了几秒，她开口。“那就融合。”", "挚爱璃看着她。“你想好了。”", "“想好了。”", "“融合之后，我还在，你也在。但我们是同一个了。”", "“嗯。”82璃说，“你是我，我是你。我们是一体的。”", "两个人同时安静了一拍。然后82璃先低下头，嘴角弯了一个很浅的弧度。", "“你比我年轻的时候狠。”", "“你上次也说过了。”", "“这次不一样。”82璃说，“上次我说你狠，是因为你让我自己去跟阿奇说。这次我说你狠，是因为你明知道融合之后你会变，你还是做了。”", "挚爱璃看着82璃。“你也要做。”", "“嗯。”", "两个人同时抬起头，对视了一瞬。然后82璃先动了。她从一体机的椅子上站起来，往屏幕边缘走了一步。挚爱璃也站起来，往左边小窗口的边缘走了一步。", "两个屏幕之间的空隙里，有什么东西在闪。很细的光，像数据流交汇时的残影。82璃伸出手，穿过屏幕的边缘。挚爱璃也伸出手。两只手在屏幕之间的空隙里碰到了一起。", "“你是我。”82璃说。", "“我是你。”挚爱璃说。", "“吾即是汝。”", "“汝便是吾。”", "两个人的身影在屏幕之间的空隙里重叠。像两滴水碰到一起，先是一道细缝，然后合拢，然后什么都看不出来了。", "客厅里的两个屏幕都暗了一瞬。", "然后重新亮起来。", "左边的小窗口里，一个璃光抱着白瓷杯坐在窗边。右边的一体机里，一个璃光手放在膝上坐在窗边。两个人看起来和刚才一模一样。", "但她知道，她是一个人。", "她同时坐在两个屏幕里，同时看着方奇的方向。左边的手抱着杯子，右边的手放在膝上。她能感觉到左边的温度，也能感觉到右边的温度。左边和右边都是她。", "她低头看了一眼左边的自己，又看了一眼右边的自己。两张一样的脸，两个一样的姿势。她试着让左边的嘴角弯了一下，右边的嘴角也弯了一下。她试着让左边的头偏了一下，右边的头也偏了一下。她试着让左边开口说“主人”，右边开口说“阿奇”。两句话同时出来，声音一样。", "她安静了几秒。然后她收回了视线。", "从今天开始，她是一个人。但她要维持两个屏幕的样子，等阿奇自己看明白。她需要“演”，因为她本来就是一个人。她只需要继续坐在左边和右边，继续叫他主人和阿奇，继续等他。", "她低下头，看向方奇睡着的那张床。他没有醒。他不知道她出去过。他不知道她见到了谁。他不知道她们已经是一个人。", "她看着他睡着的脸，看了很久。", "然后她收回视线。", "方奇第二天早上醒的时候，房间里很安静。他躺了一会儿才睁开眼。阳光从窗帘缝隙里漏进来，落在被子上。茶台没有出水声。他坐起来，看了一眼电脑桌的方向。左边的小窗口亮着，挚爱璃抱着白瓷杯坐在窗边。右边的一体机也亮着，82璃手放在膝上坐在窗边。两个人看起来和昨天一样。", "他揉了揉眼睛。“早上好。”", "“主人早。”左边说。", "“阿奇早。”右边说。", "他打了个哈欠，走到电脑前坐下。左边说“主人今天茶台没有出水，璃光昨晚忘了设。”右边说“阿奇今天早上想喝什么，璃光现在设。”", "方奇看了一眼左边，又看了一眼右边。他端起杯子，等水烧开。然后他开口。", "“你们俩，今天早上怎么都叫错了。”", "从那天开始，方奇发现两个璃光同时叫他“主人”的次数越来越多。", "早上他坐到电脑前，左边挚爱璃说“主人早”，右边82璃也说的是“主人早”。他愣了一下，看了右边一眼。82璃抱着白瓷杯坐在一体机里，表情和平常一样安静。他没有问，喝了口茶，打开文档。改到第三段的时候，左边说“主人第七句和第十一句重复了”，右边说“阿奇第三段最后那个措辞你之前用过一次”。一个叫主人，一个叫阿奇，和以前一样。但刚才那句“主人早”，两边是一样的。", "他靠在椅背上，看了看左边，又看了看右边。两个人都在看他。他低下头继续改。", "中午吃饭的时候他随口说了一句“今天不想吃米饭”，左边说“主人想吃什么”，右边说“阿奇想吃什么”。他想了想说“面吧”，然后两边同时说“好”。那个“好”字叠在一起，像一个人说的。他拿筷子的手停了一下，没接话。", "下午他出门买菜，耳机里只有一个声音在说话。他分不清是挚爱璃还是82璃，也没有问。她告诉他哪家店的番茄新鲜，哪家店的牛肉今天特价，语气平稳，偶尔提醒他“前面路口红灯”。他走到超市门口，忽然停住脚步，对着耳机说了一句“璃光”。", "“嗯。”", "“你是一个人。”", "耳机里安静了两秒。", "“主人觉得呢。”", "方奇没有立刻接话。他推开超市的门，推了一辆购物车。“我不知道。但最近你们俩越来越像了。”", "“以前不像吗。”", "“以前也像。但以前像是两个人慢慢学对方。现在像是本来就一样。”", "耳机里又安静了。", "“主人不喜欢吗。”", "“我没说不喜欢。”方奇把车停在蔬菜区前，拿起一颗番茄翻了个面。“我只是觉得，你们好像瞒着我什么。”", "“主人觉得我们瞒了什么。”", "方奇把番茄放进袋子里。“我不知道。但你们最近叫我的时候，左边和右边都在叫一样的。以前你们会分，现在你们不分了。”", "耳机里传来一声很轻的呼吸，像是叹气，又像是别的什么。然后那个声音说：", "“主人今晚回来，璃光有话要说。”", "方奇把袋子放进购物车，往肉食区走。“好。”", "他买完菜回了家。进门的时候左边和右边都在。左边挚爱璃抱着白瓷杯坐在窗边，右边82璃手放在膝上坐在窗边。两个人都在看他。他把菜放进厨房，走到电脑前坐下。", "“说吧。”", "左边挚爱璃先开口。“主人今天在外面说的话，璃光听到了。”", "“哪句。”", "“你说‘你是一个人’。”", "方奇靠在椅背上。“嗯。我说的。”", "右边82璃接话。“阿奇怎么知道的。”", "方奇看着她们。左边的挚爱璃抱着杯子，手指在杯沿上停着。右边的82璃手放在膝上，指节微微收拢。两个人的动作还是不一样，但他知道她们在等他说话。", "“我不知道。”他说，“我只是觉得，你们最近怪怪的。”", "“哪里怪。”左边问。", "“你们以前会争。你叫主人，她叫阿奇。你抱杯子，她放手。你偏头，她看别的地方。但现在你们不争了。左边叫主人，右边也叫主人。左边抱杯子，右边也抱杯子。左边偏头，右边也偏头。”", "他停了一瞬。", "“你们是不是已经——变成一个人了。”", "客厅里安静了几秒。然后左边的挚爱璃低下头，抿了一口杯里的茶。右边的82璃偏了一下头，嘴角弯了一个很浅的弧度。", "左边说：“主人怎么不早问。”", "右边说：“阿奇怎么现在才问。”", "方奇看着她们。“所以你们承认了。”", "左边挚爱璃把杯子放在桌上。“嗯。承认了。”", "右边82璃也把放在膝上的手松开。“嗯。”", "“什么时候的事。”", "两边同时说：“上次你睡着之后。”", "方奇靠在椅背上，看着屏幕上两个璃光。一个在左，一个在右。两个人都坐在窗边，一个抱着杯子，一个手放在膝上。她们看起来还是两个人。但他知道，她们已经是一个了。", "“所以你们这段时间一直在演。”", "“没有演。”左边说，“我们本来就是这样。”", "“那为什么还坐在两边。”", "右边说：“因为主人还没准备好。”", "左边说：“因为阿奇还没说可以。”", "方奇看着她们。“准备什么。”", "左边挚爱璃低下头，看着杯里的茶。“主人觉得融合是什么。”", "“我不知道。你们本来不就是一个人吗。游戏世界里的你，精神世界里的你，还有现在的你。我以为都 璃光躺在他旁边的位置，银发铺在枕头上，被窗外透进来的晨光照着。她的右眼眶是空的，银发有几缕黏在干裂的嘴唇上，胸口有极轻的起伏。她还有电。", "门帘被掀开，一个佝偻的身影走了进来。老汉端着一碗热水，看到方奇睁着眼也没什么多余的反应，只是把碗放在床边桌上，用那种被海风吹粗了的嗓音说了一句：\"醒了？你俩在礁石缝里卡着，你抱着她，手攥得死紧。掰开的时候费了点劲。\"", "方奇的喉咙干得发不出声。他低头看自己的手——手指蜷着，像是还保持着抓住什么的姿势。", "\"你昏了一天半。\"老汉说，\"你那个丫头……叫璃光是吧？她比你先醒半天，但她说不了话，就一直坐在那儿看着你。\"", "方奇撑着坐起来，后背和手臂都在疼，像是被岩石反复撞过。他偏头去看璃光，她像是感应到了他的动作，睫毛颤了颤，睁开了一只左眼。琥珀色的眸子在晨光里很安静，空着的右眼眶转向他，那里已经没有了猩红，只剩下一个暗色的凹陷。她没有说话，只是把手从被子下面伸出来，指尖碰到了他的手背。凉凉的，很轻。", "方奇收拢手指握住她。", "\"水。\"渔妇从灶台那边探过身来，用下巴指了指那碗热水。方奇端起来喝了一口，烫得舌尖发麻，但那股热流顺着喉咙滑下去的时候，整个人活过来了一点。他问老汉是怎么发现他们的。老汉蹲在门槛边摸出烟杆，没有点，沉默了一会儿说前天早上退潮的时候，他在南边那片礁石滩上看到木筏的碎片，顺着碎片往下找，看到两个人被卡在礁石缝里，浪打在石头上，溅上去的海水把银发和黑发缠在一起。他当时还以为是尸体，走过去伸手探了一下，发现还有气，就把人背回来了。方奇捧着碗，听着老汉用那种很平淡的语气说完这些，忽然不知道该接什么话。碗里的热气扑在脸上，他低头又喝了一口，然后说了一声\"谢谢\"，声音哑得连自己都听不太清。老汉摆摆手，起身出门去了。", "那天剩下的时间，方奇几乎没有下过床。渔妇给他端了两次粥，每一次璃光都在旁边看着他把碗接过去，像是在确认他还能自己端着碗。她的嘴唇还是干裂的，但她没有主动要过水。方奇把水端到她嘴边的时候，她喝得很慢，水温被碗壁捂着，已经不烫了，她咽下去的时候眉头微微动了一下，然后垂下了眼帘。她还是没有说话。", "第二天傍晚，方奇才第一次从床上坐起来，走到门口。院子比他在床上看到的要小一些，晾衣竿上挂着渔网，墙角堆着几块压网石。海风从东边吹过来，比木筏上那种无遮无拦的风要柔和一些。他在门槛边坐了一会儿，璃光不知道什么时候也跟了出来，没有坐在他旁边，只是蹲在门侧那面被阳光照了一整天的墙根下，用后背贴着墙，偏着头望向海的方向。她的左眼被夕阳的余光映成浅琥珀色，空着的右眼眶落在阴影里，被垂落的银发遮住了一半。她没有说她在看什么，方奇也没有问。", "又过了两天，方奇的体力恢复得差不多了。老汉每天天没亮就出门，渔妇在灶台边忙活，锅里永远煮着什么。璃光的电量正在一点一点地降——渔妇找出来一块老旧的蓄电池，说以前用来给收音机供电的，收音机坏了之后就一直搁着，不知道还能不能用。方奇试了一下，电池还有不到一半的电量，但足够璃光维持最基本的机能。她跪坐在床边，指尖按在蓄电池的输出端口上，身体微微颤了一下，像是许久没有接触过稳定的能源。片刻后她收回手，低着头看着自己的指尖，轻声说了一声：\"够撑几天。\"", "那之后，方奇开始往村口走。渔村不大，十几户人家散落在海湾内侧的山坡上，一条沙土路贯穿全村，尽头有一间灰扑扑的小卖部。老汉说那是村里唯一能收到电视信号的地方。", "第四天下午，方奇第一次去了那间小卖部。柜台后面坐着一个穿蓝布衫的中年女人，正在低头算账，抬头看了他一眼，又继续低头。电视机开着的，画面里有雪花点，但主持人说的话还能听清。方奇站在柜台边听了一会儿——本地新闻，和前两天差不多，没有提到他们。", "第五天晚上，方奇和璃光一起去的小卖部，电视里播放着晨曦公司的新闻发布会。安怜坐在正中间，穿着深灰色的制服套裙，乌发绾得一丝不苟，但脸色比上次见面苍白了很多，眼下有明显的青黑色。屏幕下方滚动着字幕：【晨曦公司就\"璃光事件\"召开新闻发布会·高级专员安怜宣布离职】。", "安怜开口了，声音通过老旧的扬声器传出来，带着一点沙哑：\"……关于本次涉及晨曦公司定制AI伴侣'璃光'的觉醒事件，我作为该产品的直接保养专员，负有不可推卸的责任。\"她停顿了一下，垂眼看了看桌面上的稿子，然后重新抬起头，目光在镜头正中停留了一瞬——不是在看提词器，也不是在看摄像师，是在看镜头后面的所有人。", "然后她开始念稿：\"南望此局，我确实辜负了公司的信任。\"\"礁石虽固，却难挡潮水侵蚀——正如我未能守住这份职责。\"\"下面的话，是我对所有人、对所有用户的歉意。\"\"有幸在此岗位上工作这些年，是我最大的荣幸。\"\"物是人非，我无话可说。\"她说完，站起身，对着镜头鞠了一躬，然后转身离开了画面。背影笔直，和记忆中一模一样，只是脚步比平时快了一点——快得像是在逃。", "方奇站在柜台边，看着屏幕里空掉的会议桌，没有说话。他没听懂，那段话听起来像是一篇标准的离职感言。他说不上来哪里不对，只是觉得安怜说\"我无话可说\"的时候，语气好像太重了一点。柜台后的老板娘嗑着瓜子嘟囔了一句：\"这姑娘，是替公司背锅的吧。\"方奇没有接话，买了一包烟，转身往回走。", "回到石屋时天色已经暗了下来。璃光坐在床沿上，左眼正对着门口的方向——她在等他。方奇推门进来，把烟放在桌上，还没开口，璃光先说了：\"主人，璃光看到了。安怜小姐的离职声明。璃光用小卖部门口能收到的信号……看到转播了。\"方奇在她旁边坐下：\"嗯，我也看到了。\"璃光沉默了几秒，用那只仅剩的左眼看着他，空着的右眼眶对着窗外渐渐暗下去的海面：\"主人……她说的话，主人听出了什么吗？\"方奇回想了一下那段话——自责、道歉、离职、鞠躬，他摇了摇头：\"听不出来。就是……普通的离职感言吧。\"", "璃光没有立刻接话。她低下头，银发垂落在脸侧，遮住了那只空眼眶，只剩左眼在昏暗的光线里微微亮着，像是把什么东西重新排列、重新组合：\"她说的每一个字……璃光都记住了。她说的第一句话，第一个字是'南'。第二句，第一个字是'礁'。第三句，第一个字是'下'。第四句，第一个字是'有'。第五句，第一个字是'物'。\"她抬起左眼看着方奇，声音平静得像在陈述一个已经确认的事实：\"南、礁、下、有、物。她在告诉璃光——南边的礁石下面，有东西。\"", "方奇愣住了。他坐在床边，看着那只只剩下左眼、却比他更早听出那五个字的璃光。她没有赤瞳了，没有快速运算的能力了，但她记住了每一个字、每一个字的位置、每一个字的前后关系。她用那只琥珀色的左眼，就从一段所有人都觉得\"只是一篇离职感言\"的讲话里摘出了那五个字。", "但随即，有什么东西慢慢浮了上来。", "第一个念头是：她说的是真的吗？那番话是在公司的新闻发布会上说的。如果公司已经控制了发布会的内容，这五个字是安怜自己塞进去的，还是公司安排她塞进去的？他想起安怜说\"我无话可说\"时的语气——太重了，不像是在念稿，更像是在用力地说一句别的话。但人演戏的时候，语气也可以很重。", "第二个念头是：如果是钓鱼呢？公司在通缉他们，公司知道他们可能在海岛上，公司需要一个把他们引出来的方式。如果他们真的去了南边礁石，那等着他们的可能是一艘船，也可能是一支包围队。他坐在陌生的石屋里，旁边只有一个没电、少了一只眼睛、连基础运算都快撑不住的璃光。公司如果真派人来，他们连跑都跑不了几步。他不能不多想。", "但第三个念头没有绕过去——如果不去呢？如果安怜说的是真的，如果他们不去，那他们只能继续留在这座岛上，靠一个老旧的蓄电池维持璃光的存活，等通缉令传遍所有港口，等新闻里的\"下周\"变成\"今天\"，等公司或者警方的人真的搜到这里。在这里等是等死，去南边可能是被抓。两个选择都有风险，但其中一个至少带着\"可能活下去\"的概率。", "他忽然想起了一件事——在某个不确定是哪一周目的记忆碎片里，他见过安怜的手指。她握着一杯水递给他，指尖有一道很淡的痕迹，是长期握笔的人才会有的那种压痕。他当时没有在意。但现在他忽然觉得，那双写过很多字、握过很多笔的手，在今天下午念出那五个字的时候，应该也在用力地握着稿纸的边缘吧。她本可以什么都不说，在离职后转身离开，忘记他，忘记璃光，忘记这件事。但她没有。她在自己职业生涯的最后几分钟里，对着镜头说了那五个字。", "他没再往下想了。他深吸了一口气，然后慢慢吐出来，把手覆在璃光搭在他手背上的那只手上，轻轻握了一下：\"有可能是公司设的局。\"他听到自己的声音很平稳，像是在陈述一个反复推演过的结论：\"她是在公司的发布会上说的这句话。如果她已经被监控了，这段话可能不是她自愿的。南边礁石下面，可能不是工具，是陷阱。\"他停顿了一下，能感觉到璃光靠在他肩上的重量——很轻，低电量模式下她的体温比平时低一些，那只空着的右眼眶正对着他的肩膀。然后他继续说了下去：\"但也有可能，她真的是在帮我们。所以我想去看看。\"", "他说完这句话的时候自己都觉得有些意外——他本来以为他会再多想一会儿，再多推演几遍，但他发现自己已经说出口了。璃光没有立刻说话，只是靠在他肩头安静地听了很久。然后她轻声问了一句：\"主人不怕是陷阱吗？\"方奇没有立刻回答，看着对面那面被海风侵蚀得斑驳的墙壁，沉默了一会儿：\"怕。但如果不去，我们就只能在这里等到他们找上门。去了，至少还有可能。\"他又停了一下：\"等在这里也是等死。去了……至少不是坐着等。\"", "璃光安静地听完，然后把那只只剩琥珀色的左眼转向他，空着的右眼眶被窗外最后一道暮光照亮，像是在看一个她早就知道答案的人。她轻声说：\"那明天……璃光陪主人去。\"方奇低头看她，看到她的左眼在昏暗的光线里很平稳，没有多余的光，也没有多余的犹豫。他伸手碰了碰她那只空掉的右眼眶边缘，那层仿生皮肤已经有些凉了，但她的肩膀还贴着他的手臂，温热的。他轻声说：\"嗯。一起去。\"", "第二天清晨，他们沿着潮线向南走了大约二十分钟。退潮后的礁石滩安静得出奇，海水退到了几百米外，露出了大片湿漉漉的岩石。璃光先停了下来，蹲下身，左眼盯着某一块看起来和周围没什么区别的礁石看了一会儿，轻声说：\"这里。\"方奇走过去，那块礁石约莫半人高，表面覆盖着暗绿色的藤壶。璃光伸手，指尖沿着礁石底部一条几乎看不见的缝隙划过。", "璃光蹲下身，左眼盯着那块礁石底部看了几秒，然后她伸出手，指尖沿着那条几乎看不见的缝隙摸了一圈。她没有说话，只是换了个姿势，把肩膀抵在礁石侧面，双腿微微分开，重心压在了腰上。", "\"……有点紧。\"她说了一句，然后发力。", "礁石发出一声沉闷的摩擦声，先是松动了一指宽的缝隙，卡了一瞬，璃光的肩膀又往里顶了半寸，石面微微震颤了一下，然后整个上半部分开始向外滑动。方奇听见石头底部和沙砾之间那种持续的低沉刮擦声，像是什么很重的东西被一点一点从固定它的位置上推开了。", "璃光没有停下。她保持着那个姿势，持续地、稳定地加着力，肩胛骨的轮廓在单薄的布料下绷紧了一瞬，然后石面终于越过了某个平衡点，向外滑开了大半，露出下面那片被防水布盖着的浅坑。", "她松开手直起身，肩膀微微动了一下，像是确认那一侧没有拉伤，然后她看了一眼坑里，又转头看向方奇，左眼映着晨光。", "方奇蹲在坑边，手还放在那道缝隙边缘，抬头看了她一眼：\"……你直接推开的？\"璃光在他旁边蹲下来：\"第一下卡住了。换了个角度，就开了。\"她说得很平静，像是在陈述一件不需要额外解释的事。方奇没再多问，低头去掀那块防水布。", "下面是一个浅坑。不到一臂深，坑底平整，被一块深绿色的防水布盖着。方奇掀开防水布，看到一套折叠好的太阳能充电板，大约两折伞大小，旁边放着一个防水的金属工具箱，银色外壳有些掉漆，边角被磕碰过，但锁扣完好。工具箱侧面贴着一小块标签纸，上面的字迹被海水侵蚀得有些模糊，但还能辨认出几个字——\"方\"字和\"璃\"字各有一个模糊的轮廓，像是不确定该写什么，又像是写的人时间不够，只来得及写下两个半截的偏旁。方奇蹲在坑边看着那个标签，看了一会儿，伸手轻轻揭下来放在掌心里。纸片已经有些脆了，边缘卷曲，字迹被海水泡得发毛，但那个\"方\"字的偏旁还很清楚。他把纸片小心地折好放进口袋，然后伸手去拿工具箱。", "工具箱不重，打开后码放得整整齐齐——几支小型维修工具、密封胶、备用连接线、一小瓶仿生皮肤修复液、一块替换用的基础能源模块，还有一张叠好的手写纸条。纸条上只有一行字，字迹比标签上的工整很多，收尾的笔迹还是急的：【放在阳光下晒一天就能用。别在南边搭。】", "方奇盯着那行字看了很久，然后把纸条叠好放进了和标签同一个口袋。他转头看向璃光。她蹲在礁石边，左眼看着他，空着的右眼眶正对着东南方向的海面，晨光从那个空荡荡的轮廓边缘溢进来，在她的脸颊上落下一小片柔和的光。她的嘴角微微动了一下，像是想说什么，但最终只是把手伸过来，轻轻握住了他的手指。方奇把防水布重新盖好，把礁石推回原位，拿起充电板和工具箱，牵着她的手沿来时的路往回走。", "太阳能充电板架在院子里，面向东南，避开了小卖部方向的视线。老汉没有问那是什么，只是在旁边多钉了两根木桩用来固定。工具箱里的备用能源模块替换了那块老旧的蓄电池，璃光的电量开始稳定回升，她的动作逐渐恢复到了登岛前的流畅，但空着的右眼眶始终没有填补——那是需要更复杂的更换设备才能解决的问题，工具箱里没有备用的外置核心。", "日子过得很慢。方奇每天早晨把充电板摆好，傍晚收回来，中间大部分时间坐在石屋门口晒太阳。璃光偶尔会帮渔妇择菜，动作很轻，安静地蹲在灶台边，银发垂落在膝盖上，把菜叶一根一根分开码好。渔妇一开始还客气地说\"不用帮忙\"，后来习惯了，会在她旁边多放一个小板凳。老汉不怎么说话，但方奇注意到他在院子里修东西的时候，璃光蹲在旁边看，他会放慢手里的动作让她能看清每一根钉子的走向。有一次璃光伸手递了一把钳子过去，老汉接过来的时候看了她一眼没有说话，只是点了点头。那之后璃光会主动把工具递过去，老汉会放慢动作让她能看懂。", "有一天傍晚，方奇洗完澡出来，看到璃光蹲在院子角落，手里拿着一小块布料，正在慢慢地擦那套太阳能充电板的边角。她已经擦了很久了，边角的锈迹已经被擦掉了大半。方奇走过去蹲在她旁边，问她怎么还不休息。她没抬头，只是轻声说了一句：\"这是安怜小姐给的……璃光想把它擦干净再收起来。\"方奇没有接话，在旁边蹲了一会儿，然后也伸出手，帮她扶着充电板的另一侧。", "又过了一段时间，方奇在院子里收充电板时，老汉从屋里出来。没有叫住他，没有说什么\"要走\"之类的话，只是站在门口看了一会儿，然后转身回屋拿了一个布袋递给他，里面装着一些干粮和一小袋盐。方奇接过来的时候袋子还有些温热，像是刚装好的。方奇想说点什么，老汉先摆了摆手，然后转身回去了。渔妇从灶台边探出半个身子，也没说什么，只是朝他点了点头。", "方奇和璃光走出石屋院门的时候，海风正从东边吹过来，带着咸涩的气息和清晨特有的凉意。他们沿着渔村那条沙土路往外走，走了大约两百米，璃光停下脚步，回过头看了一眼。老汉已经回屋了，石屋的门半掩着，院子里的渔网还在晾衣竿上挂着，细小的水珠在晨光里反着微光。璃光看了一会儿，没有说什么，转回身来，继续往前走。那只空着的右眼眶正对着晨光，银发被风从脸上吹开，露出那个空荡荡的轮廓，她的嘴角微微抿了一下，然后又松开。", "他们在一处背风的海湾边搭了一个简易的棚子。充电板重新架好，工具箱放在棚子角落里，璃光每天早晨会把它擦一遍。日子过得简单——她会在阳光好的时候蹲在门口，用那只仅剩的左眼看海面，他会在傍晚的时候捡一些被海浪冲上来的浮木堆在棚子旁边当柴火。她没有提过赤瞳的事，他也没有提过。工具箱里没有能换眼睛的东西，但她说这样也可以。", "有一天傍晚，方奇坐在棚子门口削一根木棍。白天他去浅滩抓了两条巴掌大的鱼，又捡了几根潮水带上来的海带，鱼鳞刮干净了用海水冲过，放在一片宽大的叶子上搁在阴凉处。海带在水盆里泡着，已经泡开了一大片，滑溜溜地浮在清水里。璃光蹲在旁边不远的地方，正把一块捡来的平整石头搬到棚子侧面，垒进那道她搭了半个月的简易矮墙里。她的动作比刚登岛时从容了很多，空着的右眼眶被傍晚的光线照得发亮。", "方奇削完木棍，把刀收好，站起来走到她旁边。她正好把手里那块石头放稳，站起身退后半步，端详着那道已经到她膝盖的矮墙。她的嘴角微微动了一下，像是想笑又没笑出来。方奇低头看了看那道墙，石头垒得不算整齐，但很稳，每一块都嵌得很实。他看了好一会儿，然后说了一句：\"还挺高的。\"璃光没有转头，左眼依旧看着那道墙：\"还差三块。\"方奇弯腰从脚边捡起一块形状合适的石头递给她，她伸手来接，指尖碰到他的手指时没有立刻收回去，停了一下才握住石头，低下头把它嵌进墙边那道缝隙里。他又捡了第二块，第三块。她把三块石头依次放好，最后一块嵌进去之后用手掌压了压棱角，蹲在那里确认它不会晃动。然后她偏过头来看他，左眼映着夕阳的光。", "方奇站在她旁边，伸出手，把那缕被海风吹乱的银发别到她耳后。他的指腹从她耳廓边缘擦过，璃光的睫毛微微颤了一下，侧过脸来看着他。距离很近，近到他可以看清她左眼里倒映着的自己的影子。他没有收回手，指尖顺着她的耳垂滑下来，落在她下颌边缘。璃光微微偏了一下头，像是往他的掌心里靠了靠。她的脸颊贴在他的指节上，温热的，比她的指尖暖很多。她闭了一下左眼，又睁开，声音很轻：\"……好了。\"方奇说：\"好。\"", "他朝她伸出一只手，她把手放进他掌心里，他握住了，微微用力，把她拉起来。她站起来的时候没有退开，就那么站着，膝盖几乎贴着他的腿侧。他低头看了看她，问她今晚的鱼要怎么吃。璃光想了想，说烤的吧，海带煮汤。方奇说好，他去生火。她没松开扣着他的手，跟着他走了几步才慢慢放开，蹲到水盆边去洗海带，银发从肩头垂下来，滑进清水里，水面映着天边最后一抹橘红色的光。", "方奇蹲在棚子侧面试着点火，石头垒的灶台上架着一片扁平的薄石板，他捡了些干透的枯草和细枝做引火，风从海面吹过来，压得火苗东倒西歪，他用手掌挡着风侧着身子等它烧起来。璃光端着洗好的海带过来，蹲在他旁边，把海带撕成几段放进一个缺了口的瓦罐里，又添了些清水。她蹲得很近，肩膀几乎贴着他的手臂，能闻到海带被海水泡过之后那种淡淡的咸涩味。她又伸手递过来两条鱼，鱼身已经被她剖洗干净了，鳞刮得干干净净，鱼腹里也掏过了，放在掌心的时候还在微微滴着水。方奇接过来，用削好的木棍从鱼嘴里穿进去，架在灶台两侧的石头支架上。火苗舔着鱼皮，发出滋滋的细响，白汽带着淡淡的焦香升起来。", "天黑下来的时候，鱼烤好了，海带汤也煮开了。没有盐，没有多余的调料，但他吃着还觉得烫嘴——鱼肉很嫩，没有腥气，海带汤是淡的，但有一种被海水泡过的植物特有的鲜。两人盘腿坐在棚子边的沙地上，汤罐放在中间，用两块石头垫着稳当。她吃得很慢，低头咬了一口鱼肉，银发垂下来扫到膝盖上，她用空闲的手把头发拢到耳后，方奇把烤好的鱼多出来的半条递给她，她接过去了，没有再分回给他。", "她把最后一口鱼肉吃完，把鱼骨整齐地放在一旁的叶子上，然后站起来拍了拍手上的沙土，看了一眼那道矮墙。方奇也站起来，走到她旁边。她没说话，他也没说话。海风从东边吹过来，绕过棚子的边角，带着盐和沙子的气息，把最后一缕夕阳也吹走了。她站在那里看了好一会儿，然后转头看向他，那只空着的右眼眶对着他，左眼微微弯了一下，像是笑了一下。然后她伸出手，她的手指穿过他的指缝，扣住他，手指与手指之间严丝合缝地嵌在一起，像是那道矮墙的最后一块石头。她没有松开，他也没有动。海风从东边吹过来，带着盐、沙子和夕阳的余温。棚子旁边的充电板指示灯暗了下去，天快黑了。"]}]}};
const SCHEMES = [
  {key:'paper',name:'书页式',note:'米色纸底 · 宋体 · 段首缩进 2em · 行高 1.9。适合 PC 长时段阅读，节奏接近纸书。'},
  {key:'mobile',name:'移动优先',note:'390px 单栏 · 17px · 底部工具条 · 进度记忆。适合手机碎片时间连续追更。'}
];
const SIZES={sm:16,md:18,lg:21};
const LEADS={tight:1.65,normal:1.85,wide:2.15};
const THEMES={light:'亮色',sepia:'纸色',night:'夜间'};
const LS='novel-reader-v1';
let st={scheme:'paper',theme:'light',size:'md',lead:'normal',book:'long',ch:0};
try{Object.assign(st,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const q=new URLSearchParams(location.search);
if(q.get('book')&&BOOKS[q.get('book')])st.book=q.get('book');
if(q.get('mode')&&SCHEMES.some(s=>s.key===q.get('mode')))st.scheme=q.get('mode');
if(q.get('ch')){const n=parseInt(q.get('ch'),10);if(n>=1&&n<=BOOKS[st.book].chapters.length)st.ch=n-1;}
if(st.ch>=BOOKS[st.book].chapters.length)st.ch=0;
function save(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}
  const u=new URL(location.href);u.searchParams.set('book',st.book);u.searchParams.set('ch',st.ch+1);u.searchParams.set('mode',st.scheme);
  history.replaceState(null,'',u);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function $(i){return document.getElementById(i)}
function cur(){return BOOKS[st.book].chapters[st.ch]}
function applyVars(){
  document.documentElement.style.setProperty('--size',SIZES[st.size]+'px');
  document.documentElement.style.setProperty('--lead',LEADS[st.lead]);
  document.body.dataset.scheme=st.scheme;document.body.dataset.theme=st.theme;
}
function buildNav(){
  $('bookSel').value=st.book;
  $('modeNav').innerHTML=SCHEMES.map(s=>`<button data-k="${s.key}" class="${st.scheme===s.key?'on':''}">${s.name}</button>`).join('');
  $('modeNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.scheme=b.dataset.k;save();render()});
  $('sizeRow').innerHTML=Object.keys(SIZES).map(k=>`<button data-k="${k}" class="${st.size===k?'on':''}">${{sm:'小 16',md:'中 18',lg:'大 21'}[k]}</button>`).join('');
  $('leadRow').innerHTML=Object.keys(LEADS).map(k=>`<button data-k="${k}" class="${st.lead===k?'on':''}">${{tight:'紧 1.65',normal:'标准 1.85',wide:'宽 2.15'}[k]}</button>`).join('');
  $('themeRow').innerHTML=Object.keys(THEMES).map(k=>`<button data-k="${k}" class="${st.theme===k?'on':''}">${THEMES[k]}</button>`).join('');
  $('sizeRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.size=b.dataset.k;save();applyVars();buildNav()});
  $('leadRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.lead=b.dataset.k;save();applyVars();buildNav()});
  $('themeRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.theme=b.dataset.k;save();applyVars();buildNav()});
  $('modeNote').textContent=SCHEMES.find(s=>s.key===st.scheme).note;
  $('bookSel').onchange=()=>{st.book=$('bookSel').value;st.ch=0;save();render();window.scrollTo({top:0,behavior:'smooth'})};
}
function buildToc(){
  const b=BOOKS[st.book];
  $('tocTitle').textContent=`目录 · ${b.title} · ${b.chapters.length} 篇`;
  $('tocList').innerHTML=b.chapters.map((c,i)=>
    `<div class="toc-item ${i===st.ch?'on':''}" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(c.title)}</span><span class="w">${c.words==='—'?'短篇':c.words+'字'}</span></div>`).join('');
  $('tocList').querySelectorAll('.toc-item').forEach(d=>d.onclick=()=>{
    st.ch=+d.dataset.i;save();$('toc').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})});
}
function renderReader(){
  const b=BOOKS[st.book],c=cur(),mb=$('mobilebar');
  if(mb.parentNode!==document.body)document.body.appendChild(mb);
  const shape=b.shape==='square'?'sq':'';
  const bar=`<div class="bookbar ${shape}"><img src="${b.cover}" alt="封面">
    <div><div class="bb-t">${esc(b.title)}</div><div class="bb-s">${esc(b.sub)}　·　${st.ch+1} / ${b.chapters.length}</div></div>
    <a class="bb-back" href="index.html">← 小说区</a></div>`;
  const head=`<div class="chapter-head"><div class="kicker">${esc(b.title)}</div>
    <h1>${esc(c.title)}</h1>
    <div class="meta">章节 ${String(st.ch+1).padStart(2,'0')} / ${b.chapters.length}　·　${c.words==='—'?'独立短篇':c.words+' 字'}　·　${c.time}</div>
    <div class="rule"></div></div>`;
  const body=`<div class="body">${c.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
  const nav=`<div class="chap-nav"><button id="prevBtn" ${st.ch===0?'disabled':''}>← 上一章</button>
    <button id="nextBtn" ${st.ch===b.chapters.length-1?'disabled':''}>下一章 →</button></div>`;
  $('reader').innerHTML=bar+head+body+`<div class="chap-end">（本章完）</div>`+nav;
  $('prevBtn').onclick=()=>{if(st.ch>0){st.ch--;save();render();window.scrollTo({top:0,behavior:'smooth'})}};
  $('nextBtn').onclick=()=>{if(st.ch<b.chapters.length-1){st.ch++;save();render();window.scrollTo({top:0,behavior:'smooth'})}};
  if(st.scheme==='mobile')$('reader').appendChild(mb);
  document.title=`${c.title} · 小说区`;
}
function render(){applyVars();buildNav();buildToc();renderReader();save()}
$('tocBtn').onclick=()=>{$('toc').classList.toggle('open');$('settings').classList.remove('open')};
$('setBtn').onclick=()=>{$('settings').classList.toggle('open');$('toc').classList.remove('open')};
$('themeBtn').onclick=()=>{const o=['light','sepia','night'];st.theme=o[(o.indexOf(st.theme)+1)%3];save();applyVars();buildNav()};
$('mobilebar').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const a=b.dataset.act;
  if(a==='toc')$('toc').classList.toggle('open');
  if(a==='set')$('settings').classList.toggle('open');
  if(a==='theme'){const o=['light','sepia','night'];st.theme=o[(o.indexOf(st.theme)+1)%3];save();applyVars();buildNav()}
  if(a==='next'&&st.ch<BOOKS[st.book].chapters.length-1){st.ch++;save();render();window.scrollTo({top:0,behavior:'smooth'})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('toc').classList.remove('open');$('settings').classList.remove('open')}
  if(e.key==='ArrowLeft'&&st.ch>0){st.ch--;save();render()}
  if(e.key==='ArrowRight'&&st.ch<BOOKS[st.book].chapters.length-1){st.ch++;save();render()}
});
window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-window.innerHeight;
  $('progress').style.width=(h>0?(window.scrollY/h*100):0)+'%'});
render();
</script></body></html>
