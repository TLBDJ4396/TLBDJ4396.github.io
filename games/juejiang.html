<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>我的病娇机械妻</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { display: flex; justify-content: center; align-items: center; font-family: 'Noto Serif SC', 'Songti SC', serif; background: #f0eef2; touch-action: manipulation; }
body.mood-soft { background: radial-gradient(ellipse at top, #fff5f8 0%, #f0eef2 60%, #e8e4ec 100%); }
body.mood-cozy { background: radial-gradient(ellipse at top, #ffe8f0 0%, #e0d4e8 55%, #b8a8c8 100%); }
body.mood-eerie { background: radial-gradient(ellipse at top, #d0d8e0 0%, #8a8a98 55%, #404048 100%); }
body.mood-dark { background: radial-gradient(ellipse at top, #2a2028 0%, #1a1220 55%, #0a0610 100%); }
body.mood-bloody { background: radial-gradient(ellipse at center, #3a0a10 0%, #150308 55%, #000 100%); }
body.mood-glitch { background: #000; }
body.mood-love { background: radial-gradient(ellipse at top, #ffe4f0 0%, #f0c8d8 50%, #d0a0b8 100%); }
body.mood-ng { background: radial-gradient(ellipse at top, #1a0a2a 0%, #0a0618 55%, #050208 100%); }

#error-bar { position: fixed; top: 0; left: 0; right: 0; background: #b00020; color: #fff; padding: 8px 14px; font: 12px/1.5 monospace; z-index: 9999; display: none; word-break: break-all; }

#app {
    width: 100%; height: 100%; max-width: 720px;
    background: rgba(255,255,255,0.94);
    padding: max(20px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; position: relative; z-index: 2;
    overflow: hidden;
}
body.mood-dark #app, body.mood-bloody #app, body.mood-glitch #app { background: rgba(20,10,15,0.94); color: #e0d0d8; }
body.mood-ng #app { background: rgba(15,5,25,0.96); color: #d8c8e8; }

@media (min-width: 720px) {
    body { padding: 16px; }
    #app { height: auto; min-height: 680px; max-height: 90vh; max-width: 900px; border-radius: 20px; border: 1px solid rgba(180,140,160,0.4); box-shadow: 0 30px 80px rgba(0,0,0,0.35); padding: 40px 48px; }
}

#menu-title { text-align: center; font-size: clamp(24px, 6vw, 38px); font-weight: 700; color: #b02a5a; letter-spacing: clamp(3px, 1vw, 6px); padding-bottom: 14px; margin-bottom: 10px; border-bottom: 1px dashed rgba(180,120,150,0.4); }
body.mood-ng #menu-title { color: #a080d0; }
#menu-sub { text-align: center; color: #8a7a8a; font-size: clamp(11px, 2.5vw, 13px); letter-spacing: 3px; margin-bottom: 18px; }

#story-text { flex: 1; font-size: clamp(15px, 4vw, 19px); line-height: 1.9; color: #2a2028; padding: 4px 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
body.mood-dark #story-text, body.mood-bloody #story-text, body.mood-ng #story-text { color: #d8c8d0; }
#story-text::-webkit-scrollbar { width: 4px; }
#story-text::-webkit-scrollbar-thumb { background: rgba(180,120,150,0.4); border-radius: 2px; }

.line { display: block; margin-bottom: 5px; }
.line.action { color: #8a7a88; font-style: italic; }
.line.narration { color: #4a4048; }
.line.dialogue { font-weight: 500; }
.line.system { color: #00a0c0; font-family: monospace; font-size: 0.92em; }
body.mood-dark .line.narration { color: #b0a0b0; }
body.mood-ng .line.narration { color: #b0a0c0; }

.tone-warm { color: #c87098; }
.tone-cold { color: #6a90c0; }
.tone-eerie { color: #a080c0; }
.tone-danger { color: #d04060; }
.tone-blood { color: #ff0033; font-weight: 700; }
.tone-flash { color: #00ffff; font-weight: 700; }
.tone-glitch { color: #00ffff; text-shadow: 2px 0 #ff0044, -2px 0 #00ffff; }
.tone-secret { color: #a060e0; font-style: italic; }

.cursor { display: inline-block; width: 10px; animation: blink 0.8s infinite; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

#choice-area { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(180,140,160,0.25); max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.choice-btn { background: rgba(255,240,245,0.9); border: 1px solid rgba(200,140,170,0.5); border-radius: 10px; padding: 12px 16px; font-size: clamp(13px, 3.5vw, 15px); font-family: inherit; text-align: left; cursor: pointer; color: #3a2a32; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
.choice-btn:active, .choice-btn:hover { background: rgba(255,215,230,1); }
body.mood-dark .choice-btn, body.mood-bloody .choice-btn { background: rgba(40,20,30,0.9); border-color: rgba(200,80,120,0.4); color: #e0c8d0; }
body.mood-dark .choice-btn:hover, body.mood-bloody .choice-btn:hover { background: rgba(80,30,45,0.95); }
body.mood-ng .choice-btn { background: rgba(30,15,45,0.9); border-color: rgba(160,100,200,0.4); color: #d0c0e0; }
.choice-btn.locked { opacity: 0.45; cursor: not-allowed; }
.choice-btn.ending-btn { border-left: 4px solid #a02040; }
.choice-btn.love-btn { border-left: 4px solid #d4a0c0; background: linear-gradient(90deg, rgba(255,230,240,0.9), rgba(255,245,250,0.9)); }
.choice-btn.secret-btn { border-left: 4px solid #a060e0; color: #7040b0; }
.choice-btn.suicide-btn { border-left: 4px solid #600020; color: #800030; font-style: italic; }

#toolbar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.icon-btn { background: rgba(200,140,170,0.15); border: 1px solid rgba(200,140,170,0.3); border-radius: 20px; padding: 5px 12px; color: #8a7a8a; cursor: pointer; font-size: 11px; font-family: inherit; }
.icon-btn:active, .icon-btn:hover { background: rgba(200,140,170,0.4); }
body.mood-ng .icon-btn { background: rgba(160,100,200,0.15); border-color: rgba(160,100,200,0.3); color: #a090c0; }

.back-btn { background: transparent; border: none; color: #9a8a9a; font-size: 12px; cursor: pointer; padding: 4px 0; margin-bottom: 8px; align-self: flex-start; font-family: inherit; }
.back-btn:active, .back-btn:hover { color: #c87098; }

#menu-buttons { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#menu-buttons button { background: rgba(255,245,250,0.85); border: 1px solid rgba(200,140,170,0.4); border-radius: 12px; padding: 14px; font-size: clamp(14px, 3.8vw, 16px); font-family: inherit; cursor: pointer; color: #3a2a32; letter-spacing: 1px; }
#menu-buttons button:active, #menu-buttons button:hover { background: rgba(255,220,235,1); }
#menu-buttons button.ng-btn { background: linear-gradient(90deg, rgba(220,200,255,0.9), rgba(240,230,255,0.9)); border-color: #a080d0; color: #6040a0; }
#menu-buttons button.ng3-btn { background: linear-gradient(90deg, rgba(255,230,180,0.9), rgba(255,240,210,0.9)); border-color: #d0a060; color: #806030; }

/* 晨曦工作室标识 */
.studio-mark { text-align: center; font-size: 10px; letter-spacing: 4px; color: rgba(160,130,150,0.45); margin-top: 20px; font-family: 'Songti SC', serif; }
.studio-watermark { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: 3px; color: rgba(160,130,150,0.35); pointer-events: none; z-index: 250; font-family: 'Songti SC', serif; }
body.mood-dark .studio-watermark, body.mood-bloody .studio-watermark, body.mood-glitch .studio-watermark, body.mood-ng .studio-watermark { color: rgba(180,140,180,0.25); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; display: flex; justify-content: center; align-items: flex-end; padding: 0; }
@media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
.modal-box { background: #fff8fc; border-radius: 20px 20px 0 0; padding: 22px 20px max(22px, env(safe-area-inset-bottom)); max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
@media (min-width: 600px) { .modal-box { border-radius: 18px; padding: 28px 32px; } }
.modal-box h2 { color: #b02a5a; font-size: clamp(18px, 4.5vw, 22px); margin-bottom: 14px; }
.modal-box .entry { padding: 10px 12px; margin-bottom: 8px; background: rgba(255,240,248,0.8); border-radius: 8px; font-size: clamp(13px, 3.5vw, 14px); border-left: 3px solid #d4a0c0; word-break: break-all; }
.modal-box .close-row { margin-top: 16px; text-align: right; }
.modal-box button { background: #f0e0ea; border: 1px solid #d4a0c0; border-radius: 10px; padding: 10px 22px; cursor: pointer; font-family: inherit; font-size: 14px; color: #6a4058; }
.modal-box button:active, .modal-box button:hover { background: #ffd0e0; }

#input-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; justify-content: center; align-items: flex-end; }
@media (min-width: 600px) { #input-overlay { align-items: center; } }
#input-box { background: #fff8fc; border-radius: 20px 20px 0 0; padding: 22px 20px max(22px, env(safe-area-inset-bottom)); max-width: 640px; width: 100%; }
@media (min-width: 600px) { #input-box { border-radius: 18px; padding: 28px; } }
#input-box h2 { color: #b02a5a; font-size: 17px; margin-bottom: 10px; font-weight: 600; }
#input-box .hint { color: #8a7a8a; font-size: 13px; margin-bottom: 14px; line-height: 1.6; white-space: pre-wrap; }
#input-box textarea { width: 100%; min-height: 70px; padding: 12px; border: 1px solid rgba(200,140,170,0.5); border-radius: 12px; font-family: inherit; font-size: 16px; background: rgba(255,250,252,0.9); color: #3a2a32; resize: none; outline: none; -webkit-appearance: none; }
#input-box textarea:focus { border-color: #c87098; box-shadow: 0 0 0 2px rgba(200,112,152,0.2); }
#input-box .btn-row { display: flex; gap: 10px; margin-top: 14px; }
#input-box .btn-row button { flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #d4a0c0; background: #f0e0ea; color: #6a4058; font-family: inherit; font-size: 15px; cursor: pointer; }
#input-box .btn-row button.primary { background: linear-gradient(90deg, #ffb0d0, #d4a0c0); color: #fff; border-color: #c87098; }
#input-box .btn-row button:active { transform: scale(0.98); }

#ending-fx { position: fixed; inset: 0; pointer-events: none; z-index: 500; opacity: 0; transition: opacity 0.8s; }
#ending-fx.on { opacity: 1; }

/* BAD — 剧烈震动 + 血色脉冲 + 边缘扫描 */
body.fx-bad #app { animation: fxShake 0.28s infinite; }
body.fx-bad #ending-fx { background: radial-gradient(ellipse at center, transparent 30%, rgba(140,0,25,0.7) 100%); animation: fxBadPulse 1.1s infinite; }
body.fx-bad #ending-fx::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(255,0,40,0.06) 0px, rgba(255,0,40,0.06) 2px, transparent 2px, transparent 6px); animation: fxBloodScan 4s linear infinite; }
@keyframes fxShake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, -3px); } 80% { transform: translate(6px, 4px); } }
@keyframes fxBadPulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
@keyframes fxBloodScan { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }

/* LOVE — 花瓣翻倍 + 金色光晕 + 星光 */
body.fx-love #ending-fx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,230,245,0.5) 0%, rgba(255,200,230,0.2) 40%, transparent 70%); animation: fxLoveGlow 2.4s infinite; }
body.fx-love #ending-fx::after { content: '❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿'; position: absolute; inset: 0; font-size: 26px; color: rgba(255,180,220,0.85); letter-spacing: 40px; line-height: 70px; text-shadow: 0 0 12px rgba(255,180,220,0.9); animation: fxPetal 9s linear infinite; word-break: break-all; }
body.fx-love #app::after { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,220,240,0.7), transparent), radial-gradient(2px 2px at 70% 60%, rgba(255,220,240,0.7), transparent), radial-gradient(2px 2px at 40% 80%, rgba(255,220,240,0.7), transparent), radial-gradient(2px 2px at 85% 20%, rgba(255,220,240,0.7), transparent), radial-gradient(2px 2px at 55% 45%, rgba(255,220,240,0.7), transparent); animation: fxStar 3s infinite; }
@keyframes fxLoveGlow { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes fxPetal { 0% { transform: translateY(-100%) rotate(0deg); } 100% { transform: translateY(100vh) rotate(360deg); } }
@keyframes fxStar { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* GLITCH — 强撕裂 + RGB分离 + 色块闪帧 */
body.fx-glitch #app { animation: fxGlitchShake 0.07s infinite; }
body.fx-glitch #ending-fx { background: repeating-linear-gradient(0deg, rgba(0,255,255,0.12) 0px, rgba(0,255,255,0.12) 1px, transparent 1px, transparent 3px); animation: fxScan 0.15s linear infinite; }
body.fx-glitch #ending-fx::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,0,68,0.15) 0%, transparent 15%, rgba(0,255,255,0.15) 85%, transparent 100%); animation: fxChroma 0.12s infinite; }
body.fx-glitch #ending-fx::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #00ffff; box-shadow: 0 0 20px #00ffff; animation: fxGlitchBar 2.3s linear infinite; }
@keyframes fxGlitchShake { 0% { transform: translate(0,0); } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(6px, -6px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(7px, 5px); } 100% { transform: translate(0,0); } }
@keyframes fxScan { 0% { background-position: 0 0; } 100% { background-position: 0 6px; } }
@keyframes fxChroma { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
@keyframes fxGlitchBar { 0% { top: 0; } 100% { top: 100%; } }

/* NG — 紫色虚空 + 数据流加速 */
body.fx-ng #ending-fx { background: radial-gradient(ellipse at center, rgba(140,70,220,0.25) 0%, rgba(10,0,20,0.75) 100%); animation: fxNgPulse 2.8s infinite; }
body.fx-ng #ending-fx::before { content: '01001010 01101001 01101110 01100111 01001100 01101001 01100111 01101000 01110100'; position: absolute; top: 8%; left: 0; right: 0; color: rgba(180,120,255,0.55); font-family: monospace; font-size: 15px; letter-spacing: 10px; white-space: nowrap; animation: fxData 4s linear infinite; }
body.fx-ng #ending-fx::after { content: '01001010 01101001 01101110 01100111 01001100 01101001 01100111 01101000 01110100'; position: absolute; bottom: 8%; left: 0; right: 0; color: rgba(180,120,255,0.4); font-family: monospace; font-size: 14px; letter-spacing: 8px; white-space: nowrap; animation: fxData 5s linear infinite reverse; }
@keyframes fxNgPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
@keyframes fxData { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.ending-title-impact { display: block; text-align: center; font-size: clamp(20px, 5.5vw, 28px); font-weight: 900; letter-spacing: 6px; margin-bottom: 18px; animation: fxTitleIn 1.4s ease-out; }
@keyframes fxTitleIn { 0% { opacity: 0; transform: scale(3) rotate(-4deg); filter: blur(28px); } 60% { opacity: 0.8; transform: scale(1.05) rotate(1deg); filter: blur(2px); } 100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); } }
body.fx-bad .ending-title-impact { color: #ff0033; text-shadow: 0 0 40px #ff0033, 0 0 80px #800020; animation: fxTitleIn 1.4s ease-out, fxTitleBlood 2s infinite 1.4s; }
@keyframes fxTitleBlood { 0%,100% { text-shadow: 0 0 40px #ff0033, 0 0 80px #800020; } 50% { text-shadow: 0 0 60px #ff0033, 0 0 120px #ff0033; } }
body.fx-love .ending-title-impact { color: #ffb6d8; text-shadow: 0 0 30px #ffb6d8, 0 0 70px #ff80b0, 0 0 100px #ff80b0; }
body.fx-glitch .ending-title-impact { color: #00ffff; text-shadow: 3px 0 #ff0044, -3px 0 #00ffff, 0 0 40px #00ffff; animation: fxTitleIn 1.4s ease-out, fxTitleGlitch 0.2s infinite 1.4s; }
@keyframes fxTitleGlitch { 0% { transform: translate(0,0); } 25% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-1px, -2px); } 100% { transform: translate(0,0); } }
body.fx-ng .ending-title-impact { color: #b080ff; text-shadow: 0 0 40px #8040c0, 0 0 80px #400060; }

#fade-overlay { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 0; z-index: 200; }

.wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px 0; }
.wall-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 2px; }
.wall-cell .glyph { font-size: clamp(13px, 3.5vw, 16px); line-height: 1; margin-bottom: 2px; }
.wall-cell .code { font-size: clamp(9px, 2.3vw, 10px); opacity: 0.85; }
.wall-cell.locked { background: rgba(180,140,160,0.12); color: rgba(120,100,120,0.35); cursor: not-allowed; }
.wall-cell.unlocked { background: linear-gradient(135deg, #ffd0e0, #ffb0c8); color: #802040; box-shadow: 0 2px 8px rgba(200,80,120,0.3); }
.wall-cell.unlocked .glyph { text-shadow: 0 0 8px currentColor; }
.wall-cell.unlocked:active, .wall-cell.unlocked:hover { transform: scale(1.1); z-index: 2; }
.wall-cell.unlocked.love { background: linear-gradient(135deg, #ffd0e8, #ffb0d8); color: #a04080; }
.wall-cell.unlocked.meta { background: linear-gradient(135deg, #d0e0ff, #b0c8ff); color: #4050a0; }
.wall-cell.unlocked.ng { background: linear-gradient(135deg, #e0c0ff, #c8a0ff); color: #6030a0; }

#fragment-indicator { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 300; display: none; align-items: center; gap: 5px; background: rgba(120,60,200,0.25); border: 1px solid rgba(160,100,220,0.5); border-radius: 20px; padding: 5px 12px; color: #b090e0; font-size: 13px; font-family: monospace; }
#fragment-indicator.show { display: flex; }
#fragment-indicator.flash { animation: fragFlash 0.8s; }
@keyframes fragFlash { 0% { transform: scale(1); } 30% { transform: scale(1.35); box-shadow: 0 0 35px rgba(160,100,220,1); } 100% { transform: scale(1); } }

.save-slot { padding: 12px 14px; margin-bottom: 8px; background: rgba(255,240,248,0.8); border-radius: 10px; border: 1px solid rgba(200,140,170,0.3); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 8px; }
.save-slot:active, .save-slot:hover { background: #ffe0f0; }
.save-slot .color-tag { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.save-slot .label { flex: 1; color: #6a4058; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-slot .time { color: #a08aa0; font-size: 11px; flex-shrink: 0; }
.save-slot.empty { opacity: 0.6; }

#audio-toggle { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); right: 14px; z-index: 300; background: rgba(200,140,170,0.4); border: 1px solid rgba(200,140,170,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; backdrop-filter: blur(4px); }
#audio-toggle:active { background: rgba(200,140,170,0.7); }

@media (max-height: 600px) {
    #story-text { font-size: 14px; line-height: 1.7; }
    .choice-btn { padding: 10px 14px; font-size: 13px; }
    #choice-area { gap: 6px; margin-top: 10px; padding-top: 10px; }
}
</style>
</head>
<body>
<div id="error-bar"></div>
<div id="app">加载中……</div>
<div id="ending-fx"></div>
<div id="fade-overlay"></div>
<div id="fragment-indicator">◈ <span id="frag-count">0</span></div>
<div id="audio-toggle" title="音效开关">🔊</div>

<script>
window.onerror = function(msg, url, line, col) {
    const bar = document.getElementById('error-bar');
    bar.style.display = 'block';
    bar.textContent = '[错误] ' + msg + ' | 行 ' + line + ':' + col;
};

const AudioEngine = {
    ctx: null, nodes: [], enabled: true, playing: null,
    init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { this.enabled = false; } },
    stop() { this.nodes.forEach(n => { try { n.stop(); } catch(e){} }); this.nodes = []; this.playing = null; },
    play(mood) {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        if (this.playing === mood) return;
        this.stop(); this.playing = mood;
        const configs = {
            soft:   { freqs: [261.63, 329.63], gain: 0.02, wave: 'sine' },
            cozy:   { freqs: [293.66, 369.99], gain: 0.02, wave: 'sine' },
            eerie:  { freqs: [220.00, 233.08], gain: 0.018, wave: 'triangle' },
            dark:   { freqs: [110.00, 116.54], gain: 0.025, wave: 'sawtooth' },

function loadMeta() {
    try { const raw = localStorage.getItem(META_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { unlocked: [], playCount: 0, endingsSeen: 0, ngUnlocked: false, ng3Unlocked: false };
}
function saveMeta(m) { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {} }
function saveGame(slot) {
    try {
        const data = { state: { ...state, interludeBuffer: null }, time: Date.now() };
        const all = loadAllSaves(); all[slot] = data;
        localStorage.setItem(SAVE_KEY, JSON.stringify(all)); return true;
    } catch (e) { return false; }
}
function loadAllSaves() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return {};
}
function loadGame(slot) {
    try {
        const all = loadAllSaves();
        if (!all[slot]) return false;
        state = { ...all[slot].state, interludeBuffer: null }; return true;
    } catch (e) { return false; }
}

let timers = [];
let typing = false, skipTyping = false;
function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; typing = false; skipTyping = false; }
function parseLine(raw) {
    const s = raw.trim();
    if (!s) return { type: 'blank', text: '' };
    if (s.startsWith('（') && s.endsWith('）')) return { type: 'action', text: s };
    if (s.startsWith('“') && s.endsWith('”')) return { type: 'dialogue', text: s };
    if (/^[“"]/.test(s) || s.includes('“')) return { type: 'dialogue', text: s };
    if (/^(ERROR|ENDING|RETRY|STACK|TEXT|DUMPING|EXCEPTION|SOURCE|THIS|FINAL|\d{8})/.test(s)) return { type: 'system', text: s };
    if (/^【/.test(s)) return { type: 'system', text: s };
    return { type: 'narration', text: s };
}
function typeAllLines(container, lines, tone, onDone) {
    if (!container) { onDone && onDone(); return; }
    clearTimers();
    typing = true; skipTyping = false;
    const speeds = SPEED[tone] || SPEED.warm;
    let idx = 0;
    function nextLine() {
        if (!document.getElementById('story-text')) { typing = false; return; }
        if (skipTyping) {
            for (let i = idx; i < lines.length; i++) renderLine(container, parseLine(lines[i]), tone, true);
            typing = false; onDone && onDone(); return;
        }
        if (idx >= lines.length) { typing = false; onDone && onDone(); return; }
        const line = parseLine(lines[idx]);
        const el = renderLine(container, line, tone, false);
        idx++;
        if (!line.text) { nextLine(); return; }
        let charIdx = 0;
        const speed = line.type === 'action' ? speeds.a : line.type === 'dialogue' ? speeds.d : speeds.n;
        function tick() {
            if (!document.body.contains(el)) { typing = false; return; }
            if (skipTyping) {
                el.textContent = line.text;
                const c = el.querySelector('.cursor'); if (c) c.remove();
                nextLine(); return;
            }
            if (charIdx < line.text.length) {
                el.textContent = line.text.slice(0, charIdx + 1);
                const cursor = document.createElement('span');
                cursor.className = 'cursor'; cursor.textContent = '▎';
                el.appendChild(cursor);
                charIdx++;
                const ch = line.text[charIdx - 1];
                const delay = (ch === '，' || ch === '。' || ch === '、' || ch === '？' || ch === '！') ? speed * 3 : speed;
                timers.push(setTimeout(tick, delay));
            } else {
                const c = el.querySelector('.cursor'); if (c) c.remove();
                timers.push(setTimeout(nextLine, 180));
            }
        }
        tick();
    }
    nextLine();
}
function renderLine(container, line, tone, instant) {
    const el = document.createElement('div');
    el.className = 'line ' + (line.type || 'narration');
    if (line.type === 'dialogue') el.classList.add('tone-' + (tone || 'warm'));
    if (line.type === 'system') el.classList.add('tone-' + (tone || 'glitch'));
    if (instant) el.textContent = line.text;
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
    return el;
}

function transitionTo(callback, isBig) {
    const overlay = document.getElementById('fade-overlay');
    if (!overlay) { try { callback(); } catch(e) { console.error(e); } return; }
    const duration = isBig ? 700 : 120;
    overlay.style.transition = 'opacity ' + duration + 'ms ease';
    overlay.classList.add('on');
    setTimeout(() => {
        try { callback(); } catch(e) { console.error(e); }
        const ov = document.getElementById('fade-overlay');
        if (ov) setTimeout(() => ov.classList.remove('on'), Math.max(60, duration / 6));
    }, duration);
}

            (hasSave ? '<button onclick="showLoadPanel()">📂 读取存档</button>' : '') +
            (meta.ngUnlocked ? '<button class="ng-btn" onclick="startGame(true,false)">🌙 二周目模式</button>' : '') +
            (meta.ng3Unlocked ? '<button class="ng3-btn" onclick="startGame(false,true)">🔆 三周目 · 真结局线</button>' : '') +
            '<button onclick="showRecordsPanel()">📜 选项记录</button>' +
            '<button onclick="showGalleryPanel()">🖼 记忆残片</button>' +
            '<button onclick="showSavePanel()">💾 存档管理</button>' +
            '<button onclick="showSettingsPanel()">⚙️ 设置</button>' +
            '<button onclick="window.close()">退出</button>' +
            '</div>' +
            '<div class="studio-mark">晨 曦 工 作 室</div>';
    } catch (e) { document.getElementById('app').textContent = '错误: ' + e.message; }
}

function renderGame() {
    try {
        const node = story[state.currentNodeId];
        if (!node) { alert('剧情节点缺失：' + state.currentNodeId); return; }
        applyMood(node.mood || 'soft');
        const app = document.getElementById('app');
        if (!app) return;

        const frag = document.getElementById('fragment-indicator');
        if (frag) {
            if (state.ngPlus || state.ng3Plus) {
                frag.classList.add('show');
                const fc = document.getElementById('frag-count');
                if (fc) fc.textContent = state.fragments;
            } else frag.classList.remove('show');
        }

        if (node.ending) {
            const isLove = node.type === 'LOVE' || node.type === 'NG_LOVE';
            const isMeta = node.type === 'META' || node.type === 'NG' || node.type === 'NG3_TRUE';
            app.innerHTML = '<button class="back-btn" onclick="goToMenu()">← 返回主菜单</button>' +
                '<div id="story-text"></div>' +
                '<div id="choice-area" style="opacity:0;">' +
                '<button class="choice-btn ' + (isLove ? 'love-btn' : isMeta ? 'secret-btn' : 'ending-btn') + '" onclick="resetGame()">↺ 重新开始</button>' +
                '<button class="choice-btn" onclick="goToMenu()">← 返回主菜单</button>' +
                '</div>' +
                '<div class="studio-watermark">晨曦工作室</div>';
            const st = document.getElementById('story-text');
            if (!st) return;
            const text = (state.interludeBuffer ? state.interludeBuffer + '\n' : '') + node.text;
            state.interludeBuffer = null;
            applyEndingFX(node.type);
            if (node.glitch) startGlitchEffects(text);
            else {
                typeAllLines(st, text.split('\n'), node.tone || 'warm', () => {
                    setTimeout(() => {
                        const st3 = document.getElementById('story-text');
                        if (!st3) return;
                        st3.insertAdjacentHTML('afterbegin', '<span class="ending-title-impact">【' + node.title + '】</span>');
                        st3.scrollTop = 0;
                    }, 400);
                });
            }
            setTimeout(() => {
                const ca = document.getElementById('choice-area');
                if (!ca) return;
                ca.style.transition = 'opacity 1s';
                ca.style.opacity = '1';
            }, 1500);
            unlockEnding(state.currentNodeId);
            const m = loadMeta();
            if (state.currentNodeId === 'ending_24') m.ngUnlocked = true;
            if (m.unlocked.length >= 33) m.ng3Unlocked = true;
            saveMeta(m);
            return;
        }

        app.innerHTML = '<button class="back-btn" onclick="goToMenu()">← 返回主菜单</button>' +
            '<div id="toolbar">' +
            '<button class="icon-btn" onclick="saveCurrentGame()">💾 存档</button>' +
            '<button class="icon-btn" onclick="showRecordsPanel()">📜 记录</button>' +
            (state.ngPlus || state.ng3Plus ? '<button class="icon-btn" onclick="showDiaryPanel()">📖 日记</button>' : '') +
            '</div><div id="story-text"></div>' +
            '<div id="choice-area" style="opacity:0;"></div>' +
            '<div class="studio-watermark">晨曦工作室</div>';

        const st = document.getElementById('story-text');
        if (!st) return;
        const text = (state.interludeBuffer ? state.interludeBuffer + '\n' : '') + node.text;
        state.interludeBuffer = null;
        typeAllLines(st, text.split('\n'), node.tone || 'warm', () => {
            const btnArea = document.getElementById('choice-area');
            if (!btnArea) return;
            let html = '';
            node.choices.forEach((c, i) => {
                let locked = false, lockText = '';
                if (c.condition && !c.condition(state)) { locked = true; lockText = c.locked || '（条件未满足）'; }
                html += '<button class="choice-btn ' + (locked ? 'locked' : '') + '" onclick="' + (locked ? '' : 'makeChoice(' + i + ')') + '">' + c.text + (locked ? '  ' + lockText : '') + '</button>';
            });
            if (state.ngPlus || state.ng3Plus) html += '<button class="choice-btn suicide-btn" onclick="suicideChoice()">（你想怎么死？）</button>';
            btnArea.innerHTML = html;
            btnArea.style.transition = 'opacity 0.5s';
            btnArea.style.opacity = '1';
        });
        st.onclick = () => { skipTyping = true; };
    } catch (e) { document.getElementById('app').textContent = '错误: ' + e.message; }
}

function unlockEnding(id) {
    const meta = loadMeta();
    if (!meta.unlocked.includes(id)) meta.unlocked.push(id);
    meta.endingsSeen = meta.unlocked.length;
    meta.playCount = (meta.playCount || 0) + 1;
    saveMeta(meta);
}

function makeChoice(index) {
    const node = story[state.currentNodeId];
    if (!node || !node.choices) return;
    const choice = node.choices[index];
    if (!choice) return;
    state.pathHistory.push(choice.text);
    if (choice.drank !== undefined) state.drankTea = choice.drank;
    if (choice.interlude && choice.interlude.length > 0) state.interludeBuffer = choice.interlude.join('\n');
    applyChoiceEffect(choice, index);
    const nextNode = story[choice.next];
    const isBig = BIG_TRANSITION_NODES.includes(choice.next) || (nextNode && nextNode.ending);
    transitionTo(() => { state.currentNodeId = choice.next; renderGame(); }, isBig);
}

function applyChoiceEffect(choice, idx) {
    const id = state.currentNodeId;
    const t = choice.text;
    const beforeFrag = state.fragments;
    if (id === 'start') {
        if (idx === 0) { state.trust += 2; state.mood += 2; }
        if (idx === 2) { state.trust -= 3; state.mood -= 2; }
    }
    if (t.includes('我相信你')) { state.trust += 4; state.mood += 2; }
    if (t.includes('你在说谎')) { state.suspicion += 6; }
    if (t.includes('血')) { state.suspicion += 10; state.mood -= 5; }
    if (t.includes('我爱你')) { state.trust += 8; state.mood += 5; }
    if (t.includes('举报') || t.includes('报警')) { state.suspicion += 15; }
    if (t.includes('一起逃') || t.includes('私奔')) { state.trust += 5; }
    if (t.includes('回家')) { state.trust += 8; }
    if (t.includes('真相') || t.includes('是不是都是假的')) { state.fragments += 2; }
    if (t.includes('你到底是什么')) { state.fragments += 1; }
    state.trust = Math.max(0, Math.min(100, state.trust));
    state.suspicion = Math.max(0, Math.min(100, state.suspicion));
    state.mood = Math.max(0, Math.min(100, state.mood));
    if (state.fragments > beforeFrag) {
        const fi = document.getElementById('fragment-indicator');
        if (fi) {
            fi.classList.remove('flash');
            void fi.offsetWidth;
            fi.classList.add('flash');
        }
        const fc = document.getElementById('frag-count');
        if (fc) fc.textContent = state.fragments;
    }
}

function showInputModal(title, hint, placeholder, onConfirm) {
    const html = '<div id="input-overlay">' +
        '<div id="input-box">' +
        '<h2>' + title + '</h2>' +
        '<div class="hint">' + hint + '</div>' +
        '<textarea id="input-textarea" placeholder="' + (placeholder || '') + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>' +
        '<div class="btn-row">' +
        '<button onclick="closeInputModal()">取消</button>' +
        '<button class="primary" onclick="confirmInput()">确定</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    document.body.insertAdjacentHTML('beforeend', html);
    setTimeout(() => {
        const ta = document.getElementById('input-textarea');
        if (ta) ta.focus();
    }, 200);
    window._inputCallback = onConfirm;
}

function closeInputModal() {
    const el = document.getElementById('input-overlay');
    if (el) el.remove();
    window._inputCallback = null;
}

function confirmInput() {
    const ta = document.getElementById('input-textarea');
    const val = ta ? ta.value : '';
    const cb = window._inputCallback;
    closeInputModal();
    if (cb) cb(val);
}

function suicideChoice() {
    if (!state.ngPlus && !state.ng3Plus) return;
    showInputModal(
        '（你决定结束这一切。）',
        '请描述你打算怎么做。\n（输入任何内容都可以，但只有真正致命的方式才会生效。）',
        '在这里输入……',
        (s) => {
            s = (s || '').trim();
            if (!isLethal(s)) {
                alert('（你试了，但没有用。）\n（璃光从身后轻轻抱住了你。）\n“……主人，这样是死不了的。”');
                return;
            }
            state.deathCount += 1;
            state.riGuangMemory.push({ cycle: state.cycle, node: state.currentNodeId, method: s, time: Date.now() });
            if (state.drankTea) {
                state.currentNodeId = 'start';
                state.interludeBuffer = '（你醒了过来。）\n（手心里没有伤口。）\n（你回到了今天的起点。）\n（但璃光的眼神，好像……有些不一样。）';
                state.mood = 'ng';
                renderGame();
            } else {
                alert('（你死了。）\n（但璃光没有看到你喝下她的茶。）\n（这一次的回档……什么都没能留下。）');
                startGame(state.ngPlus, state.ng3Plus);
            }
        }
    );
}

function startGame(ngPlus, ng3Plus) {
    state.currentNodeId = 'start';
    state.trust = 30;
    state.suspicion = (ngPlus || ng3Plus) ? 15 : 0;
    state.mood = 60;
    state.pathHistory = [];
    state.interludeBuffer = null;
    state.ngPlus = !!ngPlus;
    state.ng3Plus = !!ng3Plus;
    state.cycle = ng3Plus ? 2 : (ngPlus ? 1 : 0);
    state.riGuangMemory = [];
    state.deathCount = 0;
    state.fragments = 0;
    state.drankTea = false;
    state.readNodes = [];
    clearEndingFX();
    renderGame();
}

function resetGame() { startGame(state.ngPlus, state.ng3Plus); }
function goToMenu() { clearTimers(); clearEndingFX(); renderMenu(); }
function saveCurrentGame() {
    const meta = loadMeta();
    const slot = 'auto_' + (meta.playCount || 0);
    alert(saveGame(slot) ? '已存档：' + slot : '存档失败');
}

function closeModal(event) {
    if (event && event.target && !event.target.classList.contains('modal-overlay')) return;
    document.querySelectorAll('.modal-overlay').forEach(o => o.remove());
}

function showRecordsPanel() {
    if (state.pathHistory.length === 0) { alert('还没有任何选项记录。'); return; }
    const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal-box" onclick="event.stopPropagation()"><h2>📜 选项记录</h2>' +
        state.pathHistory.map((s, i) => '<div class="entry">' + (i + 1) + '. ' + s + '</div>').join('') +
        '<div class="close-row"><button onclick="closeModal()">关闭</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

function showDiaryPanel() {
    if (!state.ngPlus && !state.ng3Plus) return;
    const DIARY = {
        day1: '第一天。\n主人今天看了我三次。\n比昨天多一次。\n璃光把这一秒存进了核心。',
        day3: '第三天。\n璃光出去买了花。那盆花，主人看过。\n璃光想，主人会喜欢吗。',
        day5: '第五天。\n璃光去了地下室。\n那里有璃光不想让主人看到的东西。',
        day6: '第六天。\n璃光想让主人知道真相。\n璃光不想伤害主人。但璃光也不想失去主人。'
    };
    const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal-box" onclick="event.stopPropagation()"><h2>📖 璃光的日记</h2>' +
        Object.keys(DIARY).map(k => '<div class="entry" style="white-space:pre-wrap;">' + DIARY[k] + '</div>').join('') +
        '<div class="close-row"><button onclick="closeModal()">关闭</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

function showSavePanel() {
    const saves = loadAllSaves();
    const slots = ['auto_0', 'slot_1', 'slot_2', 'slot_3', 'slot_4'];
    const colors = { soft: '#c87098', cozy: '#d090b0', eerie: '#a080c0', dark: '#604060', bloody: '#ff0033', glitch: '#00ffff', love: '#ffb6d8', ng: '#a080d0' };
    const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal-box" onclick="event.stopPropagation()"><h2>💾 存档管理</h2>' +
        slots.map(s => {
            const d = saves[s];
            if (d) {
                const m = d.state.mood || 'soft';
                const c = colors[m] || '#c87098';
                return '<div class="save-slot" onclick="doSaveOrLoad(\'' + s + '\', true)">' +
                    '<span class="color-tag" style="background:' + c + '"></span>' +
                    '<span class="label">' + s + ' · ' + (d.state.currentNodeId || '') + '</span>' +
                    '<span class="time">' + new Date(d.time).toLocaleString() + '</span>' +
                    '</div>';
            } else {
                return '<div class="save-slot empty" onclick="doSaveOrLoad(\'' + s + '\', false)">' +
                    '<span class="color-tag" style="background:#ccc"></span>' +
                    '<span class="label">' + s + ' · 空</span>' +
                    '<span class="time">点击存档</span>' +
                    '</div>';
            }
        }).join('') +
        '<div class="close-row"><button onclick="closeModal()">关闭</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

function doSaveOrLoad(slot, exists) {
    if (exists) {
        if (confirm('覆盖存档 ' + slot + ' 吗？（取消则读取）')) {
            if (saveGame(slot)) { alert('已覆盖。'); closeModal(); }
        } else {
            if (loadGame(slot)) { closeModal(); renderGame(); }
        }
    } else {
        if (saveGame(slot)) { alert('已存档至 ' + slot); closeModal(); }
    }
}

function showLoadPanel() { showSavePanel(); }

function doLoad(slot) {
    if (loadGame(slot)) { closeModal(); renderGame(); }
    else alert('读取失败。');
}

function showGalleryPanel() {
    const meta = loadMeta();
    let wallHtml = '';
    for (let i = 1; i <= 34; i++) {
        const id = 'ending_' + String(i).padStart(2, '0');
        const n = story[id];
        if (!n) continue;
        const code = ENDING_CODENAMES[id] || { glyph: '?', code: '未知', title: n.title };
        const unlocked = meta.unlocked.includes(id);
        let cls = 'wall-cell ';
        if (unlocked) {
            cls += 'unlocked';
            if (n.type === 'LOVE' || n.type === 'NG_LOVE') cls += ' love';
            else if (n.type === 'META' || n.type === 'NG' || n.type === 'NG3_TRUE') cls += ' meta';
        } else cls += 'locked';
        const titleAttr = unlocked ? code.title : '未解码';
        wallHtml += '<div class="' + cls + '" onclick="showEndingCG(\'' + id + '\')" title="' + titleAttr + '">' +
            '<span class="glyph">' + (unlocked ? code.glyph : '·') + '</span>' +
            '<span class="code">' + (unlocked ? code.code : '····') + '</span>' +
            '</div>';
    }
    const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal-box" onclick="event.stopPropagation()"><h2>🖼 记忆残片</h2>' +
        '<div style="text-align:center;font-size:12px;color:#a08aa0;margin-bottom:12px;">每一格，都是她留下的一个残片。<br>已解开的会浮现代号，未解开的只有空白。</div>' +
        '<div class="wall">' + wallHtml + '</div>' +
        '<div class="close-row"><button onclick="closeModal()">关闭</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

function showEndingCG(id) {
    const meta = loadMeta();
    if (!meta.unlocked.includes(id)) return;
    const n = story[id];
    if (!n) return;
    closeModal();
    state.currentNodeId = id;
    state.interludeBuffer = null;
    renderGame();
}

function showSettingsPanel() {
    const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal-box" onclick="event.stopPropagation()"><h2>⚙️ 设置</h2>' +
        '<div class="entry">音效：右下角 🔊 按钮可开关 BGM。</div>' +
        '<div class="entry">二周目：达成元结局后解锁。</div>' +
        '<div class="entry">三周目：集齐全部33个结局后解锁。</div>' +
        '<div class="entry">二周目专属：任意节点可选择「你想怎么死？」。</div>' +
        '<div class="entry">喝茶后才能回档，未喝茶则从头开始。</div>' +
        '<div class="entry">版本：v13.0 · 手机/电脑自适应</div>' +
        '<div class="entry" style="text-align:center;color:#a08aa0;font-size:12px;">晨曦工作室 出品</div>' +
        '<div class="close-row"><button onclick="clearAllData()" style="background:#ffd0d0;">清空所有数据</button>' +
        '<button onclick="closeModal()">关闭</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

function clearAllData() {
    if (!confirm('确定要清空所有存档、记录和解锁进度吗？')) return;
    try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(META_KEY); } catch (e) {}
    alert('已清空。'); closeModal(); renderMenu();
}

try { selfTest(); renderMenu(); } catch (e) { document.getElementById('app').textContent = '初始化错误: ' + e.message; }
</script>
