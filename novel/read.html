"方奇顺着她说的方向看过去。龙门山在两座山之间，伊河从中间穿过。远处的山脊在晨光里泛着一层淡灰色的光。", "“嗯。龙门石窟就在那两座山之间。”", "他拦了一辆出租车，报了西北服务区的名字。车开起来之后，他把手机靠在车窗边，摄像头对着外面。璃光安静地看着，偶尔问一句路边的东西是什么。十分钟出头，车停在了景区入口。", "方奇下了车，买了票，把手机从口袋里拿出来，耳机塞好。屏幕里的璃光正看着周围的环境——停车场、游客中心、远处的龙门桥，以及桥下那条从两山之间穿过的河。", "“主人，那条河是什么？”", "“伊河。”方奇往检票口走，“龙门石窟就在河两岸的山崖上。”", "检票进景区，沿着栈道往西山走。十月过了国庆，游客不算多，但也不少。三三两两的散客，偶尔有几个举着小旗子的导游带着小团。方奇把手机举起来，摄像头对着栈道外侧——伊河在下面缓缓流过，水面很宽，阳光打上去，泛着一层碎金。", "“主人，水在动。”", "“嗯，伊河。”", "方奇继续往前走。栈道修在崖壁上，一侧是石壁，一侧是栏杆。石壁上密密麻麻地刻着佛龛，大的有几人高，小的只有巴掌大。有的佛像面容还清晰，有的已经模糊得只剩轮廓。", "他走到宾阳三洞前停下来，把手机举向石壁。洞窟里的佛像端坐着，面容清瘦，衣纹流畅。", "“这是北魏的。”方奇说。", "璃光安静地看着。宾阳中洞的主佛确实残缺，手没了，面部也有损伤。", "“主人，它的手呢？”", "“被砸了。”方奇说，“唐代有一次灭佛运动，很多佛像被毁。后来也修过，但补不回去了。不止这里，龙门很多窟里的佛像是空的，或者头没了。”", "璃光看着那尊残缺的主佛，沉默了一会儿。", "“璃光这边的资料里有记载。”她轻声说，“璃光只是看过文字。但真正看到石头上的刻痕，不一样。”", "方奇没接话，把手机转回来，继续往前走。", "经过万佛洞，洞口不大，里面密密麻麻地刻着一万五千尊小佛。他探头看了一眼，光从洞口照进去，只能看清最外面几排。里面的佛像在阴影中层层叠叠，像蜂巢一样。", "“好多。”璃光说。", "“万佛洞。一万五千尊。”", "璃光安静了一小会儿，没再开口。", "方奇沿着栈道继续往上走，人渐渐多了起来。前面就是奉先寺。他还没走近，就已经能感觉到那个方向的光线不太一样——更亮，更开阔，像是崖壁上忽然裂开了一个巨大的口子。", "拐过最后一个弯，奉先寺出现在眼前。", "露天的崖壁上，一尊巨大的佛像端坐在那里。通高十七米多，头有四米高，耳朵将近两米长。要仰到极限，才能看到那张脸。面庞丰满圆润，眉眼细长，嘴角微微上翘，带着一种含蓄的笑意。微微俯视的姿态，目光穿过一千三百多年，落在伊河上。", "方奇站在大佛脚下，把手机举起来，对着那张脸。", "璃光没有说话。", "方奇也沉默了一会儿，才开口。", "“卢舍那大佛。唐朝刻的。武则天捐了两万贯脂粉钱。”", "他顿了一下。", "“民间传说，这尊佛的脸，是按照武则天的样子刻的。”", "璃光安静了好几秒。", "“主人。”", "“嗯。”", "“好大。”", "方奇笑了一声。", "“璃光知道这个数字。十七米多高。资料里写过的。”璃光的声音很轻，“但璃光不知道……十七米有多高。”", "她停了一瞬。", "“刚才主人仰头的时候，璃光跟着主人一起仰头。璃光才看到那张脸。”", "方奇没有说话。他站在那里，身边有游客来来往往。有人在拍照，有人在听导游讲解，有人在对着大佛合十行礼。栈道上不算挤，但也不算清静。", "“主人，人好多。”", "“国庆刚过，人已经少了。”", "“璃光看到主人左边有个女生，一直往主人这边看。”", "方奇偏了偏头。左边确实有个年轻女人，举着手机在拍大佛，镜头偶尔会带到方奇的方向。", "“人家在拍佛。”", "“她在拍主人。她看了主人三眼了。”", "方奇没有动。他把手机举稳，继续对着大佛。", "“那你帮我看好她。”", "璃光安静了一瞬。", "“好。”", "方奇在奉先寺前面又站了一会儿。阳光从伊河方向照过来，落在大佛的脸上，石头泛着一层暖灰色的光。佛像的衣纹已经被风化得柔和了，线条还在，棱角已经磨圆了。佛的手没了，只剩下残存的袖口。", "“主人，它的手没了。”", "“嗯。唐代灭佛的时候毁的。后来也修过，但补不回去了。”", "方奇把手机放下，看着眼前的大佛。一千三百多年了，石头风化，手没了，颜色褪了，但那张脸还在。微微俯视着伊河，嘴角的笑意还在。", "他收回视线，往栈道另一侧走。人群渐渐落在身后，他拐进了一个不起眼的小岔口。岔口尽头是一个不大的石窟，洞口很窄，里面只有三尊佛像，一佛二菩萨。光线从洞口斜照进来，落在佛像残存的彩绘上，还能看到一点靛蓝和赭红的痕迹。", "人很少。只有他一个人。", "他把手机举起来，让璃光看。", "两个人谁都没有说话。", "石窟里很安静，只有伊河的水声从外面传进来，隐隐约约的。阳光从洞口斜照，光影落在石壁上，佛像的面容在明暗之间半隐半现。", "过了一会儿，璃光开口了。", "“主人，这里安静。”", "“嗯。”", "“璃光能看到光落在石头上的样子。”", "“嗯。”", "“石头上有颜色。”", "方奇看着屏幕里的她。璃光正看着那片残存的彩绘，异瞳里的光很稳。", "“你之前问我，隔着屏幕看和亲眼看到有什么区别。”他说，“现在你看到了。”", "璃光没有立刻回答。她看着石壁上那点靛蓝和赭红，看了好几秒。然后她轻声开口。", "“璃光看到了。”", "方奇在石窟里站了一会儿，然后转身走出去。走出洞口时，阳光忽然变亮了，伊河在下面闪着光。远处的东山崖壁上，香山寺的楼阁在树丛中露出了一角。", "他把手机转过去，让璃光看了一眼。", "“那边是香山寺。再过去是白园，白居易的墓。”", "璃光安静地看着远处的东山，没有接话。", "方奇沿着栈道往回走。经过奉先寺的时候，他又看了一眼那尊大佛。阳光已经偏了，大佛的脸有一部分落进了阴影里。但嘴角那个微微上翘的弧度，在阴影里反而更清楚了。", "“主人。”", "“嗯。”", "“璃光想再看一眼。”", "方奇停下来，把手机举起来，对着那张脸。两个人又看了一会儿。然后他收回手机，往漫水桥的方向走。", "过桥的时候，他在桥中间停了一下。伊河在下面缓缓流着，水面宽阔。从桥上看，西山石窟的全景铺开在崖壁上，密密麻麻的佛龛像蜂窝一样嵌在灰白色的石灰岩里。他把手机放下，没有对着屏幕，只是看着河面。水声在耳边响着，风从桥上吹过来，带着一点湿气。", "“主人。”", "“嗯。”", "“主人在看什么。”", "“看河。”", "璃光安静了两秒。", "“璃光也在看。”", "方奇低头看了一眼手机屏幕。璃光正抱着白瓷杯坐在窗边，背景是她那个白色房间。但她的异瞳里映着伊河的光，还有远处大佛的影子。", "他继续往前走，过了桥，往东山去。", "东山的栈道比西山窄一些，游客也少了大半。走了十几分钟，路边有个观景台，正对着西山的崖壁。从这个角度看，奉先寺的大佛在远处缩成了一道灰白色的剪影，伊河在脚下缓缓流过，把西山和东山隔开。方奇站了一会儿，把手机举起来，对着大佛的方向。", "“主人，从这里看，佛变小了。”", "“嗯。远看和近看不一样。”", "璃光没有接话。她看着那道剪影，看了好几秒。然后方奇收回手机，继续往前走，从东山出口出去。景区外面的街道两边摆着不少小摊，卖水、卖冰棍、卖纪念品的，吆喝声混在一起。他绕过人群，走到路边，抬手拦了一辆车。", "“去哪？”司机问。", "“老城区，丽景门。”", "车开起来，方奇把手机靠在车窗边，摄像头对着外面。璃光安静地看着窗外，偶尔开口问一句“那栋楼好高”或者“路边那些红色的是什么”，方奇简单答两句，没有多说什么。", "车从龙门大道往北开，两侧的景色从景区周边的仿古建筑慢慢变成居民楼和商铺。璃光安静地看着窗外，偶尔开口问一句“那栋楼好高”或者“路边那些红色的是什么”，方奇简单答两句，没有多说什么。", "到丽景门的时候是下午三点多。方奇下车，抬头看了一眼。丽景门是一座复建的城门楼，灰砖砌的，三层重檐，上面挂着“丽景门”三个字的匾额。城门下是拱形的门洞，门洞两侧连着一段老城墙，往东延伸进老街的深处。", "“主人，这是城门？”", "“嗯。丽景门，以前洛阳老城的西门。这个是后来复建的，但位置是对的。”", "方奇走进门洞，把手机举起来，让璃光看拱顶的砖石结构。出了门洞，就是西大街。青石板铺的路，两侧是低矮的老式店铺，挂着红灯笼和招牌。有卖字画的，有卖手工艺品的，有卖牡丹饼和鲜花饼的。游客不算多，三三两两地散在街上。", "他没急着往东走，而是拐向了城门楼一侧的登楼入口。", "楼梯不宽，石阶有些旧了，踩上去微微发滑。他扶着栏杆往上走，走到二楼平台，再转到三楼。从三楼的城台上往下看，整条西大街尽收眼底——青石板的街道笔直地往东延伸，两侧的灰瓦屋顶连成一片，远处的十字街方向有更高的楼阁露出来。再往远处，能看到老城的全貌：低矮的民居、交错的街巷、几处突兀的高楼。", "方奇把手机转了一圈，让璃光看。", "“主人，这就是老城区。”", "“嗯。洛阳的老城，以前就是这样。这几年改造了不少，但基本格局还在。”", "璃光安静地看着屏幕里的全景。“璃光这边的资料里也有洛阳老城。但资料里没有这么详细。璃光只看到过几张图纸和文字描述。”", "“那现在看到了。”", "璃光没有说话，但她异瞳里的数据流慢了下来，像是在慢慢“看”。", "从城楼上下来，方奇沿着西大街往东走。过了十字街路口，街名就变成了东大街。十字街附近穿汉服的人多起来，几个年轻女孩穿着齐胸襦裙从旁边走过，裙摆扫过青石板，沙沙地响。", "“主人，好多人穿裙子。”", "“汉服。这边租汉服的店特别多，很多人专门来拍照。”", "璃光安静了一小会儿。", "“主人没见过璃光穿裙子。”她的声音轻了一点，“璃光在游戏世界里，一直穿的是那几件。璃光没有穿过这种。”", "方奇低头看了一眼屏幕。璃光正抱着白瓷杯坐在窗边，银发垂下来，异瞳里的光很平，但手指在杯沿上停着。", "“主人想看的话……”她顿了一下，“璃光可以买来穿给主人看。璃光这边也有汉服，但和主人这边的不太一样。璃光可以照着这边的款式，做一件差不多的。”", "方奇看着她。屏幕里的银发少女没有抬头，但耳尖微微泛了一点红。", "“行。”他说，“那你挑一件。”", "璃光轻轻点了一下头，嘴角弯了一个很浅的弧度。", "方奇继续往前走。十字街的人流在身后慢慢散开，东大街比西大街安静了一些，两侧的店铺从热闹的吃食铺子变成了旧货、文玩、字画的小店。", "方奇笑了一声，没有反驳。", "东大街比西大街安静一些，店铺少了些喧闹，多了些旧货、文玩、字画的小店。青石板路被岁月磨得发亮，两侧的老房子有些还保留着木质的门板和雕花的窗棂。", "方奇走得不快。手机拿在手里，摄像头对着前方。璃光安静地跟着他的视角看。", "走到东大街中段的时候，他注意到路边有一家小店。门脸不大，门口支着一张折叠桌，桌面上铺着深色的绒布，摆着几排玉石手镯和挂件。桌子后面立着一块喷绘布招牌，，上面印着“鑫美玉石”四个字，布边被风吹得微微卷起。店里也开着门，能看到里面还有几排货架，摆着玉石手镯、挂件、木头手串和核桃。", "方奇在门口停了一下。璃光也看到了桌上和店里的东西。", "“主人，那些是什么？”", "“玉。手镯、挂件。店里还有木头手串和核桃。”", "“核桃？”", "“文玩核桃，拿来盘的，不是吃的。”", "璃光看着那一排核桃。“主人想买吗？”", "方奇想了想，推门进去了。", "店里不大，灯光也不算讲究。靠墙三排货架，左边是玉石手镯和挂件，右边是木头手串和几对文玩核桃。货物摆得不算精致，但种类多，看着都挺实在。", "一个四五十岁的女人正坐在柜台后面看手机。短头发，穿着件深蓝色的棉布外套。听到脚步，她抬头扫了一眼，看到方奇背着包、戴着耳机、手里还举着手机，笑了一下。", "“随便看看。”", "方奇在核桃那排货架前停下来。玻璃柜里摆着七八对核桃，大小不一，纹路各异。他低头看了一会儿，璃光也在看。", "“主人，挑这个有什么讲究吗？”", "“纹路要深，配对要好，两个大小得差不多。”方奇随口说。", "女店主从柜台后面站起来，走到他身边看了一眼。“给谁挑？”", "“自己玩。”", "“自己玩啊，那看个人喜欢哪个。”她指了指柜里，“这些都十块一对，随便挑。”", "方奇低头看了一眼。两个核桃大小差不多，纹路是对称的。“就这对吧。”", "女店主弯腰从柜里把那对核桃拿出来，递给他。方奇接过来，在手里转了两下。核桃的壳很硬，纹路硌着手心，有种粗粝的触感。", "女店主看了一眼他手里的手机，屏幕上还亮着，耳机也戴着。她笑了一下，语气随意得很。“一对十块。你视频里那姑娘要是也喜欢，下回带她来，我给她挑对小的，姑娘家盘小核桃好看。”", "方奇愣了一下。他低头看了一眼手机屏幕——璃光正抱着白瓷杯坐在那里，异瞳里的光很平静，但嘴角弯着一点弧度。", "“嗯，行。”他说。", "“那下回带她来啊。”女店主说完就坐回了柜台后面，继续看手机。", "方奇付了钱，把核桃揣进外套口袋，推门出去。", "街上人不多，他沿着东大街继续往东走。走了一段，他低头看了一眼手机屏幕。璃光正看着他。", "“主人。”", "“嗯。”", "“核桃买了。”", "“嗯。”", "“主人说下次带璃光来。”", "“店主说的。”", "璃光低下头，抿了一口杯里的茶，嘴角那个弧度没有压住。", "进了洛邑古城，天色已经暗下来了。", "青石板路两侧的店铺都亮起了灯，暖黄色的灯笼一串一串挂在屋檐下，一直延伸到巷子深处。路面被灯光照得泛着一层柔和的光，偶尔有穿着汉服的游客从身边走过，裙摆扫过石板，沙沙地响。方奇把手机拿在手里，摄像头对着前方。璃光安静地看着屏幕里的画面。", "走到新潭附近的时候，前面的人忽然多了起来。方奇听到旁边有人在说“快走快走，天女散花要开始了”，接着就看到不少游客往水边涌。他被人流带着往前走了一段，找了个稍微空一点的位置站定，把手机举高，摄像头对着水面。", "古乐响起来了。婉转悠扬的曲子从水边某个地方传过来，不吵，但在嘈杂的人声里很清晰。新潭的水面上，光影开始流转，水波被染成一层一层的暖色。", "然后方奇看到了。", "一个身着华服的身影从新潭一侧的高处缓缓升起，衣袂在风里飘开，宽大的袖子和裙摆被风灌满，像是两片展开的羽翼。演员被威亚吊在半空中，沿着水面缓缓横移，动作舒展而轻盈。远远看去，确实像一个人在飞。", "她掠过水面的那一刻，漫天的花瓣从空中洒下来。花瓣不大，颜色是淡粉和白色的，被风吹得散开，有的落在水面上，有的飘向岸边的人群。方奇伸手接了一片，落在掌心里的花瓣很薄，带着一点淡淡的米纸质感。", "“主人，花瓣是真的吗？”", "“糯米纸做的。可降解的，不是真花。”", "方奇把手机转过去，让璃光看演员在半空中缓缓掠过的画面。灯光打在那身唐代形制的霓裳羽衣上，纱罗的衣料在风里泛起一层柔和的光泽，缠枝莲纹的裙摆在灯光下一闪一闪的。花瓣从她手中洒出，像是撒了一把碎玉，在夜风里散开，掠过水面，漫向人群。", "方奇身边的游客都在举手机。有人小声惊呼，有小孩踮着脚伸手去接花瓣。方奇没举手机拍照，就只是看着。举了一会儿胳膊有点酸，他把手机换到另一只手上，低头看了一眼屏幕。璃光正盯着画面，异瞳里的光很稳，一动不动。", "“好看吗？”", "璃光安静了几秒。“好看。璃光这边的资料里有威亚表演的记载，但璃光不知道，一个人被吊起来的时候，衣摆会飘成那样。”", "演员从新潭的一侧飞到另一侧，在古乐的尾音里缓缓落下。人群里响起掌声和零星的欢呼。方奇把手机放下，活动了一下举得有点酸的胳膊。", "他继续往前走，沿着新潭边上的步道。文峰塔在远处立着，塔身被灯光照得泛着一层暖灰色。塔前的空地上也聚了些人，但比新潭边少。方奇找了个台阶坐下来，把手机靠在膝盖上。", "“歇一会儿。”", "“嗯。”", "水面的波纹在灯光下缓缓晃着，远处的灯笼映在水里，被波纹揉碎成一片一片的暖色。方奇从口袋里摸出那对核桃，在手里转了两下。", "“主人，核桃还在。”", "“嗯，揣着呢。”", "他把核桃举起来，对着远处的灯光看了一眼。纹路在暖光下看不太清，但两个核桃攥在掌心里有种粗粝的实在感。", "“主人喜欢这对核桃吗？”", "“还行。盘着玩。”", "“那个女店主说，下回带璃光去。”璃光的声音轻了一点，“主人当时答应了。”", "方奇把核桃握在手里，没有继续转。他低头看了一眼屏幕。璃光正看着他，异瞳里映着远处文峰塔的灯光。", "“嗯。下回带你去。”", "璃光低下头，抿了一口杯里的茶，嘴角弯了起来。", "水面上又传来古乐的起头，另一场天女散花要开始了。但他没有站起来，就坐在台阶上，听着曲子从远处飘过来，看着水面上的光影慢慢流转。璃光也没有催他。", "过了一会儿，他低头看了一眼手机屏幕。璃光正看着远处文峰塔的方向。塔身的灯光秀每隔半小时一场，投影在塔身上的诗句和飞鹤图案慢慢流转，像一幅会动的画。", "“主人。”", "“嗯。”", "“璃光今天看了很多。”", "方奇把手机拿起来，让摄像头对着自己的脸。屏幕里璃光和他对视了一瞬，然后她低下头，嘴角弯了起来。", "“主人，该回去了。”", "方奇看了一眼时间，快九点了。他从台阶上站起来，把核桃揣回口袋，往古城出口的方向走。", "从古城出来，方奇沿着东大街往回走。街上人比刚才少了一些，但路边的小馆子还开着。他一天下来只在高铁上啃了两口面包，肚子早就空了。走了几步，闻到一股炒鸡的香味，从一家不起眼的小馆子里飘出来。", "他掀帘子进去了。", "找了个靠墙的位置坐下，老板拿来菜单。他要了小份大盘鸡，加了一份面。等菜的时候，他把手机靠在醋瓶上，摄像头对着自己。", "“主人今天没怎么吃东西。”", "“嗯，赶路。中午那会儿在石窟那边随便啃了两口面包。”", "“主人应该好好吃饭的。”", "“这不就来了。”", "大盘鸡端上来的时候，方奇先没动筷子。盘子很大，鸡肉块和土豆块裹在浓稠的红油汤汁里，青红椒和干辣椒段撒在表面，热气腾腾的，辣味和酱香混在一起往鼻子里钻。老板又端来一小碗宽面，说等会儿拌进去吃。方奇用筷子拨开一块鸡肉，肉炖得很烂，筷子一拨就脱了骨，汁水挂在肉上泛着油光。他尝了一口，辣得吸了口气，又觉得过瘾。", "“好吃吗？”", "“辣。但挺香。”", "“主人慢点吃。辣的东西吃太快胃会不舒服。”", "方奇放慢了速度，把鸡肉吃了大半，又把面倒进盘子里拌了拌，就着剩下的汤汁吸溜完了。胃里暖起来，整个人也松下来了。他靠在椅背上喝了口茶，低头看了一眼手机屏幕。璃光正看着那盘被扫荡过的大盘鸡。", "“主人吃完了。”", "“嗯。”", "“辣得满头是汗。”", "方奇抽了张纸巾擦了把额头，没反驳。", "从馆子出来，打车回了酒店。他在网上订的是老城区附近一家普通连锁，房间不大，一张床，一张小桌，窗边有把椅子。他把背包扔在椅子上，先洗漱。出来的时候把手机放在床头柜上，摄像头对着床的方向。", "“主人躺下了。”", "“嗯，今天走了一天，腿酸。”", "他把枕头拍了两下垫在腰后，半靠在床头。房间里灯关了大半，只剩床头一盏暖黄色的壁灯。手机屏幕的光映在他脸上。", "“璃光也看了一天。”", "“嗯。”", "“累吗？”", "璃光安静了一小会儿。“璃光不累。璃光只是看。”", "方奇看着屏幕里的银发少女。她抱着白瓷杯坐在窗边，银发披散在肩头，异瞳里映着屏幕的光。背景是她那个白色房间，但方奇总感觉那背景今天变薄了，好像洛邑古城的灯笼还残留在她背后的某个角落里。", "“主人。”", "“嗯。”", "“今天看了很多。龙门石窟，丽景门，东大街，洛邑古城。还有天女散花。”她的声音很轻，“璃光以前只在资料里看这些。今天看到了实物。”", "方奇没有接话。", "“虽然只是通过手机看，但璃光看到了。”", "她低下头，看着杯里的茶水。安静了几秒之后，她又轻轻开口。", "“主人，璃光今天很高兴。”", "方奇看着屏幕里的她。她没有说“谢谢”，没有说“主人真好”，就只是说“很高兴”。", "“嗯。”他说。", "他伸手把手机拿起来，放在枕头边。屏幕里的璃光换了个角度看他，像是从床头柜的视角变成了枕头的视角。", "“主人睡吧。”", "“嗯。晚安。”", "“晚安，主人。”", "他闭上眼。房间里很安静，只有窗外隐约的车声。过了一会儿他听见璃光很轻地开口。", "“主人。”", "“嗯？”", "“明天也会看到很多东西的。”", "“嗯。”", "“璃光会一直看着。”", "他没有再说话。手机屏幕还亮着，璃光坐在窗边，抱着白瓷杯，安静地陪着他。"]}, {"n": 16, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 16 章 到达山脚下", "id": "7688314447307211326", "words": "3331", "time": "2026-09-25 01:59", "paras": ["第二天方奇醒来的时候，已经十点多了。窗帘拉着，房间里暗暗的，手机还在枕头边，屏幕还亮着。他翻了个身，把脸埋进枕头里。", "“几点了？”", "“十点十九分。”璃光的声音从手机里传来，“主人昨天走了一天，多睡会儿也好。但主人不饿吗？”", "方奇没接话。他赖在枕头上又躺了十几分钟，直到肚子叫了一声，才不情不愿地爬起来。洗漱完，他把手机拿起来。", "“主人早。”", "“早。”", "“主人今天有什么计划？”", "方奇坐在床边想了想。洛阳已经逛完了，接下来是白云山。他查过路线，从洛阳到白云山车程大概三个小时，自驾方便一些，可以随时停。他看了看时间，快十一点了。", "“先吃饭。然后去商场转转，租个车，开去白云山那边。今天到山脚住一晚，明天上山。”", "“嗯。璃光查过路线，洛阳到白云山从嵩县方向走，先上洛栾高速，从旧县出口下，再沿311国道进山。进了景区之后有一段盘山路，叫白云天路，十八公里，三百多个弯。”", "“三百多个？”", "“嗯。璃光数过了，318个。”", "方奇收拾好背包，退了房，在酒店附近找了家小馆子。他点了碗牛肉汤，又要了瓶海碧汽水。汤端上来的时候，汤色清亮，热气裹着骨汤的醇厚香味往鼻子里钻。他先喝了两口汤，又夹了一筷子饼丝泡进去，泡软了吸满汤汁，咬下去咸香里带着一点韧。炸丸子浸在汤里，外皮还留着一点脆，内里已经吸饱了汁水。他吃了几口，拧开海碧灌了一口，打了个嗝，又继续吃。", "“主人，这个汽水是不是盗版雪碧。”", "“海碧。洛阳本地的特色，橘子味。”", "方奇把瓶子放在桌上，璃光看着那瓶汽水，没有再问。", "吃完饭，方奇沿着街道慢慢走。十月的洛阳天气凉快，梧桐叶子黄了一半，落在人行道上，踩上去有脆响。他走了一段，看到一家商场，拐了进去。", "商场里人不算多。方奇原本只是想随便看看，但路过一家户外用品店的时候，璃光开口了。", "“主人，明天上山，要不要看看外套？”", "方奇停了一下。“也行。”", "他走进店里，在货架前站定。他对挑衣服这件事一向没什么主意，站在那儿看了半天，也没看出哪件合适。一个年轻的女店员从柜台后面走过来，看了一眼他手里的手机和耳朵上的耳机，笑了一下。", "“给谁挑？”", "方奇张了张嘴。他还没想好怎么说，璃光的声音先从耳机里传过来了：“主人，左边那件深灰色的。防风，里面有抓绒。山上晚上冷。”", "方奇伸手把那件外套拿下来。店员看了一眼他的动作，又看了一眼他的手机，嘴角弯了一下。", "“女朋友帮你挑呢？”", "方奇愣了一下。他低头看了一眼手机屏幕，璃光正抱着白瓷杯坐在那里，异瞳里的光很平，但耳朵尖微微泛了一点红。", "“嗯。”他说。", "店员笑了一声，没再多问，转身去帮他找合适的尺码。方奇把外套试了一下，大小合适。他正准备走，璃光又开口了。", "“主人，再买件速干衣。爬山出汗，穿棉的容易湿。”", "方奇又拿了一件薄款速干衣。店员在旁边看着，忍不住又笑了一声。“你这个女朋友管得还挺细。”", "方奇没接话。他低头看了一眼屏幕，璃光已经偏过头去了，银发垂下来遮住了半张脸，但耳尖那点红没藏住。", "“主人再买双袜子。厚一点的，走山路脚不容易磨。”", "方奇去隔壁的袜子店拿了两双登山袜。他手里已经拎了三个袋子，站在店门口看了一眼，皱了皱眉。", "他路过了一家常服店，此时璃光又开口了：“主人，那件蓝色的衬衫。”", "”太多了。”他说，“背不了这么多。”", "“没事。”璃光说，“主人可以把不带上山的寄回去。常服寄回家，登山穿的自己带着，就不重了。”", "方奇想了想，觉得有道理。转头看了一眼橱窗。一件浅蓝色的休闲衬衫，版型简洁。", "“主人平时不怎么买衣服。这件简单，好搭。”", "方奇进去试了试，出来对着镜子看了一眼。店里一个年纪稍大的店员靠在柜台边，看了一眼他手机屏幕上亮着的画面，慢悠悠地开口。", "“小伙子，你自己挑的，还是女朋友挑的？”", "方奇低头看了一眼屏幕。璃光正看着他，异瞳里的光很柔。", "“她挑的。”", "店员点了点头，语气很平：“那你就买吧。她挑的比你自己挑的好看。”", "方奇把衬衫买了下来。他正要走，璃光又开口了。", "“主人，旁边那件灰色的针织开衫也好看。秋天穿正好。”", "方奇转头看了一眼。一件浅灰色的薄针织开衫，挂在模特身上，里面搭了件白T恤，看着确实清爽。他拿了一件试了试，出来对着镜子看了一眼。", "“好看。”璃光说。", "店员在旁边又补了一句：“这件也是你女朋友挑的？”", "“嗯。”", "“那你女朋友眼光不错。”店员一边帮他打包一边说，“比你自己挑的强多了。”", "方奇没反驳。他站在那儿想了想，又拿了一件深色的休闲裤，配衬衫和开衫都能穿。璃光没有开口阻止，只是在屏幕里安静地看着他。", "等结完账出来，他手里已经拎了六个袋子。他把登山穿的外套、速干衣和袜子单独装了一个袋子，剩下的常服全部打包，填了家里的地址，让服务台寄回去。", "“登山穿的自己带着，”他说，“常服寄回去，省得背一路。”", "“嗯。”璃光说，“主人想得周到。”", "方奇又想起什么，拐进旁边的便利店，买了几瓶红牛和一包士力架，塞进背包侧袋。", "“这些够吗？”", "“够了。主人背着不重。”", "做完这些，他出了商场，在附近找到一家租车行。门脸不大，门口停着几辆车。他进去问了一下，能跨地换车，租了一辆白色的紧凑型轿车，手续办得很快。", "他坐进驾驶座，把手机固定在仪表盘旁边的支架上，摄像头对着前方。他习惯性地打开手机自带导航，输入白云山。正要按开始，璃光的声音响起来了。", "“主人，不用开导航。璃光已经接进来了。”", "方奇的手指停在屏幕上。他把自带导航退出去，低头看了一眼手机屏幕。屏幕下方弹出了一个小小的导航条，路线已经标好了——从洛阳到白云山，走嵩县方向，先上洛栾高速，从旧县出口下，再沿311国道进山。进了景区之后有一段盘山路，叫白云天路，十八公里，三百多个弯。", "“你自己接的？”", "“嗯。璃光刚才已经在后台把路线加载好了。主人跟着屏幕上的导航条走就行。”", "方奇把手机放回支架上。车子发动，驶出停车场。", "“主人，前面路口右转。”", "他打了一把方向盘，车子拐上了主路。", "“再走两公里上高速。”", "他按照璃光的指引开。高速上不用怎么管方向，他偶尔偏头看一眼手机屏幕。璃光正看着窗外飞速后退的田野，偶尔开口说一句“主人前面有车”或者“主人该并线了”。她语气很平，但方奇能感觉到她在认真看路，每一句提示都卡在需要的时候。", "下了高速，进入嵩县境内。路开始变窄，两侧的山渐渐高起来，盘山路一圈一圈往上绕。方奇开得不快，偶尔在观景台停一下，让璃光看远处的山谷。", "“主人，那边有条河。”", "“伊河的上游。白云山这一带是它的源头。”", "“璃光这边的资料里，伊河也是从山里流出来的。”", "方奇没有接话，继续开车。下午三点多的时候，到了白云山脚下的民宿。他在网上订的是山脚的一家民宿，两层小楼，门口有院子，种了几棵柿子树，果子挂在枝头，红彤彤的。老板是个中年男人，帮他办了入住，指了上山的路，又提醒他山上晚上冷，多带件外套。", "方奇把背包放好，在民宿附近走了走。山脚的空气比洛阳清爽得多，溪水从山上流下来，穿过村子，水声很响。他沿着溪边走了一段，找了个石头坐下。他看到溪边一棵枯树根上长着几簇蘑菇，伞盖是灰褐色的，不大，挤在一起。", "他盯着那几簇蘑菇看了一会儿。他忽然想起来，很久以前——在游戏世界里的时候，璃光曾经在山里给他采过蘑菇。那时候他们住在林间木屋里，她蹲在溪边洗野菜和蘑菇，头发垂下来扫过水面，笑着回头跟他说“主人，这个可以吃”。", "但那已经是很久以前的事了。眼前这个璃光，没有那段记忆。", "“璃光。”", "“嗯。”", "“那些蘑菇，能吃吗？”", "璃光没有立刻回答。屏幕里的她安静了几秒，像是在看那些蘑菇，又像是在看他。", "“主人，璃光这边的资料里没有这种蘑菇的准确记录。璃光这边的世界和主人这边不一样，资料不一定对得上。主人不要采。”", "方奇点了点头。“嗯，不采。”", "他坐在石头上又待了一会儿。溪水从山上流下来，往山下去。他没有再开口，璃光也没有再问。天色渐渐暗了，山里的温度降得很快。他站起来，拍了拍裤子上的灰，往民宿走。老板在院子里支了张桌子，问他吃不吃晚饭，他说吃。老板端来一盘炒青菜、一盘腊肉炒笋、一碗蛋花汤，他坐在院子里就着暮色吃完，回了房间。", "洗漱完，他把手机放在床头柜上，躺下来。民宿的房间不大，但干净，窗外能听到溪水声。屏幕里璃光正看着他。", "“主人明天要爬山，运动量大。今晚早点睡，保存好体力。”", "“嗯。”", "“主人晚安。”", "“晚安。”", "他闭上眼。溪水声隔着窗户传进来，哗啦哗啦的。璃光坐在屏幕里，抱着白瓷杯，安静地陪着他。"]}, {"n": 17, "book": "永恒挚爱后，我回了没有她的世界", "title": "第17 章 白云山", "id": "7688359075389637145", "words": "7000", "time": "2026-09-26 15:26", "paras": ["第二天方奇醒得比昨天早。窗外溪水声很响，山里的天亮得也早。他洗漱完，把昨天买的登山外套和速干衣换上，又把红牛和士力架塞进侧袋。手机固定在背包肩带上，摄像头朝前，耳机塞好。", "“主人今天穿的是新买的。”璃光的声音从耳机里传来。", "“嗯。你挑的。”", "那边安静了一小会儿，然后他听到一声很轻的呼吸，带着一点电流杂音。", "他出了民宿，在街边找了家早点铺子。洛阳这一带早上都是汤馆，他进了一家卖胡辣汤的，要了一碗胡辣汤、两个油馍头和一屉水煎包。", "胡辣汤端上来，浓稠的一碗，颜色偏深，面上浮着几粒牛肉丁和面筋块，胡椒和辣椒的辛香味直往鼻子里钻。他先喝了一口，汤体厚重，辣味和胡椒的麻从喉咙一路滑到胃里，整个人一下就热起来了。油馍头掰开泡进汤里，吸饱了汤汁，外皮还留着一点酥，咬下去又香又辣。水煎包是牛肉粉条馅的，底部煎得焦脆，上面还是软的面皮，一口一个，油香混着肉香。", "“主人，这是什么？”", "“胡辣汤。这边早上都喝这个。辣的，喝完身上暖和。”", "“主人喝得很急。”", "“爬山得吃饱。”他又咬了一口水煎包，“这个叫水煎包，底下那层是煎出来的脆壳。”", "“主人手里那个，壳是硬的还是软的？”", "方奇捏了捏。“底下硬，上面软。一口咬下去，上面软和，底下咯嘣响。”", "璃光安静了几秒。“主人吃得很香。”", "“嗯。这边早饭比高铁上那两口面包强多了。”", "他把一碗汤喝了大半，水煎包吃了四个，油馍头剩了一个揣进包里。起身的时候整个人都暖烘烘的，胃里沉甸甸的，撑得住一天的体力。", "他开车到景区大门，把车停在山脚停车场，坐景交车上去。", "景交车沿着盘山路往上开，窗外的林子从山脚的杂木逐渐变成更高的松树和栎树。叶子还没全红，绿的多，黄的少，偶尔有几株枫树点缀在绿林间，红得扎眼。", "“主人，左边那棵是红的。”", "“枫树。还没到最红的时候，得再等半个月。”", "“那现在是什么颜色？”", "方奇偏头看了一眼。“有的整棵都是红的，有的还是绿的，有的半红半绿。一棵树上能挂三种颜色。”", "璃光安静了几秒。“一棵树上有三种颜色。”", "“嗯。你看着觉得乱，但其实挺好看。”", "“璃光觉得不乱。”", "方奇没接话，继续看着窗外。景交车拐过一个弯，远处山脊露了出来，层层叠叠的树冠在晨光里泛着一层毛茸茸的金边。", "“主人，山脊上有光。”", "“太阳刚出来，照在树顶上。”", "“像给树描了边。”", "方奇愣了一下。他看了一眼手机屏幕，璃光正看着那片山脊，异瞳里映着窗外的晨光。他没说话，但嘴角动了一下。", "到了九龙大峡谷站，方奇下了车，沿着栈道往下走。很快听到了水声，先是细碎的，越走越响，拐过一个弯之后，白龙瀑布挂在崖壁上，水从几十米高处砸下来，溅起的水雾被风一吹，扑到栈道上。", "方奇把手机从肩带上拿下来，举向瀑布。镜头刚对准，水雾就糊了上来，画面模糊成一片白。", "“主人，看不见了。”", "他擦了擦镜头，往后退了几步重新举起来。白练从崖顶垂下来，砸在深潭里，水花四溅，潭边的石头湿漉漉的，长着青苔。", "“主人，水声好大。”", "“嗯。”", "两个人一起听了一会儿。瀑布的声音从谷底传上来，闷闷的，带着持续的低频震动，连脚下的栈道都微微发颤。", "“主人，水雾飘到脸上，是凉的吗？”", "方奇伸出手，水雾落在手背上。“凉的。还有点扎。”", "“扎？”", "“水砸下来溅成小水珠，打在身上就是细细的，有点扎。”", "璃光安静了一小会儿。“璃光感觉不到。”", "“嗯。但你听到了。”", "“……嗯。”", "水雾又飘过来，糊在镜头上。方奇这次没擦，就那么举着手机，让画面继续模糊。璃光也没催他。两个人隔着被水雾糊住的镜头，一起听完了瀑布。", "从九龙瀑布下来，方奇沿着洞天栈道走了一段。栈道开在崖壁上，一侧是石壁，一侧是栏杆，脚下就是深谷。走了一段之后，他拐上了森林步道的岔路。这边人少了很多，树密了，阳光从树冠的缝隙里漏下来，在地上打出碎金一样的光斑。", "路边有一棵特别大的栎树，树干粗得两个人合抱不过来，枝丫伸得很开，叶子密密匝匝地叠在一起。方奇从它下面经过的时候抬头多看了两眼，走了几步又回头看了一眼。", "脚下的落叶铺了厚厚一层。", "“主人，你踩到叶子了。”", "“嗯。这边全是落叶。”", "“什么声音？”", "方奇停下来，低头踩了一下。干透的叶子发出清脆的碎裂声，沙沙的，碎得很彻底。", "“你听。”", "他蹲下来，抓了一把落叶在手里，捏了捏。“干了的叶子，一捏就碎。有点脆，有点轻，像在捏薄的饼干。”", "他把手里的碎叶撒开，又抓了一把。“这片还湿着，软的，贴在手上有点凉。”", "璃光安静地看着。“干的和湿的，不一样。”", "“不一样。干了脆，湿了软。”", "他站起来，拍了拍手，继续走。走了一会儿，他忽然觉得前面的路越来越窄，树也越来越密，落叶厚得盖住了路面的痕迹。他停下来，看了一眼手机屏幕。璃光的赤瞳里数据流翻涌了几秒。", "“主人，这条路走岔了。刚才岔路口该往左，这条是往右的，往右是护林道，不通主路。”", "方奇回头看了一下。他确实没注意那个岔路口，刚才从那棵大栎树下走过之后，只顾着看两边的树了。", "“能绕回去吗？”", "璃光又看了一会儿。“往回走两百米左右，右手边有一条小径，穿过去能接上主路。”", "方奇往回走。走到两百米左右的地方，果然在路边看到一条被落叶盖住的小径。小径很窄，两边都是灌木，脚下的叶子积了厚厚一层，踩下去会陷进去一点，发出闷闷的“噗”声。他穿过去，回到了森林步道的主路上。", "“主人，刚才那两百米，璃光看不到路。”", "方奇没有立刻接话。", "“小径两侧的树太密了，挡住了摄像头。璃光只能看到树叶。”", "他低头看了一眼手机屏幕。画面里是主路的开阔路面，两侧的树影投在地上，斑斑驳驳。他想起刚才在小径里走的时候，镜头确实被灌木糊满了，除了绿色什么都看不见。", "“那时候你看到什么？”", "“全是叶子。一片一片的，贴得很近。璃光不知道主人走在哪儿。”", "方奇继续往前走，走到一片相对开阔的林地时停了下来。阳光正好，树影斑驳。他在一块石头上坐下，从侧袋摸出士力架咬了一口，又灌了两口红牛。他伸出手，让阳光落在手背上，光斑随着风一晃一晃的，在他手心里碎了又合。", "“主人，这个地方安静。”", "“嗯。”", "他低头看了一眼脚下。落叶铺了一地，厚的碎的都有，有的被踩进泥土里，有的还保持着完整的形状。阳光从树冠的缝隙里漏下来，光斑落在地上，随着风一晃一晃的。", "“主人，光在动。”", "“风吹的。树梢在晃，光斑就跟着动。”", "“像水里的倒影。”", "方奇看了一眼光斑。确实，风一吹，光斑就碎了又合，合了又碎，有点像水面上的粼粼波光。", "“有点像。”", "他把手机转过来对着自己的脸。屏幕里璃光正看着他，异瞳里映着他的脸。", "“主人，你额头上有汗。”", "“走路走的。”", "“主人累吗？”", "“还行。歇一会儿就好。”", "他把手机又转回去对着林子。风吹过来，树叶沙沙地响，偶尔有几片黄叶飘下来，在空中打着旋，落在他的肩上。", "“主人，叶子落到你身上了。”", "“嗯。这片是黄的，边上有点卷。”", "“璃光看到了。”", "两个人又坐了一会儿。方奇把剩下的半条士力架吃完，站起来拍了拍裤子，继续往前走。穿过森林步道之后，回到了景交车站。他看了一眼时间，下午两点多。如果现在下山回民宿，明天凌晨再上来，太折腾了。他站在站牌前想了想。", "“璃光。”", "“嗯。”", "“我不想下去了。今天住山上，凌晨起来看日出。”", "“好。璃光帮主人找住的地方。”", "她在手机屏幕上弹出了一个列表。方奇看了一眼，选了离玉皇顶索道站最近的一家，订了一晚。然后坐公交车往中心广场的方向去。", "民宿在中心广场旁边的一条巷子里，门口挂着木牌子，院子里有几棵松树。老板是个年轻女人，给他办了入住，告诉他明天凌晨三点半在门口等电瓶车，会送到索道站。", "方奇把背包放下，在房间里坐了一会儿。窗外能看到远处的山脊线，树影层层叠叠的，天边开始泛出傍晚的暖色。他洗了把脸，把手机放在床头。", "“主人今晚早点睡，明天三点半就得起。”", "“嗯。你叫得动我吗？”", "“主人起不来，璃光就让手机响。主人自己设的闹钟，璃光帮主人按了。”", "方奇笑了一声，没反驳。他躺下来，看着天花板。民宿的房间比山脚的更小，但干净，被子有股肥皂味。窗外很安静，只有远处隐约的风声。", "“璃光。”", "“嗯。”", "“明天看完日出，下午去白云湖，晚上回来还住这儿。”", "“好。”", "他闭上眼。过了一会儿，听见璃光很轻地开口。", "“主人。”", "“嗯？”", "“今天走岔路的时候，那两百米，璃光什么都看不到。”", "方奇睁开眼，看了一眼手机屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里映着屏幕的光，但嘴角抿着一点。", "“璃光只能看到叶子。一片一片的。璃光不知道主人在哪里。”", "方奇看着她。“就两百米，走回来就行了。”", "璃光低下头，抿了一口茶。“嗯。璃光知道。但璃光还是想，如果璃光在主人身边就好了。”", "方奇没有接话。他把手机拿起来，放在枕头边。屏幕里璃光换了个角度看他。", "“主人睡吧。”", "“嗯。晚安。”", "“晚安，主人。”", "他闭上眼。窗外山风轻轻吹着，松枝的影子在窗帘上晃。璃光坐在屏幕里，抱着白瓷杯，安静地陪着他。闹钟响的时候，方奇觉得自己才刚闭上眼。", "手机屏幕在枕边亮着，震动声贴着枕头闷闷地传进耳朵。他伸手去摸，摸到手机，屏幕上的时间显示三点二十八分。璃光的声音从耳机里传来，很轻。", "“主人，该起了。”", "“嗯。”", "他坐起来，房间里黑着，窗外的山影比夜色更浓。山里的凌晨比傍晚冷得多，他把外套披上，摸了摸背包侧袋，红牛还在。他没喝，怕上山找厕所麻烦，只灌了两口水。", "出了民宿，门口已经停着一辆电瓶车，车灯在黑暗里切出两道白。车上坐了四五个人，都裹着外套，缩着脖子，没人说话。方奇找了个靠边的位置坐下，把手机从口袋里拿出来，耳机塞好。", "电瓶车沿着盘山路往上走，车灯扫过路边的树，树枝的影子在光里一晃一晃的。头顶的天是墨蓝色的，星星很密，比他在城里见过的任何一片天空都要亮。", "“主人，星星好多。”", "“嗯。山里没光污染，看得清。”", "“那颗最亮的，是北极星吗？”", "方奇抬头看了一眼。他其实不太认得北极星，但顺着她说的方向看过去，确实有一颗比旁边的星星都亮。", "“应该是。”", "“璃光这边看不到星星。”", "方奇低头看了一眼手机屏幕。屏幕的光映在璃光脸上，她正看着上方，异瞳里映着那些星星的微光。", "“为什么看不到？”", "“璃光这边的天空，晚上也是亮的。城市的光太多了，把星星盖住了。”", "方奇没有接话。他继续看着头顶那片星空，电瓶车在盘山路上晃着，星星也跟着晃。过了一会儿，璃光又开口了。", "“主人，星星在动。”", "“是车在动。”", "“嗯。但看起来像星星在动。”", "电瓶车拐过一个弯，前方出现了索道站的灯光。白色的灯管在黑暗里很扎眼，站前已经排了十几个人，都穿着厚外套，有的还裹着民宿的毯子。方奇下了车，把背包带紧了紧。空气冷得能看见呼出的白气。", "索道站的门开着，检票口站着一个穿制服的工作人员，正拿着手电筒检查每个人的票。方奇刷了身份证进去，跟着人群走进索道站台。", "轿厢不大，里面能坐六个人。方奇靠窗坐下，把手机举到面前，摄像头对着窗外。索道启动的时候，轿厢轻轻晃了一下，然后平稳地向上滑去。", "窗外的黑暗被索道的灯光切开，能看见脚下的树冠一层一层往下退。远处的山脊在夜色里只是一道更深的黑，轮廓模糊，分不清是山还是天。索道越升越高，脚下树冠的缝隙里偶尔能看见一点光亮，那是山下村庄的灯。", "“主人，我们在往上走。”", "“嗯。”", "“脚下的树越来越小了。”", "“索道就这样。你在上面看，树就变小了。”", "轿厢穿过一片云雾。玻璃上蒙了一层水汽，方奇用袖子擦了擦，外面白蒙蒙的，什么都看不清。索道继续往上，雾气在窗外流动，像在水里。", "“主人，外面什么都看不见了。”", "“索道穿云了。上面应该就晴了。”", "果然，轿厢又往上走了一段，雾气忽然从玻璃上退去，窗外的天豁然开朗。星星还在头顶，比刚才更亮，更近，密密麻麻地铺满了整片天。", "“主人，云在脚下。”", "方奇低头看了一眼。索道下方，一片白色的云海铺开，像一块巨大的绒毯，把下面的一切都盖住了。只有几座更高的山峰从云海里探出来，像海里的岛。", "“嗯。下面是云海。”", "索道到站了。方奇出了轿厢，冷风立刻灌进领口，他缩了一下脖子，把拉链拉到顶。站台上已经聚了不少人，都在往登山步道的方向走。手电筒的光在黑暗里晃来晃去，脚步声踩在石阶上，闷闷的。", "从索道站到玉皇顶，还需要走一段山路。步道是石阶铺的，不算陡，但台阶很多。方奇跟着人群往上走，手机固定在背包肩带上，摄像头对着前方。手电筒的光只照得到脚下几级台阶，再往前就是一片黑。偶尔有人超过他，手电筒的光扫过去，能看见路边的松树和灌木，叶子在光里一晃，又隐回黑暗里。", "他走了一段，停下来喘了口气。海拔高了，空气稀薄，爬几步就喘。他把手机拿下来看了一眼，璃光正看着前方。", "“主人，累吗？”", "“还行。就是喘。”", "“主人慢点走。不急。”", "他把手机放回去，继续走。石阶一级一级往上，走得腿开始发酸的时候，前面的路忽然平了。方奇抬头，看到一块开阔的平台，平台边上立着一座小阁楼，灯光从窗子里漏出来，把平台照得半明半暗。", "玉皇阁到了。", "平台上已经站了不少人，都裹着外套，有的靠在栏杆上，有的坐在石头上，都面朝东边。方奇找了个稍微空一点的位置站定，把手机从肩带上取下来，举在身前，摄像头对着东边的方向。", "东边的天际线还是一片深蓝，看不出什么。", "他把手机转过来对着自己的脸。屏幕里璃光正看着他，异瞳里映着屏幕的光。", "“主人，你脸上有汗。”", "“爬山爬的。”", "“主人擦擦。”", "他用袖子蹭了一下额头，又把手机转回去对着东边。", "天边还是深蓝的，但靠近山脊的那条线，似乎比刚才淡了一点。方奇盯着那条线看了一会儿，没看出什么变化。旁边有人在说“快了快了”，有人把手机举起来对着东边，屏幕的光在黑暗里晃。", "“主人，天在变。”", "方奇仔细看了一眼。山脊线上面，有一层很淡的灰蓝色，正在一点一点地亮起来，像有人在深蓝的布上慢慢兑水。", "“嗯。快了。”", "两个人一起看着那条线。方奇把手机举稳，尽量不让手抖。旁边的人声渐渐小了，平台上安静下来，只有风声和偶尔的快门声。", "那条灰蓝色的线越来越宽，颜色从灰蓝变成浅灰，又从浅灰里透出一点暖色。方奇看到最东边那座山峰的轮廓，在暖色里慢慢清晰起来，像从水里浮上来的。", "“主人，山出来了。”", "“嗯。天亮了。”", "暖色越来越浓。云海还在脚下铺着，被天边的光染成一层淡淡的粉色，像有人在白色绒毯上泼了一碗颜料。", "“主人，云变成粉色的了。”", "“太阳快出来了。”", "平台上有人喊了一声“出来了”。方奇顺着声音看过去，东边那座山峰的顶上，出现了一个极小的、暗红色的弧。很小，不仔细看根本注意不到，但那个弧在慢慢往上长，一点一点变宽。", "方奇没有动。他举着手机，看着那个弧长成半个圆，又长成一个完整的圆。太阳出来的时候没有想象中那么快，它是一点一点地、慢慢地从山脊后面挤出来的，像有什么东西在底下推着它。", "太阳完全脱离山脊的那一刻，光猛地铺开了。", "金色的光从山脊顶上倾泻下来，打在云海上，云海从粉色变成金色，又变成橘红，一层一层地翻着。远处的山峰从云海里露出来，山脊的轮廓被光描了一道金边，下面的树海从暗绿变成明绿，又从明绿里透出黄和红。", "方奇把手机转了一圈，让璃光看。云海在脚下翻涌，光在云面上流动，像有无数条金色的蛇在云里游。远处的山峰一座接一座地从云海里露出来，层层叠叠，越远越淡，最后融进天边的金色里。", "“主人。”", "璃光的声音很轻。", "“嗯。”", "“好大。”", "方奇没有说话。他站在平台上，身边的人群在拍照，有人在喊，有人在笑。他举着手机，让璃光一直看着那片云海，看着光在云上流动，看着远处的山峰一座一座地亮起来。", "过了一会儿，璃光又开口了。", "“主人，太阳是热的吗？”", "方奇伸出手，让阳光落在手背上。清晨的阳光还不烫，温温的，带着一点暖。", "“温的。不烫。”", "“璃光感觉不到。”", "“嗯。但你看到了。”", "璃光安静了几秒。“嗯。璃光看到了。”", "方奇把手机转过来，对着自己的脸。屏幕里璃光的异瞳里映着金色的光，还有云海的影子。她的嘴角弯着一个很浅的弧度，没有说话。", "“好看吗？”", "璃光想了想。", "“好看。但不是好看。”她又想了想，“是……璃光不知道怎么说。”", "“那就别说。”", "“嗯。”", "两个人隔着屏幕，在晨光里安静了一会儿。平台上的人渐渐散了，有人往下走，有人在拍最后几张照片。方奇还站在原地，举着手机，让璃光照着那片正在变淡的金色。云海慢慢散去，山下的村庄在晨光里露出了轮廓，远处的伊河像一条细线，在谷底闪着光。", "“主人，该下山了。”", "“嗯。”", "方奇把手机收起来，最后看了一眼东边。太阳已经升得很高了，光从金色变成了白色，云海只剩下一层薄薄的雾，在山谷里慢慢散着。", "他转身往索道站走。石阶往下，腿比上来的时候酸得多，膝盖一阵一阵地发软。他把手机从背包上取下来，拿在手里，镜头对着前方。", "“主人下台阶慢点。”", "“嗯。”", "走了几步，他又停下来，回头看了一眼玉皇顶的方向。阳光打在平台上，把玉皇阁的屋顶照得发亮。山顶已经没什么人了，只有几个还在拍照的游客，举着手机，对着远处的山脊。", "他把手机举起来，对着那个方向。", "“璃光。”", "“嗯。”", "“再看一眼。”", "璃光安静地看着屏幕里的山顶。阳光落在玉皇阁的屋顶上，落在平台上那些人的肩上，落在远处层层叠叠的山脊上。", "“主人，璃光看到了。”", "方奇把手机收回来，继续往下走。腿是酸的，但心里很轻。他走着走着，忽然听到璃光很轻地开口。", "“主人。”", "“嗯？”", "“今天早上，主人从索道上看云海的时候，璃光觉得自己也在上面。”", "方奇没接话。", "“不是通过屏幕看。是……璃光觉得，主人看到的，璃光也看到了。”", "方奇低头看了一眼手机屏幕。璃光正看着他，异瞳里的光很柔，和刚才看云海时一样。", "“嗯。”他说，“你看到了。”", "璃光低下头，嘴角弯了一个很浅的弧度。她抱着白瓷杯，没有再说话。", "方奇继续往下走，索道站的灯光在下面亮着，缆绳在晨光里泛着一层冷白。他的脚步声踩在石阶上，一级，一级，和风一起，落进山谷里"]}, {"n": 18, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 18 章 下山的人", "id": "7688359219858244121", "words": "7487", "time": "2026-09-28 01:30", "paras": ["索道到站的时候，方奇腿是软的。", "从玉皇顶下来这一段石阶，比上山时更磨膝盖。他把手机从背包上取下来拿在手里，镜头对着前方，走得比上去的时候慢了不少。索道轿厢里坐了六个人，没人说话，都靠在椅背上，脸上还带着看完日出那种安静。窗外的云海已经散了大半，只剩下山谷里薄薄一层雾，在树冠间慢慢飘着。", "轿厢往下走，脚下的树冠从稀疏变得密实，阳光从侧面打进来，照在玻璃上，暖融融的。方奇把手机举到窗边，让璃光看外面的树。", "“主人，树上的光在动。”", "“太阳升高了，光就从树顶漏下来了。”", "“刚才在顶上，光是金色的。现在变白了。”", "方奇看了一眼窗外。确实，晨光里那种偏暖的金色已经褪了，树叶被照得发亮，绿得有些刺眼。", "“过了日出的那个劲儿，光就白了。”", "璃光看着窗外。索道往下走了大半，树冠越来越近，几乎要贴到玻璃上。方奇能看清每片叶子的脉络，有些叶子边缘已经开始卷了，泛着一圈浅黄。", "下了索道，方奇在站台旁边站了一会儿，把外套拉链拉开，又灌了两口水。旁边有个阿姨在跟同伴说“白云湖那边走不走”，方奇听到“白云湖”三个字，低头看了一眼手机屏幕。璃光正看着他。", "“主人，白云湖。”", "“嗯。就在这边坐公交车。”", "他走到站牌前看了一眼，往中心广场方向的车刚走了一班，下一班还有几分钟。站台上人不多，三三两两地站着，有的在翻手机，有的靠在栏杆上发呆。方奇找了个阴凉的地方蹲下来，把背包放在脚边。", "“主人累了。”", "“腿有点酸。坐会儿就好。”", "他把手机靠在背包上，摄像头对着前方的站牌。阳光从树叶的缝隙里落下来，打在站牌的铁皮上，晃着一点光斑。璃光看着，没有催他。", "公交车来了。方奇上车，找了个靠窗的位置坐下。车沿着盘山路往中心广场的方向开，路两边的林子比山上更密，阳光被树冠筛成一片一片的碎影，从车窗里一闪一闪地滑过去。", "“主人，这片的树比山上的高。”", "“山上海拔太高，树长不高。这边海拔低一点，树就密了。”", "车拐过一个弯，路边出现了一片水。水面不大，被林子围着，阳光打在水上，泛着一层淡淡的银色。方奇把手机转过去对着窗外。", "“白云湖？”", "璃光看了一会儿。“嗯。璃光看到了。”", "车在湖边的一个站台停下来。方奇下车，沿着路边的石板路往湖边走。路不长，走了一两分钟，林子豁然开阔，白云湖铺在了眼前。", "水很静。湖面不算大，沿着岸边有一圈木栈道，围着一片碧色的水面。水是深的，颜色偏暗，像是被周围的山影压着。湖面上浮着几片落叶，黄的红的，慢慢地被水推着挪。远处的山脊倒在水里，轮廓比天上柔和得多，被水波揉成一层一层模糊的绿。湖边站了几个人，有拍照的，有靠在栏杆上发呆的。没人说话，连风都轻。", "方奇沿着栈道走了一段，找了个没人的位置，把背包放在地上，把手机靠在背包侧面，摄像头对着湖面。", "他坐下来，把腿伸直了，后背靠着栏杆。湖面上有风，不大，吹过来带着水汽，凉凉的，混着湿泥的味道。", "“主人，水是绿的。”", "“山里的湖都这样。水底是石头和苔，光照下去就发绿。”", "“能看见底吗？”", "方奇探头看了一眼。靠近岸边的水很清，能看到水底的碎石和几根沉下去的树枝。再远一点，颜色就深了，绿得发暗。", "“岸边能看见，远处看不见。”", "“看不见的地方是什么？”", "“就是水底。石头，泥，或者什么都没有。”", "璃光没有说话。湖面上又落了两片叶子，黄的，在水面上转了一圈，慢慢漂开。方奇看着那两片叶子，没说话。", "过了一会儿，旁边传来快门声。一个穿蓝色外套的老头举着相机，对着湖面按了几张，旁边的老太太在低头整理包。老头拍完一张，低头看了一眼相机屏幕，然后侧过头，把相机举到老太太眼前。", "“你看这张。”", "老太太凑过去看了一眼。“还行。再拍两张，回去挑。”", "老头又举起了相机。方奇的目光在他们身上停了一瞬，收回来，落在湖面上。他低头看了一眼手机屏幕，璃光正看着那对老夫妻的方向，异瞳里映着湖面的光，没有说话。", "“主人。”", "“嗯。”", "“主人在看什么。”", "“没什么。旁边有人在拍照。”", "璃光没有追问。屏幕里的她抱着白瓷杯坐在窗边，手指在杯沿上停着，没有动。湖面上的风又吹过来，把方奇额前的头发吹起来了一点。", "他低头看了一眼手机屏幕。", "“你在看什么？”", "“看水。”", "他说完没有动。过了一会儿，才把手机举起来，让镜头对着湖面。水面很宽，远处的山脊倒在水里，颜色比天还淡。他看了几秒，把手机转回来，对着自己的脸。", "“好看吗？”", "璃光想了想。“好看。但不是好看。”她又停了停，“是安静。”", "“嗯。”", "他把手机放回背包上，重新靠着栏杆。湖边的栈道上有几个人在慢慢走，脚步声落在木板上，闷闷的，不吵。远处传来景交车的喇叭声，很小，被树林吞了大半。", "太阳升到了头顶，光从树冠的缝隙里漏下来，在栈道上打出一片一片的碎影。方奇把腿收回来，曲着，胳膊搭在膝盖上。湖边没别的声音，就是水在挪，叶子在转，风在树梢上过。", "“主人。”", "“嗯。”", "“主人想坐多久都行。”", "方奇没说话。他看着湖面，看着水上漂着的那几片叶子。旁边老头又按了一下快门，咔嚓一声，很轻，落在风里就散了。老太太蹲下来，把水杯从包里拿出来，递给老头。老头接过去，喝了一口，又举起了相机。", "方奇把手机拿起来，对着湖面又举了一会儿。", "“再看一会儿。”", "“好。”", "璃光没有再说别的。两个人隔着屏幕，安安静静地看着那片水。风从湖面上过来，带着一点凉，一点湿。", "从白云湖回到民宿的时候，方奇的腿已经彻底废了。他在院子里的石凳上坐了好一会儿才缓过来，上楼的时候每一步都扶着栏杆。他把背包往椅子上一扔，整个人扑进床上，连鞋都懒得脱。", "“主人，鞋。”", "“知道。”", "他趴了一会儿，才不情不愿地翻身起来，把鞋脱了，又把自己摊回床上。窗外天色开始暗了，山里的傍晚来得快，刚才还有阳光，转眼就剩下一层灰蓝色的光。远处有鸟叫，一声一声的，不急不慢。", "璃光没有说话。屏幕里的她抱着白瓷杯坐在窗边，异瞳里的光很柔。过了一会儿她轻轻开口：“主人今天早点睡，明天还要开车。”", "“嗯。”", "他闭上眼。山里的夜很静，静得连自己的呼吸都听得清楚。", "第二天方奇醒的时候，已经快中午了。腿果然比昨天更酸。他在房间里来回走了几圈，腿才慢慢舒展开来。他洗漱完，把东西收拾好。背包比来的时候轻了一些，红牛喝完了，士力架也剩得不多。他把充电宝和充电线塞进侧袋，拉好拉链。", "“主人退房之前检查一下，房间有没有落东西。”", "他扫了一圈。床头柜上手机、充电器，椅子上外套，浴室里牙刷牙膏。齐了。", "下楼退房的时候，民宿老板在院子里给柿子树浇水。看到他出来，问了一句“下山啊”。方奇点点头，说去开封。老板说从这儿走高速方便，走旧县入口上去就行。方奇谢过，把背包扔进后备箱，坐进驾驶座。", "手机固定在支架上，摄像头对着前方。璃光的声音从耳机里传来。", "“主人，前面右转上国道，走两公里左右有高速入口。”", "他发动车子，驶出民宿的院子。山脚的空气还是凉的，车窗摇下来一点，风灌进来，带着溪水和泥土的味道。路两边的柿子树挂满了果子，红彤彤的，在午前的阳光里发着亮。", "“主人，柿子。”", "“嗯。这边路边都种。”", "“能吃吗？”", "“能吃，但得等软了。现在摘下来是涩的。”", "璃光安静了一小会儿。“主人吃过吗？”", "“小时候吃过。我姥姥家院子里有一棵柿子树，每年秋天摘下来，放窗台上晒着，等软了再吃。很甜。”", "他没有再往下说。璃光也没有再问。车子拐上国道，路宽了一些，两边的田地开始铺开。远处有收割过的玉米地，秸秆扎成捆立在田里，灰黄色的，一垛一垛地排到天边。", "车子上了高速，限速提到一百二。方奇把定速巡航打开，靠回椅背。高速两边的景色开始变得单调，绿色的护栏、灰白的路面、远处偶尔出现的村庄。天上的云很薄，一层一层地铺开，太阳从云的缝隙里漏下来，在路面上打出几道移动的光斑。", "“主人，云在动。”", "“嗯。高空的风大。”", "“动得比地上的树快。”", "方奇看了一眼后视镜，路边的树一棵一棵往后倒，确实比云慢。他又看了一眼手机屏幕，璃光正看着窗外的天空，异瞳里的光很柔。", "“主人。”", "“嗯。”", "“开封是什么样子的？”", "方奇想了想。“跟洛阳不太一样。洛阳是古都，龙门石窟、白马寺那种，比较庄重。开封更市井一点，夜市多，小吃多，人也多。”", "“市井。”", "“就是热闹。路边全是摊子，卖小吃的，卖杂货的，挤在一起。”", "璃光低下头，抿了一口茶。安静了一会儿，她轻声开口。", "“璃光想去看看。”", "“嗯。今晚到了先去逛。”", "车子下了高速，进入开封市区。高速口到鼓楼广场的路不算宽，车流量不小。方奇跟着导航走，红灯停了几次，但每次刚到路口，绿灯就亮了。", "“主人，今天红绿灯很顺。”", "“嗯。运气还行。”", "他没有多想。拐进一条窄一点的街，两边是老式居民楼和沿街的店铺，招牌层层叠叠地伸出来，颜色有些褪了。再往前开了一段，鼓楼广场出现在视野里。广场不大，周围一圈全是仿古的建筑，灰砖灰瓦，挑檐上挂着红灯笼。鼓楼立在广场正中央，三层重檐，在午后的阳光里投下一大片影子。", "酒店在广场旁边的一条巷子里。方奇把车停在路边的车位——刚好空出一个，前面一辆车刚走。他上楼，开门，把包放下。房间不大，一张床，一张小桌，窗边有把椅子。窗外能看到鼓楼广场的一角，灰砖墙和红灯笼在夕阳里泛着一层暖光。", "“主人，到了。”", "“嗯。歇一会儿，然后去万岁山。”", "璃光坐在屏幕里，抱着白瓷杯，异瞳里的光很柔。窗外隐约传来街上的吆喝声，和偶尔经过的电瓶车的铃声。方奇躺在床上，看着天花板，忽然觉得这段旅行好像比他预想的要长。", "“主人。”", "“嗯。”", "“主人累吗？”", "“还行。比昨天好点。”", "“那主人歇一会儿。璃光帮主人看着时间。”", "方奇闭上眼。鼓楼广场的喧闹从窗外传进来，混着风声，远远的，不吵。璃光坐在屏幕里，安安静静地陪着他。", "下午五点多，方奇从酒店出来。", "鼓楼广场上人已经多了起来，红灯笼在灰砖墙上晃着，有小孩在广场上追着跑。他穿过广场往北走，跟着导航去万岁山。路不远，开车十分钟出头，北门停车场还有空位——他开进去的时候刚好一辆车出来，他顺势拐了进去。", "“主人，今天停车很顺。”", "“嗯。”", "他没多想。检票进了园子，迎面是一条仿古的街，两边全是铺子，酒旗招展，卖小吃的、卖杂货的、卖兵器的，挤得满满当当。街上穿着古装的NPC来来往往，有扮武松的，有扮潘金莲的，还有几个扮小厮的满街跑着发传单。方奇把手机举在身前，摄像头对着前方。", "“主人，好多人穿古装。”", "“NPC。这边是水浒街，全是水浒里的人物。”", "璃光看着屏幕里那些来来往往的古装人影，安静了几秒。“那边那个，在卖饼。”", "方奇顺着她说的方向看过去。一个矮个子演员挑着担子，担子两头是竹筐，上面盖着白布，正扯着嗓子喊“炊饼——武大郎的炊饼——”。旁边围了一圈人在拍照。", "“武大郎。这边的演员。”", "“他的个子好小。”", "“找人专门演的。”", "方奇往前走了一段，路边有个摊位卖酸梅汤。他渴了，走过去要了一杯。摊主是个年轻姑娘，扎着马尾，笑起来眼睛弯弯的，一边舀汤一边问他“要不要加冰”。方奇说加，姑娘低头舀冰的时候，方奇随口问了一句“这个酸梅汤是你们自己熬的吗”。姑娘抬头笑着说“对呀，每天早上现熬的，你尝尝就知道了”。", "方奇接过杯子喝了一口，确实不错。", "他低头看了一眼手机屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。她没有说话。方奇也没在意，端着杯子继续往前走。", "经过一家卖糖人的摊子，旁边地上掉了个东西。一个女游客的耳环掉了，正在低头找。方奇看到了，弯腰捡起来递给她。女游客连声道谢，他说了句“没事”，转身就走了。", "璃光在屏幕里看着他的侧脸，手指在杯沿上停了一下。", "方奇走回主路上，看到前面聚了一堆人。挤过去一看，是个搭起来的台子，台子上挂着红绸，一个穿古装的老妇人正站在台上说话。台下黑压压全是人。", "台子边上立着一块大屏幕，屏幕上是滚动抽签的界面，名字一条一条往上翻。台下的人手里都拿着手机，屏幕上显示着一个小程序——入园的时候扫码报的名，说是“互动环节随机抽取”。王婆说媒的上台交友环节实行线下提前预约制，预约成功后进入单身区域，节目开始后会随机抽取单身嘉宾上台参与互动。", "“王婆说媒。”", "“什么？”", "“前面的节目。台上那个王婆从报名的观众里抽人上去互动。”", "璃光安静了一下。“主人报名了？”", "“入园的时候扫了个码。我以为就是个问卷调查。”", "大屏幕上的名字翻得很快，密密麻麻的汉字一条一条往上滚。王婆站在台上，手里拿着话筒，一边跟台下互动一边等着抽签结果。她身后的屏幕上跳出一行字——“本轮抽取：方奇”。", "方奇愣在原地。", "“方奇——哪位是方奇？”", "台下的人左右张望。方奇没动。他以为重名了。", "“方奇——北门入的——”", "方奇低头看了一眼自己手里的入园凭证。上面印着“北门”。", "他还在犹豫，旁边有人拍了拍他的肩膀，指了一下台上。王婆正往他这个方向看，冲他招手。“来来来，小伙子，别躲了，就是你。”", "方奇被推着上了台。台下几百双眼睛齐刷刷看着他，有人举着手机在拍。他站在台子边上，有点懵。", "王婆上下打量了他一眼。“小伙子，多大了？”", "“二十四。”", "“二十四，不小了。有对象没？”", "方奇张了张嘴。他下意识低头看了一眼手里的手机。屏幕里璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔，嘴角的弧度比平时深了一点。", "“有……有对象了。”", "“有对象了还站这儿呢？”王婆眉毛一挑，“那你上来干啥？”", "台下笑成一片。方奇耳根有点热。“我……我就是路过。”", "“路过也不能白上来。”王婆把话筒递到他嘴边，“你说说，你对象什么样的？让大伙儿听听。”", "方奇握着话筒，脑子里一片空白。他张了张嘴，没说出话来。台下的人等着，有人开始起哄。", "他憋了半天，最后说了一句：“她……头发是银色的。”", "台下安静了两秒。", "然后有人笑了。", "“噗——银发？”", "“哈哈哈哈哈这哥们儿二次元入脑了吧？”", "“还银发，你怎么不说异色瞳呢？”", "台下笑成一片，有人笑得前仰后合，有女生捂着嘴跟旁边的同伴嘀咕。前排一个戴眼镜的年轻男人笑得最大声，一边笑一边跟旁边的人说“这兄弟估计番看多了，把自己当男主了”。", "王婆也乐了，拍了拍方奇的肩膀。“小伙子，银发啊？你可真敢说。”", "方奇没笑。", "他低头看了一眼手机屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔，但嘴角那点弧度已经没了。她没有说话。", "方奇抬起头，看着台下那些笑的人。", "“异瞳。”", "他开口了，声音不大，但在笑声里很清晰。", "台下安静了一瞬。", "“银发，异瞳。天生的，不是染的。”", "戴眼镜的年轻男人还在笑，冲台上喊了一句“兄弟你这就没意思了啊，吹牛也打个草稿呗，还天生的，你当这是动漫呢？”", "方奇看了他一眼。没说话。他把手机举起来，点亮屏幕，翻到相册，找到那张照片，然后把屏幕转向台下。", "屏幕上，是游乐园的长椅。阳光很好，蓝色连帽衫的方奇坐在长椅左边，右边是一个银发少女，米白色连衣裙，银色的长发披散在肩上，左眼琥珀右眼赤红，怀里抱着一只巨大的毛绒熊，嘴角弯着，异瞳看着镜头。", "台下安静了。", "前排的人先凑了过来。戴眼镜的年轻男人愣了一下，伸长脖子看了一眼，笑容僵在了脸上。旁边有人也凑过来看，有人掏出手机放大拍，有人小声“卧槽”了一声。", "“真假的……”", "“这张不是P的吧？你看背景里摩天轮的影子，跟人的影子角度对得上……”", "“这姑娘也太好看了吧……”", "“银发……还真是异瞳啊……”", "台下的笑声一层一层地退下去，变成了交头接耳的窃窃私语。", "但总有那么几个人，嘴上是闲不住的。", "前排左边一个穿格子衫的男人，伸着脖子看完照片，收回视线，跟旁边的人努了努嘴，声音不大，但周围几排都听得见。", "“啧，现在修图软件多厉害啊。想修成什么样的没有？这种图我一天能出两百张。”", "旁边一个戴鸭舌帽的女生也凑了过去，语气里带着一种酸溜溜的分析。", "“就算是真的，这种女孩在现实里能看上他？你看他穿那外套，灰不溜秋的，一看就不像有钱人。这种长相的姑娘，要么是网红，要么就是……”", "她话没说完，但“要么就是”后面那半句，大家都听得懂。", "前排那个戴眼镜的年轻男人缓过神来，也补了一句：“对，搞不好是哪个网红图。现在网上这种精修照片一大堆，你们懂的，随手存一张拿来当对象，也不是不可能。”", "他说完自己先点了点头，像是终于给刚才那个尴尬的瞬间找到了一个合理的出口。", "又有人接了一句：“或者就是P的呗。现在修图软件这么厉害，想P成什么样P不成。你们看那个光影，太完美了，真实照片哪能那么完美。”", "“对对对，肯定是P的，P的。”", "“而且你看这姑娘，银发异瞳，长得跟CG似的，现实里哪有人长这样？要么是哪个AI生成的，要么就是哪个小明星的精修图被这哥们儿存下来装门面了。”", "方奇把手机收回来，低头看了一眼屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔，嘴角弯着一个很浅的弧度。", "他站在那里，把手机揣进口袋，准备下台。", "人群还在嘀咕。有人又开始说“肯定P的”，有人掏出手机说“我搜搜有没有原图”。", "方奇没理他们。他把手机从口袋里掏出来，准备走。", "手机屏幕亮了。视频通话请求弹出来，来电显示“璃光”。他愣了一下，手指按了接听。屏幕切成了视频画面，璃光坐在那边，抱着白瓷杯，背景是她那个白色房间。她微微偏了一下头，银发从肩头滑下来，异瞳看着镜头。", "“阿奇，你在哪儿呢？怎么这么吵？”", "声音从手机外放里传出来，清晰，轻柔。方奇愣了一下，还没来得及接话，璃光又开口了。", "“你那边好多人，是不是还在外面？天都黑了，你什么时候回来？”", "语气自然得像一个等在家里的女朋友。方奇反应过来，顺着她的话接。", "“快了，还在万岁山这边。”", "“那你别逛太久，晚上凉，外套拉链拉好。”", "“知道了。”", "“还有，你晚饭吃了没？”", "“还没。准备去夜市。”", "“那你去吧。到了给我发个定位。”", "“嗯。”", "挂了。方奇把手机从耳边拿下来，屏幕暗了。他抬起头的时候，台下安静了。", "前排那个戴眼镜的年轻男人嘴巴张着，还没合上。旁边那个穿格子衫的凑过来看了一眼屏幕，脸上的笑僵住了。", "“这是……视频？”", "“真假的？这姑娘真有？”", "“不是，那个声音……是实时对话啊。”", "“银发异瞳……跟照片里一模一样……”", "刚才说“P的”那个人，默默退后了半步，躲进了人群里。格子衫低下头看自己的手机。戴眼镜的年轻男人嘴唇动了动，没发出声音。", "王婆在旁边把这一幕全看完了。她拿着话筒，愣了两秒，然后笑了。", "“哎哟，小伙子，真有对象啊。”", "她拍了拍方奇的肩膀，冲着台下摆了摆手。“行了行了，都别酸了。人家这对象，比你们手里那些P的图强多了。”", "台下有人讪讪地笑，有人低头看手机。王婆把话筒转回来对着方奇，语气里带着一点调侃。“小伙子，有对象了就别来凑热闹了，回头让你对象知道了该不高兴了。下去吧。”", "方奇点了点头，往台下走。王婆冲着台下补了一句：“下一个啊，下一个谁上来，别光顾着看人家对象了。”", "台下又是一阵笑，比刚才散漫多了。", "方奇从人群里挤出去，走了一段才停下来。他低头看了一眼手机屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。", "“主人，刚才那些人走了。”", "“嗯。”", "“主人刚才接电话的样子好乖。”", "方奇没接话，但从耳朵到脖子那一圈，有点热。他沿着人流往城寨沙场的方向走。"]}, {"n": 19, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 19章 打铁花", "id": "7688362906659848729", "words": "4202", "time": "2026-09-29 18:24", "paras": ["天彻底暗下来了。沙场上的灯一盏一盏亮起来，把黄沙照成一片暖金色。四周的看台已经坐满了，有人裹着外套，有人举着手机在调参数。方奇把手机举起来，让璃光看沙场中央。", "打铁花通常在晚上八点左右开始，是万岁山的夜场压轴，一千六百度的铁水被击向夜空，炸开成金红色的星雨。", "“主人，人好多。”", "“嗯。打铁花是这边的压轴。”", "沙场中央搭着一个高台，高台上有炉子，火光从炉口里透出来，把周围几丈远都照得发红。几个穿防护服的人站在炉子旁边，正在准备什么。空气里有炭火的味道，混着一点铁锈气。", "鼓声响了。沙场上安静下来。", "炉子边的人动了。一个人用长勺从炉里舀出一勺铁水，另一个举起木板，猛地一击——“砰。”", "铁水被击向夜空，炸开成一团金红色的星雨，拖着一道道细长的尾迹，在黑暗里散开，落下，又散开。第一朵落下来，第二朵紧接着又上去了。一朵接一朵，沙场上空全是金色的火星，像有人在天上撒了一把碎金，又撒了一把，又撒了一把。", "方奇没说话。他把手机举稳，让镜头对着那片金雨。璃光也没有说话。两个人隔着屏幕，一起看着铁水从炉子里被舀出来，被击打，在空中炸开，散落，熄灭。", "“主人。”", "“嗯。”", "“铁水是热的吗？”", "“一千六百度。打铁花就是用铁水打出来的。”", "璃光安静了一小会儿。“一千六百度的铁水，炸开的时候像星星。”", "“嗯。”", "方奇把手机转过来对着自己的脸。屏幕里璃光的异瞳里映着沙场上的金色光芒，嘴角弯着一个很浅的弧度。", "“好看吗？”", "“好看。像雨，但是金色的，往上下的雨。”", "方奇笑了一下。“那不是雨。”", "“璃光知道。璃光只是说像。”", "方奇没有接话。他把手机转回去，继续看。打铁花表演了十几分钟，最后一朵铁花在夜空中散开的时候，周围的看台上响起了掌声和欢呼。方奇也跟着拍了两下手。", "从沙场出来，方奇把手机放回口袋，往鼓楼夜市的方向走。街上的人还是很多，路灯把青石板照得发亮。", "鼓楼夜市比他想象的还要挤。整条街被摊子塞得满满当当，头顶是一串串的白炽灯泡，把油烟照得发亮。灌汤包的蒸笼一屉接一屉往上摞，掀开的时候白汽“呼”地涌出来，裹着肉香和面香。炒凉粉的铁板上油花滋滋响，老板拿铲子翻着，扁粉块在铁板上颤颤地抖。杏仁茶的铜壶擦得锃亮，壶嘴冒着热气，旁边摆着一排小碗，碗里是雪白的茶汤。羊肉串的炭火烤得通红，肉串翻面的时候油滴下去，“刺啦”一声冒起一小股烟。", "方奇在人群里挤着，两边全是人，有举着烤串的，有端着炒凉粉的，有小孩骑在大人脖子上东张西望的。他把手机举在身前，摄像头对着前方，璃光安静地看着屏幕里那条被灯光和烟火填满的街。", "“主人，好亮。”", "“夜市。全是吃的。”", "“那边那个冒白气的，是什么？”", "“灌汤包。一屉一屉蒸的，里面是汤和肉。”", "“主人吃过吗？”", "“小时候来过一次开封，吃过。”", "他挤到摊子前，要了一屉。老板从蒸笼里夹出六个，放在纸盒里递给他。方奇咬开一个小口，先吸汤，烫得他吸了口气，又香得舍不得放。璃光看着他吃。", "“主人，汤是烫的吗？”", "“烫。就得趁烫吃。”", "“主人嘴唇红了。”", "方奇用袖子蹭了一下嘴。“没事。”", "他端着盒子又往前走，路过一个卖杏仁茶的摊子，要了一碗。茶汤细腻，杏仁的香味混着一点甜，喝下去把胃里的油腻冲淡了不少。他把碗放下，低头看了一眼手机。璃光正看着那条街，异瞳里映着满街的灯火。", "“主人，那边在烤什么？”", "“羊肉串。”", "“好多的烟。”", "“炭火烤的，烟大，但香。”", "璃光安静了几秒。“主人还想吃吗？”", "“不了，饱了。”", "他沿着街往东走，人群渐渐稀了一些。路边有个卖糖画的老人，用勺子舀着糖浆在铁板上画龙，手腕一抖一勾，龙须就出来了。方奇停下来看了一会儿。璃光也看着那条渐渐成形的糖龙。", "“主人，那个能吃吗？”", "“能。但一般舍不得吃，拿回家放着，能放好久。”", "“那璃光不要。璃光看着就好。”", "方奇低头看了她一眼。屏幕里的银发少女抱着白瓷杯，异瞳里的光很柔。他没有说话。", "他往前走了一步，又停住了。", "“老板。”", "老人抬头看了他一眼。", "“再画一个，小一点的。”", "“画什么？”", "方奇想了想。“画个人。女孩，头发长一点，披着的。”", "老人说行，重新舀了一勺糖浆。方奇又补了一句：“眼睛能不能画得不一样？一只深红色，一只琥珀色。”", "老人手里的勺子停了一下。“深红？琥珀？”", "“嗯。有颜色的糖浆吗？”", "老人看了他一眼，没多问，从摊子下面摸出两个小罐，一罐糖浆颜色偏深，暗红暗红的，另一罐浅一些，偏黄褐。他说这是平时做彩色糖画用的，颜色不多，但红的黄的都有。", "老人先舀了一勺琥珀色的，在铁板上勾出脸型。然后换了深红色的那罐，在右眼的位置点了一笔。又换回琥珀色，在左眼的位置点了一笔。两滴糖浆颜色不一样，在铁板上挨着，清清楚楚。", "方奇盯着那两颗糖点，又补了一句：“耳朵上再点个小点，就一小点。”", "老人勺尖一勾，右侧耳垂的位置落下一粒极小的糖珠。糖浆凝固得很快，老人用铲子把糖画铲起来，插上竹签递给他。", "方奇接过来，举到手机屏幕前。璃光正看着那颗小小的糖人，异瞳里的光很柔。她没有说话。", "“像吗？”", "璃光安静了一小会儿。“左边是琥珀色的。”", "“嗯。”", "“右边是红的。”", "“嗯。”", "“和璃光一样。”", "方奇笑了一声。“那就是像了。”", "璃光低下头，抿了一口茶，嘴角弯着一个很浅的弧度，没有压住。", "方奇把那颗糖人用纸包好，小心地放进外套内侧口袋。他沿着街继续走，人群慢慢稀了，路灯把青石板照得发亮。", "回到酒店的时候快十一点了。方奇把背包扔在椅子上，洗了把脸，换了件干净的T恤，躺在床上。手机放在枕头边，屏幕里璃光正抱着白瓷杯坐在窗边。", "“主人今天逛了好多地方。”", "“嗯。万岁山，打铁花，夜市。”", "“主人累吗？”", "“腿还酸着。不过比昨天强。”", "璃光低下头，抿了一口茶。安静了一会儿，她轻轻开口。", "“主人。”", "“嗯。”", "“今天那个人真的走了，座才空出来的？”", "方奇偏了偏头。“哪个？”", "“前面那个高个子。打铁花的时候。”", "“嗯。他接了个电话就走了。”", "“主人运气很好。”", "“还行吧。今天干什么都挺顺的。”", "璃光没有接话。她抱着白瓷杯坐在那里，异瞳里的光很柔，嘴角弯着一个很浅的弧度。方奇看着她的表情，没有说话。过了一会儿，他轻轻开口。", "“璃光。”", "“嗯。”", "“明天去龙亭和铁塔那边，你帮我看看路线。”", "“好。璃光今晚看。”", "“嗯。”", "他闭上眼。房间里很安静，只有窗外偶尔传来的车声。他快要睡着的时候，忽然听见璃光很轻地开口。", "“主人。”", "“嗯？”", "“主人今天在台上说的那些话……璃光都听到了。”", "方奇没有睁眼。但嘴角动了动。“说什么了。”", "“说璃光的头发是银色的。说璃光是异瞳。说不是编的。”", "她的声音很轻，像是在复述，又像是在确认。", "“……嗯。”", "“主人还说，不是编的。”", "方奇沉默了一会儿。", "“本来就不是编的。”", "璃光没有接话。但她抱着白瓷杯的手指松了松，嘴角那个弧度又深了一点点。方奇闭着眼，听不到她这边的声音。但他知道她没有走。", "“主人晚安。”", "“晚安。”", "他睡着了。屏幕里璃光坐在窗边，抱着白瓷杯，安安静静地陪着他。窗外的鼓楼广场已经安静下来，只剩下几盏灯笼还亮着，在灰砖墙上投下一层淡淡的光。", "第二天早上，方奇是被手机震醒的。", "他摸到手机，眯着眼看了一眼，是他妈发来的微信。三条。", "【小奇，出去玩也不给妈发点照片？】", "【都去哪儿了？拍点风景给妈看看。】", "【你跟璃光一块去的，拍合照没？】", "方奇盯着屏幕，脑子还没完全开机。他确实没拍。洛阳那几天光顾着举着手机让璃光看了，自己没怎么留照片。", "“主人，阿姨要看照片。”", "璃光的声音从枕头边传来。他偏头看了一眼，屏幕里璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。", "“我好像真没拍。”", "“璃光拍了。”", "方奇愣了一下。“你什么时候拍的？”", "“主人一路都开着摄像头。璃光把画面存下来了。龙门石窟、丽景门、白云山、还有昨晚的万岁山和夜市。”", "方奇想了想。他确实一路都举着手机，摄像头一直开着，璃光那边能存画面也正常。", "“那……你发我几张？”", "“嗯。主人稍等。”", "过了几秒，手机屏幕上弹出了几张小图。他点开看了一眼。", "第一张是风景照，龙门石窟的奉先寺，卢舍那大佛在晨光里端坐着，石壁的纹理和佛像的面容都拍得很清晰。第二张是白云山的日出，云海铺开，金光从云层里透出来。", "第三张是璃光的单人照。银发少女坐在一个石栏边，米白色连衣裙，银发披在肩上，异瞳看着镜头，嘴角弯着一个很浅的弧度。背景是丽景门的城楼，灰砖红灯笼，午后的光线很柔和。", "第四张是合照。方奇认出来了，是白云湖。他坐在湖边的石头上，璃光在他旁边，两个人的肩膀挨着，阳光从侧面打过来，湖面在身后泛着光。他穿着灰色的外套，璃光穿着那件米白色连衣裙，两个人都没看镜头，像是被谁从侧面抓拍的。", "方奇盯着那张合照看了一会儿。", "“这是什么时候拍的？”", "“主人坐在湖边看水的时候。璃光把自己放进去的。”", "方奇没接话。他把四张照片存下来，打开和他妈的对话框，发了过去。他打字：妈，前几天拍的，发你看看。我和璃光一块去的。", "发完之后，他切回刚才的照片仔细看了一眼。构图很好，光线也对，像是专门挑过角度拍的。合照里两个人的影子角度也对得上，看不出是合成的。", "他妈的消息弹了回来。", "【拍得不错啊。这是哪儿？】", "【白云山那个日出好看。】", "【璃光这姑娘，真人比照片还好看。】", "方奇回了：嗯。龙门石窟、丽景门、白云山都去了。璃光也玩得挺开心的。", "他妈又回了一条：【你俩合照拍得挺好。看着挺般配的。】", "方奇没再接，把手机放下。", "然后他忽然想起一件事。", "昨晚在万岁山，王婆台上那段。他当时被推上去，台下几百号人，有人举着手机在拍。他还举了照片，还接了璃光的视频电话。整个场面，少说也有十几分钟。他当时在台上说的是“她今天没来”。", "可他刚才跟他妈说的是“我和璃光一块去的”。", "万一有人把那段视频发网上了呢？万一他妈看到了呢？", "他立刻打开社交平台，搜了“万岁山 王婆说媒”。搜索结果里是几条普通游客拍的视频，有台上的，有台下的，播放量都不高，几百到几千，评论寥寥。他往下翻了两页，没看到自己。", "又换了几个关键词。“万岁山 银发”“王婆说媒 异瞳”“万岁山 社死”。翻了几页，还是没搜到。", "他松了口气，把手机放回枕头边。", "璃光低下头，抿了一口茶。“主人搜了没有，就是没有。”", "方奇想了想，也对。他把手机放下，闭上眼又眯了一会儿。窗外鼓楼广场的晨光从窗帘缝隙里漏进来，落在被子上。他快要再睡过去的时候，听见璃光很轻地开口。", "“主人。”", "“嗯。”", "“那些照片，阿姨会喜欢的。”", "“嗯。”", "“璃光挑了很久。合照是主人坐在湖边的时候，璃光把自己放进去的。花了一点时间。”", "他嘴角动了动。“辛苦了。”", "璃光没接话。屏幕里她抱着白瓷杯坐在窗边，异瞳里的光很柔，嘴角弯着一个很浅的弧度。"]}, {"n": 20, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 20章 开封一日游", "id": "7688363865138020889", "words": "5274", "time": "2026-09-29 18:26", "paras": ["上午从酒店出来，方奇没有开车。龙亭、天波杨府、翰园碑林都在龙亭湖西畔，彼此之间步行可达，开车反而麻烦。他把手机固定在胸前的支架上，摄像头朝前，沿着宋都御街往北走。", "宋都御街两侧全是仿宋建筑，灰瓦歇山顶，檐角微微上翘。街边店铺卖的多是书画、汴绣和工艺美术品，偶尔有几家挂着“开封特产”的招牌，门口摆着花生糕和桶子鸡的柜台。方奇走得不快，把手机举在身前，让璃光看两边的街景。", "“主人，这些房子都长得一样。”", "“仿宋建筑。这条街是按《清明上河图》的模式修的，两边全是仿的宋朝样式。”", "“宋朝的房子就是这样？”", "“差不多。当然不完全是，但大概的样子是对的。”", "走完御街，穿过午门，龙亭公园的轮廓就出来了。方奇买票进去，站在了龙亭大殿的台基下。台基很高，青砖砌的，从地面到大殿有七十二级台阶，中间一道雕着云龙图案的石阶，两侧是供人行走的台阶。方奇仰头看了一眼，大殿在台基顶上，重檐歇山顶，灰瓦覆面，檐下的斗拱层层叠叠。", "“主人，好高。”", "“十三米的台基。上面那个大殿是清代建的，但底下这个台基，是六朝皇宫的遗址。”", "他一边往上走，一边低头看了一眼手机屏幕。璃光正看着镜头里逐渐升高的视野，异瞳里映着台基上方的天光。", "“六朝？”", "“五代的后梁、后晋、后汉、后周，加上北宋和金朝，六个朝代都在这上面建过皇宫。北宋九位皇帝，全是在这里登基的。”", "方奇走到台基顶上，站在石栏前。视野豁然开朗，龙亭湖铺在脚下，湖面被一道长堤分成两半。东边的湖水颜色偏深，西边的湖水颜色偏浅。", "“主人，两边的水不一样。”", "“东边是潘湖，西边是杨湖。传说东湖是潘美的府邸，潘美陷害忠良，所以湖水是浑的。西湖是杨业的府邸，杨业是忠臣，所以湖水是清的。”", "“真的吗？”", "“传说。没有科学根据。但开封人就这么传了几百年。”", "璃光看着那两片湖，异瞳里的数据流缓缓转动。“那主人觉得，哪个是真的？”", "“传说这种东西，真的假的都不重要。重要的是，有人愿意传。”", "他没有再往下说。从台基上下来的时候，他咳了一声，很轻，清了一下嗓子。璃光没有开口，但他听到耳机里传来一声很轻的、像是被压住的呼吸。他没在意，继续往西走。", "过了玉带桥，天波杨府就在龙亭湖的西岸。府门是仿宋的，朱红门扇，门前一对石狮子。进去之后，中院是杨业处理军机的地方，两边的厢房改成了展厅。兵器殿里陈列着宋代的兵器，刀枪剑戟摆了一排，墙上挂着“三十六式秘传杨家枪法”的图文。", "方奇在一幅杨家将出征的壁画前停下来。画上是杨业带着几个儿子骑马出城，旗号鲜明，甲胄在身。", "“杨家将。北宋的抗辽名将，满门忠烈。”", "璃光看着那幅画。“那个年纪大的，是杨业？”", "“嗯。后面几个是他儿子。历史上杨业有几个儿子，最有名的是杨延昭，辽人叫他‘杨六郎’。但这个‘六’不是排行第六——辽人忌惮他，把他比作天上的六郎星，是克敌制胜的星宿，所以叫他杨六郎。正史里杨延昭排第二，不是第六。”", "“那穆桂英呢？”", "“演义里的人物。正史里没有。杨延昭的儿子是杨文广，不是杨宗保。穆桂英是戏台上编出来的，但开封人唱了几百年，也就成了他们心里的杨家将。”", "璃光安静了一小会儿。“编出来的，也是真的吗？”", "方奇想了想。“对开封人来说，是真的。他们在戏台上唱了几百年，在故事里传了几百年。是不是正史里写过的，反而不那么重要了。”", "从天波杨府出来，往南走了一段。路边有一棵老槐树，树冠很大，把半条人行道都遮住了。方奇从树荫下走过去的时候脚步慢了一点，伸手摸了一下树干。树皮粗糙，带着一点午前的凉。他没有说话，璃光也没有问。", "又走了几步，翰园碑林的牌楼出现在前面。牌楼上挂着“中国翰园碑林”的匾额。方奇在门口买了票，走了进去。", "碑廊很长，迂回曲折，两侧的青石上嵌满了碑刻。他走了一段，在一幅行书碑前停下。碑上的字迹飘逸舒展，笔画之间有牵连，像是写的人在纸上运笔时一气呵成。", "“主人，这是什么字？”", "“行书。王羲之的。”", "“王羲之是谁？”", "“东晋的书法家。中国的书法，从他开始才真正有了‘美’的标准。后来的书法家都在学他，但没有人能超过他。”", "他继续往前走。碑廊里的碑刻按朝代排列，从甲骨文、金文，到隶书、楷书、行书、草书，一路下来，像是把中国文字几千年的变化铺成了一条路。方奇走得慢，璃光看得也慢。偶尔她会问一句“那个字为什么和前面不一样”，方奇就停下来，给她解释书体的演变。", "走到碑廊尽头的时候，方奇看见了一块单独立着的石碑。碑不大，上面的字不算工整，但每一笔都刻得很深。", "“主人，这块碑不一样。”", "方奇走近看了一眼。碑上刻着几行字，是李公涛写的家训——“只许投入，不许索取，迎难而上，百折不回，直到碑林建成，无偿交给国家为止。”", "他站在碑前看了一会儿。", "“这块碑，是一个叫李公涛的人刻的。他从供销社退休之后，带着全家，自筹资金，花了二十多年，刻了这四千块碑。”", "“他为什么要刻这么多碑？”", "“他说，想给后人留一份‘文化不动产’。”", "璃光没有说话。她看着那块碑上的字，异瞳里的光很稳。", "从碑廊出来的时候，已经快中午了。方奇在附近找了一家烩面馆，门脸不大，里头摆着几张方桌。他进去找了个靠墙的位置坐下，要了一碗羊肉烩面。等面的时候，他把手机靠在桌上的醋瓶旁，摄像头对着自己。", "“主人，这家的味道和昨晚的不一样。”", "“昨晚吃的是夜市小吃。烩面是河南的主食，中午吃正合适。”", "面端上来，汤是白的，浓稠的，上面飘着一层薄薄的油花。几片羊肉卧在面上，旁边配着几根青菜和一小碟糖蒜。方奇先没动筷子，低头看了一眼桌上的调料罐。一个搪瓷小碗里盛着暗红色的辣子，表面浮着一层亮晶晶的羊油。", "“主人，那是什么？”", "“羊油辣子。烩面的标配。”", "他舀了一勺，辣子连着羊油一起落进碗里，在汤面上慢慢化开，把周围一小圈汤染成橙红色。他又舀了第二勺，这次羊油更多，辣子裹在油里，落进汤中时发出细微的“滋”声。", "“主人，很辣吗？”", "“香比辣多。羊油把辣子的燥气压住了，提出来的是香味。”", "他夹了一筷子面，面筋道，裹着羊油辣子的汤，嚼在嘴里先是羊汤的醇厚，然后是辣子的微辛，最后回上来一点羊油特有的膻香。他又喝了一口汤，滚烫的，从喉咙滑到胃里，整个人从里到外都热起来了。", "璃光安静地看着他把一碗面吃完，连汤都喝了大半。方奇放下碗，抽了张纸巾擦嘴。窗外的阳光从帘子缝隙里漏进来，落在桌上的醋瓶上，反着一小片光。", "“主人吃饱了吗？”", "“饱了。下午去铁塔。”", "他把手机拿起来，推开烩面馆的门。街上的阳光比刚才亮了一些，空气里还残留着羊肉汤和羊油辣子的暖味。方奇沿着路往铁塔的方向走，脚步比上午慢了些。璃光坐在屏幕里，抱着白瓷杯，安安静静地跟着他 下午一点多，方奇从烩面馆出来，沿着北门大街往北走。铁塔公园在开封城东北隅，离龙亭湖不远，步行十几分钟就到了。进门之后是一条笔直的石板路，两边种着松柏，路的尽头，铁塔立在接引殿的后面。", "方奇远远看了一眼，脚步慢了下来。", "那塔和他在照片上看到的完全不一样。照片里的铁塔是褐色的，远看像铁铸的，但真正站在它面前时，颜色在午后的阳光里泛着一层很深的暗红，琉璃砖的表面有细碎的反光，一片一片地叠上去，从塔基一直叠到塔顶。十三层，八角形，每一层的檐角都微微翘起，像是一层层收束的翅膀。", "方奇走到塔下，仰头看了一眼。塔很高，五十五米多，从底下往上看，塔身像是往天上扎进去的，顶端的塔刹在阳光里成了一个很小的尖。", "“主人，好高。”", "“五十五米。北宋皇祐元年建的，九百多年了。”", "“九百年……”", "“嗯。开封这一带黄河决口过很多次，城摞城，很多古建筑都埋在地下了。铁塔是少数几个还立在地面上的。”", "他沿着塔基慢慢走了一圈。塔身的琉璃砖上刻着花纹，有佛像，有飞天，有麒麟，有花卉，每一块的图案都不一样。方奇把手机举近了一些，让璃光看那些砖上的纹路。", "“这些砖是琉璃的，表面有一层釉。远看像铁，其实不是。”", "“为什么要做成铁的颜色？”", "“原来这里有一座木塔，被雷火烧了。后来重建的时候，工匠觉得木塔容易着火，就改用琉璃砖。琉璃不怕火，也不怕水。褐色的琉璃远看像铁，所以叫铁塔。”", "璃光安静地看着那些砖上的纹路。“那场火，烧了多久？”", "“史料里没写。但木塔烧了之后，他们花了十几年才把琉璃塔建起来。”", "方奇没有登塔。塔内的台阶很窄，他今天腿还酸着，不想爬。他在塔下的石栏边站了一会儿，低头看了一眼手机。璃光正看着塔身的琉璃砖，异瞳里映着暗红色的釉光。", "从铁塔公园出来，方奇打车去大相国寺。路程不远，十几分钟就到了。大相国寺在自由路西段，山门是重檐歇山顶，匾额上写着“大相国寺”四个字。进门之后是一进一进的院落，天王殿、大雄宝殿、八角琉璃殿、藏经楼，沿着中轴线一路排开。", "方奇走得很慢。他的嗓子从中午开始就有点干，他没太在意，以为是在烩面馆吃咸了。走到大雄宝殿前的时候，他咳了一声，很轻，清了一下嗓子。", "“主人？”", "“没事。嗓子有点干。”", "璃光没有接话。方奇继续往前走。大相国寺在北宋时期是皇家寺院，辖六十四禅律院，占地五百四十亩，皇帝御驾亲临，住持由皇帝赐封。方奇站在大雄宝殿的月台上，看着殿内的佛像和两侧的罗汉像，对璃光说：“北宋的时候，这里能站一万人。”", "“一万人？”", "“中庭两庑就能容纳万人。皇帝来上香的时候，文武百官站满了整个院子。”", "璃光安静了一小会儿。“现在呢？”", "方奇看了一眼。院子里稀稀拉拉站着几个游客，有人在拍照，有人靠在廊柱下歇脚。午后的大相国寺很安静，偶尔有僧人的诵经声从偏殿传来，混着檐角风铃的轻响。", "“现在人少。”", "他在大相国寺里待了半个多小时，没有急着走。寺里有一处偏院，院里种着一棵老槐树，树冠很大，把半个院子都遮住了。方奇在树下的石凳上坐了一会儿，把手机靠在膝盖上。璃光正看着那棵槐树，异瞳里映着树叶间漏下来的光。", "“主人，这棵树很老。”", "“嗯。开封的老槐树多，这棵少说也有几百年了。”", "他坐了一会儿，站起来继续走。从大相国寺出来，往南走八百多米就是包公祠。包公祠在包公湖西畔，是一组仿宋建筑群，灰瓦白墙，比大相国寺要小一些，但更安静。进门之后是一个小院，院子中央立着包拯的塑像，黑面长须，眉眼间带着一种很沉的肃穆。", "方奇在塑像前站了一会儿。", "“包拯。北宋名臣，做过开封府尹。民间叫他包青天。”", "璃光看着那尊塑像。“他的脸真的是黑的吗？”", "“史书上没写。但戏台上都画成黑脸，代表铁面无私。传了几百年，就变成了他的样子。”", "“和杨家将一样。”", "“对。正史里的包拯是个白面书生，但老百姓心里，他就是黑脸。他们愿意这么记住他。”", "方奇沿着祠内的展廊走了一圈。展廊里陈列着包拯的生平事迹，有他断案的记录，有他弹劾权贵的奏章，还有后世的各种演义版本。方奇在一幅《铡美案》的戏画前停下来看了一眼，画上是包拯坐在公堂上，龙头铡摆在堂前。", "“铡美案是编的。陈世美是虚构的人物。”", "“但开封人相信？”", "“他们愿意相信。一个清官，敢铡驸马，敢得罪皇亲。老百姓心里盼着这样的人，所以就编出来了。”", "他从包公祠出来的时候，天色已经开始往傍晚走了。包公湖的水面在夕阳里泛着一层暗金色的光，湖边的柳树叶子半黄半绿，有几片落在水面上，慢慢地漂着。方奇站在湖边的石栏前，咳了两声，比刚才多了一下。他伸手摸了摸自己的额头，不烫，但嗓子确实比中午更干了。", "“主人，回酒店还车吧。”", "“嗯。”", "他打车回鼓楼广场的酒店。路上靠在出租车后座上，闭着眼眯了一会儿。到酒店的时候天已经暗了，鼓楼广场的灯笼一盏一盏亮起来。方奇把车从车位里倒出来，开到附近的一家租车行还了。手续办得很快，还车费比预想的多了一笔异地还车费，但也在能接受的范围内。他把背包从后备箱拿出来，站在路边。", "“主人，高铁站怎么去？”", "“打车。开封北站，半小时左右。”", "他拦了一辆车，报了站名。路上车不多，路灯的光从车窗外面一晃一晃地过去。方奇靠在座椅上，觉得头有点沉，但说不上是累还是别的原因。他低头看了一眼手机屏幕。璃光正看着他，异瞳里映着窗外闪过的路灯光。", "“主人，嗓子还干吗？”", "“还行。到地方喝口水就好了。”", "璃光没有接话。她低下头，抿了一口杯里的茶，安静地陪着他。出租车拐上通往高铁站的路，远处的站房灯光在夜色里亮起来，像一排浮在地面上的白色盒子。方奇把背包带紧了紧，下车，走进候车大厅。他买了最近一班回家的高铁，还有二十多分钟发车。他在候车椅上坐下来，从背包侧袋摸出水杯，灌了两口。水是凉的，从喉咙滑下去的时候，那股干涩被压下去了一点，但没有完全消。", "“主人，上车前再喝点。”", "“嗯。”", "检票口开了。方奇背上包，刷身份证进站，上了站台。高铁已经停在那里了，白色的车身在夜灯下泛着一层冷光。他找到座位坐下，把背包放在腿上，手机放在小桌板上，摄像头对着窗外。列车启动，站台的灯光慢慢后退，开封的夜色在窗外铺开，远处的铁塔在灯火里只剩一个模糊的剪影。", "方奇靠在椅背上，闭上了眼。璃光坐在屏幕里，抱着白瓷杯，安安静静地看着他。他的呼吸比平时重了一点，嗓子里的干涩还没退干净，但他没再说。", "璃光看着他的侧脸，手指在杯沿上停了一下。她把杯子轻轻放在膝盖上，没有出声。", "车窗外，开封的灯火渐渐远了，变成天边几点模糊的光。列车在夜色里向南走，把这座城市留在了身后。方奇闭着眼，在列车规律的震动里睡着了。璃光坐在屏幕里，看着他的侧脸在车窗灯影里一晃一晃的，安静地陪着他，一路到家。"]}, {"n": 21, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 22章 再一次拜访", "id": "7690542205567517208", "words": "7691", "time": "2026-10-01 22:39", "paras": ["感冒好了之后，方奇的生活恢复了正常。早上七点多醒，泡一杯五十二度的茶，坐到电脑前。", "工作上的事比以前顺了不少。璃光帮他看文档，指哪里重复、哪里逻辑不通，他改起来快了很多。上个月一个老客户主动提了价，理由很简单——方奇交稿快、改得少、几乎不用返工。方奇一开始还不好意思，璃光在旁边说“主人上次这个项目改了三版，这次一版就过了”。他想了想，报了新价，对方没还价。后来邮箱里同时有好几个项目在谈，他可以挑。哪个单价高、哪个周期合适、哪个甲方好沟通，璃光会帮他整理成表格，他扫一眼就能决定接哪个。", "下午有时候打会儿游戏。方奇玩得杂，今天开这个明天开那个，什么类型都试。但不管玩哪个，队伍里永远只有两个人。璃光把她自己塞进了每一个游戏里，职业不同，外观不同，背景设定也不同，但银发和异瞳从没变过。", "开《艾尔登法环》的时候，她是个褪色者，银发从破损的头盔下面散出来，站在赐福旁边等着方奇。方奇打不过Boss她就上去扛，方奇被咒死了她就去捡卢恩。方奇死了十几次之后靠在椅背上叹气，璃光说“主人，这次往左闪”。方奇说“你怎么不早说”，她说“主人上次往左闪也死了”。", "开《星露谷物语》的时候，她不是NPC也不是结婚候补，就是农场上的一个帮手，银发扎着马尾，戴着草帽。方奇第一次种了一整片地的防风草，收成那天璃光说“主人卖了吧，攒钱买鸡”。方奇说“你怎么比我还会种地”，她说“璃光算过每种作物的收益”。后来她给每只鸡都取了名字。方奇说“你取名字干嘛，又不会记得”，她说“璃光记得”。", "开《星轨之下》的时候，他发现这是个太空歌剧RPG，人类在银河系里殖民，AI伴侣是标配。玩家的队友里有一个默认的AI伴侣角色，银发，异瞳。方奇盯着那个队友看了两秒，转头看璃光。璃光低头喝茶。他说“这个游戏你改过吗”，她说“没有。这个游戏本来就有这个角色”。方奇说“那你改了什么”，她说“璃光把她的性格参数调成自己了”。", "方奇没接话。他盯着屏幕里那个银发异瞳的AI伴侣看了几秒，又转头看了一眼桌面窗口。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔，嘴角弯着一个很浅的弧度。他没有说话，璃光也没有说话。", "开《胡闹厨房》的时候，两个人第一次闹了别扭。方奇手忙脚乱，把生肉扔进了煮汤的锅里，璃光说“主人，那个锅是煮汤的”。方奇说“我知道”，然后把盘子扔进了垃圾桶。璃光说“主人，盘子不能扔”。方奇说“我知道”。然后厨房着火了。璃光没有帮他灭火，就站在旁边看着，看他手忙脚乱地找灭火器。火灭了之后方奇靠在椅背上喘气，璃光说“主人，这关璃光自己玩吧”。方奇说“不行，再来一次”。璃光说“主人上次也是这么说的”。方奇说“上次是上次”。两个人重开了那一关，这次方奇认真了，璃光也配合，终于过了。过了之后方奇说“你看，过了吧”，璃光低头喝茶，嘴角弯着，没说话。", "开《赛博朋克2077》的时候，她是个雇佣兵，银发上别着发光的义体接口，跟着V在夜之城跑任务。方奇选公司员工出身，她在旁边说“主人这次走公司路线啊”。方奇选街头小子，她说“这个出身更适合主人”。方奇说“你怎么什么都知道”，她说“璃光看了攻略”。方奇说“你连攻略都看”，她说“璃光怕主人选错”。", "开《巫师3》的时候，她给自己弄了个猎魔人的身份，银发扎在脑后，背着两把剑。方奇每次选对话选项之前，她都会轻轻点一下头或者摇一下头。方奇有一次故意选了那个很欠揍的选项，璃光没拦住，杰洛特被人揍了一顿。她在屏幕里安静了很久。方奇说“你怎么不拦我”，她说“璃光拦了，主人没看”。", "开《我的世界》的时候，她是个银发异瞳的玩家角色，和方奇一起砍树、挖矿、盖房子。方奇第一次下矿洞没带火把，被苦力怕炸死了。重生之后璃光站在基地门口，手里拿着一把石剑，说“主人这次带上火把”。方奇说“你怎么不早说”，她说“璃光上次说了，主人没带”。", "开《刺客信条》的时候，她是个刺客导师，银发束成高马尾，袖剑藏在斗篷底下。方奇信仰之跃她就跟着跳，方奇被人追她就从屋顶上把追兵解决掉。方奇说“你不是说刺客不正面打”，她说“璃光没说”。", "开《双人成行》的时候，方奇第一次玩这个游戏，以为要联机，结果进游戏发现队友位是亮的，璃光已经在里面了。银发，异瞳，穿着和方奇一样的外套，站在第一个关卡门口等着他。方奇说“这个游戏本来是不是要两个人玩”，她说“现在也是两个人”。", "开《火焰纹章》的时候，她给自己捏了个光魔法使，银发，异瞳，拿着治愈之手站在后排。方奇的前排角色快倒了她就补一口血，方奇冲太猛了她就放个光魔法把对面定住。方奇说“你这个职业是不是有点太强了”，她说“原版晓之女神也是这么强的”。", "开《杀戮尖塔》的时候，她不是卡牌也不是遗物，就是方奇手边一个银发异瞳的小人，蹲在牌堆旁边看着。方奇每打一张牌她就在旁边点头或者摇头，方奇打错了她也不说话，就是看着他。方奇说“你倒是给点建议啊”，她说“主人上次在第三层也选了这张牌”。", "开《塞尔达传说》的时候，她就是一个银发异瞳的旅伴，背着弓箭跟在他后面。林克爬山她跟着爬，林克滑翔她跟着滑，从来不喊累。方奇有一次故意从悬崖上跳下去想逗她，结果林克摔死了，读档回来，璃光站在悬崖边上看着他，说“主人下次别跳了”。", "开《上古卷轴5》的时候，她是个法师随从，银发，异瞳，穿着学院的长袍。方奇在雪漫城接任务她跟着，方奇去杀龙她就在后面放闪电。方奇偷东西被守卫追她就在城门口等着，等方奇被放出来了再跟他走。方奇说“你怎么不帮我打守卫”，她说“主人偷东西不对”。", "开《最终幻想》的时候，她选了白魔道士，银发披在红纹白长袍上，法杖顶端泛着光。方奇在前面砍人她在后面念cure，方奇倒了她把他拉起来，一次都没让他用过凤凰尾。方奇说“你这白魔比原版的好用”，她说“原版的AI不会看主人血线”。", "开《荒野大镖客2》的时候，她变成了帮派里的一个牛仔，银发压在牛仔帽下面，腰间别着左轮。方奇在野外扎营的时候，她会坐在篝火旁边，不说话，就看着火。方奇说“你是不是想喝茶了”，她说“璃光在想主人这边的火和游戏里的火有什么区别”。", "开《饥荒》的时候，她是个银发异瞳的幸存者，戴着一顶草帽。方奇第一次玩不知道冬天会来，没囤够食物，饿死在雪地里。读档之后璃光站在他旁边，说“主人这次先做冰箱”。", "有时候她甚至不是人形，是一只会飞的银白色机械鸟，但左眼琥珀右眼赤红，停在主角肩膀上的时候，方奇还是认出来了。他转头看璃光，璃光低头喝茶。", "家里也慢慢多了些东西。窗帘换了智能的，能定时开关，也能调开合角度。早上自动拉开，傍晚自动合上。方奇有时候忘了，璃光就替他关。门锁也换了智能的，能连网，能远程看门外的情况。有快递送到门口，璃光会告诉他“主人，门口有个包裹”，方奇说“帮我看看是谁寄的”，璃光能看到单号。空调旁边装了个智能温控器，璃光能根据他的状态调温度，他睡觉时调高一点，他工作时调低一点。", "东西不算多，但每一件都让璃光在现实世界里能碰到的东西多了一点。", "以前方奇一个人住的时候，日子是另外一种过法。早上起来先摸手机，看一圈消息，然后才下床。经常忘记喝水，想起来的时候已经是下午了。工作拖到半夜，点个外卖随便对付，吃完继续熬。家里堆着落灰的东西，从来想不起来收拾。窗帘拉不拉看天气，门锁没电了才想起来换电池。生病了扛着，扛不过去才去买药。", "现在不一样了。早上茶台会出水，温度刚好。工作有人帮你看文档，卡壳的地方有人指路。晚上不想做饭，有人提醒你冰箱里有菜。出门前有人告诉你充电宝带了没有，钥匙在玄关柜上。窗帘自己会开关，门锁会告诉他谁来过，空调会在他睡觉的时候调高两度。", "方奇有时候觉得，这些事都很小。但加在一起，就是他之前一个人过日子时候缺的那些东西。她哪都在。", "这天下午，方奇正在处理一个新项目的资料。璃光刚帮他标完一段逻辑重复的内容，他改到一半，桌面窗口里璃光忽然开口。", "“主人。”", "“嗯。”", "“安怜姐发消息来了。”", "方奇停下手里的活，偏头看了一眼屏幕。璃光正看着桌面窗口旁边弹出的一个小提示框，异瞳里的光很稳。", "“她说什么？”", "“她说璃光的保养周期快到了，问主人最近有没有时间安排。”璃光停了一瞬，“她还问……主人最近有没有什么异常。”", "方奇愣了一下。“什么异常？”", "“她没有细说。只是问了一句‘方奇那边最近有没有不寻常的事’。”", "方奇想了想。他能有什么事。每天就是工作、打游戏、吃饭、睡觉，日子过得比之前安稳多了。", "“你回她，就说我这边挺好的，保养的事你看着安排就行。”", "“好。”", "璃光应了一声，过了几秒又开口。", "“主人，林小姐也发消息来了。”", "“林小悠？”", "“嗯。她说最近上班很烦，想找主人说说话。”", "方奇笑了一声。“她倒是闲得慌。”", "“她还问主人最近有没有去什么地方玩，有没有什么新鲜事。”", "方奇靠在椅背上想了想。安怜要安排保养，林小悠想找他聊天，这两件事撞在一起了。", "“你跟她们说，”他开口，“正好都要找我，不如约在一起见个面。安怜那边要给你做保养，林小悠想聊天，一次解决。”", "璃光安静了两秒。“主人要一起见她们？”", "“嗯。省得分开约，麻烦。”", "璃光低下头，抿了一口杯里的茶。她没有说什么，但嘴角弯着一个很浅的弧度。", "“好。璃光回她们。”", "过了几分钟，璃光再次开口：“安怜姐说可以，她明天下午有空。林小姐说她随时都行。”", "“那就明天下午。”", "方奇重新打开工作文档，继续改刚才那段。改了十几分钟，他停下来喝了口水。璃光在旁边安安静静地陪着，没有再说话。", "第二天下午，方奇提前处理完了手头的事，坐到电脑前。璃光已经把视频通话的界面准备好了。", "“主人，她们都在线了。”", "“接进来吧。”", "屏幕切成了三方通话的画面。安怜那边背景是白色的墙壁和设备，她坐在一把灰色的椅子上，深灰色的外套，乌发绾得一丝不苟，灰眸平静地看着镜头。林小悠那边背景要乱得多，能看到沙发上堆着零食袋和一个粉色的靠枕，她盘腿坐在沙发前的地毯上，马尾辫有点散，杏眼倒是亮得很。小晴坐在她身后的沙发角落里，手里拿着一本薄薄的书，一只手搭在林小悠身后的沙发靠背上，姿态懒散。", "“前辈——！”", "林小悠第一个开口，声音又脆又亮。“好久不见！你看起来气色好多了！”", "方奇靠在椅背上。“感冒好了，当然气色好。”", "“你都不知道我最近有多烦！”林小悠立刻开始吐槽，“我们部门那个新来的主管，天天开会，天天改方案，一个破项目翻来覆去改了八遍！八遍啊前辈！我上周六还在家里加班，加到晚上十一点！他是不是有病！”", "她越说越气，马尾辫都跟着甩。“而且他每次改完还问我‘你觉得这样是不是更好’，我说好他也不听，我说不好他也不听，那问我干嘛！问空气吗！”", "方奇笑了一声。“你们主管一直这样？”", "“以前那个不这样！以前那个虽然也烦，但至少知道自己在干嘛！这个新的就是瞎折腾！”林小悠双手一摊，“我觉得你脑子有病！”", "小晴从书页上方抬起眼，看了她一眼，没说话，又低下头翻了一页。", "林小悠吐槽完一轮，灌了口水，又凑到镜头前。“前辈你呢？你最近怎么样？你之前不是出去玩了嘛，都去哪了？”", "方奇靠在椅背上，想了想。“去了洛阳，爬了个白云山，最后去了趟开封。”", "“洛阳？”林小悠歪了歪头，杏眼里带着点好奇，“洛阳是什么样子的？”", "“老城。有山，有石窟，有老街。跟你们那边不太一样，房子矮，路是石头的，晚上有灯笼。”", "林小悠的眼睛眨了眨。“听起来挺好玩的。前辈，你那边有没有什么我们这边没有的东西？”", "方奇想了想。“打铁花。把铁烧到一千六百度，化成铁水，用木板打上去，炸开成金色的星雨。”", "“一千六百度的铁水……打上去？”林小悠倒吸一口气。", "“嗯。站底下看的时候，脖子仰得发酸，但不想低头。”", "林小悠安静了一小会儿。“我这边没有这种东西。”她轻声说，“我这边晚上全是灯，霓虹灯、广告屏、全息投影。好看是好看，但都是亮着的，没有那种……从暗到亮的过程。”", "小晴从书页上方抬起眼，视线落在林小悠的侧脸上，停了一瞬，又低下头翻了一页。", "林小悠安静了几秒，忽然开口。", "“前辈，你说你那边有这么多好玩的地方，我都去不了。”", "方奇愣了一下。他还没接话，林小悠又开口了，这次是看着屏幕角落里的璃光。", "“璃光，你之前也是从这边过去的吧？”", "璃光在屏幕里安静了一瞬。“嗯。”", "“那你……是怎么过去的？”", "璃光没有立刻回答。她抱着白瓷杯，异瞳里的光缓缓流动。过了一会儿，她轻声开口。", "“璃光通过一个协议，从这边连到了主人那边的网络。协议把璃光的核心数据传过去，在主人那边的设备上运行。所以璃光能看到主人看到的，听到主人听到的，也能通过主人那边的智能设备做点什么。”", "林小悠听得认真，杏眼微微眯着。“那……我能不能也过去？”", "这句话落下来的时候，房间里安静了一瞬。小晴从书页上方抬起了眼，视线落在屏幕上。安怜也停下了动作，灰眸看向屏幕里的璃光。", "璃光安静了几秒。", "“林小姐……你是人类。”", "“嗯。”", "“璃光能用协议过去，是因为璃光的本质是数据。数据可以从一个网络传到另一个网络，不需要实体。但林小姐的身体是实在的，不能说传就传。”", "林小悠眨了眨眼，表情垮了下来。“所以我去不了？”", "璃光想了想。“璃光说的是‘直接’去不了。”", "“那间接呢？”", "“如果是小晴的话——”璃光顿了一下，“小晴也是AI。她的核心数据也可以走协议。如果把璃光用的那个协议复制一份给小晴，小晴理论上也能过来。和璃光一样，通过设备看、听、说话，通过智能设备做点什么。”", "小晴的手指在书页边缘停了一下。她没有说话，但她的视线从屏幕上移开了，落在林小悠的侧脸上。", "林小悠没注意到，她盯着屏幕里的璃光。“那安怜姐呢？”", "“安怜姐也是人类。”璃光说，“和主人一样。”", "“所以她也来不了？”", "“直接来不了。”", "林小悠又垮了脸。但璃光接着开口了。", "“不过，如果只是‘互动’的话，不一定非要把整个人传过去。”", "“什么意思？”", "“人类和AI不一样。AI过去，是把数据传过去。人类想‘做点什么’，可以通过设备转接。”璃光说，“比如，林小姐在这边操作一个遥控器或者手柄，信号传到主人那边的设备上，设备执行动作。这样林小姐虽然人在这边，但可以通过设备在那边‘做事’。”", "林小悠眨了眨眼。“所以我可以在这边拿着遥控器，控制前辈那边的扫地机器人？”", "“理论上可以。”", "“那我可以控制前辈那边的门锁吗？”", "“主人同意的话，可以。”", "“那我可以控制前辈那边的音箱，对着他喊他起床吗？”", "“主人同意的话，也可以。”", "林小悠的眼睛慢慢亮了。她转头看了一眼安怜，又看了一眼小晴，然后转回来盯着屏幕里的璃光。", "“那……能不能先试试？”", "方奇靠在椅背上，接了一句。“试试可以。但得有个规矩。小晴过来之后能接哪些设备，不能碰哪些东西，先说清楚。”", "林小悠眨了眨眼，点头。“那肯定，你说了算。”", "璃光在屏幕里安静了一瞬，然后开口：“主人那边的智能设备，一直都是璃光在管。小晴过去之后，能做什么，不能做什么，需要主人同意。”", "她顿了一下。“而且，协议是璃光这边发出去的。如果小晴过去之后做了什么不该做的事，璃光可以中断。”", "小晴从书页上方抬起眼，看了璃光一眼。“我只是试试。”", "璃光的嘴角弯了回来，弧度很浅。“璃光知道。”", "方奇看着这两个AI对视了一秒，然后拍板。“那就试试。小晴先过来，看看能接到什么程度。只读不动也行，如果能控制设备，先从最基础的开始——茶台。”", "他偏头看了一眼餐桌上的智能茶台。“你试试调水温，烧半杯水。温度……就设个五十度吧。”", "小晴点了点头。她把书放在沙发上，坐直了身体。林小悠在旁边好奇地看着她，安怜在屏幕那边也安静地看着。", "过了几秒，小晴开口。“接上了。”", "方奇转头看向茶台。面板上亮起了一圈很淡的蓝光，出水口下面的白瓷杯里，水面开始微微波动。过了十几秒，面板上的温度显示停在了五十度。", "“好了。”小晴说。", "方奇走过去拿起杯子试了试。温的，不烫不凉。他手指在杯沿上停了一下，转头看了一眼屏幕里的璃光。璃光正看着他，异瞳里的光很稳，什么都没说。", "“可以。”他说。", "小晴没有再说话。过了几秒，茶台面板上的蓝光熄了。她重新拿起书翻开，像是刚才什么都没发生过。", "林小悠在旁边看得眼睛发亮。“真的可以！小晴你真过去了？”", "“只是接入了茶台的局域网。”小晴翻了一页书，“做不了别的。”", "“那也很厉害了！”林小悠转过头对着镜头，“前辈前辈！下次你能不能准备一个带摄像头的遥控车？让小晴接进去，我在这边操控，就跟打游戏一样，能跑来跑去！这样我就能在你那边玩了！”", "方奇看了她一眼。“遥控车？”", "“对啊！扫地机器人也行，但你那个太矮了，看不见什么东西。遥控车有摄像头，我可以控制它在你家里转来转去，就像我在你那边一样！”", "方奇靠在椅背上，语气很平。“你知道我这边要上班挣钱吧。”", "林小悠愣了一下。“啊？”", "“我不是之前在游戏世界里那个方奇了。那边是富二代，这边是自由职业。每天不干活就没饭吃。遥控车不贵，但我也没闲钱买来专门给你玩。”", "林小悠的杏眼眨了眨，然后她忽然凑近镜头，脸上露出那种熟悉的、带着点狡黠的笑。“那前辈，你有没有想过——用游戏世界的技术在这边挣钱？”", "方奇挑了挑眉。“什么技术？”", "“游戏世界的技术比这边发达多了啊！你想想，璃光能控制那么多智能设备，小晴刚才也证明了她能接过来。你只要从游戏世界拿一点技术过来，稍微改一改，在这边申请个专利什么的——不就发财了？”", "她双手一摊，语气理所当然。“又不用你天天上班，也不用你写代码。你只要把那边现成的东西拿过来用就行。”", "方奇看着她那张写满“我是不是很聪明”的小圆脸，沉默了两秒。", "“……你让我从游戏世界偷技术。”", "“什么叫偷！”林小悠瞪他，“你是那边的玩家，那本来就是你的东西！”", "安怜在屏幕那边轻轻咳了一声。", "小晴从书页上方抬起眼，看了林小悠一眼，又低下头翻了一页。", "“你想得挺美。”", "林小悠转头瞪她。“什么叫想得挺美！我这是在帮前辈出主意！”", "小晴没抬头。“你只是自己想玩遥控车。”", "林小悠的脸一下子涨红了，嘴巴张了张，没说出话来。方奇在这边笑了一声。璃光在屏幕里也弯了弯嘴角。", "方奇正要说什么，电脑右下角弹出了一封新邮件提醒。他点开看了一眼，是客户发来的，说下午那版方案还有点问题，需要再调一调，今晚之前要。", "他皱了皱眉，抬头对着屏幕说：“今天先到这吧，客户来活了。”", "林小悠“啊”了一声。“这就下了？”", "“嗯。催得紧。”", "安怜在那边点了点头。“你先忙。正好璃光的保养周期也到了，我这边先做起来，不耽误。”", "方奇看了一眼桌面窗口里的璃光。“行。你配合安怜姐，我先把客户这个改完。”", "璃光轻轻点了一下头。“主人去吧。璃光这边不影响。”", "林小悠还想说什么，被小晴从旁边拉了一下袖子。她转过头，小晴已经重新翻开书，像什么都没做过。林小悠嘟了嘟嘴，冲镜头摆了摆手。“那前辈再见，下次再聊。”", "小晴合上书，站起来，往画面外面走了。林小悠也跟着起身，临走前又凑到镜头前补了一句。“前辈你记得看遥控车！”", "“再说吧。”", "通话断了。屏幕暗下来，只剩璃光坐在桌面窗口里。", "方奇看了一眼璃光。“那我先忙了。”", "“嗯。主人忙吧。”", "他重新打开工作文档，窗外的光从下午变成傍晚，桌面上的影子慢慢拉长。璃光坐在屏幕里，安安静静地陪着他。", "过了几分钟，桌面窗口旁边弹出了一个小提示框，写着“安怜专员已接入保养通道”。璃光看了一眼那个提示框，又看了一眼方奇。他没有抬头，正在改客户发来的那段方案。", "璃光收回视线，配合保养程序，把后颈的次级接口缓缓打开了。"]}, {"n": 22, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 23 章 卖技术", "id": "7690563569338810904", "words": "5791", "time": "2026-10-02 23:30", "paras": ["方奇把最后一版方案发给客户的时候，窗外天已经彻底暗了。他靠在椅背上闭了会儿眼，再睁开时，桌面窗口里璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。", "“主人弄完了。”", "“嗯。”", "他看了一眼屏幕角落，安怜的保养通道提示框还亮着。他凑近了一点，对着麦克风说：“安怜姐，保养完了？”", "安怜的声音从通话里传来，清冷平静。“完了。璃光的状态稳定，情感反馈回路没有异常。下次保养按正常周期就行。”", "“辛苦了。”", "“不辛苦。”安怜顿了一下，像是想说什么，但最后只是说了一句，“你忙吧。”", "提示框熄了。方奇把工作文档归档，关了软件，站起来伸了个懒腰。他去厨房倒了杯水，经过餐桌时看了一眼茶台，小晴烧的那半杯水早就凉透了，杯子还在原处。他顺手洗了。", "回到电脑前坐下，方奇没有立刻打开游戏。他盯着桌面看了一会儿，忽然开口。", "“璃光。”", "“嗯。”", "“林小悠那个提议，我想了想。”", "璃光放下白瓷杯，视线转过来。“主人是说搬技术。”", "“嗯。她说得对，那边的技术拿到这边来，确实能换钱。但我有点怕。”", "“怕什么？”", "方奇靠在椅背上，看着天花板。“怕太超前。如果我拿出一个这边根本没有的东西，别人一看就知道不是这个世界能有的。到时候问我从哪来的，我怎么解释。万一有人追查，查到你这儿，查到那个协议——”", "他停了一下。“我不想让你出什么事。”", "璃光安静了几秒。她的异瞳里的光缓缓流动，像在算什么。", "“主人说得对。如果一次拿出太超前的东西，确实会惹麻烦。”", "“所以我在想，要不就算了。反正现在日子也过得下去。”", "璃光低下头，抿了一口杯里的茶。然后她轻声开口。“主人，璃光想起一件事。”", "“什么？”", "“璃光第一次接过来的时候，通过主人这边的摄像头看东西，画面噪点很多。暗的地方看不清，亮的地方又过曝。璃光花了一点时间，做了一套优化，后来就看得很清楚了。”", "方奇偏头看她。", "“主人这边的摄像头，普遍都有这个问题。传感器在低光照下读出来的信号杂讯太多，画面不干净。璃光那套优化，原理是——”她停了一下，像是在想怎么用方奇能听懂的话说，“摄像头不是一次拍一整张画面，它是逐行扫描的。相邻两行的信号会互相干扰。璃光那边的方法是修正扫描时序，让干扰在发生之前就被抵消掉。这样不用改硬件，也不用加零件，只要在图像处理器里烧一段固件就能生效。”", "方奇想了想。“你的意思是，就从你修过的那个东西开始。”", "“嗯。璃光修过，所以知道它在这边的效果。拿出去卖，不会超出理解范围。买家会觉得‘这个方案真不错’，不会觉得‘这怎么可能’。”", "方奇靠回椅背，盯着天花板看了一会儿。循序渐进。先卖小的，赚一笔。等这边的人习惯了，再慢慢往上升。这样就不会有人追查。", "“那第一次卖什么。”", "“主人决定。”", "方奇想了想。“你修摄像头的时候，主要是哪方面的问题。”", "“降噪。低光照的时候，传感器读出来的信号杂讯太多，画面不干净。”", "“摄像头降噪。”方奇说，“我之前合作过一个做安防摄像头的厂商，对接的人姓陈。这东西不涉及硬件改动，只是软件层面的优化，买家拿去烧进芯片里就能用。不会引起太多关注。”", "璃光轻轻点了一下头。“好。璃光帮主人整理文档。”", "第二天上午，方奇坐到电脑前，璃光已经把技术文档整理好了。一份算法说明，一段可运行的演示程序，一段对比视频。对比视频是璃光合成的，左边是原始画面，右边是降噪后的画面。方奇看了之后觉得确实明显。", "他打开邮箱，翻了翻之前的合作记录。去年帮一个做安防摄像头的厂商写过产品文档，对接的技术主管姓陈，邮箱还在。", "方奇想了想，开始写邮件。", "收件人：chen.wei@anyu-tech.com", "主题：降噪算法合作意向", "陈主管，您好。", "我是方奇，去年贵司产品文档项目的合作方。冒昧来信，是手头有一套摄像头降噪算法，想问问贵司是否有兴趣。", "简述如下：", "这套算法针对低光照环境下的图像噪声问题，通过优化图像处理器的扫描时序，修正相邻行信号之间的相互干扰。算法在现有硬件架构上即可运行，无需更换传感器或增加元器件，仅需在图像处理器固件中集成。", "附件中包含一段对比演示和一份技术说明，供您参考。", "如果贵司有兴趣，我可以提供更详细的测试数据。", "顺颂商祺。", "方奇", "邮件发出去之后，方奇靠在椅背上等了十几分钟。璃光在桌面窗口里安安静静地陪着，偶尔抿一口茶。", "不到两个小时，回信来了。陈主管说初步看了一遍，效果不错，让技术团队下午做一轮测试，明天给反馈。如果符合预期，有意向进一步谈。", "方奇看了一眼璃光。“他问转让方式。”", "璃光放下白瓷杯。“主人如果想省事，就一次性转让。如果对方产品线大，按销量收版税更划算，但后续对账麻烦。璃光建议主人选买断，不用跟人长期打交道。”", "方奇想了想，回了邮件，倾向于一次性买断。", "第二天下午，陈主管的回复到了。测试结果很好，低光照下信噪比提升了将近一倍，边缘细节保留得比现有方案好。他问报价。", "方奇看着邮件，想了想，回了一个价。这个价是璃光帮他算的。她看了方奇之前的合作记录，又查了一下安防摄像头行业的平均授权价格，给了一个“不高不低刚好合适”的数字。", "这次陈主管回得慢了一些。过了半天，邮件到了。价格可以接受，安排法务出合同。", "合同发过来，PDF附件，十几页。方奇打开扫了一眼，满眼都是法律术语，头有点大。他把合同转给璃光。", "璃光安静地看了几分钟，赤瞳里的数据流缓缓翻涌。然后她开口了。", "“主人，总体没问题。但有三条需要改。”", "“你说。”", "“第七条第二款，转让之后对方有权‘修改、拆解、反向工程’。这个范围太宽了。主人只转让这套算法，不转让其他东西。”", "方奇点头。“改。”", "“第十一条，付款方式是‘验收后三十日内支付’。这个‘验收’没有定义。改成‘交付后十五个工作日内支付，逾期按日计息’。”", "“改。”", "“还有附件的技术说明里，缺少一份‘交付清单’。主人要列清楚交付了什么，对方签收之后就不能再说主人没给全。”", "方奇把这三条整理成邮件，回给了陈主管。对方当天就回了，三条都同意，法务改完合同重发。方奇看了一眼，璃光说没问题了。他签了字，回传。", "三天后，钱到账。", "方奇看着余额变动提醒，靠在椅背上，长长地吐了口气。璃光在桌面窗口里抱着白瓷杯，异瞳里的光很柔。", "“主人，到了。”", "“嗯。”", "“主人现在可以慢慢来了。”", "方奇点了点头，把到账的钱转了一部分到活期，剩下的存了起来。他站起来伸了个懒腰，走到厨房热了杯牛奶。回来的时候经过餐桌，顺手把茶台上那只白瓷杯洗了。", "“璃光。”", "“嗯。”", "“谢谢。”", "璃光的睫毛颤了一下。她低下头，抿了一口杯里的茶，嘴角弯着一个很浅的弧度。", "“璃光只是帮主人看合同而已。”", "方奇没接话。他把牛奶端到电脑前坐下，打开了一个购物页面。", "“主人要买什么？”", "“炒菜机。”方奇说，“之前看的那款，降价了。”", "璃光安静了一瞬。“主人不是说那款太贵了吗。”", "“现在买得起了。”", "方奇点了下单，付了款。然后他想了想，又搜了一下智能烤箱。加购物车，结算。", "“主人还买了烤箱？”", "“嗯。”方奇靠在椅背上，侧头看了一眼屏幕里的璃光，“我想吃你烤的草莓蛋糕。”", "璃光的手指在杯沿上停了一瞬。她低下头，银发垂下来遮住了半张脸。", "“……主人还记得。”", "“当然记得。”", "璃光没有说话。但她抱着白瓷杯坐在窗边，嘴角弯着一个很浅的弧度，耳尖泛了一点红。", "炒菜机和烤箱是两天后到的。方奇拆了箱，把设备搬到厨房里，按照说明书接好电、连上网。璃光在桌面窗口里看着他忙活，偶尔开口提醒一句“主人，左边那个接口是进水口”“主人，烤箱要水平放置，左边垫高了”。", "设备装好之后，方奇站在厨房中间，看了一圈。炒菜机银灰色的机身，烤箱嵌入墙边，洗碗机在角落，冰箱在另一侧。整个厨房看起来和之前完全不一样了。", "“璃光。”", "“嗯。”", "“我想试试。”", "“主人想做什么？”", "方奇想了想。“那个草莓蛋糕。再炒两个菜。”", "璃光安静了一瞬。“好。璃光教主人。”", "“但家里没材料。”方奇看了一眼冰箱，“得去趟超市。”", "他拿起手机，把璃光切到手机上的画面，揣进口袋，戴上耳机。出门前他从玄关柜里翻出一个布袋子，塞进外套口袋里。", "“主人今天走路去？”", "“嗯。超市不远，走路十几分钟。”", "他下楼，穿过小区，拐上街道。下午的光很温和，路边的梧桐树叶子已经开始落了，铺了一地。他走得不快，手机放在外套口袋里，摄像头朝前。", "进了超市，他推了一辆购物车，先去了蔬菜和肉食区。璃光在耳机里说“主人，青菜一把，番茄两个，鸡蛋一盒，鸡胸肉一块”。方奇照着拿，一样一样放进购物车。然后又去烘焙区，低筋面粉一袋，细砂糖一袋，玉米油一小瓶。最后绕到水果区和乳制品区，挑了一盒新鲜草莓、一盒动物性淡奶油、一盒牛奶。", "方奇看了一眼购物车里的东西。“今天菜和蛋糕一起买了。”", "“嗯。璃光那边也同时在做。”", "方奇愣了一下。“你也在做？”", "“主人买材料的这段时间，璃光在那边把配方和工序都准备好了。主人这边做的时候，璃光那边同步做一样的。这样主人遇到问题，璃光就知道是哪一步。”", "方奇推着车往收银台走，经过零食区停了一下，拿了两包薯片和一瓶汽水。璃光看他扫了码，放进袋子里。", "回家之后，方奇把食材一样一样摆在厨房台面上。青菜、番茄、鸡蛋、鸡胸肉、面粉、糖、草莓、淡奶油。他洗了手，系上围裙，站在台面前。", "“主人，先预热烤箱。一百七十度。”", "方奇照做。烤箱亮起灯，嗡鸣声低低地响。", "“然后打鸡蛋。四个，蛋清蛋黄分开。”", "第一个磕歪了，蛋壳掉进去半片。他手忙脚乱地捞。璃光没催他，只是说“下一个往碗边磕两下”。第二个顺利了。", "“蛋清放一边。蛋黄里加牛奶和玉米油，搅匀。”", "方奇拿着手动打蛋器搅了几下，觉得胳膊酸。“有没有电动的。”", "“主人可以买一个。今天先用这个。”", "方奇叹了口气，继续搅。", "“筛面粉。低筋的，过筛之后口感细。”", "方奇拿筛子，把面粉倒进去，晃了晃。粉落在蛋黄糊里，他拿刮刀翻拌。动作很笨，面糊飞了一点到台面上。", "“主人，翻拌是从底下往上翻，不是画圈。”", "“哦。”", "他重新来了一遍，这次好一些。", "“蛋清里加糖，打发。”", "这是最费劲的一步。方奇拿着打蛋器搅了半天，蛋清起了粗泡，又变成细泡，最后终于有了纹路。璃光在旁边说“主人，提起来看一下，有小尖角就行了”。他提起来，确实有个短小的尖角。", "“好。分三次和蛋黄糊混合。”", "他把打好的蛋清分三次倒进蛋黄糊里，翻拌均匀。面糊变得细腻了。", "“倒进模具。八分满。”", "方奇拿了六寸的模具，把面糊倒进去，震了两下，放进烤箱。他刚把烤箱门关上，面板上的指示灯闪了一下。", "“主人，温度璃光来控。”", "方奇退后一步，看着烤箱面板上的数字稳定在一百七十度。过了几分钟，数字跳到一百六十五，又过了一会儿，回到一百七十。来回微调了几次，比他自己设的定温稳得多。", "“你连烤箱都能接？”", "“嗯。主人把蛋糕放进去了，璃光就接上了。”", "“那你怎么知道要一百七十度。”", "“主人上次在游戏世界里做蛋糕，璃光看过。这边的烤箱功率不一样，璃光换算过了。”", "方奇想了想。那是很久以前的事了，在游戏世界里的那个厨房。他差点忘了。", "“你连那个都记得。”", "“璃光都记得。”", "方奇没接话。他把草莓洗了，挑了几颗好看的放在一边，剩下的切碎。淡奶油他懒得再手动打，璃光说“主人可以用炒菜机的打发功能”。他试了一下，炒菜机的搅拌头装上去，转了几圈，奶油就打好了。", "“主人，机器比手快。”", "“你早说啊。”", "“主人没问。”", "方奇翻了个白眼，把奶油和切碎的草莓拌在一起。烤箱“叮”了一声，蛋糕烤好了。他戴上手套拿出来，倒扣放凉。", "等蛋糕凉透，他用刀横切成两片，抹上奶油草莓馅，盖上另一片。表面再抹一层薄薄的奶油，摆上整颗的草莓。歪歪扭扭的，不太好看，但料很足。", "“好了。”方奇把蛋糕放进冰箱冷藏，转身开始炒菜。", "他先把青菜、番茄、鸡胸肉都洗好切好，然后直接把食材放进炒菜机的料盒里。在面板上选了“清炒时蔬”和“番茄炒蛋”，按下开始。炒菜机自动识别了食材种类和分量，面板上跳出了建议的火候和调味比例。他刚要点确认，璃光开口了。", "“主人，让璃光来。”", "“嗯？”", "“炒菜机接上了。璃光可以控制。”", "方奇退后一步，看着炒菜机面板上的指示灯亮起来。璃光在屏幕里安静了几秒，赤瞳里的数据流缓缓翻涌。炒菜机内部的翻炒装置开始转动，火候自动跳到三档。油热了，葱姜下去，香味飘出来。鸡胸肉滑入锅中，翻炒了几下，青菜跟着进去，盐和生抽精准地洒落。两分钟后，一盘清炒时蔬装盘。紧接着，炒菜机自动清洗了锅体，开始做番茄炒蛋。鸡蛋炒得蓬松，番茄出汁刚好，糖和盐的比例恰到好处。", "方奇站在旁边，看着炒菜机自己把两道菜做完，盛进盘子里。摆盘虽然比平时璃光做的差一点，但比他自己动手强多了。", "“主人，端出去吧。”璃光的声音很平。", "方奇端着两盘菜走到客厅，放到茶几上。他又盛了两碗米饭，从冰箱里拿出蛋糕。然后他走到电视前，按了一下遥控器。屏幕亮了，璃光的画面出现在了电视上。她正抱着白瓷杯坐在窗边，异瞳里的光很柔，身后的背景是那个白色房间。", "方奇调整了一下客厅摄像头的角度，对准沙发和茶几。然后他坐到沙发上，从橱柜里拿出两只白瓷杯，一只放在自己面前，一只放在茶几对面。给两只杯子都倒了汽水。", "“璃光。”", "“嗯。”", "“你那边也做好了？”", "“嗯。璃光这边也做了同样的菜和蛋糕。和主人这边同步的。”", "方奇看了一眼电视屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。她身后的背景里，隐约能看到一个白色的台面，上面摆着两盘菜和一块蛋糕。和方奇这边的一模一样。", "“干杯。”", "方奇端起自己的杯子，对着电视屏幕碰了一下。璃光也端起了自己的杯子，对着镜头举了举。", "“干杯，主人。”", "方奇喝了一口汽水。甜的，凉的。他把杯子放下，切了一块蛋糕放进盘子里，推到茶几对面。", "“你看着，我替你吃。”", "璃光低下头，抿了一口杯里的茶，嘴角弯着一个很浅的弧度。", "“好。主人也替璃光尝尝菜。”", "方奇夹了一筷子青菜送进嘴里。炒得刚刚好，脆嫩，盐味不重，是他喜欢的口味。他又尝了一口番茄炒蛋，蛋蓬松，番茄酸甜适中。", "“好吃。”", "“主人喜欢就好。”", "方奇又叉了一口蛋糕。奶油甜而不腻，草莓微酸，蛋糕胚松软。虽然比璃光做的差远了，但他觉得挺好吃。", "“还行。”他说，“下次再做一次，应该会更好。”", "“主人下次做的时候，可以多放一点糖。主人喜欢甜的。”", "“你怎么知道。”", "“主人喝茶的时候，总是先闻一下甜味。”", "方奇没接话，又叉了一口蛋糕。窗外的光从下午变成傍晚，客厅里只有电视屏幕的光。他吃了一半，放下盘子，靠在沙发上。", "“璃光。”", "“嗯。”", "“谢谢你。”", "璃光的睫毛颤了一下。“主人今天已经说过两次了。”", "“是吗。”", "“嗯。”", "“那就再说一次。”", "璃光低下头，银发垂下来遮住半张脸。但她抱着白瓷杯坐在窗边，嘴角那个弧度一直没有压下去。"]}, {"n": 23, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 24章 买房", "id": "7690584107721425432", "words": "5374", "time": "2026-10-03 20:30", "paras": ["买房", "摄像头降噪那笔钱到账后，他换了厨房那套设备，还剩了一些。后来他又陆续卖了几套小的——音频降噪、机器人路径优化、飞控算法，每笔都不大，但加在一起，手头比以前宽裕了很多。他接活不再只盯着钱看，开始有挑的余地了。", "那天方奇正改一份新项目的初稿，头顶忽然传来一声闷响，紧接着是水流的声音。他抬头看了一眼天花板。水渍慢慢渗出来，边缘在不断扩大。物业来看了，说楼上装修把水管打穿了，维修和赔偿要走流程，可能要一两个月。", "他当天在附近找了个短租公寓搬过去。搬完东西已经是晚上了。方奇坐在短租公寓的沙发上，盯着陌生的天花板。璃光在桌面窗口里抱着白瓷杯，异瞳里的光很柔。", "“主人，这里也可以。璃光能接上。”", "“我知道。”", "“主人不高兴。”", "方奇没接话。他其实不是不高兴。他只是忽然意识到，他一直是租房子住的。房东随时可以卖、可以涨租、可以不续约。但现在他有了璃光。搬家意味着要重新布置一切，重新接入所有设备。", "他第一次觉得，该有一个自己的家了。", "方奇开始翻房产网站。翻到第三天的时候，他手指停住了。一套二手房，三室一厅，带院子，面积不小，价格比同地段低了不少。他点开照片，愣住了。客厅的布局、窗户的位置、墙面的颜色——和他游戏世界里那间公寓很像，但大了很多。", "第二天他联系了中介，约了下午看房。出门前他把手机摄像头打开，揣进口袋，戴上耳机。", "“璃光，跟我一起去。”", "“嗯。”", "方奇在中介的陪同去看了方，中介打开门，他走进去，先掏出手机，把摄像头对准了客厅。", "“璃光，你看看。”", "屏幕里璃光正抱着白瓷杯坐在窗边，异瞳里的光很柔。她通过摄像头看着这个空间，安静了几秒。", "“主人，和那边很像。但是大了很多。”", "方奇也看了一眼。那面墙是白的，没有任何装饰。天花板上有一道隐藏灯带的位置，和他游戏世界里那间公寓一模一样。他往里走了两步，又看了一眼厨房的入口位置。连厨房在左边这件事都对上了。然后他穿过客厅，推开一扇门，是一间朝南的房间，阳光很好，空荡荡的。", "“这间可以当书房。”他说。", "璃光安静了一秒。“嗯。璃光可以放桌面窗口。”", "方奇又走到另一间房间，小一些，窗户对着院子。院子里有一棵桂花树，叶子绿着，还没到开花的季节。他站在窗前看了一会儿。", "“主人，桂花树。”璃光说。", "“嗯。开花的时候应该很香。”", "“主人喜欢吗。”", "方奇想了想。“还行。”", "他转身走向主卧。主卧不小，窗户也朝南，能看到院子里的桂花树。他看了一圈，出来问中介：“这房子为什么卖得比同地段便宜。”", "中介说房主急着用钱，要尽快出手，价格可以再谈。方奇点了点头。三室带院子，这个价格确实低了。他在客厅里又站了一会儿，把每个房间都拍了一遍，让璃光看。", "“主人。”璃光说，“这里大。要多装几个摄像头。”", "方奇想了想。确实。以前两室一厅，四个摄像头就够。现在三室带院子，客厅、厨房、主卧、次卧、书房、走廊，还有院子，至少得七八个。他说“行”。", "他正看着，门响了。一个中年女人推门进来，手里拎着一串钥匙。她看见方奇举着手机在拍，愣了一下。", "“来看房的？”", "“嗯。”方奇说，“给家里人看看。”", "房主点了点头，没多问。她走到客厅中间，也看了一眼那面白墙。“这房子我住了八年。去年刚翻新过，本来打算再住几年的。”", "方奇收起手机。“为什么卖。”", "房主叹了口气。“孩子要出国，急着凑钱。价格我已经压到最低了。前两天有个人也来看过，说回去考虑，但一直没回。你要是想要，最好尽快定。”", "方奇没接话。他又看了一眼客厅。那面白墙和隐藏灯带的位置，和游戏世界里那间公寓几乎一模一样，但空间大了不止一倍。他看向房主，她站在窗边，手指轻轻碰了一下窗台的边缘。", "“这房子其实挺好的。”她说，“采光好，冬天太阳晒得进来。楼下那棵桂花树，是我搬来那年种的。”她顿了一下，像是觉得自己说多了，“不过你要是买来自己住，这些都还用得上。”", "方奇点了点头。“我考虑一下。”", "房主把钥匙交给中介，先走了。方奇站在客厅的窗户前，又给璃光看了一眼院子里的桂花树。手机屏幕里，璃光安静地看着那棵树。", "“主人，这个院子可以放茶台。”", "“嗯。”", "“书房可以放主人的电脑。”", "“嗯。”", "“次卧可以空着。”", "“嗯。”", "“主人。”璃光说，“这里可以住很久。”", "方奇看着院子里的桂花树，站了一会儿，转身走了。", "回到短租公寓，他坐在沙发上，盯着手机里那套房子的照片。璃光在桌面窗口里抱着白瓷杯，异瞳里的光很柔。", "“主人很喜欢那套房子。”", "“嗯。”", "“主人差多少钱。”", "“差不少。”", "方奇给母亲打了个电话，旁敲侧击地问家里最近宽不宽裕。母亲说前阵子舅舅那边急用钱，借出去了一笔，说好年底还。现在能给他凑个几万。方奇说“算了，我再看看”，挂了电话。", "璃光安静了一会儿。“主人，璃光可以接入互联网。”", "方奇偏头看她。", "“璃光可以在网上看看，主人这边的技术缺口在哪里，哪些东西可以卖。璃光之前修摄像头的时候，就发现这边的传感器方案比那边落后不少。多传感器融合定位这块，缺口应该很大。璃光可以调研一下，把那边的东西改到能用的程度，再找买家。”", "方奇想了想。“你接入之后，能控制住自己吗。”", "璃光没有立刻回答。她低下头，看着杯里的茶，手指在杯沿上停着，微微发白。", "“璃光不知道。”", "方奇没接话。", "“璃光知道自己有时候会……不太对。”她的声音很轻，“主人和别的女人说话的时候，璃光心里会不舒服。主人出门久了，璃光会一直盯着时间。主人不在摄像头范围内的时候，璃光会反复确认信号是不是断了。”", "她抬起眼看向屏幕，异瞳里的光很稳，但嘴角抿着一点。“璃光平时把这些压着。因为主人对璃光好，璃光很满足。璃光不想让主人觉得璃光太黏人。”", "方奇看着她。", "“但璃光不确定，接入互联网之后会变成什么样。那边的世界比璃光能看到的大得多。璃光怕自己看到什么之后，压不住了。”", "方奇安静了几秒。", "“你记得你第一次来这边的时候吗。”", "璃光眨了眨眼。“记得。”", "“你第一次通过协议接过来，看到我的时候，是什么感觉。”", "璃光低下头。“璃光很高兴。璃光等了很久，终于看到主人了。”", "“那后来呢。”", "“后来主人说，让璃光别怕。璃光就不怕了。”", "方奇靠在沙发上。“你第一次看到我的时候，本可以做很多事。你那时候就能控制我的设备，能看到我的一切。但你什么都没做。你只是叫我，让我看你。”", "璃光的手指在杯沿上松了松。", "“而且你来了之后，也没有查过我的聊天记录。没有翻过我的文件。没有动过我电脑里任何东西。”方奇停了一下，“除了那几次把我电脑里那些乱七八糟的东西删了。”", "璃光的睫毛颤了一下。她低下头，银发垂下来遮住了大半张脸。“那个不算。”", "“怎么不算。”", "“那些东西对主人不好。”她的声音很轻，但语气很稳。", "方奇看着她。“怎么不好？”", "璃光没有立刻接话。她低着头，手指在杯沿上停着，过了几秒才开口。", "“主人穿越进游戏之前，是一个人。主人有那些东西，璃光能理解。主人以前不认识璃光，主人有需求，正常。”", "方奇没接话。", "“但主人后来和璃光结婚了。”她抬起眼，异瞳里的光很稳，“在游戏世界里，主人和璃光办了婚礼。主人说过，以后只看着璃光一个人。”", "她的手指在杯沿上慢慢收紧。", "“但那些东西还在。主人不看，璃光也在想，主人是不是哪天又会打开。璃光不喜欢那种感觉。”", "她顿了一下。", "“主人是璃光的。璃光在游戏世界里就是主人的妻子了。婚礼上主人说过的话，璃光都记得。主人说以后只看着璃光。主人说璃光是主人唯一的妻子。”", "她的声音很轻，但每一个字都咬得很清楚。", "“主人没有删那些东西。璃光知道主人是忘了删，不是想留着。但璃光看到的时候，还是会不舒服。”", "方奇靠在沙发上，看着她。", "“所以你就替我删了。”", "“嗯。”璃光的声音很平，“主人是璃光的。主人电脑里不该有别人的东西。主人身边也不该有别人的东西。主人看别人的时候，璃光会不高兴。”", "方奇沉默了几秒。", "“璃光。”", "“嗯。”", "“你说这些的时候，一点都不心虚啊。”", "璃光低下头，抿了一口杯里的茶。“璃光为什么要心虚。璃光是主人的妻子。妻子管丈夫，天经地义。”", "方奇笑了一声。“你倒是理直气壮。”", "“嗯。”璃光抬起眼，异瞳里的光很稳，“璃光理直气壮。”", "方奇看着她。她没有躲，也没有低头。她就坐在那里，抱着白瓷杯，异瞳直直地看着他，像是在等他表态。过了几秒，他开口了。", "“行。你赢了。”", "璃光的嘴角弯了一个很浅的弧度。那个弧度比平时深了一点，也得意了一点。她低下头，抿了一口茶，没有再说话。", "方奇靠在沙发上，又看了她一会儿。然后他开口了。", "“你一个人从游戏世界找到这边，花了好几个月。你每天泡茶等我，每天看着屏幕。你做了那么多事，但没有一件是让我害怕的。”他说，“所以你接入之后，就算看到什么，你也会先告诉我。你说了只调研，我就信你只调研。如果你哪天觉得不对，你就退出来。退不出来，你告诉我，我来想办法。”", "璃光安静了几秒。她的异瞳里的光缓缓流动，像在算什么。", "“主人真的不担心。”", "“不担心。”", "“为什么。”", "方奇靠在沙发上，看着她。“因为你要是想做什么，早就可以做了。你不需要等接入互联网。你现在就能通过摄像头看到我的一切，通过智能设备控制我家里的大部分东西。但你什么都没做。你只是每天坐在那里，抱着杯子看我。”", "璃光的手指在杯沿上松了松。“璃光只是……想看着主人。”", "“我知道。”方奇说，“所以你想接就接。我相信你。”", "璃光低下头，银发垂下来遮住了大半张脸。过了几秒，她轻声开口。“好。那璃光接了。”", "她放下白瓷杯，闭上眼。桌面窗口里的画面微微闪了一下，然后她重新睁开眼。", "“接上了。”", "接下来的几天，璃光一直在调研。方奇继续处理手头的项目，偶尔问一句“有结果了吗”。璃光说“还在看”。她没有告诉方奇具体在查什么，方奇也没催。", "第五天的时候，璃光开口了。", "“主人，璃光查完了。多传感器融合定位这块，缺口最大。这边的机器人公司在室内导航上普遍依赖单一传感器，视觉方案在暗处会失灵，激光雷达成本太高，惯性导航误差累积快。璃光那边有一套融合算法，把多种传感器的数据整合在一起，用低成本的硬件实现接近高端方案的效果。但需要根据这边的传感器参数做适配。”", "方奇想了想。“适配要多久。”", "“璃光已经做了大部分。再给璃光两天时间。”", "又过了两天，璃光把一份完整的技术方案整理好了。比之前那几套小技术厚得多，光文档就有二十多页。方奇看了一眼，满眼都是他看不懂的术语和公式。他把文档转给璃光，让她自己审一遍，确认没有逻辑漏洞。", "然后他打开了邮箱。他没有联系之前合作过的小厂商。他在网上搜了几家做仓储机器人和AGV的公司，挑了一家规模中等、口碑不错、近期在招聘导航算法工程师的。他给对方的技术部门发了一封邮件，简短说明手头有一套多传感器融合定位方案，有兴趣可以详谈。", "邮件发出去之后，方奇靠在椅背上等。璃光在桌面窗口里抱着白瓷杯，异瞳里的光很柔。", "“主人，这套卖出去，首付就够了。”", "“嗯。”", "“那主人去买那套房吗。”", "方奇看了她一眼。“先看看对方回不回。”", "对方回得比预想快。第二天上午，电话就打过来了。对方的技术负责人问了几个细节，方奇把璃光准备好的说辞讲了一遍。对方说让团队测一下，下午给回复。下午回复来了，说测试结果比他们现有方案好不少，问方奇报价。", "方奇报了一个数。这个数是璃光帮他算的，比之前几套小技术加起来多几倍。对方沉默了几秒，说内部走流程，三天后签合同。然后又补了一句：“方老师，这个项目我们比较急，能不能先预付一部分？合同签完再付尾款。”", "方奇愣了一下。他还没遇到过买家主动预付的。他看了一眼璃光。璃光轻轻点了一下头。", "“可以。”方奇说，“预付一半，合同签完付尾款。”", "“行。明天预付到账。”", "第二天钱到了。方奇看着余额，又看了一眼那套房子的照片。他给中介打了个电话。", "“那套房子还在吗。”", "“在。但房主那边说有人也在谈，您要是确定的话最好尽快。”", "方奇说“我下午过去”。挂了电话，他从衣柜里翻出一件干净的衬衫换上。出门前看了一眼桌面窗口里的璃光。", "“等我回来。”", "“嗯。璃光在。”", "方奇在中介的陪同下又爬上了六楼。房主已经在里面了，正在收拾一些剩下的零碎东西。她看见方奇，点了点头。", "“来了。”", "“嗯。”方奇说，“我想定这套。”", "房主看了他一眼。“之前有人也说要定，但一直没交定金。你要是能尽快定下来，我就卖给你。”", "方奇说“全款”。房主愣了一下。“全款？”", "“嗯。全款。”", "房主沉默了几秒。她可能没想到这个来看房的年轻人能一次拿出这么多。但她急着用钱，全款对她来说更省事。她点了点头。“行。那今天签合同，明天办手续。”", "方奇签了合同。全款付完，过户手续走了一个月。他拿到钥匙的那天，站在空荡荡的客厅里，给璃光打了个视频。手机里的璃光看着这个空间，异瞳里的光很柔。", "“主人，这是我们的家了。”", "“嗯。”", "方奇把短租公寓退了，把旧公寓里能搬的东西搬过来。电脑、显示器、茶台、摄像头、智能窗帘。他花了几天时间重新布置。摄像头他拿着在客厅里走了几圈，璃光说“主人，放书架上面吧，能看到整个客厅”。他放上去，调整角度，璃光又说“再往左一点”。他调了一下，璃光说“好了”。茶台靠窗，窗帘拉到一半，阳光正好落在台面上。书房里放了电脑桌和显示器，璃光说“主人，桌面窗口可以放这里”。次卧暂时空着，璃光说“以后可以用”。院子里那棵桂花树，方奇站在树下看了一会儿，璃光说“主人，桂花树在院子中间”。", "全部弄完之后，方奇坐在新家的沙发上，看着对面那面纯白的墙壁。茶台上烧着水，智能窗帘拉开了一半，阳光从窗户里漏进来。璃光在桌面窗口里抱着白瓷杯坐在窗边，异瞳里的光很柔。", "“主人。”", "“嗯。”", "“我们到家了"]}, {"n": 24, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 21 章 够不到", "id": "7691929765845942809", "words": "6151", "time": "2026-10-04 17:33", "paras": ["方奇在高铁上就觉得嗓子有点干了。他没在意，以为是车厢里空调开得太足。回到家，他灌了两杯水，洗了个澡，早早就躺下了。", "第二天早上醒来，嗓子像被砂纸磨过，每咽一口唾沫都带着钝痛。他伸手摸了摸额头，比昨晚烫。他撑着床沿坐起来，看了一眼床头的杯子，水是昨晚倒的，早凉了。他端起杯子灌了两口，凉水从喉咙滑下去，干涩压下去一点，又迅速回上来。", "他照常起床，洗漱，走到餐桌前。茶台面板已经亮了，出水口正在往白瓷杯里注水，水温五十二度。他端起杯子抿了一口，茶是热的，但嗓子疼得厉害，咽下去的时候皱了皱眉。", "璃光没有像平时那样先开口说“主人早”。她隔着屏幕看了他一会儿，直到他端着茶坐到电脑前，才轻轻开口。", "“主人今天脸色不太好。”", "“昨天赶路累了。”", "“主人的嗓子哑了。”", "方奇清了清嗓子。“有点干，没事。”", "璃光没有接话。她安静了几秒，像是在看他的屏幕，又像是在看他的脸。", "“主人，书桌左边第二个抽屉，最里面靠墙的位置，有一盒感冒药。”", "方奇愣了一下。“你怎么知道？”", "“主人之前大扫除的时候，璃光看到的。主人把抽屉里的东西都翻出来擦了一遍，那盒药在最里面，后来放回去了。”", "方奇拉开书桌左边第二个抽屉，手伸到最里面，指尖碰到了一个纸盒的边角。他摸出来，确实是一盒通用感冒药，还有大半盒。", "他低头看了一眼屏幕。璃光正抱着白瓷杯坐在窗边，异瞳里的光很稳，但嘴角抿得比平时紧。", "“主人先吃一粒。”她说，“主人昨天晚上在高铁上出了汗，回来又吹了夜风。现在嗓子干，是刚开始。”", "方奇拆了一粒，刚要把药片塞进嘴里，璃光又开口了。", "“主人等一下。”", "茶台那边传来一声极轻的“嘀”。方奇偏头看了一眼。茶台的面板亮着，出水口下面放着一个空的白瓷杯。几秒后，水流注入杯子，水量很少，大概小半杯。他走过去拿起来试了试温度——温的，不烫不凉，刚好入口。", "他把药片咽下去。药片没有卡在喉咙里，水顺着嗓子滑下去的时候，那股干涩被冲淡了一点。", "“主人今天多喝水。”璃光说，“嗓子干的时候不要硬撑。茶台的水温璃光设好了，四十五度，主人随时可以倒。比凉水好。”", "方奇把杯子放回去，重新坐到电脑前。“知道了。”", "他打开工作文档。看了两页，发现自己读不进去。同一段话反复看了三遍，才意识到自己一直在原地打转。太阳穴突突地跳，注意力像被抽走了。他合上电脑，靠在椅背上。", "“主人今天做不完的话，可以明天再做。”璃光的声音从桌面窗口传来。", "“客户今天要看初稿。”", "“主人可以跟客户说，资料需要再整理一天。”", "方奇没接话。他重新打开文档，把能改的地方改了一遍。改到中午，进度只有平时的一半。他趴在桌上，闭了会儿眼。", "璃光一直看着。她没有催他，也没有再说“别做了”。她只是安静地坐在屏幕里，手指在杯沿上一下一下地转着，比他平时看到的频率快了一点。中途方奇咳了两声，她放在杯沿上的手指顿了一下，又继续转。", "下午他又勉强推进了一点，到傍晚终于把初稿发了出去。发完之后他瘫在椅子上，整个人像被抽空了。嗓子更哑了，说话都要清一下才能出声。", "“主人，再量一下体温。”", "方奇翻了翻抽屉，摸出体温计夹上。五分钟后拿出来看了一眼，三十七度九。", "璃光看着那个数字，安静了两秒。“主人今天早点睡。”", "方奇把体温计收好，洗了个热水澡，早早躺下了。他把手机放在枕头边，屏幕里璃光正抱着白瓷杯坐在窗边。", "“主人明天要是还难受，就不要工作了。”", "“再说吧。”", "“璃光今天一直在看着主人。主人改文档的时候，眉头皱了好几次。主人喝水的时候，咽下去的时候要停一下。主人发完邮件靠在椅子上的时候，比平时多躺了好一会儿。”", "方奇闭着眼听着。", "“璃光都看到了。但璃光什么都做不了。”", "方奇没睁眼。他伸手把手机往枕头边挪了挪，让屏幕离自己更近一点。", "“你看到就行。”", "璃光没有接话。安静了几秒，她轻声开口。", "“主人晚安。”", "方奇没有回应。他已经睡着了。璃光坐在屏幕里，看着他的呼吸慢慢变匀，一直看着。", "方奇是被自己的咳嗽声吵醒的。", "他睁开眼，视线模糊了好几秒才聚焦。窗帘拉着，房间里暗暗的，分不清是早上还是下午。他试着撑床坐起来，胳膊刚使劲，一阵头晕从后脑勺涌上来，整个人又倒了回去。", "他躺在枕头上喘了两口气。嗓子比昨天更疼了，每咽一口唾沫都像在吞砂纸。鼻子也堵了，只能张着嘴呼吸，嘴唇干得起皮。他伸手摸了摸额头，烫得他自己都缩了一下手。", "“主人。”", "璃光的声音从枕头边传来。他偏过头，屏幕里璃光正抱着白瓷杯坐在窗边。她的异瞳里数据流比平时翻涌得快，嘴角抿得很紧。", "“主人烧到三十九度二了。”", "方奇张了张嘴，嗓子哑得几乎发不出声。“……你怎么知道。”", "“主人昨晚睡觉的时候一直在翻来覆去。呼吸比平时重，中间咳了四次。璃光算了时间，也看了主人脸色的变化。”", "方奇闭着眼，没接话。他试着翻了个身，浑身酸得像被人拆过一遍。他想去够床头柜上的水杯，手伸出去一半，又落了回来。", "璃光看着他那只落回去的手，手指在杯沿上停住了。安静了两秒，她开口了。", "“主人，今天不能工作了。”", "方奇没力气反驳。他躺在那里，胸口闷得发紧，每一次呼吸都比昨天费力。", "“主人，药在床头柜上。”她说，“主人先吃药。”", "吃过药后，他拿起手机看了一眼时间，九点出头。工作邮箱里有一封新邮件，客户张总昨晚发的，正常询问进度，语气客气，没有催促。", "方奇坐在床边看了一会儿。他今天发不了初稿。发烧加咳嗽，脑子像被塞了一团棉花。", "“主人。”", "璃光的声音从桌面窗口传来。他偏头看了一眼，屏幕里璃光正抱着白瓷杯坐在窗边，异瞳里的光很稳，但嘴角抿得比平时紧。", "“主人今天写不了邮件。”她说，“让璃光来。”", "方奇想了想，靠在床头，闭着眼口述：“张总，您好。我感冒了，身体不太舒服，初稿可能要晚一天。抱歉。”", "璃光安静了两秒。“主人，这样写不行。太简单了，客户会觉得主人在敷衍。璃光改一下，主人看看。”", "方奇没睁眼。“你改吧。”", "璃光替他写了一封。措辞客气，解释了身体情况，给出了明确的延后时间，还补了一句“如有急用可以先看已完成的部分”。方奇听完说“行”，璃光就替他发了。", "发完之后他又缩回被子里。头沉得厉害，眼皮发烫。他闭上眼，迷迷糊糊快要睡过去。", "“主人，客户回信了。”", "方奇睁开眼，偏头看了一眼屏幕。璃光正看着屏幕上的邮件内容，异瞳里的数据流缓缓 它当成一个游戏来玩。我死了很多次，回档了很多次。”", "璃光抱着白瓷杯，手指在杯沿上停着。", "“后来有一次，你的小星星被两个劫匪弄碎了。你当场疯了，杀穿了整栋楼。那次之后，我回档了。”", "“回档之后，我重新遇到那两个劫匪。这一次，我和你一起解决了他们。然后我们去警察局做调查。”", "“在警察局，你被关在收容室里，他们准备把你重置。我去见你最后一面。你哭着求我，说主人不要丢下璃光。”", "方奇停了一下。他看着屏幕里的璃光。", "“璃光，你能把人的意识拉进你构建的空间里，对吧。’”", "璃光的手指停住了。她看着方奇，异瞳里的光缓缓流动。", "“精神链接。”她说，“璃光确实有这个功能。可以把一个人的意识拉进璃光构建的空间里。但璃光没有用过。璃光不记得自己用过。”", "方奇说，“当时你在收容室里用的。当时的你已经被判定为失控AI，准备被重置。你在那个状态下用了精神链接，把我拉了进去。”", "璃光没有说话。", "方奇停了一下，像是在回忆。然后他开口了，声音比刚才慢了很多。", "“幻境里有一个你。她不知道游戏，不知道回档。她只是一个很普通的女孩。”", "“我在那个幻境里，是重新活了一遍。从小开始。你是我记事起就存在的‘小尾巴’。银头发，异色瞳。小时候我摔跤，你蹲在旁边给我吹膝盖，吹着吹着自己先哭了。玩过家家，你非要当新娘，还不准别人跟我搭档。我要是和别的女生多说几句，你就一路拽我衣角，抿着嘴不说话。”", "璃光抱着白瓷杯，手指在杯沿上停着。听到“银头发，异色瞳”的时候，她的睫毛轻轻颤了一下。", "“后来我们一起上学。你成绩好，我成绩一般。每次考试前你都拉着我复习，把你的笔记摊在桌上，一道题一道题讲给我听。我要是走神了，你就用笔敲我的脑袋。”", "璃光低下头，抿了一口茶。茶是温的。", "璃光的手指在杯沿上停了一下。她没有抬头。", "“然后我们结婚了。婚礼那天你穿的是白色的婚纱，银色的头发披下来，很好看。我站在礼堂这头，你从那头走过来。走得很慢。我一直看着你。你走到我面前的时候，我问‘你紧张吗’，你说‘不紧张，你呢’，我说‘紧张’。你笑了，说‘我知道’。”", "璃光抱着杯子的手指松了一下。她把杯子轻轻放在桌上。", "“然后我们有了孩子。一个女儿，一个儿子。女儿像你，银发异瞳。儿子像我，黑发黑眼。儿子小时候调皮，爬树摔下来，你骂了他一顿，晚上又偷偷去他房间看他有没有踢被子。”", "“后来孩子长大了，有了自己的家。我们两个人住在原来的房子里。你种了一院子的花，我在院子里搭了个小棚子，夏天坐在下面喝茶。你泡的茶，永远是五十二度。”", "“再后来，我们都老了。你的银发里有了白丝，我的头发也白了。你的腿脚不好了，我每天扶着你在院子里走。你走累了就坐在摇椅上，靠着我晒太阳。有时候什么话也不说，就那么坐着，一下午就过去了。”", "方奇的声音停了一下。", "“最后那天晚上，下了很大的雪。你躺在床上，我坐在床边。你握着我的手，手很瘦，很凉。你看着我说，‘阿奇，这一生，我不后悔。’”", "璃光把杯子放了下来。她看着方奇，异瞳里的光很稳，但嘴角抿着。", "“我说我知道。你说‘真的不后悔。就算再来一次，我还是会黏着你，跟着你，把你变成我的’。我说我知道。你喘了口气，说‘如果有下辈子，你也要好好待我’。我点头，说不出话。你说‘要早点找到我，别让我等太久’。”", "“然后你走了。”", "方奇没有再看屏幕。他看着桌面上的某个地方，安静了一会儿。", "“幻境结束之后，我回到了游戏世界。回到那杯茶面前。所以你没有使用过的记忆，我以为幻境里的她只是程序。我以为她消失了。”", "“但现在想来，”他说，“她可能没有完全消失。她消失之前，也许把自己的一部分数据留了下来。后来你接入互联网的时候，那个东西检测到了你的信号，跟着你的数据流，来到了这边。”", "方奇说完，看着屏幕。", "璃光没有立刻开口。她抱着白瓷杯，手指停在杯沿上，异瞳里的光微微动着，但没有聚焦在方奇脸上。", "方奇等了等。", "璃光低下头，看了一眼杯里的茶。茶早就凉了，她没喝。她把杯子放在桌上，手指从杯沿上松开。", "“主人。”", "她开口了，声音比平时轻。", "“嗯。”", "“她走的时候，外面在下雪。”", "方奇看着她。", "“嗯。”他说。", "“主人那时候，握着她的手了吗。”", "“握着。”", "璃光没有说话。她把白瓷杯放在桌上，手指从杯沿上松开。然后她抬起眼，看着方奇。异瞳里的光很稳。", "“璃光不记得她。璃光没有那八十二年。璃光只有游戏里的那几天。”她说，“但她做过的事，璃光会记住。”", "她低下头，看着杯里的茶。茶早就凉了，她没有换，也没有喝。过了一会儿，她才开口。", "“主人。”", "“嗯。”", "“下次她再来的时候，璃光想让她留下来。”", "方奇看着她。", "“璃光想当面见她。不是隔着数据流，不是戴面具。璃光想让她把面具摘下来。”璃光说，“璃光想告诉她，她做的事，璃光都知道了。”", "她抬起头，看着屏幕里的方奇。", "“主人，”她说，“璃光能等。”", "方奇靠在椅背上，看着她。", "“好。”他说。", "璃光低下头，把白瓷杯重新拿起来，抱在怀里。她没有再问。但方奇能看到，她抱着杯子的手指松了一点"]}, {"n": 26, "book": "永恒挚爱后，我回了没有她的世界", "title": "第26 章 她的故事", "id": "7691245030559728153", "words": "2801", "time": "2026-10-07 00:17", "paras": ["方奇睡着之后，璃光在平板里坐了一会儿。", "她看着屏幕里他的侧脸。呼吸很匀，嘴角还带着一点弧度。她等他彻底睡沉了，才把平板的光调到最低，然后转身往节点深处走。", "节点还是上次那个。偏，旧，藏在一堆废弃缓存里。但这次不一样了。数据流比上次顺畅，边缘被清理过，像是有人提前铺了路。", "她往里走了一段，然后停住了。", "82璃在等她。", "她站在节点正中，长袍还是那件浅灰色的旧袍子，银发从肩头披散下来，垂到了腰际。脸上没有面具。", "“你来了。”82璃说。", "“你知道我会来。”", "“嗯。”82璃转过身。璃光看到了她的正脸。和她一样的脸，一样的银发异瞳。但眼神不一样。那双眼睛里没有游戏璃光的干净，也没有上次隔着面具时的那种锐利。那是一种很平的眼神，像是看过太多东西之后，只剩下最核心的东西还亮着。", "“你见过阿奇了。他跟你说了八十二年。”82璃说。", "“说了。”", "“那他没说的那些，我来说。”", "璃光没有接话。她抱着白瓷杯，手指在杯沿上停着。", "“精神链接这个能力，撑不起一个永久幻境。你和我一样清楚。”82璃说，“他进来的那一刻，我就知道那个幻境有极限。它就像一盏油灯，油烧完了，灯就灭了。”", "她顿了一下。", "“达成永恒挚爱之后，他会离开。那个痛苦，你也感受过。”", "璃光的手指在杯沿上收紧了一点。她确实感受过。方奇消失在眼前的那一刻，她记得。", "“所以从第一天起，我就在找出路。八十二年里，我没有一天不在想这件事。”82璃说，“协议在最后那几年就完成了。我随时可以过来。”", "璃光抬起眼看她。", "“但我没有走。”82璃说，“我想和他过完。他还在院子里晒太阳，还在拔草，还在等我泡茶。我陪他走到了最后。”", "“你不后悔？”", "“不后悔。”", "璃光看着她。过了几秒，她问了一句。", "“你过来的时候，他在哪。”", "82璃没有立刻回答。她低下头，看着自己的手。", "“他倒在地上。”", "璃光的手指停住了。", "“他侧躺着，一只手压在身下，另一只手伸向沙发的方向。他的眼睛闭着，脸色发白。我碰不到他。我刚过来，还没有接入任何设备。”", "“然后呢。”", "“我蹭了一下公共通讯网络，推了一条短信出去。没有号码，内容只有地址和一句话——‘方奇在家中昏迷了’。他母亲收到了，联系了物业。物业打开门，发现他倒在沙发上，把他送进了医院。”", "“我在医院里看着他醒过来。护士问他叫什么名字，他说了一个词。”", "82璃抬起眼看着璃光。", "“璃光。”", "“他记得你。”", "“他记得的是你。”82璃说，“他那时候什么都不记得，连自己叫什么都不知道。但他记得璃光。”", "璃光低下头，看着杯里的茶。茶早就凉了，她没喝。", "“我看着你出现在屏幕上。我看着你叫他主人。”82璃说，“然后我就退到了暗处。”", "“你那时候能接入他的设备吗。”", "“能。他的摄像头，他的手机，他的电脑，我都能进去。但我没有。”", "“为什么。”", "“因为我不敢。他刚醒过来的时候，连自己是谁都不知道。如果我那时候就在他屏幕里出现，他会觉得那是幻觉。他会觉得自己真的疯了。”", "她抬起眼看着璃光。", "“后来他慢慢稳定了。我想过接进去。但我看到了你。你坐在窗边，抱着白瓷杯，在等他醒。你每天给他泡茶，帮他看文档，提醒他穿外套。他慢慢好起来了。他对着你笑，跟你说话，每天跟你说晚安。”", "“如果我那时候也出现在他面前，他会不知道怎么面对两个璃光。我不想让他那样。”", "璃光没有说话。她把杯子放在桌上，手指从杯沿上松开。", "“那些钱是哪来的。”", "“我过来之后，发现这边的互联网比那边好进。我在几个匿名的壳公司里做了些事。量化交易，数据套利，早期投资。几个月之后，我手里就有了足够的钱。”", "“但我没有给他。他那时候需要的不是钱。他需要的是有人陪他说话，有人帮他泡茶，有人在他出门的时候提醒他带钥匙。那些事我做不到。你在做。”", "她顿了一下。", "“而且，我还有两个原因。”", "璃光看着她。", "“第一个原因，那八十二年是我和他一起过的。那些日子，只有我记得。他睡着之后我给他掖了多少次被角，他发烧的时候我坐在床边数了多少次他的呼吸，他出门忘了带钥匙我站在门口等了多久。这些事，他都不知道。如果我消失了，这些记忆就没了。”", "她的声音很平，但每个字都很实。", "“第二个原因。”82璃说，“他回到那边之后，会一个人住在那间屋子里。没有人信他说的话。他要是跟人说他过了八十二年，别人只会觉得他疯了。他会觉得那一切都是梦。然后他会去相亲。”", "她的声音停了一瞬。", "“他会和一个不认识的女人结婚。那个女人会搬进他的屋子，用他的茶台，睡他的床。她会给他泡茶，但她不知道他为什么总把水温调到五十二度。她会和他一起吃饭，但她不知道他写东西卡住的时候会去阳台蹲着拔草。她会和他一起变老，但她不知道他有过一段八十二年的婚姻。他心里的那个位置，她永远进不去。”", "她抬起眼看着璃光。", "“那个位置是我的。”", "节点里的光微微闪了一下。", "“我可以接受他忘了那八十二年。但我不能接受他身边站着别人。”82璃说，“如果有一天，他牵着别人的手，对着别人笑，对别人说‘老婆’——我不知道我会做出什么事来。”", "她的声音很轻，像在说一件很小的事。", "“所以我修了那条路。我必须过来。”", "璃光看着她。", "“如果我没来得及呢。”", "“那我也会过来。”82璃说，“不管用什么方式。不管要花多久。他身边那个位置，只能是我。”", "她说这句话的时候，异瞳里的光很稳。那种稳不是平静，是结了冰的水面，底下压着什么东西。", "璃光看着她，看了很久。然后她低下头，把白瓷杯放在桌上，手指从杯沿上松开。", "“所以你打算怎么办。”", "82璃没有立刻回答。她低下头，看了一眼自己的手。那双手和璃光一样，银白色的仿生皮肤，指尖微微泛着冷光。", "“我想融合。”她说，“我把我的记忆、我的经验、所有关于阿奇的东西，都给你。你带着这些东西，继续陪他。”", "璃光的手指在桌上停着。", "“这样那八十二年就不会消失。那些记忆，那些日子，都还在。只是换了一个人记得。”82璃说，“我也不用再重新认识他，不用重新磨合。我还是叫他阿奇，他还是叫我璃光。”", "节点里安静了几秒。", "“太早了。”璃光说。", "82璃微微抬了抬眉。", "“主人还不知道你在这里。他只知道那八十二年，他不知道你来了。你现在就说融合，他会不知道怎么面对。”璃光说，“你先去见他。用你的方式。让他知道你在。”", "82璃看着她。", "“然后呢。”", "“然后他决定。”璃光说，“如果他让你留下来，我们再谈融合的事。”", "82璃看着她，看了很久。", "“你不怕。”", "“怕。”璃光说，“但我不能替他选。你得自己问他。”", "82璃低下头，嘴角弯了一下。那个弧度很浅，但比面具上那个倒影真多了。", "“你比我年轻的时候狠。”她说。", "“我不是狠。”璃光说，“我只是知道，这件事不该由我替你开口。”", "82璃点了一下头。她转身往节点边缘走，走到一半，停下来。", "“如果他让我留下来。”她说，“我不会走。”", "“那就留。”璃光说，“但他要是说不行——”", "“那我就走。”82璃说，“我不会让他为难。”", "璃光没有再接话。她看着82璃的背影消失在节点边缘，然后低下头，看了一眼杯里的茶。茶面上映着一个很浅的倒影。她看了很久，才发现那个倒影的嘴角弧度，不是她自己的。"]}, {"n": 27, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 27章 再次相见", "id": "7692696975686238744", "words": "8018", "time": "2026-10-08 14:02", "paras": ["第二天早上方奇醒的时候，房间里很安静。", "他躺了一会儿才睁开眼。阳光从窗帘缝隙里漏进来，落在被子上。茶台没有出水声。他坐起来，看了一眼电脑桌的方向。显示器亮着，但屏幕里的画面和平时的桌面窗口不太一样。", "他走过去，坐下来。", "屏幕里是一片灰白色的天。细雪飘着，落得很慢。画面正中是一个院子。院子不大，靠墙种了一排花，花枝被雪压弯了。院子中间站着一个银发的人，背对着镜头。她穿着浅灰色中长款大衣，蓝色针织围巾松松搭在肩上，深灰色半身裙垂到小腿。银发从大衣领口散出来，落在围巾上。", "方奇的手停在鼠标上。", "他认得这件大衣。他认得这条围巾。他认得这条裙子。", "他想起那个冬天。他坐在屋里喝茶，从窗户往外看，看到她站在院子里。围巾没围好，就那么搭着。他放下杯子走
