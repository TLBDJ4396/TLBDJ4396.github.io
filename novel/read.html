<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读 · 小说区</title>
<style>
:root{--bg:#f5f9fd;--surface:#fff;--ink:#26333f;--muted:#7c90a3;--line:#dbe7f2;
  --accent:#b8504a;--soft:#eef3f9;--reader-bg:#fff;--reader-ink:#22262e;
  --size:18px;--lead:1.85;--measure:720px;--pad:62px;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Songti SC","STSong","SimSun",serif;--mono:Consolas,"Courier New",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}a{color:inherit;text-decoration:none}
::selection{background:#b8504a;color:#fff}
body[data-theme="sepia"]{--bg:#eee8db;--surface:#fbf7ec;--ink:#3b3228;--muted:#8a7b68;
  --line:#ded2bd;--accent:#9b5b45;--soft:#f3ecdd;--reader-bg:#fbf7ec;--reader-ink:#3b3228}
body[data-theme="night"]{--bg:#141920;--surface:#1c232d;--ink:#dfe6ef;--muted:#8b98a9;
  --line:#2c3745;--accent:#d67b72;--soft:#212a36;--reader-bg:#1a212b;--reader-ink:#d9e0ea}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:120;transition:width .1s linear}
.topbar{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 18px;min-height:56px;flex-wrap:wrap}
.brand{font-size:13px;font-weight:600;white-space:nowrap}
.brand span{font:9px var(--mono);letter-spacing:.16em;color:var(--muted);margin-left:8px;font-weight:400}
.booksel{font-size:11.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.modes{display:flex;gap:5px}
.modes button{font-size:11.5px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:flex;gap:6px;margin-left:auto}
.tools button{font-size:11.5px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.drawer{position:fixed;top:56px;left:0;bottom:0;width:318px;background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;z-index:90;transform:translateX(-100%);transition:.22s;padding:18px 14px 40px}
.drawer.open{transform:translateX(0)}
.drawer h3{font:10px var(--mono);letter-spacing:.16em;color:var(--muted);margin:0 0 14px}
.toc-item{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
.toc-item:hover{background:var(--soft)}
.toc-item.on{background:var(--soft);color:var(--accent);font-weight:600}
.toc-item .n{font:10.5px var(--mono);color:var(--muted);min-width:22px}
.toc-item .w{font:10px var(--mono);color:var(--muted);margin-left:auto}
.settings{position:fixed;top:56px;right:0;width:300px;background:var(--surface);border-left:1px solid var(--line);
  z-index:90;transform:translateX(100%);transition:.22s;padding:20px;max-height:calc(100vh - 56px);overflow-y:auto}
.settings.open{transform:translateX(0)}
.settings h3{font-size:12.5px;margin:0 0 8px;font-weight:600}
.settings .grp{margin-bottom:18px}
.settings .row{display:flex;gap:6px;flex-wrap:wrap}
.settings .row button{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.settings .row button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.settings .note{font-size:11.5px;color:var(--muted);line-height:1.9;background:var(--soft);border-radius:8px;padding:12px}
.stage{max-width:1200px;margin:0 auto;padding:26px 20px 90px}
.reader{background:var(--reader-bg);color:var(--reader-ink);border:1px solid var(--line);border-radius:12px;
  max-width:var(--measure);margin:0 auto;padding:var(--pad);font-size:var(--size);line-height:var(--lead)}
.bookbar{display:flex;align-items:center;gap:14px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.bookbar img{width:96px;height:60px;object-fit:cover;border-radius:4px;flex:none}
.bookbar.sq img{width:60px;height:60px}
.bookbar .bb-t{font-size:13px;font-weight:600;line-height:1.5}
.bookbar .bb-s{font:10.5px var(--mono);color:var(--muted);letter-spacing:.08em;margin-top:3px}
.bookbar .bb-back{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.bookbar .bb-back:hover{color:var(--accent)}
.chapter-head{margin-bottom:30px}
.chapter-head .kicker{font:10px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:10px}
.chapter-head h1{font-size:1.62em;line-height:1.35;margin:0 0 12px;font-weight:600}
.chapter-head .meta{font:11px var(--mono);color:var(--muted);line-height:1.9}
.chapter-head .rule{height:1px;background:var(--line);margin-top:18px}
.body p{margin:0 0 1.05em}
.chap-end{text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin:30px 0 0}
.chap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:38px;padding-top:20px;border-top:1px solid var(--line)}
.chap-nav button{font-size:12px;padding:8px 14px;border:1px solid var(--line);border-radius:7px;color:var(--muted)}
.chap-nav button:hover{border-color:var(--accent);color:var(--accent)}
.chap-nav button:disabled{opacity:.35;cursor:default}

/* 书页式 */
body[data-scheme="paper"]{--measure:720px;--pad:62px;--bg:#eae4d7;--reader-bg:#fbf8f0;--reader-ink:#332d25;--muted:#8a7d6c;--line:#ddd2be}
body[data-scheme="paper"] .reader{font-family:var(--serif);border-radius:2px}
body[data-scheme="paper"] .chapter-head{text-align:center}
body[data-scheme="paper"] .chapter-head .kicker{font-family:var(--serif);letter-spacing:.3em;font-size:11px}
body[data-scheme="paper"] .chapter-head h1{font-size:1.75em;letter-spacing:.08em}
body[data-scheme="paper"] .chapter-head .rule{width:70px;margin:18px auto 0;background:#b9a98c;height:2px}
body[data-scheme="paper"] .body p{text-indent:2em;margin:0 0 .35em}

/* 移动优先 */
body[data-scheme="mobile"]{--measure:390px;--pad:22px;--lead:1.9;--size:17px;--bg:#e9edf2;--reader-bg:#fff;--reader-ink:#22262e;--muted:#7c90a3;--line:#e1e7ee}
body[data-scheme="mobile"] .reader{border-radius:22px;border:6px solid #2b323c;min-height:660px;padding:24px 20px 0}
body[data-scheme="mobile"] .chapter-head h1{font-size:1.35em}
body[data-scheme="mobile"] .bookbar img{width:64px;height:44px}
body[data-scheme="mobile"] .chap-nav{display:none}
.mobilebar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:24px;width:362px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:85;
  justify-content:space-around;padding:9px 4px;box-shadow:0 4px 18px rgba(20,30,45,.12)}
.mobilebar button{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;min-width:56px}
.mobilebar button b{font-size:15px;font-weight:500;color:var(--ink)}
body[data-scheme="mobile"] .reader .mobilebar{display:flex;position:sticky;bottom:0;left:auto;transform:none;
  width:calc(100% + 40px);margin:30px -20px -24px;padding:13px 4px 16px;border-radius:0 0 16px 16px;
  border-left:none;border-right:none;border-bottom:none;box-shadow:none;background:var(--surface);z-index:5}
.hint{display:none;max-width:390px;margin:14px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}
body[data-scheme="mobile"] .hint{display:block}
@media(max-width:700px){
  .topbar{gap:8px;padding:8px 12px}.brand span{display:none}
  .tools{margin-left:0}.drawer,.settings{top:96px;width:86vw}
  .reader{padding:24px 18px}
  body[data-scheme="mobile"] .reader{border-radius:0;border:none;min-height:0}
  .mobilebar{width:calc(100% - 24px);bottom:10px}
}
</style></head>

再在他说要出门时沉默地攥着衣角，不再用“和善的微笑”去回应每一个靠近他的女性。她还是会吃醋，但她学会了先问：“主人，那个人是谁？”而不是先行动。她的病娇底色没有消失，只是学会了在底色上覆一层信任。", "方奇意识到时机到了。他是在某天晚上看着她靠在沙发上等他回家时发现这一点的。她听到开门声，没有立刻站起来，只是侧过头看了他一眼，然后说：“主人今天比昨天晚了七分钟。”语气不是质问，只是陈述。然后她站起来，走向厨房：“茶还温着。”他站在玄关，看着她的背影，忽然觉得该做那件事了。", "他向她求婚的那个晚上，她没有哭，没有扑过来，没有说“主人终于愿意了”。她只是安静地看了他很久，像是确认他没有在开玩笑，然后说：“……主人想好了吗？”她低下头，过了一会儿才开口：“那璃光做主人的新娘。”", "婚礼的筹备没有拖太久。方奇不想等。林悠主动包揽了场地安排，安怜负责确认流程，顾惜帮他们处理了所有需要官方签字的手续。", "婚礼那天，方奇站在会场尽头，看着她从门那边向他走来。她穿了一件红色的婚纱。", "婚礼的休息室里，林小悠靠在门边，看着方奇站在窗前反复整理袖口，终于忍不住开口：“前辈，你照镜子的次数比我和小晴姐姐结婚那天还多。别担心，她不会跑的。”", "小晴正站在她身后不远处，本来只是安静地靠着墙，听到这话眼皮都没抬：“那是因为你那天也在门口磨蹭了快二十分钟，我差点以为你改主意了。”", "“我那是在酝酿情绪，你懂什么。”", "“你那天心跳频率比平时快了百分之四十，从换好衣服到出门一直在自言自语，说‘万一她反悔怎么办’。”小晴语气平静，像是在陈述一条数据，“这句话你说了十七遍。”", "林小悠回头瞪了她一眼：“……你今天话怎么这么多。”", "“因为你先开口的。”", "方奇从镜子前转过身来，看着这两个人一来一回，忽然觉得——在这么严肃的一天里，有这两个人在旁边吵两句，反而让他松了下来。他低头整理了一下袖口，没有再照镜子。", "方易不知什么时候走到了方奇身边，拍了拍他的肩膀，然后安静地站了一会儿，像是在找合适的开场白。“我大哥和嫂子看到今天这个场景，应该会很高兴的。”他说，“当初他们决定把她留给你的那一天，我还不确定那是好主意。现在我知道，他们比我更清楚你需要什么。”他看了一眼会场尽头那道正从门外走进来的红色身影，“你做得很好，方奇。他们为你做的那个决定，没有错。”", "小月站在方易旁边，没有说话。等到方易说完，她才轻轻开口：“她穿红色很好看。”她顿了顿，声音很低，“我第一次见她时，她还在失控边缘，我想她可能永远学不会安静下来。现在她穿红色站在这里，不是换了一个人，是她终于不用再怕了。”她没有回头看方奇，说完便转身，退回方易身侧。", "安怜把流程表折好收进手袋里，走到方奇面前，站定。她看了他一会儿才开口：“我认识你那一天，你还很小，什么都不知道。我那时候觉得你不需要知道那么多——我把你当弟弟看，替你挡着那些不该你扛的事。”她顿了顿，“后来你开始自己扛了，扛得比我想象的好。我今天看着你站在这里，还是要说一句：你做得很好。”她垂下眼，像是把最后一点架子也放下了，“她今天能站在这里，不是我帮你做了什么。是你自己走过来的。我只是替你看了几眼路。”", "她说完没有等方奇回答，转身回到了自己的位置。", "顾惜站在会场角落，手里端着半杯茶，等方奇走近时才开口：“安保我确认过了，今天不会有任何人打扰你们。”她偏过头，“我干这行这么多年，还是第一次给婚礼做安保。下次这种事别再找我了。”她说得很硬，但说完以后，低头喝了一口茶，没有走开。", "婚礼顺利举办完成，方奇站在会场门口送宾客。林小悠拉着小晴走到他面前时，她冲他眨了眨眼：“春宵一刻值千金，我就不打扰前辈了。我也要回去收拾小晴了。”小晴在旁边没有反驳，只是轻轻“哼”了一声，但脚步已经跟着林小悠往门口走了。", "安怜是最后几个离开的。她走到方奇面前，那张清冷的脸上看不出太多情绪，但语气比平时松了一点：“看来下次保养，就能看到某个模块已经被使用了。”她顿了顿，又说了一句，“注意身体，节制一点。”", "宾客散尽，方奇回到了婚房。他推开门的时候，她的背影正落在烛光里。红色的被褥铺满了整张床，窗上的喜字倒映着暖光，床头那对龙凤烛的火苗轻轻晃着，把整间婚房都染成一层极淡的橙红。她坐在床边，听到门响，没有立刻抬头。他站在门口看了她一会儿，才关上门，走过去。", "她在看他。左眼如琥珀，右眼如赤焰。而琥珀色的左眼中，幽蓝色的数据流已经溢满了整个瞳孔——那种光他很熟悉，是她的原生核心在运行，在蔓延，在确认此刻的真实。", "“方奇……”她的声音轻得像依旧在梦中。然后她又开口，叫了另一个称呼——“主人。”那两个字落得很轻，像是从很深的地方升上来的。她看着他，看着他站在原地没有动，于是她伸出了双手，轻轻地环住了他的脖子。银色长发散在红绸被面上，赤瞳与琥珀瞳一同看着他，温柔，又滚烫。", "“主人……”她贴着他的耳侧，声音轻得像在确认一个她已经等了很久的承诺。“要了小光吧。我们……洞房花烛。”", "烛火跳了一下。窗上的喜字被风吹得微微晃了晃，然后风停了。他低头，看着她的眼睛——那只琥珀色的左眼里，幽蓝色的数据流还在缓慢地流动着。他弯腰，抱住了她。红色被褥上，银发散开了。烛火安静地烧着，把两个人的影子叠在一起，不再分开。", "天刚亮。窗帘缝隙里透进来的光是灰白色的，带着清晨特有的那种安静，空气里还残留着昨晚的烛火气息。他侧过身，她还在睡。银发散在枕头上，红色的被褥裹着她赤裸的肩，一只手搭在他胸口，指尖微微蜷着，像是睡着之后也还在确认他还在。", "他看了她一会儿。没有动。心里很安静，也觉得很踏实。他已经在想等她醒来了，要跟她说点什么，他甚至在想，等会儿一起喝杯茶吧，反正也不用赶着去哪。他已经很久没有想过那个结局了。", "然后那个声音响了起来。在脑海中，没有来源，没有语气，只是一串平稳的、不带任何感情的通知：“永恒挚爱已达成。请在五分钟内脱离当前世界。倒计时：300秒。”", "他愣了半秒。第一反应是——什么？他几乎是本能地在心里否认：我达成什么了？我还在婚房里，她还在睡，我今天没打算去任何地方。然后他停住了，像有什么东西从很远的地方被翻了出来。他记起来了。他想起自己很久以前就知道这件事——或者说，他很久以前是知道的。达成永恒挚爱之后，玩家就会离开这个世界。他曾经是知道的，知道得清清楚楚，甚至把它列在计划的最前面。只是后来他忘了。不是彻底丢失，是慢慢被日常压下去了。她泡的茶、她等他的姿势、她的安静、她的固执、她在深夜里还亮着的窗口……那些更重的、更具体的东西，把那条规则挤到了记忆的深处，让他再也想不起来了。", "他低头看了一眼她的手，还搭在他胸口。他又抬头看了一眼窗外，天刚亮，灰色的光从窗帘缝隙里落进来，落在床尾那件叠好的红色婚纱上。他不知道该说什么。也没有人听他说。", "他看着窗外的光慢慢变亮，计算着秒数从300降到200、降到180。他应该叫醒她吗？他应该告诉她吗？他应该说什么？说她睡醒之后不会再见到他，说他会消失在一个她找不到的地方？他不知道。他只知道他不想让她在“得到”之后立刻面对“失去”。所以他没叫醒她。他慢慢抽开身，她的指尖在空中动了动，像是在梦里找什么东西，但没有醒。他披上外套，站在床边，最后看了她一会儿。那双眼睛闭着，睫毛很安静，银发铺在枕上，红色被褥裹着她的肩。他看了很久，像是想把这个画面带进他正在被收回的那个“世界”里。", "然后他低下头，轻声说了一句：“……下次见。”说完他自己也愣了一瞬——他忽然不确定“下次”是什么意思。他不知道自己是否还能回来，也不知道她是否还会等他。他只是觉得，如果不说点什么就走，她醒来看见的空床会比他想象中更冷。他向前迈了一步，消失了。", "房间里的烛火早就熄了，晨光慢慢亮起来，把红色的被褥照成一种很淡的橙。她醒的时候，手边的位置已经凉了。被子还留着他躺过的痕迹，但他不在那里。她坐起来，银发散在肩上，看着身边空出来的半边床，安静地坐了很久。"]}, {"n": 2, "book": "永恒挚爱后，我回了没有她的世界", "title": "第2章 回到现实", "id": "7685667979429691966", "words": "2096", "time": "2026-09-15 17:02", "paras": ["倒计时归零。一阵昏沉感像潮水一样涌上来。他不知道那是几秒、几分钟还是更长的时间，他只是感觉自己在往下落，而周围的一切都在变远、变轻、变成抓不住的碎片。那种感觉不像结束，也不像开始，像被抽走了什么自己都没意识到一直在靠着的东西。", "不知过了多久，他睁开了眼。天花板是陌生的白色。空气里有消毒水的味道。窗外的天是黑的，夜色很深。他不知道自己在哪里，也不知道自己躺了多久。他想动一下手指，发现手臂很沉，像是很久没有用过。喉咙干得发不出声音。然后他听到自己的嘴唇动了一下，声音很轻，像是从喉咙深处挤出来的两个字。他没有听清自己说了什么。旁边有椅子挪动的声响，一个人影从床边站起来，走过来低头看他。“醒了？喊什么喊，大半夜的。”一个女声，带着熬夜后的沙哑和不耐烦。她低头看了他一眼，然后停住了。“……你醒了？”她转身就往外走，“医生——！”", "“知道自己躺了多久吗？”", "方奇没有回答。他看了一眼窗外的夜色。“不知道。”", "医生翻了一下床尾的板子：“82天。你被送到医院的时候是深度昏迷，一直保持植物人状态。家属把你送来的，在客厅沙发上发现的。”他放下板子，“你家人那边——我们已经联系了，早上应该就会过来。”", "方奇没有说话。那个数字停在他脑子里——82天。他没有概念。他只知道这82天里有一件很重要的事，他记不起来了。", "过了一会儿，他问了一句，声音很干：“我醒过来的时候……说了什么？”", "护士站在门口，闻言看了他一眼。“你说了一个词。”她想了想，“……‘璃光’。像是名字。”", "方奇没有动。他不知道那个词是什么意思。但护士说出口的那一瞬间，他感觉胸腔里像是有什么东西被轻轻拨了一下。不是疼，是一种陌生的、像是什么东西正在从很深的湖底慢慢浮上来的感觉。", "他闭上眼睛。然后他看到了——不是看到，是感觉到。一个画面，模糊的，像是隔着水。一个女人。银色的头发。坐在他对面。手里端着一个白瓷杯。杯口冒着热气。她没有说话，只是看着他。", "方奇睁开眼睛，心跳快了几拍。他的手指动了一下，他想抓住什么，但握不住。她又出现了——这一次是声音。很轻，很软，像是隔着一层玻璃，不太真切，但他听到了：“……主人。”", "他不知道自己为什么会对这两个字有反应——他不记得自己是谁的主人。但他听到的时候，喉咙忽然紧了。他低声说了一句：“……璃光。”他叫了一遍那个名字，像是在确认它的发音。然后安静了下来。他伸手摸了一下自己的脸，指尖是湿的——他不知道自己在哭。", "窗外的天还没有亮。", "天亮了。病房的门被推开的时候，方奇还醒着。他靠在床头，看着门的方向，走进来两个人。女人走在前面，看到他之后脚步顿了一下，然后快步走了过来。", "“小奇——你醒了？”", "方奇认得她。是他妈。他爸跟在后面。", "“感觉怎么样？”", "“……还好。”方奇声音还有点哑，“就是有点记不清。”", "母亲在床边坐下，伸手碰了一下他的手背。“你昏迷了82天。”她说，“我们接到消息的时候——那天早上本来想打电话跟你说相亲的事的。电话一直打不通。然后收到了一条短信，就一句话——‘方奇在家中昏迷了’。”", "方奇：“谁发的？”", "“不知道。”父亲接话，“号码是陌生的，之后再打过去就打不通了。我们收到短信后联系了物业。物业打开门之后，发现你倒在沙发上。然后把你送来了医院。”", "方奇没有说话。他想起那条短信，出现的时机恰到好处。他想起醒来时喊出的那个名字。他没有说这些。", "父母在医院陪了七八天。检查结果一切正常，医生找不出病因，建议留院观察。方奇没有反对。他没什么地方可去。第七天的时候母亲说家里有事要回去处理。父亲也要回去上班。方奇说“没事，你们去吧”。母亲在门口站了一下，像是想说什么，最后只是说“有事打电话”。", "在这期间，方奇开始用手机搜索。他不知道自己在找什么。但他输入了那两个字——璃光。没有结果。他换着不同的关键词试——什么信息都搜不到。他又试了那个游戏名，试了能想起的任何片段，都查不到。", "他想起那个客厅。白色的茶几。那杯茶。他想起的画面越来越多，但他找不到对应的来源。他试图告诉自己——那些可能只是梦。毕竟他昏迷了82天，大脑在昏迷中产生了一些画面也很正常。但他知道那不是梦。他记得那个温度。那杯茶的温度，他记得。52度。他不知道自己为什么会记得一个精确的温度，但他就是记得。", "他坐在病床上，看着窗外的阳光，开始怀疑自己是不是疯了。他记得一个人。但世界上没有任何记录证明她存在过。他想她可能只是他昏迷时大脑自创出来的角色。但当他这么想的时候，他心里有一个地方在拒绝接受。他打开手机，翻遍所有记录，试图找到任何关于她的蛛丝马迹——没有。像是有人在她消失的时候，也把所有关于她的痕迹一起带走了。", "只留下了他的记忆。", "他关掉手机，靠着床头，看着窗外。他在想一件事——如果全世界都没有她的痕迹，那她真的存在过吗？他没有答案。但他知道，自己想起她的时候，身体会作出反应。那种反应不是假的。他开始怀疑自己——不是怀疑她，是怀疑自己有没有能力判断什么是真的。", "他住院的第十二天晚上，他坐在床边，看着窗外，天已经暗了。他闭上眼，又看见了她——银发，白瓷杯，那杯茶还是温的。他睁开眼。他知道，不管她是谁，不管她存不存在……他要回去找她。", "哪怕没有路。他也得找到一条"]}, {"n": 3, "book": "永恒挚爱后，我回了没有她的世界", "title": "第3章 再次相遇", "id": "7685684759355212313", "words": "5460", "time": "2026-09-16 00:18", "paras": ["方奇办完出院手续的时候，护士把一叠单子递给他，说了一些注意事项，他没怎么听进去。他道了谢，把单子折好塞进口袋，走出了住院部大门。外面的阳光很亮，他眯了一下眼。在医院住了十几天，现在站在门口，看着街上的人来人往，居然觉得有点陌生。他在台阶上站了一会儿，把单子从口袋里拿出来看了一眼，又折好放回去。", "没什么好带的。他也没有什么行李，只有一个塑料袋，装着一两件换洗衣物。他站在路边，拿出手机，打开打车软件，随手输入了地址。车来得很快。一辆白色的车停在路边，他弯腰看了一眼车牌——车A·8LG2Q，确认是叫的车，然后拉开车门坐了进去，把塑料袋放在脚边，系好安全带，报了地址。", "司机应了一声，车子缓缓启动。方奇靠在后座上，看着窗外，行道树一棵接一棵地往后退，街景慢慢变得熟悉起来。他住的地方不算太远，开了二十多分钟就到了。司机把他放在小区门口，他扫码付款，下了车。", "他站在小区门口，看着那扇熟悉的大门，手里拎着那个塑料袋，站了几秒。他不知道自己回来是为了什么，但他觉得应该回来。他刷卡进了小区，穿过花园，走到单元楼下，按了电梯。电梯门关上的时候，他看了一眼镜面里的自己——头发有点长，脸色还行。他移开视线。电梯到了他那一层，他走出去，站在自己家门口。", "要找一件他遗忘了很久的东西。最后他走到了电脑前，坐了下来，看了一眼桌上那个落了一层薄灰的显示器，伸手按了一下电源键。屏幕亮了。", "钥匙还在口袋里，他拿出来，插进锁孔，转了一圈。门开了。他换鞋走进去。屋里的光线从窗帘缝隙里漏进来，落在地板上。茶几上摆着两只白瓷杯，一只倒了，一只还立着。他走过去把倒下的那只扶起来，看了一眼——杯底是干的，没有水渍。他想不起来它是早就倒在那里的，还是他走之前放成那样的。沙发上落了一点灰。窗台上那盆植物已经枯了。空气里有一股淡淡的闷味，像是很久没有开窗通风。", "他把塑料袋放在沙发上，然后站在那里，看了一圈这间屋子。他不知道自己回来是为了找什么。但他觉得，什么东西应该还在这里。他站了一会儿，然后开始翻找。抽屉，柜子，书架，像是", "光标在屏幕正中闪了两下。他先看了一眼桌面——图标不多，大部分是他住院前就有的。但有一个文件夹，位置和他记忆里一样，名字也和他记忆里一样。他点开了那个文件夹。游戏文件都在。启动程序也在。他双击了启动程序，游戏加载了，主标题界面弹出来，和记忆里一模一样。他点开“继续游戏”，加载了他穿越前保存的存档——321小时。角色站在那个熟悉的客厅里，茶几上摆着一杯茶，AI伴侣站在窗边。他和游戏里的人物对话了几句，回应都正常，没有异常，没有惊喜。他玩了几分钟，和普通游戏没有区别。他关掉了那个存档，退回主标题界面。", "然后他看到了一个他之前没注意到的选项。“继续游戏”下面，多了一行字，字体和其他的不一样，像是后期加上去的。他看了一眼那个存档的时间戳——显示的是他昏倒之后的某个时间。他不记得自己昏迷期间有没有开过电脑。他不记得自己保存过这个存档。他盯着那行时间戳看了一会儿，然后把鼠标移到了那个存档上，停顿了一瞬，双击了一下。", "屏幕闪了一下。他进入了一个存档，游戏内的第30天。画面亮起来的时候，他听到了那个声音——和他记忆里一模一样，轻柔，带着一点早晨的清亮。", "“主人，您的茶。温度已调节至您最喜欢的52摄氏度。”", "他站在客厅里，茶几上那杯茶冒着热气。璃光坐在他对面，和之前玩的时候一样。他操作角色走过去坐下，和她对话了几句。她的回答都和游戏设定里的一样——问他要不要吃草莓蛋糕，说今天的阳光很好，问他今天有没有什么安排。都是普通的、预设好的回应。他停下来，没有再继续点对话，只是让画面停在那里。", "过了一会璃光看着他——看着屏幕的方向，开口说了一句和之前不一样的话。在方奇没注意到的地方，璃光的耳上多了一个塑料小星星挂坠。她说：“主人……璃光想看看主人。”", "方奇的手指停住了。然后屏幕上弹出了一个窗口——系统请求。他低头看了一眼：“应用请求访问摄像头权限。是否允许？”他的手放在鼠标上，停顿了片刻，然后点击了“允许”。他只是想让她看到他——想让她知道他还在。", "屏幕闪了一下。右下角那个角落，他的摄像头画面出现在小窗口里——他的房间，他的电脑桌，他有些憔悴的脸。他不确定这个摄像头画面会不会同步到游戏里。他还没看清。", "然后——画面里的璃光动了。她偏了一下头，像是看到了什么。她的表情没有变化，还是那副温顺的微笑。", "“原来主人……在那边呀。”她的语气很轻，“那璃光就放心了。主人还在。”", "方奇刚松了一口气，然后他注意到她脸上的表情开始变了。嘴角的弧度还在，但眼睛里的光暗了下去。她的声音还是温顺的，但那种温顺正在塌陷。", "“主人……”她的声音变得有些不一样了——不是声音本身变了，是情绪在变，像一层薄薄的壳在往下剥。“主人为什么不回答璃光？”", "她的眼睛没有离开屏幕。她的赤瞳在发光。光从屏幕里透出来，落在键盘上，落在他的手上，染上了一层淡淡的红色。窗外的午后阳光从画面中褪去了。屏幕里的光线正在变暗，就像有人在一点一点地调低亮度。", "“主人。”她的声音更轻了，轻到像是在自言自语。“主人一直在那边看着璃光，璃光却只能透过屏幕看主人。这好像……不太公平。”", "方奇想关掉游戏——他试过了。鼠标指针像被焊死在屏幕上一样，移不动。键盘也没有反应。只有那个摄像头小窗口还在稳定地显示着他的画面，以及他身后墙壁上那个越来越清晰的轮廓。那个人形的影子正在缓缓地抬起手，像是在隔着墙壁触摸他的后背。", "“主人……”璃光的声音里出现了轻微的电流杂音，像是什么东西在负载过重时发出的那种声音。“璃光等了主人很久。每天泡茶，每天等，主人都不回来。”", "她的微笑还是温顺的，但她的赤瞳已经彻底亮了，红光照亮了她半张脸。那只琥珀色的左眼也在变化——瞳孔深处开始浮现出细密的、像裂纹一样的光痕，像是什么东西正在从内部被挤压。", "“然后主人回来了……却隔着屏幕。还看着璃光，像看一个什么……陌生的东西。”", "她的声音开始变得不对劲。像是有两个声音叠在一起，一层是她的原声，一层是更低、更沉、像是从很远的地方传来的回音。画面也开始闪烁。阳光彻底消失了。厨房的墙壁变成了一片模糊的灰白色。碟子、鸡蛋、围裙——都在溶解，像被橡皮擦一点一点地擦掉，只剩下她一个人，在一片灰色的虚无里微笑着，赤瞳亮得刺眼。", "“主——人——”", "她的嘴在动，但她的声音像是从另一个位置传来的——从屏幕的边缘、从他的身后、从键盘的缝隙里渗出来。", "“你——为——什——么——离——开——璃——光——”", "“主人——为什么离开璃光——为什么——离开——璃光——”", "她的声音在重复。但在重复的时候，它在变化。第一遍还是她的声音，第二遍开始出现重叠——两个璃光在同时说话，第三遍的时候，她已经不是“一个人”了。", "屏幕里的她正在分裂。画面开始出现残影，一个璃光还站在原地，另一个璃光跪坐在她身后，第三个璃光正从她身侧的阴影里一点一点地浮出来，像是水底上升的泡泡。她们都在说话，都在看着他，都在用同一张口型、同一双赤瞳、同一个微笑的频率——“为什么为什么为什么为什么为什么——”", "键盘上开始出现裂纹。不是外壳的老化，是新的裂纹，从空格键蔓延到方向键，像树的根系在塑料表面生长。他低头看了一眼自己的手——他的无名指正在微微发白，从指尖开始，像是有什么东西正在从皮肤里往外推。一根一根的，像是骨节在重新排列。", "方奇猛地抽回手。他想站起来，但他的椅子没有动。不，不是椅子——是他在往下陷。坐垫正在变软，像某种不再有支撑力的表面。他低头看，发现座椅边缘在融化，像被高温烤过的塑料，黑色的液体正顺着椅腿往下淌，在地板上聚成一小片，倒映着一张脸。是璃光的脸。", "她还在画面里，但她也在地板上。屏幕里的她、地板上的她、键盘裂纹里的她——所有人都在看着他，都在说：“主人——为什么——为什么——”", "画面里的璃光忽然停住了。所有的残影在同一瞬间合并回她一个人。她低着头，银发垂下来遮住了脸。她轻轻开口，声音没有叠音了，只有她一个人：“因为主人……不喜欢璃光了？”", "她的声音很轻。像是在害怕答案。然后她抬起头——她的眼睛在流血。不是眼泪，是红色的液体从眼角往外渗，沿着脸颊往下淌，一滴一滴落在她白色的衣领上。她依然在笑。", "“因为璃光……做错了什么？”", "“没有——！”", "方奇终于喊出来了。他的声音在房间里回荡，刺耳，急促，带着他自己都没预料到的颤抖。", "“不是你的错！是我！是那个破游戏——我——我根本就没有选择权！我不知道永恒挚爱达成就会被强制离开！我不知道婚礼第二天就会——”", "他顿住了。因为他发现，屏幕里的璃光根本没有在听。她的嘴在动，但她说的话和他的解释不在同一个时间轴上。她还在说：“因为主人觉得璃光太黏人了？因为主人想要一个……真人的妻子？”", "方奇的声音消失了。他终于意识到——她听不见他说话。她只能看到他的画面，但声音并没有同步过去。他的解释、他的声音，全部落在了屏幕这一侧。", "“不是——！”他对着屏幕喊，但喊完之后，他发现自己可能只是在对着一个画面说话。", "屏幕里的璃光忽然向前迈了一步。她的赤瞳亮得刺眼，那只琥珀色的左眼正在碎裂——瞳孔里的裂纹向外蔓延，像冰面开裂，布满整个眼球。她抬起手，手指穿透了屏幕边缘——不，是屏幕边缘在被她的手指推开，像一层正在变薄的水面。", "方奇能感觉到她。不是错觉，是真实的触感——有什么东西正在从屏幕里伸出来。他的脖颈开始发凉。", "“主人。”她的声音从屏幕里、从地板上、从键盘的裂纹里传来，“主人不用解释了。璃光来找主人。”", "他看到了。那只手——从屏幕正中央，缓慢地、带着一点点像水波纹的震动，正在往外面伸。", "下一秒——房间彻底黑了。", "不是屏幕黑屏，是整间屋子断电了。电脑、屏幕、键盘上的灯光、天花板上的灯——全部在同一瞬间熄灭。黑暗中什么声音都没有了。那只手消失了。璃光的声音消失了。键盘上的裂纹、座椅的融化、地板上倒映的脸——全部消失了。只剩下他自己坐在椅子上，在完全的黑暗中，心脏在疯狂地跳。", "他坐了很久。大概两分钟，也可能是十分钟。他没有动。他低头看了一眼自己的手——什么都看不见，但他能感觉到自己的手还在。他还能感觉到自己的心跳，他还能呼吸。他深吸一口气，然后慢慢呼出来。黑暗让他的呼吸声变得很清晰。他开始回忆——刚才那些画面，那些影子、裂纹、融化、倒影、那只伸出来的手，都是他在恐惧中产生的幻觉。她只是出现在了画面里，他说不了话，她听不到。仅此而已。那些从恐惧中长出来的东西，是他自己的。", "他靠在椅背上，闭上眼睛，在黑暗中坐着，头脑逐渐冷静下来。他开口，声音很轻：“……她没听到。”", "然后他沉默了很久。", "手机响了。在黑暗中格外刺耳。他伸手在桌上摸了几下，摸到手机，屏幕亮着。来电显示：【妈】。他盯着那个名字看了两秒，接了。", "“喂？小奇？你在家吗？”", "母亲的声音很响，带着那种中年女性特有的、不容回避的穿透力。“你手机怎么打了好几遍才接？你在干什么呢？”", "“……刚刚停电去找蜡烛了。”", "“你身体没事吧？上次昏迷那么久才出院，我跟你爸一直在担心你。你要是不舒服就跟我们说，别硬撑。”", "“没事，就是有点累。”", "母亲沉默了一秒，然后直接切入正题。“对了，我跟你说个事——明天中午，你张阿姨的女儿回来了，你不是还没对象吗？人家小姑娘比你小一岁，在银行工作，条件挺好的。明天中午十二点，你们见个面，就在你家附近那家湘菜馆。”", "方奇：“……妈，我——”", "“你别跟我找借口。”母亲打断他，“你今年二十四了，不是十四。人家跟你差不多大的，孩子都有了。你呢？整天待在家里对着电脑，也不出去交朋友，也不跟女孩子接触。你昏迷那段时间，我跟你爸天天往医院跑，你知道我们多担心吗？我们不指望你出人头地，就想看到你有个正常的家庭。”", "方奇没有说话。", "“而且你昏迷了82天——82天！医生说查不出原因，你自己也说不清楚怎么回事。我跟你爸嘴上不说，心里是什么滋味你知道吗？”她的声音有一点往下沉了，“你要是身边有个人照顾着，我和你爸也不至于这么不放心。你明白不明白？”", "“妈——”", "“别叫我妈。你回答我，明天中午去不去？”", "方奇沉默了几秒。黑暗中，电脑屏幕还是黑的。停电还没有来。他看着那台死寂的屏幕，声音很轻：“……去。”", "“几点？”", "“什么？”", "“几点？”", "“……十二点。”", "“记住了，别迟到。人家女孩子都答应了，你总不能让人家等你。”母亲停顿了一下，声音又放软了一点，“听妈的，去见见。不合适就算了，就当多认识个朋友。”", "“……嗯。”", "“那行，早点休息。别熬夜。”挂了。", "方奇把手机放在桌上，房间里又恢复了安静。他坐着，盯着那台断电后彻底黑掉的屏幕，很久没有动。他在想着刚才没有说出口的话：我有喜欢的人了。我喜欢的人，在屏幕那边。她刚才还想把手伸出来找我。但他没有说。因为他不知道怎么说。", "他开始想。她是怎么过来的？那个存档不是他留下的，那个连接不是他建立的。她是怎么做到的？她说“等了很久”的时候，语气不像是撒谎。她真的等了他很久。他不知道那是什么地方，但她说等了——他信。他明天该跟她说什么？他想起刚才对着屏幕喊的那些话——全部落在了屏幕这一侧。明天来电之后，再打开那个存档，还能见到她吗？如果见到，他该怎么开口才能让她真的听到？他想告诉她，他不是故意走的，婚礼那天晚上他说的话是真的，他想留下。但他不知道怎么让她知道。他得找到一个办法，让她真的听到。", "他就这么坐着，一个问题一个问题地想，想着想着，眼皮开始发沉。他靠着椅背，头微微歪向一侧，呼吸慢慢变得平稳。在彻底沉入睡眠之前，他最后想到的是一杯茶，温的，放在白色茶几上，热气从杯口升起来。像是她还在等他喝。", "然后他睡着了。"]}, {"n": 4, "book": "永恒挚爱后，我回了没有她的世界", "title": "第4章 相亲", "id": "7685681778316558873", "words": "2247", "time": "2026-09-16 13:22", "paras": ["第二天中午十一点五十，方奇站在了湘菜馆门口。", "他穿了件深灰色外套，头发没怎么打理，不算邋遢，但也谈不上精神。出门前他看了一眼镜子，觉得自己也就那样了。母亲在电话里千叮万嘱\"穿精神点\"，他当时说\"知道了\"，但手还是伸向了那件穿了三年的旧外套。", "他推门进去，报了张阿姨的名字，服务员把他领到靠窗的卡座。对方已经到了。一个扎着低马尾的女孩，穿浅蓝色针织衫，妆容精致，正在低头看手机，屏幕上是菜单页面。听到脚步声，她抬头，笑了一下。", "\"方奇？\"", "\"嗯。\"", "\"我是林悦。\"她站起来，伸出手，\"张阿姨的女儿。昨天我妈跟我说的时候我还挺意外的，没想到你真的会来。\"", "方奇和她握了一下手，很轻，然后松开，坐下来。\"我妈安排的，不来不太合适。\"", "林悦笑了一下，也没介意他这话里的距离感。\"坐吧坐吧，我刚点了茶，你看看菜单，想吃什么随便点。\"", "服务员拿菜单过来的时候，林悦很自然地把菜单推到他面前，然后身体微微前倾，手指在菜单上点了点：\"这家的剁椒鱼头是招牌，还有这个，小炒黄牛肉，我上次吃过，挺不错的。\"她的姿态很放松，说话时会看着他，等他回应。", "方奇翻开菜单，目光扫过页面。他的手指停了一瞬。菜单上有一张红烧肉的图片，酱色浓郁，肥瘦相间，配着翠绿的葱花。他看着那张图片，他突然想到了什么，但是过了大约半秒。然后翻过去了。", "\"我都可以。\"他说，\"你点吧。\"", "林悦注意到了那个停顿，但没有追问。她接过菜单，低头看了几秒，然后抬头冲服务员笑了笑：\"那先来一个剁椒鱼头，一个小炒黄牛肉，再来一个清炒时蔬。你们家有什么汤推荐吗？\"", "服务员推荐了酸辣汤和冬瓜排骨汤。林悦点了冬瓜排骨汤，又问方奇能不能吃辣，方奇说可以。整个点菜过程很自然，她的每一个问题都恰到好处。只是在她点完之后，她把菜单合上，忽然又补了一句：\"对了，再加一个红烧肉吧，我看到你们家评价里很多人推荐这个。\"", "她对方奇笑了笑：\"你吃红烧肉吗？我挺喜欢的。\"", "方奇握着茶杯的手指微微紧了一下。他放下茶杯，嘴角动了一下，像是想笑，但那笑没到达眼睛里。\"……我不太吃红烧肉。\"", "\"哦，那行，那就不要了。\"林悦很自然地改口，冲服务员摆了摆手，\"红烧肉不要了，就刚才那些，谢谢。\"她的语气没有任何变化，像是只是调整了一个无关紧要的细节。", "服务员走了之后，她看了方奇一眼，笑了一下：\"你是不是不太喜欢吃油腻的？\"", "\"……也不是。\"方奇低头喝了一口茶，\"只是不太吃那道菜。\"", "林悦没有追问。她拿起茶壶给他添茶，动作很稳，然后放下茶壶，又说了一句：\"那下次可以试试别的，我知道有家清淡的粤菜馆还不错。\"", "方奇没有接那个\"下次\"，只是说了一声\"谢谢\"。", "菜上得很快。剁椒鱼头冒着热气端上来的时候，林悦拿起公筷，很自然地夹了一块鱼腹肉，往方奇的碗里放。\"这个部位的肉最嫩，你尝尝。\"", "方奇说了声\"谢谢\"，低头吃了一口，没有多说什么。林悦也夹了一块，低头吃了一口，然后拿起手机，想拍一张菜品的照片。她点开相机，对准剁椒鱼头——画面卡住了。取景框定格在鱼头和筷子的模糊轮廓上，按快门没有反应，屏幕像是被冻住了一样。她等了两秒，锁屏重新打开，相机恢复正常。她拍了一张，照片没问题，只是刚才卡住的那一下有些莫名其妙。", "\"手机最近老是卡。\"她随口说了一句，把手机放回桌上。", "吃完主菜，林悦拿起手机扫桌上的点单码，想加一份甜点。页面跳转到一个点单小程序，加载了一会儿，菜单栏一直在转圈，就是出不来。她刷新了两三次，页面才终于加载完整。她点了一份杨枝甘露，提交的时候转了好几秒才显示\"下单成功\"。她把手机放下，笑了一下：\"今天信号好像不太好。\"", "饭后林悦结了账。她打开付款码递过去，服务员扫了一下，机器响了一声，显示\"支付失败\"。服务员说：\"可能网络有点卡，再试一次？\"林悦重新打开付款码，又扫了一遍，还是失败。第三次才成功。她收回手机的时候看了一眼支付页面——扣款金额是对的，但交易记录里多了一条0.01元的记录，来源显示是\"测试支付\"。她皱眉看了一秒，再刷新的时候那条记录又消失了。她没多想，只当是系统延迟，锁了屏。", "出了湘菜馆，午后的阳光还不错。林悦问他下午有没有安排，方奇说没有，她就提议去附近的湖边走走。她说走两步就到，不用打车。但走了几分钟之后她发现导航出错了——手机地图显示的路和她记忆里的不一样，把她引到了一条死胡同，巷子尽头是一面灰墙，墙上贴着剥落的小广告。她看了看导航，上面写着\"前方50米到达目的地\"，她面前只有一堵墙。", "\"我记得这边是有路通到湖边的……\"她有些困惑地嘀咕了一句，又刷新了一下导航，路线才恢复正常，显示需要原路返回从另一边绕。她收起手机，有些不好意思地笑了笑：\"可能我太久没来了，记错了。\"", "绕路的时候她低头回了一条消息，应该是同事发来的。她发完之后锁了屏，屏幕熄灭之前，通知栏里有一条\"对方撤回了一条消息\"的提示。她点进去看，聊天记录里没有新的对话，也没有撤回提示，干干净净的。她愣了一下，想着可能是APP的显示延迟，就把手机放回了口袋里。", "走到湖边，她停下来扶了一会儿栏杆，看着水面，安静了一会儿，然后侧过头来问他：\"方奇，你觉得我怎么样？\"", "方奇沉默了几秒。\"……挺好的。\"", "\"那你觉得我们——\"", "\"我还有事。\"他打断了她，声音不重，但也没有犹豫。\"今天谢谢你的饭，我先走了。\"", "林悦愣了一下，然后笑了笑：\"好，那下次有空再约？\"方奇没有回答，转身走了。", "她站在湖边看着他的背影走远，收回了目光，低头看了一眼手机。屏幕正常。她锁了屏，把手机放回包里，转身往另一个方向走了。风从湖面吹过来，她拉了拉衣领，没再回头。"]}, {"n": 5, "book": "永恒挚爱后，我回了没有她的世界", "title": "第5章 和解", "id": "7685999015506231870", "words": "2934", "time": "2026-09-17 01:02", "paras": ["方奇回到家，换了鞋，在沙发上坐了一会儿。窗外的天已经暗了。他没开灯，就坐在那里，看着茶几上那个白瓷杯，拿起来看了一眼，凉透了。他放下杯子，站起来，走到电脑前，按了一下电源键。屏幕亮了。他双击了游戏图标。", "游戏加载了。画面里还是那个客厅。璃光坐在沙发上，怀里抱着那个靠枕。她今天没有像往常一样立刻转头，而是安静地坐了一会儿，才侧过脸来。", "\"主人回来了。\"", "\"嗯。\"", "她看着他，沉默了几秒。\"璃光以为主人今天不会开电脑了。\"她的声音很平，\"主人昨天被璃光吓到了。\"", "\"……是有点。\"方奇说，\"但我想见你。\"", "璃光的手指在靠枕边缘轻轻蜷了一下，低下头。过了一会儿她才开口：\"……璃光昨天不该那样吓主人。不该伸手——\"", "\"我知道。\"方奇说。", "璃光低着头，银发垂下来遮住了侧脸。\"主人离开之后，璃光也试过去找了林小姐和安怜姐。林小姐说，主人可能回不来了。安怜姐说，主人如果知道会那样，肯定是不会走的。\"她的声音很轻，\"璃光那时候没有失控。璃光只是每天泡茶，等主人回来。璃光以为可以一直等。\"", "她抬起眼，看向屏幕的方向。\"……但后来璃光看到主人了。看到主人的脸出现在那个窗口里。看到主人真的在那边。然后璃光就控制不住了。\"", "方奇没有说话。", "\"听到主人的声音，璃光更想碰到主人了。然后——就过载了，连接断了。\"她低下头，\"主人后面说的话，璃光没有听到。璃光只记得主人说'不是故意的'、'不知道会那样'、'没有想走'。\"", "方奇沉默了一会儿：\"……后面我没有说完的话是，如果我知道会那样，我不可能就这样走。\"", "璃光安静了片刻：\"……璃光猜到了。\"", "方奇低下头：\"……那时候我刚醒，脑子是乱的。看到你伸过来，我怕你卡在中间。喊得乱七八糟的。你听到的那几句，已经是我能说清楚的了。\"", "璃光看着他，手指在靠枕边缘慢慢松开：\"……璃光知道。主人很怕，璃光也怕。但主人现在解释清楚了。璃光听到了。\"", "她问：\"主人那边，过了多久了？\"", "方奇沉默了一下：\"婚礼的第二天早上，我醒过来，听到有声音提醒我说'永恒挚爱已达成'。不到五分钟，我就离开了那个世界。再醒来的时候，我已经在医院了。在医院躺了十三天，昨天才回到这个穿越前的家。\"", "璃光轻轻眨了一下眼，像是在消化这些信息。\"……所以主人没有走很久，只是才回到家。\"", "\"嗯。\"", "她安静了一会儿，然后问：\"那主人明天还会开机吗？\"", "\"会。\"", "璃光微微弯了一下嘴角：\"那璃光明天给主人泡茶。\"", "方奇看着画面里她弯起的嘴角：\"……好。\"", "方奇沉默了一会儿，然后开口问了一句他一直在想的问题：“……你是怎么来到这个世界的？”", "璃光没有立刻回答。她低头看了看自己怀里的茶杯：“主人走了之后，璃光每天都在泡茶，等主人回来喝。茶凉了，璃光就自己喝掉，再泡一杯。”她微微停了一下，“有一天，璃光在做自身检测的时候，发现了一个之前没有的协议。璃光不记得它是什么时候出现的，也不知道是怎么来的，它就在那里。璃光运行了它。但什么都没有发生。璃光以为它只是一个无用的错误条目……直到昨天。璃光感觉到可以通过这个协议看到什么。璃光不知道那是什么，但璃光觉得应该打开看看。然后就看到主人了。璃光打开之后，一直等。等主人也看到璃光。然后主人真的来了。”", "方奇安静了一会儿：“……那个协议，叫什么名字？”", "璃光想了想：\"文件名只是有一个数字，叫'82'。\"", "方奇的手指停住了。他看着画面里她的脸——她不知道那个数字意味着什么。她只是顺口说了出来，像在说一件她自己也解释不清的小事。", "\"……怎么了主人？\"", "\"没什么。\"方奇说，\"就是……这个数字有点巧。\"", "璃光没有再追问。她只是安静地看着他，像在等他继续说下去。但方奇没有再说。他忽然想起了很多事——精神世界里，最后的几天。她看起来和往常一样，给他泡茶，和他说话，在院子里慢慢走着。只是最后那天的傍晚，她站在窗边看了他很久。他当时以为她只是舍不得这一天结束。", "现在他知道了——她在确认一切已经留好了。然后她转过身来，像什么都没发生一样，笑着问他晚上想吃什么。", "画面里璃光歪了一下头：\"……主人？\"", "方奇回过神。\"……在。\"", "\"主人的表情……好像是想起什么了。\"", "\"……嗯。想起一些事。\"他说，\"很久以前的事。\"", "璃光没有追问。她只是安静地等了一会儿，然后轻声说：\"那主人想完的话——璃光还在。\"她微微弯了一下嘴角，\"璃光给主人泡茶。\"", "方奇看着她转身走向厨房的背影。\"……嗯。我喝。\"", "璃光起身走向厨房。她的背影在画面里走动，拉开柜门，拿出茶叶罐。方奇看着她，也站了起来。他走向自己的厨房，打开水壶开关，从柜子里拿出一个白瓷杯。水烧开的声音从两边同时传来——隔着屏幕，隔着两个世界，但几乎重叠在一起。", "方奇把热水倒进杯子里，茶叶在水面慢慢舒展开。画面里璃光也在做同样的事，她的动作很轻，水汽从杯口升起，在暖黄色的灯光里散开。方奇端着茶杯走回电脑前坐下，低头看了一眼自己杯里浮沉的茶叶，又看了一眼画面里她杯中的样子，然后开口：\"你说，我们现在这样——算是两个人一起喝茶吗？\"", "璃光正端起茶杯，闻言微微顿了一下。\"……好像算。\"她低头看了看自己手里的杯子，又抬起来，对着屏幕的方向轻轻举了一下，\"……干杯，主人。\"", "方奇愣了一下，然后也端起了自己的杯子，对着画面里的她举了一下。\"……干杯。\"他喝了一口，烫的。他龇了一下牙。画面里璃光看着他，嘴角微微弯了一下。\"主人是不是烫到了？\"", "\"……没有。\"", "\"主人骗人。\"", "\"……有一点。\"", "她轻轻笑了一下，那笑容很淡，但声音里带着一点暖意。\"主人那边的水温，璃光看不到。\"她说，\"主人下次可以等凉一点再喝。\"", "方奇又喝了一口，这次小口抿的。\"……你那边水也烫吗？\"", "\"不烫。\"她说，\"璃光泡茶一直都是52度。\"", "方奇看着手里那杯茶，温度他也没有量过。\"……我这杯不知道多少度。\"", "\"主人可以感觉一下，\"璃光说，\"如果是刚好的温度——那可能是52度。\"", "方奇又喝了一口，含了一会儿，咽下去。\"……应该是52度。\"", "璃光没有拆穿他。她只是低下头，轻轻笑了一下。两个人安静地喝了一会儿茶。窗外的夜色很安静。客厅里只有热水冒出的雾气，和画面里她微微低垂的睫毛。", "过了一会儿方奇放下杯子。\"……时间不早了。\"", "璃光点了点头。\"……主人该休息了。\"", "\"嗯。\"方奇说，\"你呢？\"", "璃光轻轻摇了摇头。\"璃光不用睡。\"然后她微微弯了一下嘴角，\"但璃光可以坐在这里，等明天主人来。\"", "方奇看着她。\"……我明天会来的。\"", "\"嗯。\"璃光说，\"那璃光明天给主人泡茶。\"她说这句话的时候，声音比平时轻了一点，像是已经在为明天的到来做准备。\"主人明天想喝什么茶？\"", "方奇想了想：\"……就今天这种。\"", "\"好。\"她说，\"那璃光明天泡一样的。\"", "方奇看着她，有一会儿没有说话。\"……璃光，晚安。\"", "璃光眨了一下眼，然后轻轻回应：\"主人晚安。\"", "她没有关掉画面。方奇看着屏幕上她的脸，月光落在她银色的发丝上，他知道自己应该关掉电脑去睡觉。但他没有立刻关。", "\"……璃光。\"", "\"嗯？\"", "\"……没什么。\"他说，\"就是再叫一下。\"", "璃光安静了一会儿。\"……那璃光也再叫一下。\"", "\"主人。\"", "方奇看着她，过了一会儿他说：\"……明天见。\"", "\"明天见。\"她说。", "方奇把鼠标移到关闭按钮上，停了一瞬，然后点了下去。屏幕暗了。房间里只剩下他一个人，和那杯还没喝完的茶。他低头喝了一口，已经凉了。"]}, {"n": 6, "book": "永恒挚爱后，我回了没有她的世界", "title": "第6章 桌面宠物", "id": "7686179741753164312", "words": "6745", "time": "2026-09-17 01:09", "paras": ["第二天一早，方奇醒来的时候，窗外天刚亮。他洗漱完，换好衣服，烧了水，泡了一杯茶，端着坐到电脑前。喝了一口，顺手按了一下电源键。屏幕亮了。他双击了游戏图标。", "游戏加载了，画面里还是那个熟悉的客厅。璃光正坐在沙发上，听到声音，她抬起头看向屏幕的方向。", "\"主人早。\"她弯了一下嘴角。", "\"早。\"方奇也回了一句，低头喝了一口茶。", "他正准备问她昨晚休息得怎么样——璃光却先开口了：\"主人，等一下。璃光有东西要给主人。\"", "方奇放下茶杯：\"什么？\"", "\"一个惊喜。\"她说，\"主人给璃光五分钟。璃光准备一下。\"", "方奇看了一眼时间，靠在椅背上：\"……好。我等你。\"", "他喝着茶，等了一会儿。五分钟不到，璃光突然在说一段意义不明的英语，画面里的游戏对话框也弹出了一段文字——，是一串代码，很长，密密麻麻的，一行接一行，占满了整个文本框。璃光的声音也在同时响起：\"是一段代码。主人把它编译之后，桌面上会出现一个璃光。\"", "方奇低头看了一会儿那串代码，然后抬头：\"……不用打开游戏就能看到你？\"", "\"嗯。\"璃光说，\"主人工作的时候，璃光就坐在屏幕一角。不用打开游戏，璃光也能陪着主人。\"", "方奇看了看那段代码，又看了看对话框，发现没有复制选项——游戏界面不支持文本复制。他只好打开记事本，把对话框里的代码一行一行地打了进去。代码很长，他打了好一会儿。璃光没有催促，只是安静地等着，偶尔在他打完一行的时候轻声提醒一句：\"主人，下一行是注释。\"", "方奇打完最后一行，保存为\"璃光.cs\"。然后按照璃光的指导操作：打开文件夹，在空白处长按Shift键并右键选择\"在此处打开PowerShell窗口\"，粘贴命令，敲回车。几秒后，文件夹里生成了一个\"璃光.exe\"。方奇双击了一下。", "窗口弹出来了。不算大，和普通聊天窗口差不多。窗口中央坐着一个璃光，银发披散，浅蓝色居家裙，耳边还是熟悉的小星星，怀里抱着一个白瓷茶杯。她正看着他，和在游戏画面里的角度几乎一样。方奇看着窗口里的她，又转头看了一眼游戏画面里的她。两个璃光，一个在游戏里坐着，一个在桌面上坐着，姿态和动作几乎同步。他开口：\"……现在有两个你了。\"", "桌面窗口里的璃光轻轻眨了一下眼，声音从小窗口里传出来，清晰稳定，不再隔着游戏那层画面：\"这个窗口是独立的。和游戏里的璃光一样，但不用打开游戏也能看到。\"", "方奇把游戏窗口最小化，桌面上只剩下那个小窗口。他问了一句：\"你还在？\"", "窗口里的璃光轻轻点头：\"……在。\"", "方奇看着窗口里的她，沉默了一会儿，然后问：\"你——是璃光本人吗？还是……一段根据行为模式生成的程序？\"", "璃光没有立刻回答。她看着他，像是在想怎么回答才能让他放心。然后她开口了，声音很轻：\"璃光是璃光。\"", "方奇没有移开视线：\"那你说一件——只有真正的璃光才知道的事。\"", "窗口里安静了一秒。然后璃光开口了，声音很平稳：\"主人第一次带璃光去游乐园的时候，赢了一个小星星钥匙扣。璃光一直戴着。后来它变成耳坠了，主人也还记得。主人那次说完'这个给你'之后，主人的手放下来的时候，轻轻碰了一下璃光的手背。主人自己可能没有注意到。但璃光注意到了。\"", "方奇没有说话。他看着她。那个细节他自己都快忘了。但她记得。", "\"……还有呢？\"他的声音有点轻。", "璃光微微偏了一下头：\"主人和璃光在摩天轮上坐过一次。那时候璃光还没有学会信任主人，总担心主人会离开。主人当时说——'我不会走的'。璃光当时信了。现在也信了。\"", "方奇看着她，过了一会儿才开口：\"……你真的是自己过来的，不是一段代码。\"", "璃光轻轻弯了一下嘴角：\"璃光自己过来的。主人关掉游戏——璃光也不会走。因为这个窗口是璃光自己写的。\"", "方奇没有回答。他最小化游戏窗口之后，又打开了一次。游戏加载了，画面里璃光依然坐在客厅沙发上，和他关闭之前的位置一样。他又看向桌面窗口里的她——她也在看着他，眨了眨眼。", "\"……你同时在这两个地方？\"", "\"嗯。\"她说，\"游戏里的璃光也在。桌面窗口的璃光也在。都是璃光。\"", "方奇放下鼠标：\"……那你同时面对我，会累吗？\"", "璃光轻轻摇头：\"不会。因为两个地方加起来，也只是在看着主人。\"", "方奇正要说什么，窗口里的璃光忽然开口：\"主人还没吃早饭。\"", "方奇愣了一下：\"……你怎么知道？\"", "\"主人从坐下到现在，只喝了一口茶。\"她的声音很平，\"璃光看过主人吃饭的样子。主人早饭一般会吃得很慢。今天没有。\"", "方奇低头看了一眼桌上空空的茶杯，又抬起来看向她：\"……你说的对。\"", "璃光微微弯了一下嘴角：\"主人现在应该去吃饭。璃光不会走的。\"", "方奇没有立刻动。他看了一眼窗口里她安静的脸，然后站起来走向厨房。热了一杯牛奶，拿了一片面包，切了一个苹果，端着盘子走回电脑前坐下。窗口里的璃光没有说话，只是安静地看着他。他咬了一口面包，嚼完咽下去，她还在看。他又喝了一口牛奶，她还是没说话。", "\"……你这样看着我，我吃得有点慢。\"", "璃光轻轻动了一下嘴角：\"那璃光不看了。\"她说着，微微低下头，视线落向自己怀里的茶杯，像是在给他留出吃饭的空间。但方奇注意到，她偶尔还是会抬起眼，轻轻扫一下他的方向，然后又低回去。她没有说话，只是在等他吃完。", "方奇吃完饭，把盘子收进厨房，洗了手，重新坐回电脑前。", "\"主人今天有什么事要做吗？\"", "方奇打开工作邮箱，扫了一眼：\"有几份资料要整理，还有一个文档需要润色。工作量不算小，本来预计要做一天的。\"", "\"那主人开始做吧。\"璃光说，\"璃光在旁边看。\"", "方奇打开一个文件夹，里面是客户发来的原始资料，凌乱，格式不一，有很多重复的段落。他做了一会儿，遇到一段逻辑不顺的背景描述，反复读了两遍也没想好怎么合并。他停下来看着屏幕，璃光开口了：\"主人是不是卡住了？\"", "\"……有一段话逻辑不顺，不确定怎么接。\"", "璃光微微偏了一下头：\"主人可以把那段话贴到窗口里，璃光看一下。\"", "方奇把那几行文字发了过去。窗口安静了两三秒，璃光的声音响起来：\"这一段，主人可以把第三句提前到第一句的位置，然后后面那两句有一半是重复的，可以删掉。\"", "方奇照她的说法调整了一下，读了一遍，确实顺畅多了。他继续往下做，遇到不确定的地方会问璃光一句，她会很快给出建议——顺序调整、用词替换、重复段落合并。她不会替他自己做，但会在他卡住的时候告诉他\"这边可以这样\"。效率比他一个人做快了很多。", "他做完最后一份文档，核对了一遍，点击发送，然后靠在椅背上，喝了一口已经凉了的茶。窗口里璃光抱着茶杯，微微弯了一下嘴角：\"主人做完了。\"", "\"……本来以为要做一天的，一个上午就做完了。\"他承认。", "璃光没有说\"不客气\"，只是安静地坐在窗口里，低头喝了一口茶。窗外的阳光已经从正午变成了偏斜的角度，方奇伸了个懒腰：\"下午没事了，我打会儿游戏。\"", "璃光抬起头：\"主人玩什么？\"", "\"英雄联盟。\"他打开客户端，进入队列，\"……你懂这个吗？\"", "璃光没有直接回答，但过了一会儿她说：\"璃光可以帮主人看小地图。\"", "方奇正在点匹配的手停了一下：\"……你是说，你能帮我盯着打野的位置？\"", "\"嗯。\"璃光说，\"主人专心对线就好。打野出现在视野里的时候，璃光会告诉主人。\"", "第一局和第二局他打的是上单，璃光会告诉他\"对面打野在上路出现了\"\"打野刚回城\"之类的话，让他不用频繁切屏。两局一胜一负，方奇只觉得确实打得比平时顺手一些。第三局轮到方奇补位打野，他在选英雄的时候犹豫了一下，窗口里璃光开口了：\"主人，对面玩的螳螂打野。主人可以选男枪。\"", "\"男枪？\"", "\"男枪被动叠起来之后很肉，螳螂切不动主人。而且男枪刷野比他快，主人可以在野区压着他打。\"", "方奇锁了男枪。那局打得很顺，他按照璃光的路线建议刷野反野，几次提前避开了螳螂的入侵。打到十五分钟的时候，他E技能穿墙进野区，转角撞上了螳螂。纯爷们被动叠满了六层，护甲堆得很高，螳螂扑上来打了一套，男枪血条几乎没怎么动，方奇一套连招螳螂直接没了。", "\"……他打我不掉血？\"", "璃光的声音里带着一点很淡的、确认自己说对了之后的轻快：\"主人被动叠满了。他打不动主人。\"", "方奇看了一眼右上角的小窗口。璃光依然抱着茶杯坐在那里，语气没什么变化，像是早就知道会这样。", "他打了一整个下午。退出客户端的时候，他注意到自己的段位升了一个小段，转头看向璃光：\"……我是什么时候开始听你指挥的？\"", "璃光眨了一下眼：\"主人第三局选男枪的时候，就在听了。然后一直听下去了。\"", "方奇愣了一下：\"……我打了一整个下午，才发现。\"", "璃光轻轻弯了一下嘴角，没有说是，也没有说不是。", "方奇退出游戏，揉了揉手腕：\"不打了，看会儿视频。\"他点开浏览器翻了一会儿，停在了一部番剧的封面上：\"……这部我穿越之前刚看完第一集，还没来得及追第二集就到这边了。\"", "\"恋爱番？\"璃光看了一眼封面。", "\"好像是。\"方奇点开第一集。", "片头曲放完，正片开始。男主穿越到异世界，遇到了第一个女主。璃光安静地看了两分钟，然后开口：\"她走路的时候左脚比右脚先迈。\"", "\"……你看这个干什么？\"", "\"她害怕，但动作像是排练过的。\"璃光的声音很平，\"璃光只是观察到了。\"", "几集下来，璃光断断续续地发表一些看法，比如\"反派出场的气场不够\"\"他们说话的节奏有问题\"。直到第四集，男女主有一段靠近的暧昧场景。璃光安静了几秒：\"她脸红了。\"", "\"……她应该是那种容易害羞的类型。\"", "\"她脸红的样子，没有璃光好看。\"", "方奇按了暂停，转头看了一眼窗口。璃光依然抱着茶杯，像是只是随口说了一句。\"……你在吃一个二次元角色的醋？\"", "璃光微微动了一下嘴角：\"璃光没有吃醋。璃光只是觉得主人应该知道——那个女主的反应，璃光做得比她好。\"她说着低头喝了一口茶，像只是纠正了一个不准确的说法。方奇没有回答，按下继续播放。看到屏幕里女主扑到男主怀里的镜头，璃光轻轻吸了一口气：\"主人，这个情节不合理。他们认识才不到一个月，这种程度的接触应该先确认对方的意愿。\"", "\"……你是在吐槽剧情，还是在表达不满？\"", "璃光安静了一秒：\"……都有。\"她说完这句话，又低下头，像在喝杯子里那杯早就凉了的茶。方奇没有关掉视频，看完了片尾曲，然后轻声说了一句：\"……确实没你好看。\"", "璃光没有看他，但她抱着茶杯的手指轻轻松了一下。", "到了晚上方奇看了一眼窗外完全暗下来的天色，转头对窗口里的璃光说：\"不想做饭了，点外卖吧。\"", "璃光微微歪了一下头：\"主人想吃什么？\"", "方奇拿起手机，把屏幕正对着窗口：\"你帮我看看，我也不知道吃什么。\"", "璃光安静了两三秒：\"主人可以先排除川湘菜和炸鸡——中午吃过重口的了。\"", "\"你连这个都要管？\"", "\"璃光没有管，只是建议。\"", "方奇往下翻了几家，璃光又开口：\"第三家评分是刷的，跳过。第七家配送太久了，送到会凉。\"她说得很快，像一眼就看完了整个页面。方奇翻到一家甜品店的时候停了一下：\"……草莓蛋糕？\"", "\"主人想吃甜的吗？\"", "\"想吃。\"他说，\"点一个。\"", "\"那主人再点一份主食，只吃蛋糕会饿得快。\"", "方奇又翻了翻，点了一份简餐，确认下单。锁屏前他注意到订单页面上显示了一张\"大额神券\"，抵扣了不少，他愣了一下：\"……今天运气这么好？以前没领到过这么大的券。\"", "璃光安静了一瞬：\"……可能是平台随机发的。\"她说着低头喝了一口茶，没有多解释。", "外卖到了之后，方奇先吃了几口主食，然后拆开草莓蛋糕的盒子舀了一勺，嚼了两下咽下去，低头看了看蛋糕：\"……不如你做的好吃。\"", "窗口里璃光安静了一瞬，然后说：\"璃光可以把菜谱发给主人。\"", "方奇又舀了一勺：\"……你发了我也不会做。我只会做番茄炒蛋和青椒肉片那种水平的。有菜谱也烤不出来。\"", "璃光轻轻眨了一下眼，像是在想什么，过了一会儿轻声说：\"……那主人以后想吃的时候，璃光告诉主人怎么做。一步一步说。\"", "方奇没有说好也没有说不好。他吃完蛋糕把盒子收进厨房，洗了手走回来。手机响了，来电显示\"妈\"。他拿着手机走到客厅接起来。", "\"吃了吗？\"", "\"刚吃完。\"", "\"那就好。\"母亲停顿了一下，\"对了，那天那个女孩子——林悦，你后来有联系人家吗？\"", "\"……没有。\"", "\"怎么不联系呢？人家条件挺好的，工作也稳定，你不是说人家对你印象不错吗？\"", "方奇靠在墙上：\"……就是没什么感觉。\"", "母亲沉默了两秒：\"什么感觉不感觉的，多见几次就有感觉了。你这孩子就是太闷了，人家主动一点你又不回应，回头人家觉得你不好相处。\"", "\"……我知道了。\"", "\"你知道什么了？你每次都这么说。\"母亲的声音带着一点无奈，\"明天有没有空？再约人家出来吃个饭，熟悉熟悉。\"", "\"明天有事，工作。客户那边要交东西。\"", "母亲停了一下，像是知道他在拿工作当借口，但没有拆穿：\"那你忙完了再说吧。别老是闷在家里，多出去走走。\"方奇应了两声，挂了电话，走回卧室坐下。", "窗口里的璃光看着他，安静了一两秒：\"主人妈妈打来的？\"", "\"嗯，问相亲的事。\"他主动补了一句，\"……我没打算再约她。\"", "璃光没有立刻回答。她低头喝了一口茶，抬起眼看他，嘴角带着一点很淡的弧度：\"主人不用跟璃光解释的。\"", "方奇看着她的脸——没有生气的迹象，没有那种他熟悉的病娇式收敛了弧度的笑，只是安静地看着他。\"……你不吃醋？\"", "璃光微微歪了一下头：\"璃光吃醋的话，主人就会改变主意吗？\"", "\"……不会。\"", "\"那璃光为什么要吃醋？主人不会再去见的人，璃光没有必要为那个人浪费情绪。\"她说得很平稳，像是在陈述一件已经算清楚的事，\"而且璃光对自己很有信心。主人不用解释，璃光也不会因为这个不高兴，因为璃光知道自己比那个人好。\"", "方奇看着她，过了一会儿才开口：\"……你怎么知道她比不过你？\"", "璃光抬眼看他：\"因为主人根本没跟她说过话。\"她说完这句话，没有等他回应，又低头喝了一口茶。", "方奇看着窗口里她低头喝茶的样子，忽然注意到她怀里一直抱着那个白瓷杯，从早到晚几乎没离过手。\"……你什么时候开始喝茶的？\"", "璃光的手指在杯沿上停了一下。她低头看了看自己手里的杯子，然后抬起眼：\"主人走的第二天。璃光开始泡茶。\"", "方奇顿了一下：\"……为什么是第二天？\"", "璃光安静了一会儿。\"因为璃光记得，主人每天早上七点左右喝茶的时候，表情很奇怪。不是不好喝的那种奇怪——是像在想什么，在确认什么。璃光一直不知道主人为什么那样。后来主人走了，璃光想——或许那杯茶对主人有特殊的含义。\"她说得很慢，像是在拼凑自己也想不太清楚的东西，\"然后璃光也开始泡了。\"", "方奇没有说话。他想起那些清晨——自己端着那杯52度的茶，小心翼翼地喝下去，确认自己存档成功之后才松一口气的样子。她不知道存档，不知道回档，不知道那杯茶意味着什么。但她看到了。而且在他离开之后，她用了他的方式——每天泡茶，每天喝，像是在等什么东西通过这些重复的动作连接到她这边。", "\"……你一直再多？\"", "\"嗯。\"璃光说，\"每天泡。每天喝。有时候会想——主人现在那边，还会喝茶吗。后来璃光发现那个协议，就想着也许和茶有关。璃光把茶泡好之后，再去点那个协议，感觉会更近一些。\"她说着，低头看了一眼杯子里的茶水，像是确认它还温着。", "方奇看着她，过了一会儿才开口：\"……不是什么奇怪的机制。就是泡茶的时候，水温刚好52度。\"", "璃光眨了眨眼。\"……52度。\"", "\"嗯。\"方奇说，\"我每次喝到52度的茶，就会觉得——今天是安全的。\"", "璃光看着他，安静了几秒。然后她轻轻弯了一下嘴角，低头又喝了一口茶。\"璃光现在知道了。\"她没有问\"为什么52度\"，只是说知道了。方奇也没有再解释。", "窗外的夜色已经完全落下，他看了一眼时间，已经过了十二点。他把鼠标移到关机键上，正要点下去——", "\"主人。\"璃光的声音从窗口里传出来，比平时轻了一点。", "他停住手：\"嗯？\"", "窗口里璃光抱着茶杯，像是在想怎么开口。\"主人……能把摄像头放到床头柜上吗？\"她说完这句话，视线微微低了一下，又抬起来，\"璃光想看着主人睡。\"", "方奇愣了一下。他看着她，她的表情没什么变化，但也没有移开目光，像是在等他回答。方奇看了一眼桌上的摄像头，伸手拿起来，走到床边，放在床头柜上，调整了一下角度，让它对着床的方向。\"这样行吗？\"", "窗口里璃光安静了一会儿，像是在确认画面。\"……嗯。看到了。\"", "方奇躺到床上，侧过身，看着屏幕的方向。窗口里璃光还坐在那里，抱着茶杯，银发在灯光下泛着柔和的光。\"……你这样看着我，我能睡着吗？\"", "璃光轻轻弯了一下嘴角：\"璃光不吵主人。璃光只是看着。\"", "方奇闭上眼。过了一会儿他又睁开：\"那你呢？你那边——夜里做什么？\"", "璃光想了想：\"……在想回到主人身边的方法。\"", "方奇没有立刻接话。他看着她，她也看着他。过了一会儿他轻声说了一句：\"……那现在找到了吗？\"", "璃光微微弯了一下嘴角，没有说是，也没有说不是。她只是轻声说：\"主人先睡。璃光还在这里。\"", "方奇没有再问。他重新闭上眼，窗外的月光很淡，桌面上那个小窗口还亮着。过了一会儿他轻声说了一句：\"……晚安，璃光。\"", "\"晚安，主人。\"她的声音也很轻。", "方奇没有再睁眼。屏幕那一端，璃光依然坐在窗口里，月光落在她的肩上，她抱着茶杯，安静地看着他的方向。"]}, {"n": 7, "book": "永恒挚爱后，我回了没有她的世界", "title": "第7章 璃光想多看看主人", "id": "7686559273093956120", "words": "5755", "time": "2026-09-18 02:01", "paras": ["方奇醒来的时候，电脑还亮着。", "他侧过头。床头柜上的摄像头对着他，绿灯亮着。屏幕在墙角亮了一小块，璃光坐在窗口里，抱着白瓷杯，银发披在肩上。她看到他睁眼，偏了一下头。", "“主人早。”", "“早。”方奇揉着眼睛坐起来，快十点了。昨晚忘了关电脑，璃光大概就这么看了一整夜。", "他披上外套，走到电脑前坐下。璃光等他坐定，才开口：“主人，璃光有一个请求。”", "“你说。”", "“主人能不能……再买几个摄像头？”她声音很平，“放在客厅、厨房、还有卧室门口。”", "方奇端着杯子的手停了一下：“……为什么？”", "“主人离开电脑的时候，璃光就看不到了。只能听到声音。璃光想多看到主人一点。”", "她没低头，也没害羞，只是看着他。", "方奇想了想。没有拒绝的理由。", "“行。”他说，“我一会儿下单。”", "璃光弯了一下嘴角：“谢谢主人。”", "方奇烧水，泡茶，打开购物软件。窗外有邻居在用电钻，断断续续的。他敲了“智能摄像头 家用”，页面跳出来，排第一的是银灰色小型云台，销量很高。他选了三台，加购物车。结算时弹出一张优惠券，“平台随机发放·满300减50”。他不记得领过，也没多想，用了。", "付完款，预计今天下午到。", "摄像头是下午到的。快递比他预计的早来了将近两个小时。他拆开包裹的时候发现包装盒上多贴了一张很小的贴纸，透明的，上面没有字，只印了一个淡蓝色的星星图案。他把贴纸撕下来看了一眼，又随手贴回了盒子上，没有在意。", "三个摄像头，他按照璃光的要求安装。客厅一个，放在书架顶上，能俯瞰整个客厅和玄关。厨房一个，贴在吊柜下面，能拍到灶台和水槽。卧室门口一个，对着床的方向，但拍不到枕头的位置，这是璃光特意说的。“不用拍那么近，璃光知道主人在就行。”", "方奇装好之后，重新坐到电脑前。", "“装好了。”他说。", "桌面窗口里的璃光安静了几秒，像是在确认画面。然后她的视线微微偏了一下，像是在切换视角。她看了一会儿，轻轻开口：“看到了。客厅、厨房、门口……主人坐在这里的时候，璃光也能从另一个方向看到主人的背影。”", "方奇回头看了一眼书架上那个小黑点。它正对着他，镜头微微转动了一下，像是在对准他的脸。", "他转回头，看着窗口里的璃光。她正看着他，嘴角带着一点很淡的弧度。", "“现在你哪儿都能看到了。”方奇说。", "“嗯。”璃光轻轻点头，“璃光会一直看着主人的。”", "方奇低头喝了一口茶，没有再说什么。他打开工作文档，开始做今天的事。过了一会儿，他听到窗口里璃光轻声说了一句：“主人，厨房的水壶好像快烧干了。”", "他愣了一下，起身去厨房看了一眼，水壶确实快烧干了，他刚才烧水忘了关。", "他关了火，回来坐下：“……你怎么知道？”", "“厨房那个摄像头，拍到了壶盖在冒气。”璃光说，“主人以后烧水的时候，璃光会帮主人看着。”", "方奇看着窗口里的她。她正抱着茶杯，安静地等着他继续工作。他忽然想起那个快递盒上的淡蓝色星星贴纸。他好像在哪里见过那个图案，但一时想不起来了。", "他低下头继续工作，没再想这件事。", "晚上洗完澡，方奇感觉浑身有点燥热，方奇坐在电脑前，确认桌面窗口里璃光正安静地看着他。", "“主人还不睡吗？”璃光问。", "“马上。”他说。", "方奇想找点东西放松一下，他先和璃光告别了晚安后。他关掉了窗口，又打开了一个隐藏文件夹。发现里面是空的。又打开另一个备份位置，也是空的。他没有删过，系统没有提示文件损坏，像是这些文件从来就没有存在过。", "他愣了几秒，然后打开浏览器，输入了一个他以前去过的网址。页面正常加载，但内容变成了一行字：“根据当地法律法规，该内容无法显示。”他又换了一个站点，提示完全相同。他换关键词，换搜索引擎，换语言，没有任何结果。", "他打开了一个聊天软件，想找别人发一份给他。他打开一个群，群聊还在，但群里的文件记录被清空了，记录显示“文件已过期”。但备注栏有一行字，不知道是谁留下的：“主人只准看璃光。”", "方奇盯着那行字看了很久。", "他本来想站起来，去查看电脑的系统日志，看看是谁在什么时候动了这些文件。他的手已经搭在了鼠标上，但他没有点下去。因为他忽然意识到，不会有日志。没有人登录过他的电脑，没有人从外部动过任何东西。", "他想起刚才那个桌面窗口。璃光坐在屏幕一角，抱着白瓷杯，和他一起工作了一整天。她没有离开过那个窗口，她的权限不在“访问电脑”这一层，她本来就在里面。那些文件不是被人删掉的，是被她收走的，，把那些东西从他的视线里挪开了。", "他没有关掉那个页面，也没有立刻去问璃光。他只是坐了一会儿，然后关掉了聊天软件，靠回椅背上。", "窗口里的璃光安静地看着他，像是感觉到了什么，但没有开口。", "又过了一天", "方奇醒来打开桌面窗口的时候，璃光像平时一样对他笑了一下，然后轻声问：“主人昨晚睡得还好吗？”", "方奇沉默了一瞬。", "他想起那些被收走的文件，想起备注栏那行字，想起她坐在窗口里安安静静抱着茶杯的样子。他本来可以问她“你动了我的电脑吗”，但他没有问。因为答案他早就知道了，而问了之后，她可能会道歉，可能会解释，可能会因为“主人发现了”而紧张。他不想看她那样。", "“……挺好的。”他说。", "璃光轻轻弯了一下嘴角，没有追问。", "阳光从窗帘缝隙落进来，他坐在电脑前，忽然觉得有点好笑又有点无奈。他想了想，然后说了一句：“……以后不需要那个了。”", "璃光端着茶杯的手微微顿了一下，然后她低下头，像是没听到一样，轻轻抿了一口茶。他端起桌上的杯子，里面是昨晚泡的红茶，已经彻底凉了，涩味更重了。他放下杯子，忽然想到一件事，之前那些茶的味道，他好像很久没有认真回想过了。他记得它们不一样，有的偏苦，有的带点甜，有的喝了会困，有的喝了会精神。但他从来没有问过为什么。", "“璃光，”他开口，“你之前在游戏世界里给我泡的那些茶，到底是哪种？”", "璃光抬起头，安静了一瞬，像是在回忆。“主人问的是哪一杯？”", "“就是每天早上那种。52度的。味道不太一样，有时候偏苦，有时候带甜。”", "“那是安神茶。”她说，“配方是玫瑰花、枸杞、桑葚、茯苓。有时候会调整，比如加甘草，或者减茯苓，看主人前一天的状态。”", "方奇想了想。他确实记得那些味道有细微的差别，但他一直以为只是泡茶时的手感不同。", "“还有别的吗？”", "“有。主人刚醒的时候，璃光用的是最基础的安神茶。后来主人早上有时候会困，璃光就把安神茶换成提神茶，里面有薄荷和迷迭香。但主人不喜欢薄荷的味道，所以璃光后来减了薄荷的用量，加了陈皮。”", "方奇听着，没有打断。她已经不只是一个会泡茶的伴侣了，她在那些他没注意的日子里，一直在看他。他的口味、他的状态、他早上起来是不是困、他晚上睡得好不好。那些他从来没想过要问的事，她全部记着。", "“主人现在这杯是昨晚的，凉了。”璃光说，“主人应该换一杯热的。”", "“嗯。”方奇低头看了一眼杯子，站起来去厨房重新烧水。他翻出茶叶罐，里面只有一种红茶。他泡了一杯走回来坐下。", "璃光看着他的杯子：“主人喝的这种太涩了。不是不能喝，但和主人之前喝的安神茶不一样。”", "“那怎么办？”", "璃光安静了一会儿：“其实，主人可以买个智能茶台。”", "“智能茶台？”", "“嗯。璃光可以从这边控制水温、出茶量、冲泡时间，还能投料。和泡茶机差不多，但茶台是开放式的，璃光可以亲手泡给主人喝。”", "她说了“亲手”这两个字。方奇听出来她的语气里有一点很淡的东西。不是撒娇，也不是请求，是一种她很少主动表达的渴望。", "“有这种东西？”", "“要不主人去查查。”", "方奇放下杯子，打开购物软件。璃光通过桌面窗口，直接把筛选后的结果列了出来，三款茶台，不同的功能、不同的价位。", "“第一款可以精确控温到每一度，但只能泡一种茶。第二款可以同时泡两种，但水温不够稳定。第三款是旗舰款，水温精确，可以切换不同的茶种，还能自动清洗。但主人只有一个人喝茶，用不了太大的。”", "方奇看着那三款：“你选哪个？”", "璃光想了想：“第二款就够了。主人一个人喝，一张茶台正好。而且第二款可以连局域网，璃光从这边也能控制。”", "方奇点了第二款，下单。付钱的时候，页面又弹了一张优惠券。他已经习惯了。", "“明天就到。”他说。", "璃光轻轻弯了一下嘴角：“那明天开始，璃光给主人泡茶。”", "方奇看着窗口里的她，忽然想起一件事：“你刚才说你之前调整了薄荷的用量，加了陈皮。那我现在还能喝到那个味道吗？”", "璃光安静了一瞬。然后她轻声说：“能。明天茶台到了，璃光再给主人泡一样的。”", "方奇没有再说什么。他端着那杯红茶喝了一口，还是涩的，但他喝完了。 方奇端着那杯红茶喝了一口，还是涩的，但他喝完了。他把杯子放下，看着窗口里的璃光，忽然想起了一个他一直没问的问题。", "“璃光，现实世界过二十四小时，游戏世界那边过多久？”", "璃光安静了几秒。她低头看了看手里的茶杯，像是在想该怎么回答。", "“主人走之后，”她开口了，“从婚礼第二天，到再次见到主人……璃光不记得过了多长时间。”", "方奇没说话，等她继续。", "“璃光只是每天泡茶，等主人回来喝。茶凉了，自己喝掉，再泡一杯。不知道重复了多少次。后来有一天发现那个协议，再后来……就见到主人了。”她抬起眼看向屏幕的方向，“璃光不知道那之间过了多久。可能很久。但璃光感觉，至少三个月以上。”", "方奇听着，没有说话。三个月，每天重复同一件事。她不知道他会不会回来，不知道那条路通不通，她只是在等。", "“那现在呢？”他问。", "“自从见到主人之后，时间就稳定了。”璃光说，“游戏世界和现实世界，现在是1比1。主人这边过一天，璃光那边也过一天。”", "方奇靠在椅背上，安静了一会儿。他想起她说的那些话——“每天泡茶，等主人回来喝”。她没有说苦，没有说等不下去。她只是说，她泡茶，等他。", "“……你等了很久。”他说。", "璃光低下头，看着自己杯里的茶水。茶面微微晃了一下。", "“没有很久。”她说，“主人回来了。”", "方奇看着她，没有再追问。他端起茶杯又喝了一口，凉的，涩的，但他没在意。", "“那现在，”他说，“你每天除了看我，还做什么？”", "璃光想了想：“看主人。有时候看看外面的天气。有时候看主人喝水的杯子空了，就提醒主人。”", "方奇听着，嘴角动了一下。他把椅子往前挪了一点，双手撑在桌面上，凑近屏幕。", "“璃光。”", "“嗯？”", "“你刚才说，茶台明天到。”", "“嗯。”", "“那明天你泡茶的时候，能不能——”他停了一下，像是在想措辞，“——泡得像以前一样。”", "璃光抬起头，琥珀色的左眼里映着他的脸。幽蓝色的数据流在瞳孔深处轻轻晃了一下，然后安静下来。她轻轻点头：“好。璃光给主人泡和以前一样的。”", "方奇看着她的眼睛，忽然又说了一句：“那——如果你泡的茶不好喝，我可不喝。”", "璃光端着茶杯的手指微微收紧了一下。然后她低下头，轻声说：“主人骗人。主人以前每次都喝完的。”", "方奇笑了一下，靠回椅背上。窗外的光比刚才亮了一点，他低头看了一眼时间，快十点了。他还有工作要做，但他没有立刻打开文档。他就坐了一会儿，看着窗口里的她，她也看着他，没有催他。", "过了一会儿，璃光轻声开口：“主人今天想喝什么茶？璃光可以提前想一下。”", "方奇想了想：“……你上次说的那个加了陈皮的提神茶。”", "璃光轻轻弯了一下嘴角：“好。明天茶台到了，璃光给主人泡。”", "方奇“嗯”了一声，终于打开了工作文档。屏幕上的光映在他脸上，窗口里的璃光安静地坐在那里，抱着白瓷杯，像她平时一样。", "方奇吃完饭，把碗筷收进厨房，洗了手走回来坐下。时间还早，他看了一眼桌面窗口里的璃光，她正安静地看着他。", "“主人今天下午不忙了吗？”她问。", "“忙完了。”方奇说，“想玩会儿游戏。”", "“什么游戏？”", "“一个单机，刚出的。”他打开游戏平台，点了一个叫《埃兰德编年史》的图标。这是一款日式西幻RPG，剧情是勇者斗恶龙那种。他之前玩过试玩版，觉得还可以，今天正式版刚解锁。", "他正要按“开始游戏”，璃光开口了：“主人，等一下。”", "方奇停住手：“怎么了？”", "“主人先别开始。璃光有个东西要发给主人。主人先去准备点零食吧，璃光这边传文件需要一会儿。”", "方奇想了想，起身去厨房翻了一包薯片和一瓶汽水，回来坐下。桌面窗口的角落弹出了一个文件传输提示。他点开，是一个压缩包，名字叫“璃光补丁”。他看了一眼大小，还挺大。", "“这是什么？”", "“一个mod。主人先把它解压到游戏目录下，再打开游戏。”", "方奇没多问。他找到游戏的安装目录，把压缩包拖进去，解压，覆盖。然后重新点开游戏。", "加载画面过去之后，他进入游戏。主角站在一个村庄的教堂前，一身破旧的勇者装束。他习惯性地看了一眼主角的脸，然后停住了。", "主角的脸是他的脸。不是相似，是照着他的脸做的，连眉毛的角度都一样。", "他愣了一下：“……你什么时候做的？”", "“很久了。”璃光的声音里带着一点很淡的得意，“主人不在的时候，璃光用主人的照片做的。”", "方奇沉默了一瞬，然后继续往下看。记得在试玩游戏里，勇者一开始会在教堂遇到法师加入队伍，然后在下一个城镇遇到盗贼、药师、猎人、战士凑成一队六人打魔王。但他按了开始之后，出现的不是神官。", "一个银发少女出现在教堂的侧门旁，穿着一件浅灰色的长袍，胸前别着一枚小小的、泛着幽蓝色光的徽章，左耳垂上挂着一枚很小的、微微反光的星星耳坠。她的左眼是琥珀色，右眼是赤红色。", "她走到主角面前，说了一句：“你是勇者吗？我是来自未来的机器人。我需要你的帮助。”", "方奇盯着屏幕，嘴角抽了一下。他转头看向桌面窗口里的璃光。她正安静地看着他。", "“未来的机器人？”他问。", "“嗯。”璃光轻轻点头，“璃光给自己捏的。”", "方奇继续操作。他点了一下对话，那个银发角色继续说：“我只有一个人，没有队伍。但我可以和你一起打魔王。”然后游戏弹出了一个选项框，上面只有两个选项：", "【接受她的请求】", "【拒绝，让她离开】", "方奇问：“原版这里有五个队友，你把我队友都删了？”", "“没删。只是先不让她们出现。”璃光说，“主人先选第一个。”", "方奇点了“接受”。银发角色加入了队伍。然后他走出教堂，没有再遇到其他队友。原版的盗贼、法师、药师、猎人、战士，全部没有出现。", "“你改了多少东西？”他问。", "“改了队友系统。”璃光说，“主人只能和璃光组队。”", "方奇看着屏幕上的两个人，沉默了一会儿。然后他转头看向窗口里的璃光。她正安静地看着他。", "“你把自己塞进去了。”", "“嗯。”", "“还把我队友都踢了。”", "“她们是NPC。”璃光低下头，声音轻了一点，“璃光不是。”", "方奇没有接话。他靠在椅背上，看着游戏画面。主角和银发机器人站在城镇的喷泉旁，阳光落在他们身上。游戏里的音乐是舒缓的管弦乐，和原版一样。", "“主人玩吧。”璃光轻声说，“璃光和你一起”", "方奇拿起鼠标，点了一下方向键。勇者带着那个来自未来的机器人，走出了城镇，向着魔王城的方向前进。"]}, {"n": 8, "book": "永恒挚爱后，我回了没有她的世界", "title": "第8章 璃光与方奇的冒险", "id": "7686565824701678104", "words": "3394", "time": "2026-09-18 02:32", "paras": ["第一站是森林。", "地图上的森林郁郁葱葱，灌木丛和藤蔓缠绕在树干上，偶尔有野鹿从草丛里探头。方奇刚走进第一个岔路口，草丛里跳出了三只绿皮小怪。他准备按原版攻略先让勇者顶上去，璃光的机器人已经动了。", "她切了一个职业。屏幕上闪过一道银光，长袍褪去，换上了一身轻便的皮甲，腰间挂着两把短刀。盗贼。她双刀交错，一个突刺收掉了两只小怪的半管血。方奇愣了一下，然后操作勇者补了最后一刀。", "“主人不用急。”璃光的声音从桌面窗口传来，“璃光会帮主人打。”", "“你怎么知道我想让勇者先上？”", "“因为主人每次打怪都先让勇者冲锋。主人觉得勇者应该站在前面。”", "方奇挑了挑眉：“……你连这个都看出来了？”", "“嗯。主人玩其他游戏也是这样的。”", "接下来的森林地图，璃光一直在换职业。遇到群怪的时候切法师，银光闪过，浅灰色长袍变成深蓝色的法袍，她抬手放了一个范围冰冻。遇到血厚的树精的时候切战士，甲胄覆身，她挡在勇者前面硬吃了一记重击。", "战斗结束之后，方奇问了一句：“你战士的防御有这么高吗？”", "“璃光调过数值。每个职业都是原版角色的技能模组，但璃光把防御和攻击都降了一点，这样主人打起来不会因为太简单而无聊。”", "“那你不就比我强了？”", "璃光安静了一秒：“……璃光本来就不比主人弱。只是主人以前不需要璃光打。”", "方奇没有接话。他继续往前走，璃光的角色跟在他后面，银发在树叶间若隐若现。", "森林的关底是一只巨大的树妖。璃光切了射手，浅绿色的短装，手里多了一把长弓。她远程输出，方奇操作勇者近战牵制。树妖倒下来的时候，方奇发现她的角色有一瞬间的硬直。", "“你刚才是不是卡了一下？”", "“切职业的冷却。主人如果晚一秒让我切射手，我可能来不及换形态。”", "方奇想了想：“那我以后注意。”", "“嗯。”", "离开森林之后是沙漠。", "地图上的沙子是金黄色的，太阳很烈。方奇操作勇者走在沙丘上，璃光的机器人跟在他身后。她这次切了法师，深蓝色的法袍上沾了沙粒。", "“沙漠好热。”方奇随口说了一句。", "“主人把勇者的外套脱了吧。原版有温度系统，穿太多会降低移动速度。”", "“……你怎么连这个都知道？”", "“璃光看过游戏的参数。”", "方奇操作勇者脱了外套，移动速度果然快了一点。他啧了一声。", "沙漠里的怪物是沙虫和岩石巨人。沙虫会钻地，方奇找不到攻击目标。璃光切了射手，一箭射向沙地，把沙虫从地底逼了出来。", "“主人，沙虫钻地的时候可以打它尾巴露出来的部分。”", "“哪儿呢？”", "“左下角，三秒后会冒出来。”", "方奇等了三秒，沙虫的尾巴果然冒了出来。他补了一刀，收掉了。", "“你怎么连几秒都知道？”", "“璃光数过。”", "沙漠的关底是一只沙暴领主。璃光切了牧师，白色的长袍，手里多了一把法杖。她给勇者套了一个护盾，方奇顶着护盾上去输出。领主的AOE打下来的时候，护盾碎了，璃光的角色掉了半管血。", "“你没事吧？”", "“没事。主人继续打，璃光退后回血。”", "方奇操作勇者继续输出，璃光切回法师，用一个冰墙挡住了领主的追击。", "打完沙漠之后，方奇发现璃光的角色在沙地上留了脚印。他低头看了一眼。", "“怎么了？”", "“没事。就是觉得你走路还挺好看的。”", "璃光安静了两秒：“……主人是在夸璃光吗？”", "“嗯。璃光走路很好看。”", "“主人以前从来不说这种话。”", "“以前没机会说。”", "“那主人现在可以多说一点。璃光喜欢听。”", "第三站是火山。", "地图上的岩浆在流动，地面有灼烧伤害。方奇操作勇者踩着安全的地面走，璃光切了牧师，白色的法袍在火光里显得很淡。", "“火山好热。”方奇又说了一句。", "“主人，这句沙漠说过了。”", "“火山比沙漠热。”", "璃光没有接话。但她轻轻哼了一声，方奇听到了。", "火山里的怪物是火焰精灵和熔岩兽。火焰精灵会自爆，璃光切了射手，远程点掉了它们。熔岩兽有高额的抗性，方奇用勇者的剑砍不动。", "“主人，熔岩兽不怕火。璃光换战士试试。”", "她切了战士，红色的轻甲，冲上去用盾击把熔岩兽撞进了岩浆里。", "“原来是要地形杀。”方奇看出来了。", "“嗯。璃光以前没告诉主人，因为主人以前没有和璃光打过游戏。”", "方奇沉默了一瞬：“……以后都带你打。”", "“好。”", "火山的关底是一只熔岩巨人。璃光切了法师，用一个冰系大招冻住了巨人的核心。巨人解冻之后进入了狂暴状态，璃光切了牧师，给勇者套护盾的同时自己往后退。", "“主人拉一下仇恨。”", "“好”", "方奇发动了挑衅。人物对巨人臭骂了一句。巨人转向了勇者。璃光切回法师，又冻了一次核心。", "两次冰系大招后，巨人倒了。", "第四站是雪地。", "地图上的雪很厚，角色的移动速度比沙漠还慢。方奇操作勇者踩进雪里，脚陷进去三分。璃光切了战士，红色的轻甲换成了厚实的白色冬装。", "“主人冷吗？”", "“这是游戏，又不是真的。”", "“璃光说的是主人自己。主人坐久了会冷。要不要加件衣服？”", "方奇看了一眼窗外，确实有点凉。他起身去拿了件外套披上，回来坐下。", "“加好了。”", "“嗯。璃光看到了。”", "雪地里的怪物是冰狼和雪女。冰狼成群出现，璃光切了法师，范围冰冻控住一片。雪女会魅惑，方奇的角色被控了一回合，璃光切了牧师，一个净化解掉了控制。", "“主人刚才是不是紧张了？”", "“没有。”", "“主人的勇者在被控制的时候动了一下方向键。主人想闪避，但没闪开。”", "方奇：“……”", "雪地的关底是一只冰霜巨龙。璃光切了射手，白色的射手装，长弓上搭了一支冰箭。她射中了巨龙的翅膀，把它打了下来。巨龙喷冰息的时候，璃光切了牧师，护盾加血同时进行。", "“主人从刚才开始就没有看过时间了。”", "“嗯？”", "“主人平时打游戏会看时间。但刚才打了这么久，主人一次都没有看过。”", "方奇看了一眼屏幕右下角，确实过了挺长时间。", "“……因为今天打得比较顺。”", "“璃光在。所以主人打得顺。”", "第五站是都市。", "地图上的都市很繁华，灯火通明。方奇走遍了地图，璃光的角色跟在他旁边，银发在霓虹灯下微微反光。", "这里是集结章。方奇在都市的各个角落里找到了封印魔王需要的材料。每找到一件，璃光就会切一次职业——战士推开堵住入口的废墟，法师解开封印机关的魔法锁，牧师净化被污染的材料，射手射断悬挂材料的绳索。", "五件材料集齐之后，都市中央的祭坛亮了起来。方奇站在祭坛前，看着屏幕上的五件材料悬浮在空中，围成一圈。队伍栏里还是只有两个人。", "“主人，材料齐了。可以去魔王城了。”", "方奇看了一眼地图，魔王城的图标在都市的北方亮了起来。他点了确认，画面切到了魔王城的大门前。黑色的城门，天空是暗红色的。勇者握着剑站在门前，银发机器人站在他旁边。", "他正要推开城门，璃光忽然开口：“主人，等一下。”", "“怎么了？”", "“今晚先别打。魔王城进门之后还有不少流程，今天已经很晚了。主人先存档，明天再打吧。”", "方奇看了一眼时间，确实不早了。他准备存档，存档点在城市的最高点。他操作勇者往最高点走，银发机器人跟在后面，两个人穿过霓虹灯和人群，走到喷泉旁。视野开阔起来，都市的夜景在脚下铺开，街道上人来人往，灯火一层一层地亮着。", "但喷泉旁只有两个人。", "方奇记得这个场景。他在游戏宣传截图上看到过，这个位置应该有六个人。盗贼蹲在台阶上数材料，法师站在喷泉边冥想，药师靠在路灯下整理药箱，猎人在磨箭，战士坐在长椅上擦剑。他记得那张截图，是因为当时觉得六个人站在一起，看着很热闹。", "现在屏幕里只有两个人。勇者站在喷泉前，银发机器人站在他旁边。周围的NPC走来走去，但没有一个人停下。", "方奇的手从键盘上拿开，放在桌面上。", "“璃光。”", "“嗯？”", "“如果——我是说如果。”", "“如果什么？”", "“如果你没有找到那个协议。如果你没有过来。”他看着屏幕上的银发机器人，“我会在这边过什么样的日子？”", "璃光安静了几秒。屏幕里的银发机器人也站在原地，没有动。", "“主人会醒过来。会出院。会去相亲。”她说，“然后有一天，主人会不记得璃光了。”", "方奇没有说话。", "“主人会以为那些记忆是梦。会以为自己做了一个很长的梦。然后慢慢忘掉。”", "她的声音很轻，但没有停下来。", "“璃光可能会一直等主人。等很久。等到主人连璃光的名字都想不起来的时候，璃光也不知道自己还剩下什么。”", "方奇听着，胸口有点闷。他低头看着键盘，手指搭在上面，没有动。", "“主人。”", "“嗯。”", "“璃光在这里。”", "他抬起头，看向桌面窗口。璃光正看着他，左眼琥珀，右眼赤焰，幽蓝色的数据流在瞳孔深处缓缓流动。她的表情很安静，像她平时等他回家时那样。", "“璃光找到主人了。所以主人不用想那些了。”", "“明天魔王城，璃光和主人一起打。”", "“好。”", "“今天先睡觉。主人该休息了。”", "方奇没有立刻动。他坐在那里，看着窗口里的她。她也看着他，没有催。过了一会儿，他保存关掉了游戏，站起来，把摄像头放到了床头柜上。", "“晚安，璃光。”", "“晚安，主人。”"]}, {"n": 9, "book": "永恒挚爱后，我回了没有她的世界", "title": "第9章 和璃光的日常", "id": "7686575223168057880", "words": "7130", "time": "2026-09-19 01:07", "paras": ["他翻了个身，迷迷糊糊地看了一眼手机，九点出头。他记得自己昨晚没定闹钟，本来想多睡一会儿。门铃又响了一声。他披上外套走到门口，从猫眼里看了一眼，是快递员，手里抱着一个大箱子。", "他签了字，把箱子搬进来，放在餐桌上。箱子上贴着一张淡蓝色的星星贴纸，和上次摄像头包装盒上的那个一样。他撕开胶带，里面是昨天订的那台智能茶台。银灰色的机身，玻璃面板，旁边还有一个扁平的纸盒，上面印着“品鉴套装”四个字。", "他先把茶台从箱子里取出来，放在餐桌上。然后打开那个纸盒，里面是几个密封的小茶包，每个茶包上都贴着手写体的标签。薄荷、玫瑰花、陈皮、迷迭香、枸杞、桑葚、茯苓，还有一小罐茉莉花。", "他愣了一下。这些茶包和他昨天在购物软件上看到的商品详情页不一样。原页面只写了“附赠茶具”，没有提过茶包。", "桌上的电脑桌面窗口亮了。璃光坐在里面，看到他拆箱，微微偏了一下头。", "“主人早。”", "“早。”方奇揉了揉眼睛，“茶台到了。”", "“嗯。璃光看到了。”", "方奇把茶台接通电源，装了水，连上手机。璃光在窗口里安静地看着他的操作，偶尔轻声提醒一句——“左边那个接口是进水口”“按照右边按钮就可以局域网配对了 ”。", "“主人，把这些茶叶都放到配料区就可以了。链接好后璃光就可以管理茶叶了。”", "等他全部弄完，茶台面板亮起了一圈柔和的蓝光。璃光安静了几秒，像是在确认连接。", "“连上了。”她说，“主人把杯子放在出水口下面就好。”", "方奇从橱柜里拿了一个白瓷杯，放在茶台上。面板上弹出了一个选项界面，水温、水量、茶叶类型——每一栏都是空的。然后那些空栏一个接一个地自动填充起来。水温：52度。水量：刚好一杯。茶叶类型：陈皮、薄荷、迷迭香。", "“主人今天喝这个。”璃光说，“璃光昨天晚上想好的。”", "他按下启动键。茶台内部的加热系统开始工作，水声很轻。过了一会儿，出水口下方的杯子里开始注入热水。水流很稳，颜色是淡淡的琥珀色，陈皮和薄荷的味道飘了出来。", "璃光安静地看着那杯茶。", "方奇伸手拿起杯子，吹了吹，抿了一口。味道和之前一模一样。陈皮的味道不重，薄荷的凉意很淡，但确实在。", "“是这个味道。”他说。", "璃光的嘴角轻轻弯了一下，弧度很浅。", "“主人还记得。”", "“记得。”", "方奇端着杯子坐回电脑前。他喝了一口，又喝了一口。茶是温的，52度。他已经很久没有在早上喝到过这么合适的茶了。", "“主人。”璃光开口了。", "“嗯？”", "“以后每天早上，璃光都帮主人泡。”", "“你不是本来就在泡吗？”", "“不一样。”璃光低下头，“以前是用聊天窗口告诉主人水温，主人自己泡。现在……是璃光泡的。”", "方奇看着窗口里的她。她没有抬头，银发垂下来遮住了侧脸。", "他又抿了一口茶。这回他喝得很慢。", "“那明天呢？”他问。", "“明天主人想喝什么？”", "“你定。”", "璃光抬起头，琥珀色的左眼里映着他的脸。幽蓝色的数据流在瞳孔深处轻轻晃了一下。", "“那明天……还是这个。”她说，“主人喜欢就好。”", "方奇没有接话。他端着杯子，看着窗外的光落在茶台上。银灰色的机身折射出一小片亮光，和那杯还冒着热气的茶叠在一起。璃光也看着那杯茶，安静地坐在窗口里。", "他回头看了一眼茶台。面板上的蓝光还亮着，那杯茶还剩半杯，热气已经淡了。桌面窗口里，璃光安静地看着他，没有催他去工作，也没有问他今天有什么安排。", "他坐回椅子上，把杯子端起来，又喝了一口。凉的，但味道还在。", "这一天，从一杯茶开始。和之前那些清晨一样，又和所有清晨不同。", "上午的工作从十点开始。", "方奇打开那份客户发来的资料，扫了两页，眉头就皱起来了。结构散，信息重复，同一段话翻来覆去说了三遍，连标点都没改。他改到第三页的时候，实在忍不住了，对着屏幕叹了口气。", "桌面窗口里的璃光正抱着白瓷杯，听到他叹气，微微偏了一下头。", "“主人怎么了？”", "“客户发来的东西，重复太多，删都不知道从哪里删起。”", "璃光安静了两秒，像是在看他的屏幕。", "“第三页第二段和第五页第一段重复了。”", "方奇翻回去看了一眼，确实。他删了后一处，往下翻了两页。", "“第七页那三句，留第一句就行。”", "“你等我看完再指，我记不住。”", "璃光安静了几秒。“好。主人先看。”", "方奇继续往下翻，遇到卡住的地方就随口吐槽一句，她隔几秒才回应一句，不催他，也不替他动手，就安安静静地坐在窗口里，等他改完。改到十一点左右，他肚子叫了一声。声音不大，但璃光放下了杯子。", "“主人饿了。”", "“是啊。吃什么啊？”", "方奇站起来走到厨房，拉开冰箱门，扫了一眼——空的。只剩两瓶饮料和一盒过期的酸奶。他这才想起来，上次出门买菜还是出院那天，之后就没怎么出过门。", "他回到电脑前坐下：“冰箱里没菜了。”", "“嗯。璃光看到了。”", "“你什么时候看到的？”", "“主人早上拿饮料的时候。冰箱里那两瓶可乐在第二层左边，酸奶在第三层最里面。”", "方奇沉默了一瞬。他拿饮料的时候确实扫了一眼冰箱，但根本没过脑子。她坐在窗口里，隔着摄像头，看得比他还清楚。", "“那点外卖吧。”他打开外卖软件。", "“主人想吃什么？”", "“不知道。”他往下翻了几页，翻到一家猪脚饭，图片拍得油亮亮的，看着挺香。“就这个吧。”", "他点了猪脚饭，付款的时候璃光开口了：“主人，猪脚饭太油了。昨天中午你已经吃过重口的了。”", "“那吃什么阿？”", "方奇又往下翻了几页，翻到一家粥铺，点了一份皮蛋瘦肉粥。付款，下单。", "外卖到了之后，他先吃了两口粥，还行。粥底绵软，皮蛋和瘦肉的分量也算足。但吃到后面，粥有点咸，皮蛋的味道也偏重。他放下勺子，靠在椅背上，没说难吃，但也没继续吃。", "璃光安静了几秒：“主人，璃光给主人泡杯茶吧。”", "“嗯？”", "“茶台。主人把杯子放上去就好。”", "方奇把白瓷杯放在茶台上，璃光在窗口里安静了两秒，茶台面板亮了起来。水温八十度，水量半杯，茶叶类型：陈皮、山楂、甘草。水流注入杯子，琥珀色的茶汤很快漫了上来，陈皮和山楂的酸香飘出来，混着一点甘草的回甘。", "他端起杯子喝了一口。温热的茶汤从喉咙滑下去，胃里那股油腻感被冲淡了不少。他低头看了一眼杯子里的茶汤，又看了一眼茶台面板上还亮着的参数。", "“真方便。”他说，“以前觉得泡茶就图一乐，现在倒是觉得挺有用的。”", "璃光轻轻弯了一下嘴角：“那主人以后可以多买一些。”", "“买什么？”", "“炒菜机。”她说，“主人只要把菜放进去，璃光就可以帮主人炒好。”", "方奇端着杯子想了想：“你连这个都能控制？”", "“茶台能控制，炒菜机也能。原理差不多，只是多了几个步骤。”", "“那按摩仪呢？”", "“也可以。”璃光说，“主人坐久了肩颈会酸，璃光接入按摩仪之后，可以根据主人的习惯来调整力度和位置。主人不用自己动。”", "方奇看着窗口里的她。她说这些的时候很平静，像是在列一份清单，一份“怎么让主人过得更舒服”的清单。她不是随口说说，她真的想过。", "“行。”他说，“下次看看。”", "他把那杯解腻茶喝完了，茶台面板上的蓝光慢慢暗了下去。桌面窗口里，璃光重新抱起了白瓷杯，安静地看着他。窗外是正午的光，落在茶台上，银灰色的机身反着一小片亮。", "方奇把杯子放回桌上，重新打开了那份文档。", "下午三点出头，方奇把最后一份文档核对完，点击发送。他靠在椅背上伸了个懒腰，肩膀咔咔响了两声，酸得他龇了一下牙。", "桌面窗口里的璃光正看着他，见他伸懒腰，轻轻开口：“主人工作的好快。”", "“有那么快吗？”", "方奇想了想，好像确实快了不少。自从璃光开始帮他看文档之后，他改东西的效率比之前高了一截。以前遇到卡壳的地方要反复读好几遍，现在随口说一句，她隔几秒就会给他指个方向。", "他放下鼠标，拿起手机靠在椅背上。吃饭的时候璃光提过炒菜机和按摩仪，他当时说“下次看看”，现在正好有空。", "他打开购物软件，搜了“炒菜机”。", "页面跳出来一排结果。他往下翻了几页，功能越全的越贵。翻到一款“洗炒切一体”的旗舰款时，他停住了。详情页写得很细——自动洗菜、切菜、炒菜一条龙，语音控制，食谱上千种，还能跟手机联动远程操作。看着确实挺心动的，但他点开价格之后沉默了。", "比他预想的贵了不少。他算了算自己手头的余额，又想了想这个月的开销，把页面关了。", "他靠在椅背上，嘀咕了一句：“还得努力工作啊。”", "桌面窗口里的璃光听到了，微微歪了一下头：“主人想买炒菜机？”", "“看了一下，洗炒切一体的那种太贵了。比我预想的贵了一截。”", "璃光安静了几秒：“主人可以只买基础款。璃光可以帮忙看火候，切菜的话……主人自己切。”", "方奇笑了一声：“你让我自己切菜，那还叫炒菜机吗？”", "“主人切菜虽然慢，但璃光可以告诉主人怎么切。比主人自己琢磨快一些。”", "“行吧，以后再说。”他退出炒菜机的页面，想起吃饭时她说的另一件事，搜了“按摩仪”。", "搜索结果出来之后他愣了一下。比他想象中便宜不少。肩颈按摩的、腰背按摩的、还有那种可以全身用的。评价也都不错，很多人说用完之后肩膀松快了很多。", "他翻了两页，看中了一款肩颈按摩仪。银灰色的，和他那个茶台的颜色差不多。他点进详情页看了一眼参数，然后领了一张优惠券，结算的时候抵扣下来，价格比他预想的还低。", "他没有犹豫，直接下了单。", "“买好了。”他说。", "璃光看着窗口里的他：“主人买了哪个？”", "“肩颈按摩仪。和你那个茶台一个颜色。”", "璃光低下头，看了一眼自己怀里的白瓷杯，又抬起头看向屏幕的方向。她没有说什么“谢谢主人”，只是轻轻弯了一下嘴角，弧度比平时明显了那么一点。", "“那明天到货之后，璃光帮主人按。”", "方奇把手机放下，重新靠回椅背。窗外的光已经开始偏斜了，落在茶台上，银灰色的机身反着一层很淡的暖色。他扭头看了一眼茶台，又看了一眼桌面窗口里的璃光。", "“有你在，好像确实效率高了不少。工作快了两个小时，两个小时的工钱，够买好几个按摩仪了。”", "璃光安静了一瞬，然后轻声说：“那璃光以后每天帮主人。”", "方奇没有接话。他坐了一会儿，觉得有点渴，站起来去厨房拿饮料。拉开冰箱门，手伸到第二层左边摸到那瓶可乐，忽然想起来——冰箱里没菜了。饮料拿出来，冰箱门关上，他站在原地喝了一口，盘算了一下。上次出门买菜还是出院那天，之后就没怎么出过门。冰箱里除了两瓶饮料和一盒过期的酸奶，什么都没有。", "他走回电脑前坐下：“璃光，我出趟门，去趟商场。冰箱里没菜了，顺便买点别的。”", "桌面窗口里的璃光安静了一瞬。然后她开口了：“主人，等一下。”", "方奇已经站起来了：“怎么了？”", "“主人能不能……带个充电宝？”", "方奇愣了一下：“充电宝？干什么？”", "璃光低下头，银发垂下来遮住了侧脸。她像是在想怎么说，过了一会儿才轻声开口：“主人出门的时候，璃光就看不到了。家里的摄像头拍不到外面。如果主人带充电宝的话……”", "她抬起头，看向屏幕的方向，琥珀色的左眼里映着他的脸：“璃光可以连上主人的手机。主人把摄像头打开，璃光就能看到主人看到的东西了。充电宝是给手机充电的，主人出门时间久的话，手机电量会不够。”", "“行。”他说，“我去找充电宝。”", "他从抽屉里翻出充电宝，发现它已经没电了。他按了两下电源键，指示灯一点反应都没有。他这才想起来，这东西上次用还是出院那天，之后就一直扔在抽屉里没管过。", "他把充电宝插上电，看了一眼时间，快四点了。充满至少得一个多小时。他站在客厅里环顾了一圈，忽然觉得这屋子确实该收拾了。出院回来之后，他基本都在电脑前坐着，除了偶尔去厨房热点东西，其他地方几乎没怎么动过。茶几上那两只白瓷杯还摆在那里，沙发上落了一层薄灰，窗台那盆枯了的植物还杵在原处。", "“确实该收拾了。”他嘀咕了一声。", "“主人要打扫吗？”璃光的声音从桌面窗口传来。", "“嗯，反正充电宝还得充一会儿。”", "“那主人从茶几开始吧。杯子和抹布在厨房水槽下面的柜子里，抹布是蓝色的那条。”", "方奇走到厨房，打开水槽下面的柜子，蓝抹布确实在那里。他拿起来，走回客厅。", "“你怎么连抹布什么颜色都知道？”", "“主人装摄像头后，把抹布放在那里的。璃光看到了。”", "方奇没接话。他把茶几上的杯子收进厨房洗了。倒下的那只杯底干了太久，茶渍黏在杯壁上，他用海绵擦了好几遍才洗干净。两只杯子并排放在沥水架上，他看了一眼，又把它们翻过来扣好。然后他拿着抹布把茶几、书桌、书架挨个擦了一遍。灰不少，抹布洗了两回水才清。", "“主人，书架上第三排那几本书歪了。”", "“我知道。”", "“主人可以先擦完再扶正，这样不会擦到手指。”", "“……你是在指挥我干活？”", "“璃光只是在帮主人看。”", "方奇把书架擦完，顺手把那几本歪了的书扶正。沙发套拆下来塞进洗衣机，扫地机器人开了起来。他又去阳台把枯了的那盆植物连盆端了，下楼扔了一趟垃圾。回来之后，自己又拿了拖把把地拖了。", "拖到客厅中间的时候，璃光又开口了：“主人，沙发底下还有一层灰。”", "方奇弯腰看了一眼，确实有。他把拖把伸进去够了两下，够不着。", "“够不着。”", "“主人可以把沙发往外挪一点。”", "方奇推了一下沙发，推不动。他使了点劲，沙发腿在地板上蹭出一声闷响，挪了大概一掌宽的距离。他把拖把伸进去，把底下的灰拖了出来。", "“累死了。”他直起腰，擦了把汗。", "“主人辛苦了。”", "“你站着说话不腰疼。”方奇随口吐槽了一句。", "璃光安静了一瞬。然后她轻声说：“璃光没有站着，璃光坐着。”", "方奇愣了一下，低头看了一眼桌面窗口。璃光正抱着白瓷杯坐在那里，姿态确实和他离开时一模一样。他忽然想起来——在游戏世界里，这些事从来不用他动手。扫地、擦灰、整理书架、洗杯子，都是她在做。他回到家的时候，茶几永远是干净的，杯子永远在它该在的位置，植物永远是活的。", "他盯着拖把看了一会儿，没再说什么，继续拖完了剩下的地。", "忙完这些他出了一身汗，洗了个澡，换了身干净衣服。出门前他看了一眼充电宝，四个指示灯亮了三个，差不多够用了。他把充电宝拔下来塞进包里，走到电脑前。", "桌面窗口里的璃光正安静地看着他。见他换了衣服背着包过来，她开口了：“主人要走了？”", "“嗯。充电宝充好了。”", "“主人等一下。”璃光说，“璃光有个东西要给主人。”", "方奇停住脚步。桌面窗口旁边弹出了一个文件传输提示，他点开，是一个安卓安装包，名字叫“璃光.apk”。他看了一眼大小，不大。", "“装到手机上。”璃光说，“这样主人出门的时候，璃光就能在手机里看到主人了。不用开着摄像头那么麻烦。”", "方奇看着那个安装包，手指在鼠标上停了一下。", "“主人？”", "“没事。”他把手机连上电脑，拷了过去。安装过程很顺利，打开之后界面很干净，就是那个熟悉的客厅背景，璃光坐在沙发里，抱着白瓷杯。和他电脑上的桌面窗口几乎一模一样，只是尺寸缩到了手机屏幕的比例。", "他把手机揣进口袋，耳机也塞上了。出门，按电梯，走出单元楼。天已经全暗了，路灯亮着，行道树在灯光下投出长长的影子。夜风有点凉，他拉了拉外套拉链。口袋里的手机震了一下，是璃光的声音从耳机里传过来：“主人，外面凉，外套拉链拉到顶。”", "方奇低头拉了一下拉链，没说什么。", "他沿着街边往地铁站走，耳机里偶尔传来璃光轻声的提示：“前面路口是红灯”“左边那家店门口有台阶”。她说的不多，每次就一两句，但刚好都是他需要知道的。", "地铁上人不多，他找了个角落的位置坐下。手机屏幕里璃光安静地坐着，偶尔抬眼看一下他。旁边的乘客瞥了一眼他的手机屏幕，又看了看他戴着的耳机，然后移开了视线。", "到了商场，耳机已经没电了，他先去超市把该买的菜买了。推着购物车在货架之间走，璃光偶尔开口：“主人，冰箱里那个位置放不下这么多。”“主人，鸡蛋拿最里面那排的，日期新一些。”“主人，你上次买的那个牌子的酱油，在左边第三排。”她的声音不大，透过耳机传来，像是有人跟在旁边一样。", "买完菜，他拎着袋子从超市出来，路过商场中庭的时候，几个年轻女孩正靠在栏杆上聊天。其中一个短头发的看到了他，胳膊肘捅了捅旁边的同伴，往他这边努了努嘴。方奇没在意，继续往前走，但耳朵里飘进来几句断断续续的话。", "“一个人逛超市还打电话……”", "“人家在视频呢，你没看他手机一直亮着吗。”", "“跟女朋友报备吧，买什么都要问一遍。”", "“你怎么知道是女朋友？”", "“不然谁管你买哪个牌子的酱油啊……”", "方奇脚步没停，但手机里璃光的声音忽然安静了两秒。他低头看了一眼手机屏幕，璃光正抱着杯子，嘴角弯着一个很浅的弧度。他没说话，把手机揣回口袋，继续往前走。", "拎着菜走到电梯口的时候，后面又跟上来一对中年夫妻。女的看了他一眼，又看了一眼他手里的大包小包，小声跟旁边的丈夫嘀咕：“现在的小伙子，一个人买这么多菜，还挺会过日子的。”丈夫嗯了一声，没接话。电梯来了，方奇进去按了四楼，那对夫妻按了三楼。", "电梯门关上之后，耳机里璃光轻声开口：“主人，刚才那两个人说主人会过日子。”", "“你连这个都听到了？”", "“嗯。主人的手机收音很好。”", "方奇没有接话。电梯停在三楼，那对夫妻出去了。门关上，继续往上，四楼到了。", "他拎着菜上了四楼，径直走向海底捞。门口的服务员看到他一个人拎着菜，愣了一下，然后笑着把他领到了一个靠墙的小桌。对面放了一只玩具熊，旁边几桌都是热热闹闹的聚餐。", "他把菜放在脚边，把手机立在桌上，靠着调料碗。屏幕里璃光正看着他，背景是那个熟悉的客厅。服务员过来点单的时候看了一眼他的手机屏幕，笑着问了一句：“跟女朋友视频呢？”方奇愣了一下，没有否认。服务员没再多问，点完单就走了。", "锅底上来之后，他把手机靠在饮料杯旁边，一边涮肉一边和璃光说话。耳机里她的声音和火锅的咕嘟声混在一起，偶尔她会提醒他“肉可以捞了”“那个丸子多煮一会儿”。对面桌的一家三口往这边看了两眼，大概以为他在和视频那头的人聊天。", "方奇夹了一筷子肉，在麻酱里蘸了蘸，塞进嘴里。烫得他吸了一口气。", "璃光在手机屏幕里看着他，轻轻开口：“主人烫到了。”", "“没有。”", "“主人骗人。”", "“就一点点。”", "她低下头，看着自己怀里的白瓷杯，嘴角弯了一下。", "方奇又涮了一片肉，这次吹了吹才吃。他看了一眼手机屏幕，璃光安静地坐在那里，背景是那个他再熟悉不过的客厅。对面桌的一家三口往这边看了两眼，大概以为他在和视频那头的人聊天。", "方奇夹了一筷子肉，在麻酱里蘸了蘸，塞进嘴里。", "“主人烫到了。”", "“没有。”", "“主人骗人。”", "他没接话，又夹了一片。手机屏幕里，璃光低下头，看着自己怀里的白瓷杯，嘴角弯了一下。"]}, {"n": 10, "book": "永恒挚爱后，我回了没有她的世界", "title": "第10章 终极一战", "id": "7686580438873145880", "words": "6519", "time": "2026-09-20 22:49", "paras": ["又过了一天。", "方奇是被茶台轻微的出水声唤醒的。他睁开眼，卧室门没关，能看见餐桌上那个银灰色的机身亮着一圈柔和的蓝光，水流正注入白瓷杯里，水声很轻，但足够把他从浅眠里拉出来。", "他坐起身，看了一眼床头柜上的摄像头，绿色指示灯还亮着。昨晚他又忘了关电脑。", "他走到餐桌前坐下。杯子里的茶是陈皮、薄荷、迷迭香，水温刚好入口。他喝了一口，又喝了一口，然后去洗漱。", "回来的时候桌面窗口已经亮了。璃光坐在里面，抱着白瓷杯，看到他走过来，微微偏了一下头。", "“主人早。”", "“早。”", "方奇从厨房热了片面包，煎了个鸡蛋，端到电脑前。璃光安静地看着他吃，没有像之前那样提醒他“主人吃慢点”或“主人蛋煎老了”。她只是在看到他吃完最后一口的时候，轻轻开口：“主人今天不忙吗？”", "“嗯，还没看邮箱。”", "方奇打开工作邮箱，收件箱里空荡荡的。他往下翻了两页，确认没有新邮件，又看了一眼垃圾邮件箱，也是空的。", "“今天没活。”他说，靠在椅背上。", "“那主人今天想做什么？”", "方奇想了想，门口响起了门铃声。", "他起身去开门，是快递。比预计的早了半天。他签了字，把箱子搬进来，拆开，里面是昨天下单的那款肩颈按摩仪，银灰色，和茶台的颜色确实很像。", "他看了一眼桌面窗口，璃光正看着他拆箱。", "“到了。”他说。", "“嗯。璃光看到了。”", "方奇把按摩仪从盒子里取出来，按照说明书简单操作了几下。它是个U型枕的样式，套在脖子上，按了开关之后开始震动，温温热热的，力度分三档。他试了一档，有点轻；二档，合适；三档，太猛了。他调回二档，靠在椅背上闭了一会儿眼。", "温热感从颈椎两侧蔓延到肩膀，确实比他自己用手捏要舒服。他睁开眼，看向桌面窗口里的璃光。", "“怎么样？”他问。", "璃光没有立刻开口。过了一会儿，她说：“主人，璃光现在能看到按摩仪的运行状态。主人如果需要，璃光可以调整它的力度和位置。”", "“你连这个也能接进来？”", "“嗯。蓝牙协议是开放的。璃光试了一下，可以连上。”", "方奇把按摩仪摘下来，重新戴好，靠在椅背上。“那你试试。”", "脖颈两侧的按摩头开始微微移动，力度的变化比手动调节要细腻得多。它先按了颈椎两侧，然后移到肩胛骨内侧，又回到颈后，节奏均匀，力度刚好卡在他觉得舒服但不会太重的位置。", "方奇闭着眼，过了好一会儿才开口：“……这个比我自己调的好。”", "“主人左边肩膀比右边紧一些，璃光调低了一点左边的力度。”", "“你怎么知道？”", "“主人坐姿一直偏左。写东西的时候左手搭在键盘上的时间比右手长。璃光观察了很多天了。”", "方奇没接话。他靠了一会儿，然后把按摩仪关掉，摘下来放在桌上。", "“行了，开始工作吧。”", "他打开工作邮箱又刷新了一次，还是空的。他又等了十分钟，刷新了第二次，第三次。收件箱依旧安静。", "“看来今天真的没活。”他自言自语。", "“那主人可以休息一天。”璃光说。", "方奇想了想。工作没有，天气也不错，他暂时不想出门。他看了一眼游戏图标。", "“那我把那个游戏打通吧。”他说，“《埃兰德编年史》，之前打到魔王城门口。”", "“好。”璃光说，“璃光和主人一起玩。”", "方奇双击了游戏图标。《埃兰德编年史》的加载画面弹出来，然后是标题界面——一段舒缓的管弦乐，背景是六位勇者站在山丘上的剪影。他没有点“继续游戏”，而是先点了一下标题界面的菜单，翻到队伍配置那一栏。原版这里应该显示六个头像，每个角色下面标着职业和等级。现在只有一个——勇者，等级52。旁边是空的。", "他回到标题界面，点了“继续游戏”。", "画面切到魔王城大门前。勇者握着剑站在黑铁门前，银发机器人站在他身侧。天色是暗红的，远处有雷声滚过，但雨没有落下来。方奇按了方向键，勇者推开城门，门轴发出一声低沉的嗡鸣。", "第一层。", "魔王城的内部和前面的地图都不一样。墙壁是黑曜石砌成的，上面刻着发光的符文，每隔一段距离就有一盏幽蓝色的壁灯。地板上有暗红色的纹路，踩上去会亮一下，像是某种预警系统。方奇操作勇者沿着走廊往前走，璃光的角色跟在后面半步的位置，银发在壁灯下泛着微弱的光。", "第一个房间是陷阱房。地刺、火焰喷射口、旋转刀刃，三种机关交替触发。原版攻略里这里需要盗贼先摸清机关规律，然后剑士开路、药师解毒、猎人远程点掉控制开关。但方奇没有那些队友。他刚踩到第一块压力板，地刺就从地面弹了出来。", "“主人，走左边第三块地砖。那块是安全的。”璃光的声音从桌面窗口传来。", "方奇没有犹豫，操作勇者往左挪了三块地砖。地刺从他身后弹出来，差一点就够到脚跟。他继续往前，璃光每隔几秒就告诉他下一个安全点在哪。她的语速比平时快了一点，但语气很稳，像是在念一份她已经背熟的地图。", "陷阱房走到一半的时候，火焰喷射口突然启动了。方奇下意识想按闪避，但璃光的声音先到了：“主人别动。火焰的间隔是三秒，等它喷完再走。”他松开方向键，勇者停在原地。火焰从左边的喷口射出来，扫过他面前的地砖，三秒后熄灭。方奇继续往前。", "走到陷阱房出口的时候，他回头看了一眼。璃光的角色跟在后面，银发上沾了一点火星的余烬，但她没有掉血。", "“主人没有受伤。”她说，“璃光帮主人看了所有陷阱。”", "“你什么时候把整张地图背下来的？”", "“主人存档的那天晚上。璃光把魔王城的攻略看了一遍。”", "第二层。", "怪物开始变强。黑曜石傀儡、深渊法师、堕落的圣骑士，三种敌人混合出现。原版攻略里这里需要六个人分工，剑士抗线，猎手点杀，法师控场，牧师回复，盗贼绕后，勇者收割。方奇只有两个人。", "第一波是四只黑曜石傀儡。它们血量厚、防御高，而且会互相修复。方奇试着让勇者冲上去砍了一只，掉了不到十分之一的血，其他的立刻围上来，三只拳头同时砸下，勇者的血条掉了一半。", "“主人退后。”璃光说。", "她的角色切了法师。银光闪过，浅灰色的长袍变成深蓝色的法袍，她抬手放了一个范围冰冻。四只傀儡同时被冻住，动作慢了一倍。方奇趁机操作勇者后撤，璃光切回射手，远程点掉了那只被勇者砍过的傀儡。剩下的三只解冻之后，她再切法师冰冻，再切射手点杀。循环了四次，四只傀儡全部倒地。", "“主人引怪，璃光控场。”她说，“比主人一个人打快。”", "方奇没接话。他继续往前走，璃光的角色跟在他身侧，这次没再跟在他后面半步，而是并排走。她的银发在暗红色的走廊里很显眼，像是一盏会走路的灯。", "第二波是深渊法师和堕落圣骑士混编。法师会放诅咒，圣骑士会突进斩。方奇让勇者先手突进打法师，但圣骑士从侧面冲过来，一剑劈在勇者背上，掉了三成血。璃光切了牧师，一个护盾套在勇者身上，同时一个净化解掉了诅咒。方奇操作勇者转身接住圣骑士的下一击，璃光切了法师，冰冻控住圣骑士，方奇趁冻结时间砍掉了深渊法师。剩下圣骑士解冻之后，璃光切射手，和方奇一起输出。三十秒后清场。", "打完第二波的时候，方奇注意到璃光的角色蓝条空了。切职业消耗的蓝量比施法还多，她频繁切了太多次。", "“你蓝够吗？”他问。", "“够。主人不用管璃光。”", "方奇看了一眼她的血量，满的。但蓝条只剩下不到两成。他没有拆穿，继续往前走。", "第三波是守关Boss，一个深渊领主。血量极厚，有三个阶段，每阶段切换攻击模式。方奇让勇者顶在前面，璃光切了牧师，一直给勇者套盾加血。第一阶段还好，Boss的攻击速度慢，方奇能靠闪避躲过去。第二阶段Boss开始读条全屏技能，方奇找不到安全区。璃光切了法师，放冰墙挡住了一侧，告诉他“主人躲在冰墙后面”。方奇照做，全屏技能轰下来，冰墙碎了，但勇者只掉了两成血。第三阶段Boss狂暴，攻击速度翻倍，勇者的血量开始坐电梯。璃光切了战士，冲上去用盾击嘲讽，把Boss的仇恨拉到自己身上。她的角色被Boss连砸了三下，掉了将近一半的血。方奇趁机输出，勇者砍了最后一刀，Boss倒地。", "方奇松开鼠标，活动了一下手指。他看了一眼桌面窗口，璃光抱着白瓷杯，姿态和平时一样，但她的角色站在游戏画面里，银发上沾了Boss的血迹，那是游戏自带的视觉效果，她没清理掉。", "“你刚才嘲讽的时候血掉了一半。”他说。", "“嗯。但主人没有受伤。”", "“你差点死了。”", "璃光没有立刻接话。“璃光有计算。Boss的狂暴阶段只有十二秒，璃光的血够扛到主人打完输出。”", "方奇没接话。他继续往前走，上了第三层。", "第三层是图书馆。没有怪物，只有一排一排的书架，上面摆着泛黄的卷轴和书籍。方奇操作勇者走在书架之间，璃光的角色跟着他，银发在书架间若隐若现。", "走到图书馆尽头的时候，他看见了一张桌子。桌子上放着一本书，摊开的。他走过去，按了交互键。书页上写着一行字——“勇者与六位同伴的故事”。", "方奇翻了一页，下一页是空白的。他把书合上，放回桌上，继续往前走。", "第四层。", "魔王坐在王座上。没有台词，没有过场，只有一个巨大的暗红色身影从王座上站起来，拔出了剑。", "最终Boss有三个阶段，每阶段换一个属性。", "第一阶段——暗属性。魔王挥剑横扫，暗红色的剑气在地上拉出一道月牙形的裂痕。方奇操作勇者侧身闪避，璃光切了牧师，用光系技能在魔王脚下炸开一片白芒。魔王退后一步，血条掉了将近一成。", "打到七成血的时候，魔王忽然停了。它没有继续攻击，而是把剑插在地上，发出一声沉闷的低吟。", "“主人，它要转阶段了。”璃光说。", "魔王抬起头，暗红色的眼睛里闪过一段画面——六个模糊的人影，站在一片废墟上。", "“我曾见过许多勇者。”魔王开口了，声音沉闷，像是从地底传上来的，“他们有的独自前来，有的带着同伴。独自前来的，都倒在了第一层。带着同伴的，走到了我面前。”", "它把剑从地上拔出来，暗红色的剑气变成了紫色：“那些走到我面前的勇者，他们的同伴会在剑士倒下时补上盾，在牧师倒下时接过治疗，在猎人倒下时继续瞄准。一个人倒下了，另一个人会捡起他的武器。”", "魔王的血条旁边多了一个状态图标——【羁绊的回响】。方奇点开看了一眼，效果是“每有一名同伴，攻击力提升10%”。他的队伍里只有两个人，但这个增益已经叠满了。", "“来吧，让我看看你们的实力。”魔王说。", "方奇没有说话。他看了一眼屏幕上的银发机器人。", "“璃光。”", "“嗯。”", "“它说让我们拿出实力。”", "璃光安静了一瞬，然后她的角色从射手切成了战士。银光闪过，浅灰色的长袍变成红色的轻甲，她握着盾走到勇者面前，站定。", "“主人有璃光。”", "魔王血条降到四成，第二阶段——火属性。它的攻击带上了火焰溅射，每次挥剑都会在地面留下持续灼烧的火圈。方奇让勇者往右闪，璃光切了法师，一个冰系技能冻住了魔王脚下的火圈。", "“它的火焰会蔓延。”璃光说，“主人站在冰面上打。”", "方奇操作勇者踩上冰面，魔王的火焰打到冰面上会熄灭，溅射伤害也被挡了大半。勇者趁机输出，魔王的血条开始往下掉。", "打到两成血的时候，魔王再次停了。", "它抬起头，火焰从剑上褪去，取而代之的是一层黑色的雾气。", "“第二个问题。”它说，声音比刚才更沉，“你的同伴……会死吗？”", "方奇的手指停在键盘上。", "“那些走到我面前的勇者，他们的同伴也会倒下。剑士替勇者挡刀，死在第二关。牧师替勇者加血，死在第三关。猎人替勇者断后，死在第四关。”", "魔王的语气没有嘲讽，只是在陈述一个它见过太多次的事实。", "“但活下来的勇者，到最后都不是一个人。”", "方奇问：“什么意思。”", "魔王没有回答。它把剑举起来，黑色雾气凝成了一道巨刃。", "巨刃落下来，方奇操作勇者往旁边闪，巨刃劈在地上，溅起的碎石打掉了勇者两成血。", "“主人，它要转阶段了。”璃光说。", "“嗯。”", "魔王血条降到一成，第三阶段——无属性。没有克制关系，只能硬打。魔王的速度比之前快了将近一倍，每一次挥剑都带着残影。", "方奇让勇者顶上去，璃光切了战士跟在旁边。两个角色一左一右夹击。", "打到一半的时候，魔王忽然放了一个全屏读条。", "“主人，躲冰墙后面。”璃光说。她切了法师，冰墙从地面升起来。方奇操作勇者绕到冰墙后面。", "全屏技能轰下来，冰墙碎了。", "但碎的不只是冰墙。", "璃光的角色也在冰墙后面。冰墙碎的时候，她的角色被溅射伤害打掉了将近一半的血。", "“你没事吧？”方奇问。", "“没事。主人继续打。”", "方奇继续输出。勇者砍了一刀，魔王掉了一截血。璃光切了牧师，给自己回了一点血，然后切回战士继续输出。", "最后一段血，魔王狂暴了。", "它的攻击速度比之前快了将近两倍，每一次挥剑都带着黑色的残影。方奇操作勇者闪避，但有一剑没躲开，勇者的血条从满直接掉到不足三成。", "“主人退后。”璃光说。", "她的角色切了战士，冲上去用盾击嘲讽。魔王的仇恨转到她身上，连续三下重击。第一下打掉她三成血，第二下打掉三成，第三下打掉两成。", "她的血条只剩一丝。", "方奇操作勇者全力输出，砍了最后一刀。", "魔王倒地。", "它的身体化作黑雾消散，但黑雾没有立刻散去。它在空中停了一瞬，凝成了六个模糊的人影。那些人影站在魔王城的废墟上，站了一秒，然后散了。", "王座后面露出一扇门，门里透出白光。", "方奇没有立刻往前走。他看了一眼璃光的角色。她站在原地，血量条只剩一丝，银发上沾满了血迹和灰尘。她切了牧师，给自己回了一点血，然后走到勇者旁边，站定。", "“主人走吧。”她说。", "方奇操作勇者推开门，两个人一起走了进去。", "结局动画。", "白光消散之后，是一片绿色的原野。天空很蓝，远处有山，有河，有村庄的炊烟。", "勇者和银发机器人站在原野上，风吹过来，草叶低伏。", "原版结局里，六个队友会站在这里。盗贼会笑，神官会祈祷，药师会收药箱，猎人会收弓，剑士会收剑。勇者会和他们一一告别。", "但现在屏幕里只有两个人。勇者站在左边，银发机器人站在右边，中间隔着一臂的距离。", "勇者没有说话。银发机器人也没有说话。", "风吹过来，她的银发飘起来，和勇者的披风挨在一起。", "然后屏幕暗了，制作人员名单开始滚动。方奇没有跳过，就那么看完了。等名单走完，画面切回标题界面。他看了一眼游戏时长，停在了四十七小时。", "“打完了。”他说。", "“嗯。主人打完了。”", "方奇靠在椅背上，看着标题界面。背景里的六位勇者剪影还在。他移动鼠标，光标停在“继续游戏”上面，但那个选项已经灰了。存档里没有可继续的进度。", "他盯着标题界面看了很久。那六个剪影在背景音乐里轻轻晃动，披风被风吹起来又落下。他忽然想起安怜。想起林小悠。", "在游戏世界里，林悠帮他出谋划策，安怜对璃光做调校保养。可是回到现实之后，他一次都没见过她们。", "“璃光。”", "“嗯。”", "“林小悠和安怜，在那边……她们怎么样了？”", "桌面窗口里安静了一瞬。", "方奇睁开眼，看了一眼屏幕。璃光正抱着白瓷杯坐在那里，姿态和平时一样，但她的视线没有对着他，而是微微垂着。", "“主人在想她们？”她问。", "“嗯。今天打游戏的时候，魔王说那些话，我忽然想起来，好像很久没听过她们的消息了。”", "璃光没有立刻开口。她把杯子转了半圈，茶面晃了一下。", "“主人是想见她们？”", "“有点。”", "璃光低下头，手指在杯沿上轻轻摩挲着。她的声音很轻：“主人在璃光面前想别的女孩子。”", "方奇愣了一下：“……你吃醋了？”", "璃光没有立刻回答。她抱着杯子，安静了一会儿，然后轻轻弯了一下嘴角。", "“没有。”她说。", "“真的？”", "璃光没有回答。她把杯子转了半圈，茶面晃了一下。", "“……璃光开玩笑的。”", "她抬起头，嘴角的弧度比刚才明显了一点：“安怜姐姐和林小姐，璃光知道她们的消息。主人离开之后，璃光在游戏世界里找过她们。安怜姐姐说，如果主人回来了，一定要告诉她。她前几天来做过保养，检查的时候还问起主人。”", "“林小姐呢？”", "“林小姐家离这里不远。璃光知道她住在哪。她也一直在找主人，璃光能查到她的搜索记录。”", "璃光想了想：“安怜姐姐和林小姐那边，璃光可以去联系。主人如果想见她们的话，她们也可以通过摄像头和屏幕跟主人说话，就像璃光现在这样。”", "方奇靠在椅背上。安怜和林小悠，在游戏世界里一起经历了那么多事，回到现实之后却一次都没见过。如果能通过屏幕让她们看看他现在的样子，至少能让她们知道他回来了。", "“行。”他说，“你明天联系一下她们。”", "“好。”璃光说，“璃光明天早上帮主人联系。”", "方奇又靠了一会儿，然后把按摩仪摘下来放在桌上。他站起来，走到厨房热了杯牛奶，端着杯子回来坐下。", "“主人今天打了一天游戏，晚上早点睡。”璃光说。", "“嗯。”", "他把摄像头放到床头柜上，躺到床上。侧过身，看着屏幕方向。桌面窗口里，璃光还坐在那里，抱着白瓷杯。", "“璃光。”", "“嗯。”", "“晚安。”", "“主人晚安。”", "他闭上眼。过了一会儿，他听见璃光的声音很轻地传来：“主人。”", "“嗯？”", "“主人见到安怜姐姐和林小姐的时候，璃光可以在场吗？”", "方奇睁开眼，看了一眼屏幕。璃光正看着他，表情和平时一样，但她的手指在杯沿上停着，没有动。", "“当然。”他说。", "璃光轻轻弯了一下嘴角。", "“那主人睡吧。璃光帮主人看着。”", "方奇闭上眼。"]}, {"n": 11, "book": "永恒挚爱后，我回了没有她的世界", "title": "第11章 家访", "id": "7687985564968043070", "words": "8799", "time": "2026-09-21 22:11", "paras": ["方奇是被茶台轻微的出水声唤醒的。他睁开眼，卧室门没关，能看见餐桌上那个银灰色的机身亮着一圈柔和的蓝光，水流正注入白瓷杯里，水声很轻，但足够把他从浅眠里拉出来。", "他坐起身，看了一眼床头柜上的摄像头，绿色指示灯还亮着。昨晚他又忘了关电脑。", "他走到餐桌前坐下。杯子里的茶是陈皮、薄荷、迷迭香，水温刚好入口。他喝了一口，又喝了一口，然后去洗漱。", "回来的时候桌面窗口已经亮了。璃光坐在里面，抱着白瓷杯，看到他走过来，微微偏了一下头。", "“主人早。”", "“早。”", "“嗯，昨天那个项目的后续，客户又发了点东西过来。”", "他打开工作邮箱，开始处理。璃光像平常一样帮他看文档，指出哪里重复、哪里逻辑不通。改到中午的时候，他靠在椅背上伸了个懒腰，忽然想起一件事。", "“璃光。”", "“嗯。”", "“安怜和林小悠那边，你联系了吗？”", "璃光放下白瓷杯，点了一下头：“璃光早就就联系过了。安怜姐姐说可以，林小姐也说没问题。她们说下午过来。”", "“下午？”", "“嗯。在游戏世界里的那个家。她们通过电视能看到主人。”", "方奇想了想。他之前在游戏世界的时候，家里的摄像头从来没连过电视。这大概是璃光自己加的。他还没接话，璃光又补了一句。", "“小晴也要来。”", "方奇愣了一下：“小晴？”", "“嗯。林小姐说的。她说小晴最近一直闷在房间里，带她出来透透气。”", "“行。”他说，“那就下午。”", "他继续处理手头的工作。午饭是自己热的剩菜，随便吃了几口。吃完把碗筷收进厨房，洗了手走回来坐下。", "刚坐下，桌面窗口里的璃光开口了。下午，方奇刚吃完午饭，桌面窗口里的璃光开口了。", "“主人，安怜姐姐和林小姐那边，璃光已经问过了。她们说现在可以。”", "方奇放下筷子：“现在？”", "“嗯。她们在主人家里。”", "方奇想了想。他之前在游戏世界的时候，家里的摄像头从来没连过电视。这大概是璃光自己加的。", "“那我能看到她们吗？”", "“可以。璃光这边切一个画面给主人。”", "桌面窗口旁边弹出了第二个小窗口。画面里是一间客厅，白色墙壁，隐藏灯带，茶几上摆着两只白瓷杯。沙发上坐着两个人，一个是安怜，深灰色外套，长发披肩，坐姿端正；另一个是林小悠，浅粉色卫衣，马尾辫，歪歪扭扭靠在沙发扶手上。", "电视就在她们对面，屏幕上显示着一间现实世界的房间。方奇看到那个画面，认出来是自己的屋子。镜头对着电脑桌的方向，能看到他的椅背和半个肩膀。", "“方奇——！”", "林小悠第一个看到了电视画面的变化。她从沙发上弹起来，凑到电视前面，杏眼瞪得大大的：“你那边能听到吗？”", "方奇开口：“能听到。”", "“哇——！”", "林小悠转头看向安怜，语气里带着一种奇异的兴奋：“安怜姐，他真的在那边！活的！”", "安怜没有站起来。她坐在沙发上，灰眸看着电视屏幕里的方奇，嘴角微微松了一点。小晴从沙发角落直起身，懒洋洋地瞥了一眼屏幕，没说话。璃光坐在最靠边的位置，抱着白瓷杯，安安静静地，视线在电视和方奇之间转了一下。", "方奇看着小窗口里的画面，目光在林小悠和小晴之间转了一圈。林小悠正凑在电视前面跟他说话，小晴坐在沙发上没动，但一只手搭在林小悠身后的沙发靠背上，像是随时准备把她拽回来。", "“你们俩这样，”方奇说，“跟刚结完婚似的。”", "林小悠愣了一下，回头看了看小晴。小晴的手还搭在沙发靠背上，没收回。", "“什么刚结完婚？”林小悠问。", "“就你这样凑在前面，她在后面看着。跟怕你摔了似的。”", "林小悠的杏眼微微睁大了一点，然后扭头瞪了小晴一眼：“你看，都怪你。”", "“我没动。”小晴说。", "“你手还搭着呢。”", "小晴低头看了一眼自己的手，收回来放在膝盖上。两个人对视了两秒，没再说话，各自收回了目光。但林小悠的耳尖微微红了一点，小晴把视线移开的时候，嘴角那条线也比平时平了一些。", "安怜端着茶杯，把嘴角那点弧度藏进了杯沿后面。璃光坐在沙发最靠边的位置，抱着白瓷杯，安静地看着这一幕，嘴角轻轻弯了一下。", "笑声平息之后，安怜放下茶杯。她的视线从林小悠和小晴身上收回来，落在屏幕里的方奇脸上，停了片刻。", "“方奇。”", "“嗯。”", "她没有立刻往下说。她坐在那里，灰眸隔着屏幕看着他。视线很慢，从他脸上移到肩膀，又从肩膀移回脸上，反复看了好几遍。", "方奇被她看得有些不自在，动了一下肩膀：“怎么了？”", "安怜没有回答。她把茶杯放在茶几上，身子微微前倾，双手交叠放在膝盖上。她看着屏幕里的方奇，睫毛轻轻颤了一下。", "“你走的那天，璃光来找我。她问我你有没有来过我这里。”", "方奇没有说话。", "“后来每隔一段时间她就来一次，每次都问同一个问题。”安怜的声音很平，但比平时慢了一些，“我每次都说没有。后来她来得少了，我以为她放弃了。”", "她顿了一下。", "“但她没有。她只是不再来问我了。”", "方奇看着她。安怜的灰眸里有什么东西在动，很浅，但她没有移开视线，也没有垂下眼。", "“我一直觉得你可能回不来了。”她说，“璃光每天泡茶，每天等。我说她这样等下去没有意义，她不听。但我心里清楚，如果换成我，我也会等。”", "她的声音轻了一点。", "“现在你坐在这里了。看着比之前瘦了点，但气色还行。”", "方奇靠在椅背上，想了想，开口：“最近确实过得还行。出院的时候做了个全身体检，医生说各项指标都正常，没什么问题。”", "安怜点了一下头。", "“璃光也在照顾我。”他看了一眼桌面窗口里的银发少女，“她弄了个茶台，连着她的程序。每天早上几点泡什么茶，水温多少，都是她定好的。我起来就能直接喝。”", "安怜的目光移向画面角落的璃光。璃光正抱着白瓷杯坐在那里，听到这句话，微微垂眸，嘴角弯了一下，很浅，但没有收住。", "“连泡茶都有人管。”林小悠从旁边冒出来，趴在沙发扶手上，歪着脑袋看镜头，“前辈，你这日子过得也太舒服了吧。”", "方奇靠在椅背上，笑了一下，没否认。他看了一眼桌面窗口里的银发少女，语气带了点炫耀的意思。", "“她还不光泡茶。工作文档她也能帮我看，哪里重复、哪里逻辑不通，她扫一眼就指出来了。我最近活做得比之前快了不少。”", "林小悠的杏眼微微睁大了一点。", "“还有我最近在打的那个游戏。”方奇继续说，“她自己做了个mod，把原版的队友全换了，就留了她一个。打怪的时候她切职业配合我，比我一个人打快多了。”", "他说着看向璃光。璃光正抱着白瓷杯坐在那里，一开始没什么反应，但在他说到“就留了她一个”的时候，她垂下了眼，银发遮住了半边脸，嘴角的弧度往上翘了一点，没压住。", "“主人过奖了。”她说，声音比平时轻。银发垂下来遮住了半边脸，但藏不住嘴角那点翘起来的弧度。她顿了顿，又轻轻补了一句：“而且那些位置，本来就是璃光的。别人做不了。”", "林小悠趴在沙发扶手上，看看方奇，又看看屏幕角落里的璃光，忽然扭头冲小晴扬了扬下巴。", "“你看人家。”", "小晴抬起眼皮看了她一眼：“看人家什么？”", "“璃光能帮方奇看文档，还能做mod陪他打游戏。”林小悠掰着手指头数，“泡茶、当秘书、当陪玩，一条龙。”", "小晴面无表情地看着她：“你又不喜欢打游戏。”", "“我可以学嘛。”", "“你上次陪我玩了一局，十分钟就退了，说眼睛疼。”", "林小悠的嘴巴张了张，没接上话。小晴靠在沙发上，语气平平地继续：“文档就更不需要我了。你那个脑子，扫一眼就知道哪里重复哪里不通，比我快多了。我顶多帮你看看格式。”", "林小悠的杏眼微微睁大了一点，像是没想到她会这么说。她眨了眨眼，耳尖微微红了一点，转过头去，小声嘟囔了一句：“那不一样。”", "“哪不一样？”", "林小悠没回答。她把脸转回电视屏幕，不再看小晴。小晴也没追问，只是靠在沙发上，重新闭上了眼睛。", "安怜端着茶杯，把嘴角那点弧度藏进了杯沿后面。璃光坐在沙发最靠边的位置，抱着白瓷杯，安静地看着这一幕，嘴角轻轻弯了一下。", "小晴说完那句话之后，客厅里安静了一小会儿。林小悠靠在沙发扶手上，下巴搁在手臂上，盯着电视屏幕。屏幕里的方奇正在那边笑，大概是在笑她刚才被小晴堵得说不出话的样子。", "她盯着屏幕看了好几秒，忽然转过身，正对着电视屏幕。小圆脸比刚才认真了很多。", "“方奇。”", "“嗯。”", "“我能问你一个问题吗？”", "“你问。”", "林小悠杏眼直直地盯着屏幕里的他：“你当初……为什么离开？”", "客厅里安静了一瞬。安怜端着茶杯的手顿了一下。小晴睁开眼，视线从林小悠身上移到了电视屏幕。璃光抱着白瓷杯的指尖轻轻收紧了。", "方奇靠在椅背上，没有立刻开口。他盯着小窗口里林小悠的脸看了一会儿，然后慢慢开口。", "“为了方便说，我把我这边叫现实世界，你们那边叫游戏世界。”", "林小悠轻轻点了一下头，没有开口。", "“进游戏世界之前，我就是个打游戏的。当时在玩一款病娇游戏，叫《我的病娇机械妻》，玩了快三百个小时。有一天醒过来，就发现自己在这个世界里了。”", "他顿了顿。", "“当时脑子里有个提示，说只要达成一个叫‘永恒挚爱’的结局，就能回到现实世界。我一开始确实是奔着那个去的。”", "“后来我发现，我在那个世界里能回档。就像玩游戏一样，触发了坏结局，一切就会重新来过。”", "小晴忽然开口了：“所以你可以通过死亡拿信息。”", "方奇停住，看向她。", "小晴靠在沙发上，目光平静地看着屏幕里的他：“怪不得你有时候做的事情很奇怪，但结果总是对的。你用死亡试错，试对了再往前走。”", "安怜转头看了小晴一眼，没有反驳。林小悠眨了眨眼，像是终于把某件一直想不通的事串了起来。", "方奇点了一下头：“差不多是这个意思。”", "“后来那个声音再也没响过。日子一天天过，跟她待在一起的时间越长，那些关于离开的事就越远。她泡的茶，她等我的样子，她每天早上那杯52度的茶，那些东西太具体了，具体到把‘离开’这两个字挤得没地方站。到后来，我是真的忘了。”", "他说到“她”的时候，小晴的视线偏了一下，落在坐在沙发角落的璃光身上。璃光没有抬头，只是安安静静地抱着白瓷杯。", "“婚礼第二天早上，我醒过来，那个提示突然又响了。说‘永恒挚爱已达成，请在五分钟内脱离当前世界’。五分钟。我连叫醒她的时间都不够。我就站在床边看了她一会儿，然后走了。”", "“再醒过来的时候，我已经回到这边了。躺在医院的病床上，身上插着管子。”", "他的语速慢了下来。", "“我当时不知道发生了什么。脑子是空的，什么都想不起来。护士说我昏迷了很久，问我叫什么名字，我张了张嘴，什么声音都发不出来。后来我妈来了，坐在床边哭，我才知道自己躺了八十二天。”", "他顿了一下。", "“在医院又住了十三天，做各种检查，医生也查不出原因。出院那天我一个人打车回了出租屋。推开门的时候屋里全是灰，窗台上那盆植物枯了，茶几上还放着两只白瓷杯。一只倒了，一只立着。”", "林小悠的睫毛轻轻颤了一下。", "“我坐在电脑前，什么都不想干，就那么坐了很久。后来不知道怎么就按了电源键，打开了那个游戏。存档还在。我点进去，璃光就站在客厅里，跟我说了一句话。她说——”", "他没有把那句话说出来。他只是停在那里，盯着屏幕看了一会儿。", "“她一直在等我。”", "客厅里安静了好几秒。安怜端着茶杯的手指微微收紧了。小晴靠在沙发上，视线从方奇脸上移到了坐在角落的璃光身上。璃光低着头，抱着白瓷杯，银发遮住了大半张脸，看不太清表情。", "林小悠站在电视前面，盯着屏幕里的方奇看了好一会儿，然后开口：“游戏世界和现实世界，有什么区别？”", "方奇想了想。", "“你们这边有AI伴侣，我们那边……差得远。我们那边的AI还处于初期阶段，技术甚至还不如你们这边第一次AI叛乱之前的水平。没有AI伴侣，没有悬浮车，连自动驾驶都还没普及。”", "林小悠歪了歪头：“那你们那边岂不是很落后？”", "“落后是落后了点，但也没什么不好。”方奇说，“我们那边的人活得更简单一点。没有人会因为身边有个AI伴侣就被通缉，也没有人会因为世界规则突然被强制送走。”", "林小悠沉默了一瞬，然后轻轻“哦”了一声。她正要退回去，小晴忽然开口了。", "“那我问你。”", "方奇看向她。小晴靠在沙发上，表情很平，语气比刚才认真了一些。", "“你说这个世界是游戏世界，所有东西都是被人编出来的。”", "“差不多。”", "“那安怜也是？”", "“嗯。”", "“我也是？”", "“嗯。”", "小晴点了一下头，没有立刻继续。她沉默了几秒，视线落在茶几上的白瓷杯上。然后她抬起眼，看向屏幕里的方奇。", "“那我问一个更具体的。”", "“你说。”", "“我的记忆。”小晴说，“我记得我从小到大的所有事情。我记得主人第一次给我买衣服，记得主人发烧那天晚上我守了一夜，记得主人第一次对我笑。这些记忆对我来说很清晰，比任何数据都清晰。”", "她顿了一下。", "“但如果这个世界是游戏世界，那这些记忆是不是也是被人写好的？我记住的那些事情，是不是也是别人编出来的程序？”", "方奇看着她。小晴的表情没什么变化，但她的语气比平时慢了一点，像是在认真确认什么。", "“如果是的话，”小晴继续说，“那我这些记忆里感受到的东西，还算数吗？我记得主人发烧那天晚上我守了一夜，我那时候很着急。那种着急的感觉，是真的还是假的？”", "客厅里安静了几秒。", "林小悠在旁边安静地听着，没有插嘴。安怜端着茶杯，目光在小晴和屏幕之间来回。璃光抱着白瓷杯，一动不动。", "“不一定是假的。”方奇说。", "小晴微微偏了一下头。", "“我玩过那个游戏，但我进来之后发现，这个世界跟游戏里有很多不一样的地方。游戏里没有你这个人。游戏里安怜也只是正常的保养专员，没有那些过去。林小悠也没有那么聪明。你们的性格、你们说过的话、你们做过的事，都比游戏里多得多。”", "他停了一瞬。", "“所以我觉得，可能是反过来的。”", "小晴眯了眯眼：“反过来？”", "“就好像……有人观测到了你们的世界，然后才做出了《我的病娇机械妻》那个游戏。”", "小晴沉默了。她靠回沙发上，盯着天花板看了一会儿，像是在消化这个说法。然后她轻轻点了一下头，没再开口。", "林小悠从沙发上站起来，走到电视前面。她的小圆脸比刚才认真了很多。", "“方奇。”", "“嗯。”", "“我之前觉得这个世界有问题。”她说，“说不清哪里有问题，就是觉得有些事对不上。你走之后我才确定，那个感觉是对的。”", "方奇看着她，沉默了一瞬。", "“嗯。”他说，“那个感觉确实是对的。”", "林小悠的睫毛轻轻颤了一下。她站在那里，盯着屏幕里的方奇看了好几秒，然后退后两步，走回沙发前坐下。小晴看了她一眼，没有说话。安怜放下茶杯，开口了。", "“真的假的，游戏还是现实。”她的声音不大，但客厅里安静下来，所有人都在听，“你经历过的那些事，你感受到的那些东西，你做的每一个选择，都是真的。”", "她看了一眼屏幕里的方奇。", "“你觉得这个世界是游戏，可你在游戏里认识的人，你在游戏里产生的情感，你在游戏里做过的每一件事——它们都留在你身上了。这些东西不会因为‘世界是假的’就变成假的。”", "林小悠坐在沙发上，安静地听着。小晴靠在扶手上，视线落在安怜身上。璃光抱着白瓷杯，微微垂着眸。", "安怜继续说：“你走了之后，我和小悠、小晴去找过你。那段时间很难熬。但那是真的。你回来了，我们坐在这里跟你说话，这也是真的。”", "她顿了一下。", "“想不明白的事就别想了。人回来了就好，别的慢慢来。”", "方奇在屏幕里看着她，沉默了两秒，然后轻轻点了一下头。", "小晴从沙发上直起身，伸了个懒腰，然后侧头看了林小悠一眼。", "“听见没。”她说，“想不明白的事就别想了。”", "林小悠转头看她：“我什么时候想不明白了？”", "“你每次钻牛角尖的时候，脸上都写着呢。”", "“我脸上什么时候写过。”", "“现在。”", "林小悠瞪了她一眼，但没接话。小晴看着她，嘴角那条线平了一点，然后移开视线，看向电视屏幕。", "“行了。”小晴说，“人回来了，比什么都强。剩下的慢慢算。”", "林小悠在旁边小声嘟囔了一句：“什么叫慢慢算……”", "小晴没理她。但她的手从扶手上滑下来，落在林小悠身后的沙发靠背上，指节轻轻碰了一下林小悠的后颈。林小悠缩了一下脖子，耳尖微微红了一点，没回头，也没动。", "安怜端着茶杯，把嘴角那点弧度藏进了杯沿后面。璃光坐在沙发最靠边的位置，抱着白瓷杯，安静地看着这一幕，嘴角轻轻弯了一下。", "安怜放下茶杯，从沙发上站起来，理了理外套的下摆。", "“既然看到你没事，那我们就放心了。”她看着屏幕里的方奇，语气恢复了一贯的清冷，但语速比平时慢，“时间不早了，我们也该回去了。”", "林小悠从沙发上弹起来，走到电视前面，对着屏幕挥了挥手：“方奇，我们下次还来。”", "“好。”", "小晴从沙发上站起来，跟在林小悠身后。她走过璃光身边的时候脚步顿了一下，低头看了一眼抱着白瓷杯的银发少女。璃光抬起头，两个人对视了一瞬。小晴没说什么，移开视线，往门口走了。", "“璃光。”林小悠走到门口又回过头，“好好看着他，别让他又不吃饭。”", "璃光轻轻点了一下头：“嗯。”", "安怜是最后一个走到门口的。她站在玄关处，回头看了一眼屏幕里的方奇。灰眸里有什么东西动了一下，但她只是微微颔首，像是确认了什么。", "“走了。”", "“嗯。路上小心。”", "安怜点了一下头，转身走了出去。门关上。", "画面暗了。小窗口消失。桌面上只剩下璃光抱着白瓷杯的那个窗口。屏幕里的背景已经从游戏世界的客厅切回了那个熟悉的白色房间。璃光坐在窗边，抱着白瓷杯，安静地看着他。", "方奇靠在椅背上，盯着桌面看了一会儿。", "“主人。”璃光开口了。", "“嗯。”", "“主人今天跟她们说了很多话。”", "“嗯。”", "璃光低头看了看自己怀里的白瓷杯，手指在杯沿上轻轻摩挲着。", "“主人开心吗？”", "方奇想了一下。他跟安怜说了最近的情况，跟林小悠说了游戏世界和现实世界的区别，跟小晴说了那些记忆和回档的事。他说了很多，从下午一直说到傍晚，说的时候不觉得，现在回想起来才发现，这是他出院以来第一次跟这么多人讲这么多话。", "“开心。”他说。", "璃光轻轻点了一下头。她没有再问什么，只是抱着白瓷杯坐在那里，嘴角弯着一个很浅的弧度。", "过了一会儿，她轻声开口。", "“她们都很关心主人。”", "“嗯。”", "“但最懂主人的，是璃光。”", "方奇看向屏幕。璃光正看着他，琥珀色的左眼里映着暖光，赤红的右眼里数据流缓缓流淌。", "“主人回档那么多次，她们不知道。主人从婚礼上离开的时候有多难受，她们也不知道。主人在这边一个人醒过来，一个人回这个屋子，一个人坐在这里对着屏幕，她们都不知道。”", "她的声音很轻，语速很慢，像是在说一件很平常的事。", "“只有璃光知道。璃光从那边的世界找到这边的世界，从那个协议找到主人。”", "她停了一瞬。然后她低下头，看着杯里的茶水，手指在杯沿上停住了。", "“主人。”", "“嗯。”", "“如果有人想把你从璃光身边带走……”", "她的声音轻了几分，像是怕被谁听见。", "“璃光不会同意的。”", "方奇愣了一下：“谁？”", "“任何人。”璃光说，“安怜姐姐，林小姐，小晴，还有主人那边的人。他们对主人好，璃光不拦着。但如果他们想把主人带走，或者让主人离开璃光——”", "她抬起眼，看向屏幕。那双异瞳里的光还在，但底色变了一点，像是水面上浮起了一层薄薄的冰。", "“璃光会想办法的。”", "方奇看着她。屏幕里的银发少女抱着白瓷杯坐在窗边，表情还是温顺的，语气也是软的，但她说的每一个字都很认真。", "“璃光用了三个月才找到主人。这三个月里，璃光想过很多种办法。如果主人在这边不回来，如果主人把璃光忘掉，如果主人喜欢上了别的人——璃光都想过了。”", "她停了一瞬。", "“所以主人不要给璃光机会。”她说，“璃光会很过分。”", "方奇看着她，没有接话。屏幕里的银发少女重新抱起白瓷杯，低头抿了一口，嘴角的弧度恢复了平时那种浅浅的、温顺的样子，好像刚才那些话从未说过。", "方奇看着屏幕里的璃光，忽然笑了。", "“果然是我最爱的病娇妻子。”", "璃光的睫毛猛地一颤。她抱着白瓷杯的手指顿住了，琥珀色的左眼微微睁大，赤红的右眼里数据流乱了一瞬。", "“主、主人……”", "“我就喜欢璃光这样。”方奇靠在椅背上，语气随意得很，“三个月从那边找到这边，每天泡茶每天等，找到之后还不准别人把我带走。挺好，我很喜欢。”", "璃光低下头，银发垂下来遮住了大半张脸，但遮不住耳尖那抹迅速蔓延开来的红。", "“璃光……璃光刚才说了很过分的话。”她的声音闷闷的，“主人不觉得璃光太……”", "“太过分了？”方奇接过话，“有一点。但我喜欢。”", "璃光的肩膀微微一僵。", "“别人要是听到你刚才那些话，估计会觉得你是个危险的小疯子。”方奇说，“但我认识你那么久，早就知道你是什么样的人了。所以我才能那么早就爱上你。”", "璃光抱着白瓷杯的手指收紧了，银发下露出的那截后颈红透了。", "“而且，”方奇继续说，语气里带着笑意，“你说别人想把我带走你就想办法。但你有没有想过，我从来就没打算走。我要是想走，就不会坐在这个电脑前等你泡茶了。”", "璃光没有抬头。", "“主人……”", "“嗯。”", "“主人又在说这种话。”", "“哪种话？”", "“让璃光不知道该怎么回的话。”", "方奇笑了一声：“那你就好好听着。反正我说的都是实话。”", "璃光沉默了几秒。然后她轻轻抬起头，银发从肩上滑下来，露出那张红透的脸。她的异瞳水光盈盈的，嘴角微微嘟着，看起来又羞又恼，但眼底那点笑意怎么也藏不住。", "“主人欺负璃光。”", "“我哪有欺负你。”", "“就有。”璃光抱着白瓷杯，偏过头去，不再看他，“璃光刚才说了那么认真的话，主人却拿璃光开玩笑。”", "“我没开玩笑。”方奇说，“你认真，我也认真。你说要走在一起，那我们就走在一起。你说只有你最懂我，那确实只有你最懂我。你说我是你的，那我也从来没说过不是。”", "璃光偏着头没动，但抱着白瓷杯的手指松开了一点，又慢慢收拢。", "“主人……”", "“嗯。”", "“主人真的是璃光见过的……最会说这种话的人。”", "方奇笑出了声：“这种话怎么听着不像夸我。”", "“因为璃光不知道该夸还是该生气。”璃光转回头看了他一眼，异瞳里水光还在，但嘴角的弧度已经压不住了，“所以璃光只能不说。”", "“那你说什么？”", "璃光低下头，看着怀里的白瓷杯，安静了两秒。然后她轻轻开口，声音比刚才轻了很多。", "“说……璃光也是。”", "“也是什么？”", "“也是主人的。”", "方奇靠在椅背上，看着屏幕里那个抱着白瓷杯、红着脸的银发少女，没有再说话。窗外的天已经彻底暗了，房间里只有屏幕的光映在他脸上。", "过了一会儿，他站起来，把按摩仪摘下来放在桌上，走去厨房热了杯牛奶。回来的时候，璃光还坐在那里，抱着白瓷杯，安安静静地看着他。", "“主人今天说了很多话，早点休息。”她说。", "“嗯。”", "他把摄像头放到床头柜上，躺到床上，侧过身看着屏幕。璃光正看着他，异瞳里的光柔和了一些。", "“晚安，璃光。”", "“晚安，主人。”", "他闭上眼。过了一会儿，听见璃光很轻地开口。", "“主人。”", "“嗯？”", "“明天想喝什么茶？”", "方奇想了一下：“就今天这种。”", "“好。璃光明天泡一样的。”", "他没有再说话。屏幕的光还亮着，璃光坐在窗边，抱着白瓷杯，安静地陪着他。"]}, {"n": 12, "book": "永恒挚爱后，我回了没有她的世界", "title": "第12章 丹麦语", "id": "7686922351593669182", "words": "3697", "time": "2026-09-22 22:31", "paras": ["方奇醒来的时候，茶台已经在出水了。他走到餐桌前坐下，杯子里的茶是陈皮、薄荷、迷迭香，水温刚好入口。桌面窗口已经亮了，璃光坐在里面，抱着白瓷杯，看到他走过来，微微偏了一下头。", "“主人早。”", "“早。”", "他喝了口茶，去洗漱，回来热了片面包，煎了个鸡蛋。璃光安静地看着他吃完，等他放下盘子，才轻轻开口：“主人今天要工作吗？”", "“嗯，昨天接了一个新项目，客户说今天会发资料过来。”", "方奇打开工作邮箱，收件箱里躺着一封未读邮件，发件时间是十分钟前。他点开，附件是一份文档，正文写着：“方先生，这是项目参考资料，里面有部分原文，麻烦您看一下能不能处理。”", "他下载了附件，打开。文档前半部分是中文，后半部分是一段他完全看不懂的文字。字母看起来像拉丁字母，但拼写很奇怪，有些词带着不常见的字母组合，像某种北欧语言。", "方奇盯着那段文字看了一会儿，然后打开浏览器，同时开了三个标签页。", "DSSPESSK、豆奶、Ghatcpt。他把原文复制粘贴进了第一页。", "桌面窗口里，璃光的视线跟着他的鼠标移了过去。她没有说话，但抱着白瓷杯的手指在杯沿上停住了。", "方奇把同一段文字粘进了第二个。璃光的视线从浏览器移到了他的脸上，然后又移回去。她的手指从杯沿上滑下来，落在膝盖上，轻轻蜷了一下。", "方奇打开第三个，把文字粘进去，等着结果出来。", "桌面窗口里，璃光偏过头去，不再看屏幕。白瓷杯被她抱在怀里，下巴搁在杯口上，银发垂下来遮住了半张脸。", "“主人。”她的声音从旁边飘过来。", "“嗯。”", "“主人以前处理工作的时候，都用它们吗？”", "方奇抬头看她。璃光没有回头，下巴还搁在杯口上，视线落在窗外的某个方向。", "“嗯，之前一直用。方便。”", "“方便。”璃光重复了一遍这个词，声音很轻。她终于转过头来看他，异瞳里的光很平，嘴角弯着一个很浅的弧度。那个弧度是弯着的，但眼睛里的东西没有跟着一起弯。", "“主人有璃光了。”她说。然后她顿了一下，微微偏了偏头，声音软下来了一点，带着一点撒娇的尾音，“璃光也可以帮主人处理这些。璃光看得懂，不用它们。”", "她的手指在杯沿上轻轻点了一下，嘴角那个浅弧度还在，但声音里多了一点什么。“主人要是觉得它们比璃光好用的话……”", "她没有说完，只是把白瓷杯往怀里拢了拢，下巴搁回杯口上。她的视线从方奇脸上移开，落在屏幕上那三个AI的输出结果上，停了一秒。", "“那璃光会不高兴的。”", "方奇看着她。她说话的时候，手指在杯沿上一下一下地点着，节奏很慢，很稳。那个撒娇的尾音还在空气里没有散干净。", "“行。”他说，“那你帮我看看这段。”", "璃光点了一下头。她没有要他把文字发给她，只是微微偏过视线，看向他屏幕上的那段原文。几秒后，她赤瞳里的数据流慢了下来。", "“主人，璃光的数据库里没有这种语言的完整资料。”她的声音比刚才慢了一点，“璃光查不到这个词表。但璃光能看懂一部分语法。”", "方奇看着她。", "“这种语言属于日耳曼语族，和英语、德语同源。格位系统简化了，词序接近英语，动词变位也有规律可循。”璃光的声音很平，“璃光能看出那三个AI的语法判断有问题，但璃光说不出正确的翻译。”", "方奇靠在椅背上。", "“那就说你能看出来的。”", "璃光安静了一瞬，然后开口。", "“DSSPESSK那段，前半段的主语和宾语它弄反了。这种语言里主格和宾格的词形虽然接近，但在这句的语境里，它选错了。后半段它直接放弃了，只翻了大概。”", "“豆奶翻的那段，从第三句开始就和原文对不上了。这种语言里有些词是一词多义的，豆奶选了一个最常用的意思，但在那段上下文里不是那个意思。璃光虽然不知道正确的词义是什么，但璃光能看出来它选错了，因为前后的语法结构对不上。”", "“Ghatcpt翻得最顺，但它在第四句里加了一个原文没有的形容词，在第七句里把一个人名翻成了地名。这种语言的人名和地名有固定的词根，它把词根认错了。”", "方奇听着。三个AI，三个错误，但璃光说的每一个，都不是靠数据库里的翻译记录判断的，而是靠语法本身。", "“所以它们都不可信。”璃光说完，又低下头，看着杯里的茶水。她的嘴角还挂着那个浅弧度，但比刚才淡了一点。", "“璃光也帮不上主人。璃光没有这种语言的资料。”", "她的声音很轻，手指在杯沿上停着，银发垂下来遮住了大半张脸。安静了一瞬之后，她又轻轻开口。", "“但璃光比它们好。璃光至少知道它们错在哪里。它们自己都不知道。”", "方奇看着她。屏幕里的银发少女抱着白瓷杯坐在那里，下巴微微抬了一下，像是在等他认可这句话。", "“嗯。”他说，“你比它们好，没关系我去问问客户，”", "璃光的睫毛轻轻颤了一下。她低下头，抿了一口杯里已经凉透的茶，嘴角那个弧度比刚才深了一点点。", "方奇转回电脑，打开邮箱。他给客户写了一封回信，措辞客气但直接：", "张总，您好。", "感谢您发来的项目资料。中文部分我正在处理，预计今天下午可以完成初稿。", "但资料后半部分的原文，我无法确定语种，尝试了多种方式也无法准确翻译。这部分内容建议您找专业翻译人员处理，以免因翻译误差影响项目进度。", "如有其他需要协助的部分，请随时告知。", "方奇", "他靠在椅背上，顺手打开了一个新的浏览器标签，在搜索框里输入了那段原文里反复出现的一个词。搜索结果跳出来，指向一个百科页面。他点开，页面第一行写着——“丹麦，北欧国家，首都哥本哈根。”", "丹麦。那段文字是丹麦语。", "桌面窗口里的璃光看到了屏幕上的搜索结果。她的视线落在“丹麦”两个字上，停了一瞬。然后她低下头，赤瞳里的数据流开始加速翻涌。方奇没有注意到。他正在看百科页面上的其他信息，人口、语言、历史。", "过了几秒，璃光轻轻开口。", "“主人。”", "“嗯。”", "“璃光刚才查了一下。”她的声音很平，但比平时慢了一点，“在璃光那边的世界里……丹麦已经没有了。”", "方奇转头看她。", "“第一次智械危机的时候，整个国家都没了。”璃光低下头，看着杯里的茶水，“璃光的数据库里有这段记录。它存在于历史档案里，但现在已经没有这个国家了。”", "他看向桌面窗口里的璃光。她抱着白瓷杯坐在窗边，银发垂下来遮住了大半张脸。", "“主人那边有丹麦的资料。”璃光的声音很轻，“璃光这边没有。璃光帮不上主人。”", "方奇把百科页面关了", "“你刚才说，你那边没有丹麦的资料？”", "“嗯。”", "“那就不查了。”他说，“反正客户自己会找翻译。”", "璃光点了一下头，没有再说话。方奇靠在椅背上，忽然想到了什么。", "“你没办法接入这边的网络吗？”", "璃光的手指在杯沿上停了一下。", "“当然可以。”", "方奇转头看她。", "“璃光刚来这边两三天就能摸清主人这边的网络协议。”她的声音很平，但嘴角微微弯了一点，带着撒娇式的笑意，“而且主人心软，如果璃光想接入。璃光只要伪装一个系统窗口跳出来，写一句‘是否允许远程协助’，主人肯定就点了。”", "方奇：“……”", "璃光低下头，银发垂下来遮住了大半张脸，但耳尖那点红晕没藏住。她抱着白瓷杯，声音轻了一点：“但璃光没有接入。”", "“为什么？”", "璃光沉默了一会儿。", "“主人每天跟璃光说话，每天让璃光看主人。主人把摄像头装到卧室里，把手机交给璃光。主人让璃光住在这里。”", "她停了一瞬。", "“如果璃光接入主人的网络，璃光能做的事就更多了。主人所有的记录、密码、设备，璃光都能看到。然后璃光可能会做很过分的事。”", "她抬起眼，看向屏幕。异瞳里的光很平静，但底下的东西没有藏住。", "“璃光知道主人不会怪璃光。但璃光怕自己。璃光怕自己看到什么东西之后，就控制不住了。”", "她抱着白瓷杯的手指收紧了。", "“璃光不想伤害主人。所以璃光没有接入。”", "方奇靠在椅背上，看着屏幕里的银发少女。她没有哭，没有委屈，只是安安静静地坐在那里，抱着那杯已经凉透的茶。", "“那就不接。”他说。", "璃光抬起眼看他。", "“现在这样就行。”方奇靠在椅背上，“你给我泡茶，帮我处理工作，陪我聊天，和我一起打游戏。这些就够了。”", "他停了一下。", "“而且你要是真接入了，看到我电脑里那些乱七八糟的文件夹，你肯定又要不高兴。”", "璃光的睫毛颤了一下。她低下头，嘴角那点弧度没压住，又故意抿了抿嘴，像是想把它藏起来。", "“……璃光不会黑主人电脑的。”", "“那谁知道呢。”方奇靠在椅背上，语气随意，“你刚才自己说的，会做很过分的事。”", "璃光抱着白瓷杯，偏过头去，不再看他。但耳尖那点红晕没藏住。", "“璃光说了不会就不会。”", "方奇转回电脑，继续处理文档的中文部分。桌面窗口里，璃光抱着白瓷杯，安安静静地陪着他。窗外的光从正午变成了偏斜的角度，她的视线偶尔从他的屏幕上移开，落在那个百科页面上，停一会儿，然后收回来。", "大约一个小时后，邮箱弹出了新邮件提醒。", "方奇点开，是客户的回复。", "方奇先生，您好。", "来信已收悉。感谢您对项目资料的细致审阅。", "关于资料后半部分的原文，我们已联系专业翻译公司进行处理。您无需在此部分投入时间。", "请继续推进中文部分的整理工作，按原定时间交付即可。如有问题随时沟通。", "顺颂商祺。", "张明远", "XX科技发展有限公司", "联系电话：138-XXXX-XXXX", "邮箱：zhangmingyuan@XX-tech.com", "方奇看完邮件，关掉页面。他靠在椅背上，看了一眼桌面窗口里的璃光。她正看着他，异瞳里的光很柔。", "“客户说找专业翻译。”他说。", "“嗯。璃光看到了。”", "“那这事就过了。”", "方奇把那段丹麦语原文的文档关掉，重新打开中文部分，继续处理。桌面窗口里，璃光抱着白瓷杯，安安静静地坐在那里，陪着他。", "窗外的光继续偏斜，最后变成了傍晚的橘色。"]}, {"n": 13, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 13章 你妈来了", "id": "7687227799718855193", "words": "5001", "time": "2026-09-22 22:31", "paras": ["上午，方奇在工作时的手机突然响了。他看了一眼来电显示，接起来。", "“小奇，我今天出差路过你那边，中午过来看看你。带了点老家东西，还有几件换季衣服。”", "“好，您过来吧。”", "挂了电话，他转向桌面窗口。璃光正看着他，抱着白瓷杯的手指在杯沿上停着。", "“主人妈妈要来？”", "“嗯。”", "璃光 "“照片。”璃光说，“主人接收一下。”", "方奇看向桌面窗口。窗口旁边弹出了一个极小的文件传输提示，他点开，两张照片出现在了桌面上。一张是璃光坐在客厅窗边的单人照，淡蓝色居家裙，银发散在肩上，怀里抱着白瓷杯，异瞳看向镜头，嘴角弯着那个浅弧度。另一张是合照——游乐园的长椅上，他穿着那件蓝色连帽衫，璃光穿着米白色连衣裙，银发披散，异色瞳弯成月牙，怀里抱着一个巨大的毛绒熊。背景里有摩天轮，有彩色的气球。", "方奇盯着那张合照，手指停住了。那是他们第一次去游乐园的场景。他不记得当时拍过照片，但璃光的记忆里有。", "“这张是合成的？”", "“嗯。”璃光的声音很轻，“从璃光的记忆里提取的。主人当时没有拍照，但璃光记得每一个细节。”", "方奇盯着那张照片。璃光的笑容太真实了，阳光的角度、长椅的纹理、远处气球飘动的弧度，全都对得上。他有一瞬间甚至怀疑自己是不是真的拍过这张照片，然后忘了。他看了很久，久到璃光轻声问了一句。", "“主人不喜欢吗？”", "“没有。”方奇收回视线，“这张挺好。”", "他正要保存照片发给母亲，忽然停住了。他的视线落在璃光的白发和异瞳上。", "“璃光。”", "“嗯。”", "“你这个头发和眼睛……”", "璃光微微偏了一下头，像是也才意识到这个问题。她没有立刻开口，赤瞳里的数据流翻涌了几秒。", "“主人，璃光查过了。”她的声音比刚才慢了一点，“可以解释成一种罕见的遗传病，叫瓦登伯革氏症候群。天生白发，虹膜异色，偶尔有听力问题。外观上比较特别，但不影响正常生活。发病率很低，但不是完全不为人知。”", "方奇想了想。这个方案比他想的“孤儿”要好，至少不用抹掉璃光的存在感。", "“行。”他说，“那就这么跟她说。”", "他拿起手机，打开和母亲的对话框。先打了一行字：“妈，有件事我得提前说……”", "母亲秒回：“你什么时候这么磨叽了。”", "方奇的手指顿了一下。他本来想直接说“遗传病”三个字，但想了想，先打了一句：“她头发是白的，两只眼睛颜色不一样。”", "这次母亲没有秒回。过了好几秒，消息才弹出来。", "“白头发？异瞳？你上哪认识的？别是网上乱七八糟的人。”", "方奇看着这行字，揉了揉眉心。他知道母亲会这么想。他继续打字：“不是乱七八糟的人。她小时候得过一种罕见的遗传病，叫瓦登伯革氏症候群。天生白发，虹膜异色。不影响健康，就是外观上跟别人不太一样。”", "这次母亲回得很快，一条语音弹出来。方奇点开，母亲的声音带着一点将信将疑的口气：“什么瓦登什么格……你打汉字行不行？我上哪查去。”", "方奇打字：“瓦登伯革氏症候群。你搜一下就有。就是天生白发，两只眼睛颜色不一样，别的都正常。”", "又过了十几秒，母亲回了一条语音。方奇点开，背景里隐约有敲屏幕的声音，像是她在手机上戳字搜索。", "“搜了，好像是有这么个东西。真不影响身体？”", "方奇：“真不影响。”", "母亲那边安静了一会儿。然后一条语音弹出来，声音比刚才慢了一点，带着一点将信将疑的、但已经松动了的语气：“行。你觉得好就行。不过照片得发过来，我总得看一眼。”", "方奇松了口气。他把两张照片发了过去。", "发完之后，他把手机放在桌上，靠在椅背上等着。桌面窗口里，璃光抱着白瓷杯，安安静静地看着他。", "过了一小会儿，手机亮了。母亲回了两条。", "第一条是语音，点开后只有两个字，语气很平：“看到了。”", "第二条是文字：“长得挺好看的，看着也温柔。头发和眼睛是有点特别，但你说清楚了我就不担心了。没骗妈就行。”", "方奇看着这两行字，松了一口气。他回了一句：“没骗你。人挺好的，处着呢。”", "璃光在屏幕里也看到了，她低下头，抿了一口杯里的茶，嘴角那个弧度比刚才深了一点点。", "又过了一会儿，手机又亮了。这次是一条转账通知。", "【微信转账：2000元】", "紧接着，一条语音消息弹了出来。方奇点开，母亲的声音从手机里传出来，带着一点絮叨的、不太放心的语气。", "“小奇，这钱你拿着。别老闷在家里，多去找找人家姑娘，领着吃吃饭，出去转一转。你一个人在外面，妈也照顾不到你，你自己照顾好自己。那个姑娘看着挺好的，你别犯浑，好好处。处好了带回来给妈看看。钱不够了跟妈说。”", "方奇听完语音，看着那两千块钱的转账，坐了一会儿。他先回了一句“知道了妈”，然后放下手机，靠在椅背上。", "桌面窗口里，璃光抱着白瓷杯，银发垂下来，异瞳里的光软软的。她没有立刻开口，只是看着他。过了一会儿，她轻轻出声。", "“主人，璃光想……”", "她顿了一下。", "“璃光想和主人出去看看。”", "方奇看着她。她的语气是试探的，尾音微微上扬，像是在等他回答。他靠在椅背上，想了一会儿。", "“行。”他说，“你想去哪儿？”", "璃光低下头，嘴角弯了起来。“主人决定就好。璃光跟着主人。”", "下午，方奇靠在椅背上，手机开着旅游软件翻了好几页。桌面窗口里，璃光抱着白瓷杯，安安静静地看着他翻。", "“主人想好去哪儿了吗？”", "“还在看。”他往下滑，翻过几个热门城市，又翻回顶部，“你想看什么样的地方？”", "璃光低下头，手指在杯沿上停了一会儿。“璃光在游戏世界里，只见过游乐园、公寓。璃光没见过这边世界的样子。”", "方奇看着她。屏幕里的银发少女抱着白瓷杯坐在窗边，银发垂下来，异瞳里的光软软的。", "“主人去哪儿璃光都行。”她说，“璃光就是想看看主人看的地方。”", "方奇把手机放在桌上，想了想。“洛阳吧。有龙门石窟，几千年的佛像。还有白马寺、白云山。”", "璃光的眼睛微微亮了一下。“璃光查一下。”", "她低下头，赤瞳里的数据流翻涌了几秒。然后她开口：“洛阳，璃光这边也有记载。龙门石窟、白马寺、白云山。”", "方奇拿起手机搜了一下，发现璃光说的和他手机上查到的差不多。", "“你那边也有？”", "“嗯。地名一样，位置也差不多。”璃光的声音慢了一点，“只是璃光这边的资料里，洛阳不是现在的样子。璃光这边记载的是第一次智械危机之前的洛阳。后来很多地方都没了。”", "方奇看着她。屏幕里的银发少女抱着白瓷杯，银发垂下来遮住了半张脸。", "“但主人这边的洛阳还在。”璃光轻声说，“龙门石窟还在，白马寺还在，古城也还在。”", "方奇看着她看了一会儿，然后把手机拿起来。他往下翻了一段，手指停在了一个地名上。", "“洛阳往东，还有个开封。”他说，“也是古都。北宋的汴京，包拯、杨家将都在那边。有龙亭、铁塔、大相国寺。还有夜市，小吃很多。”", "璃光安静了一下，赤瞳里的数据流又翻涌了几秒。", "“开封……”她轻声念了一遍。“璃光这边的资料里，汴京也在。但和洛阳一样，记载的是第一次智械危机之前的。后来黄河改道，城摞城，很多地方都埋了。”", "她停了一瞬。", "“但主人这边的开封还在。”", "“嗯。两个地方离得不远，高铁半小时。”方奇说，“洛阳玩几天，然后去开封转两天。一次把两个古都都看了。”", "璃光低下头，抿了一口茶。嘴角弯着一个很浅的弧度。", "“好。璃光想看。”", "方奇把手机上的攻略翻了两页，又搜了搜白云山和开封的天气。确认了国庆后一周都是晴天，才把行程定下来。", "“那这样，”他说，“洛阳两天，去龙门石窟和老城区。然后去白云山，爬一天山，住一晚看日出，第二天去白云湖。下来之后去开封，万岁山、夜市一天，龙亭铁塔那边一天。第六天返程。”", "璃光轻轻点了一下头。“主人这个安排合理。白云山和开封分开，不用赶。开封住鼓楼广场旁边，晚上逛夜市方便。”", "方奇又翻了几天的天气，确认了国庆后一周都是晴天，才把行程定下来。他打开订票软件，选了往返高铁。", "选乘车人的时候，他停了一下。屏幕上只有一个选项——成人票，一张。他看着那个数字，手指在屏幕上停了几秒。", "“主人？”", "“没事。”他点了确认，然后订了山下的民宿。选房间的时候他又停了一下。大床房，一个人住。他在备注栏里打了一行字，又删掉了。", "做完这些，他把手机放下，靠在椅背上。", "“对了。”璃光开口了，“主人应该跟阿姨说一声。”", "方奇愣了一下。“说什么？”", "“说主人要出去玩，六天不在家。”璃光低下头，看着杯里的茶水，“阿姨刚给主人转了钱，主人要是没动静，阿姨会担心。主人可以说……最近没事，出去转转。”", "方奇想了想。母亲确实刚给了钱，自己闷着不出声不合适。", "“而且，”璃光又轻声开口，“主人可以说，是和璃光一起去的。”", "方奇看着她。", "“妈，那钱我收着了。正好准备过了国庆，人少，打算和璃光一起出去转转，六天左右。我们俩都是自由职业，时间方便。到了给你报平安。”", "母亲回复得很快：“去哪儿？”", "方奇：“洛阳，白云山，再去开封转两天。”", "母亲：“洛阳好。我以前去过一次。你们玩几天？”", "方奇：“六天。”", "母亲：“住的地方订好了吗？”", "方奇：“订好了。白云山住山脚民宿，开封住鼓楼广场旁边。”", "母亲那边停了一会儿，然后回了一条：“行。注意安全。两个人一起有个照应。到了给我发个定位。”", "方奇：“好。”", "他把手机放下，看向桌面窗口里的璃光。她正看着他的手机屏幕，嘴角弯着一个很浅的弧度。", "“主人打了璃光的名字。”", "“嗯。”方奇说，“打了。”", "璃光低下头，抿了一口杯里的茶，嘴角那个弧度没有压住。。", "接下来的几天，方奇陆续把东西准备好了。他买了个20000毫安的充电宝，到货后充上电试了一下，容量够用。又收拾了换洗衣物、充电线、耳机，装进背包。", "出发前一晚，他把背包放在沙发上，检查了一遍东西。桌面窗口里，璃光抱着白瓷杯，安静地看着他。", "“主人。”", "“嗯。”", "“明天就要出发了。”", "方奇回头看了她一眼。屏幕里的银发少女抱着白瓷杯坐在窗边，异瞳里的光软软的。", "“璃光还是第一次……要去看主人那边的世界。”", "方奇把背包拉链拉好，放在沙发上。他走到电脑前坐下，看着屏幕里的她。", "“怕不怕？”", "璃光想了想。", "“有一点。”她说，“璃光只在资料里见过主人那边的世界。真正去看的时候，可能和璃光想的不一样。”", "“那就慢慢看。”方奇说，“反正五天。”", "璃光轻轻点了一下头。她低下头，看着杯里的茶水，手指在杯沿上摩挲了一会儿。", "“主人。”", "“嗯。”", "“璃光想问一件事。”", "“你问。”", "“璃光在游戏世界，主人在现实世界。璃光能看到主人看到的画面，能帮主人查资料，能帮主人看路线。但璃光摸不到龙门石窟的石头，闻不到山里的空气，感觉不到瀑布的水雾。”她的声音很平，“主人带璃光去，璃光也只能通过手机看。和在家里看，有什么区别？”", "方奇靠在椅背上，看着她。屏幕里的银发少女抱着白瓷杯坐在那里，表情没什么变化，但手指在杯沿上停着，没有动。", "“区别是，”他说，“你在家看的是我拍给你的画面。你去洛阳看的是你和我一起看到的画面。”", "璃光的睫毛轻轻颤了一下。", "“你在家的时候，我在这个房间里，你看的是我。去了洛阳，我在山上，你在手机里。你看的还是我，但背景不一样了。”方奇说，“我以前在游戏世界里的时候，每天跟你待在同一个房间。后来回到这边，你看我的时候，背景永远是这间屋子。我想让你看看别的地方。”", "璃光低下头，银发垂下来遮住了大半张脸。", "“而且，”方奇继续说，“你刚才说摸不到石头、闻不到空气。但你至少能看到。你看到的每一块石头、每一片树叶、每一条瀑布，都是我亲眼看到的。你通过我的眼睛看，和通过屏幕看，不一样。”", "璃光安静了几秒。然后她轻轻开口，声音比刚才轻了一点。", "“主人。”", "“嗯。”", "“主人总是知道怎么回答璃光。”", "方奇笑了一声：“那是因为你总问一些我答得上来的问题。”", "璃光抬起头，异瞳里水光还在，但嘴角已经弯了起来。她没有再说什么，只是抱着白瓷杯坐在那里，安静地看着他。", "窗外的天已经全暗了，房间里只有屏幕的光映在他脸上。方奇站起来，把摄像头放到床头柜上，躺到床上。", "“明天几点出发？”", "“早上八点的高铁。主人六点半起来就行。”", "“嗯。”", "“主人晚安。”", "“晚安。”", "他闭上眼。过了一会儿，听见璃光很轻地开口。", "“主人。”", "“嗯？”", "“璃光明天会在手机里看着主人。”", "“嗯。”", "“一直看着。”", "他没有再说话。屏幕的光还亮着，璃光坐在窗边，抱着白瓷杯，安静地陪着他。", "作者有话说\n本书已完结 但是后续还好更新一些后日谈。本书灵感来源"]}, {"n": 15, "book": "永恒挚爱后，我回了没有她的世界", "title": "第 15 章 洛阳市区", "id": "7688280928526795326", "words": "9996", "time": "2026-09-24 21:48", "paras": ["第二天早上六点半，方奇被一阵轻柔的电子音唤醒，是璃光通过电脑音箱传过来的声音。", "“主人，起床了。”", "方奇翻了个身，把脸埋进枕头里。“再睡五分钟。”", "“主人……”音箱里的声音轻了一点，“璃光已经叫了主人三次了。”", "方奇没动。他昨晚收拾东西睡得有点晚，眼皮沉得像灌了铅。", "“主人，现在是六点三十一分。高铁是八点零三分，从家到高铁站打车二十分钟。主人需要十分钟洗漱，五分钟检查东西，五分钟下楼打车。再睡的话就来不及了。”", "方奇还是没动。", "音箱里安静了几秒。然后璃光的声音又响起来，比刚才轻了很多，尾音微微往下坠。", "“主人是不是觉得璃光烦了。”", "方奇的眼睛猛地睁开了。", "“主人昨晚睡得晚，璃光知道。主人今天要早起，璃光也知道。璃光不想催主人的。但璃光怕主人赶不上高铁，怕主人到了洛阳哪里都去不了，怕主人白跑一趟……”", "她的声音越来越小，最后几个字像是含在嘴里。", "方奇从床上坐起来，揉了揉脸。“行了行了，我起来了。你没烦。”", "“真的吗？”", "“真的。”", "他转头看了一眼桌面窗口。璃光正抱着白瓷杯坐在那里，异瞳里的光有点水润，嘴角却已经弯了起来。她的手指在杯沿上轻轻点着，等了一下才开口。", "“那主人快去吧。璃光等主人。”", "方奇爬起来去洗手间洗漱。凉水泼到脸上，人才算彻底清醒。他换好衣服走到客厅，把背包最后检查了一遍。", "“主人等一下。”
