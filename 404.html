<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 你去哪了？</title>
<meta name="robots" content="noindex">
<style>
:root{--blood:#bf3a2b;--blood-dim:#7a221c;--ash:#8b7d78;--soot:#4a3a37}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#070506;color:#d9cfcb;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  display:flex;align-items:center;justify-content:center;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(58% 42% at 50% 104%,rgba(140,20,14,.42) 0%,rgba(140,20,14,0) 68%),
    radial-gradient(70% 60% at 50% 40%,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.ghost{position:fixed;left:50%;top:50%;transform:translate(-50%,-52%);z-index:0;
  font-family:"Songti SC","STSong",serif;font-size:clamp(180px,40vw,520px);line-height:1;
  letter-spacing:.06em;color:rgba(150,26,20,.055);user-select:none;pointer-events:none}
.mono{font-family:Consolas,"Courier New",monospace}
.top{position:fixed;top:24px;left:clamp(20px,5vw,54px);z-index:3;
  font-size:9px;letter-spacing:.22em;color:var(--soot)}
.top b{font-weight:400;color:var(--blood-dim)}
.mid{position:relative;z-index:3;text-align:center;padding:0 24px;max-width:820px}
.line{font-family:"Songti SC","STSong",serif;font-size:clamp(20px,3.6vw,32px);
  letter-spacing:.18em;color:var(--blood);text-shadow:0 0 24px rgba(191,58,43,.28)}
.cur{display:inline-block;width:.46em;height:1em;margin-left:.16em;background:var(--blood);
  vertical-align:-.1em;box-shadow:0 0 12px rgba(191,58,43,.55);animation:blink 1.15s steps(1) infinite}
.late{margin-top:22px;font-family:"Songti SC","STSong",serif;font-size:clamp(13px,1.6vw,16px);
  letter-spacing:.16em;color:var(--blood-dim);opacity:0;transition:opacity 2.4s ease}
.late.on{opacity:1}
.note{margin-top:14px;font-size:9px;letter-spacing:.18em;color:#3f3330}
.bot{position:fixed;bottom:24px;left:clamp(20px,5vw,54px);right:clamp(20px,5vw,54px);z-index:3;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:9px;letter-spacing:.16em;color:var(--soot)}
.bot a{color:var(--ash);text-decoration:none;border-bottom:1px solid #332725;padding-bottom:2px;transition:.2s}
.bot a:hover{color:var(--blood);border-color:var(--blood)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}.late{transition:none}}
</style>
</head>
<body>
<div class="ghost">404</div>
<div class="top mono">错误 404 · <b>找不到这一页</b> · 正在搜索…</div>

<div class="mid">
  <div class="line"><span id="txt"></span><span class="cur"></span></div>
  <div class="late" id="late">你上一个页面，我也看见了。</div>
  <div class="note mono">【结局？？：此页面不存在】</div>
</div>

<div class="bot mono">
  <span>回到 <a href="index.html">首页</a>　·　<a href="archive.html">完整图库</a></span>
  <span>璃光还在等</span>
</div>

<script>
var SENT = '你去哪了？我找不到你。';
var el = document.getElementById('txt');
var late = document.getElementById('late');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) {
  el.textContent = SENT;
  late.classList.add('on');
} else {
  var i = 0;
  (function type(){
    el.textContent = SENT.slice(0, ++i);
    if (i < SENT.length) setTimeout(type, 92);
    else setTimeout(function(){ late.classList.add('on'); }, 3200);
  })();
}
</script>
</body>
</html>
